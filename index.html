ง ๆ 4. เจตคติช่วยทำให้เกิดความรู้"},{"n":46,"q":"ข้อใดเรียงลำดับกระบวนการเปลี่ยนแปลงเจตคติตามทฤษฎีของเคลแมนได้ถูกต้อง","o":["ความต้องการที่จะเปลี่ยน > การเลียนแบบ > การยินยอม","การซึมซับ > การเลียนแบบ > ความต้องการที่จะเปลี่ยน","การยืนยอม > การเลียนแบบ > ความต้องการที่จะเปลี่ยน","ความต้องการที่จะเปลี่ยน > การเลียนแบบ > การซึมซับ"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 44. ประกอบ"},{"n":47,"q":"ข้อใดไม่ใช่องค์ประกอบของการเสริมสร้างพลังอำนาจแห่งตนตามแนวคิดของกิ๊บสัน","o":["ความผูกพัน","ความรัก","ความทุ่มเท","โอกาส"],"a":4,"e":"องค์ประกอบของการเสริมสร้างพลังอำนาจแห่งตนตามแนวคิดของกิ๊บสัน (Gibson) ซึ่งเป็นปัจจัยนำที่ผลักดันให้ บุคคลเกิดพลัง มีกำลังใจ จนสามารถที่จะกระทำ ทุกวิถีทางในการแก้ไขปัญหาอุปสรรค เพื่อให้ได้มาซึ่งสิ่งที่ดีที่สุด ได้แก่ 1. การมีความมุ่งมั่นทุ่มเท (Commitment) 2. ความผูกพัน (Bond) 3. ความรัก (Love)"},{"n":48,"q":"\"นายเอกลัวการเข้าสังคม เนื่องจากเคยได้รับประสบการณ์จากการใช้ความรุนแรงในโรงเรียน\"จาก กรณีข้างต้นเป็นเจตคติที่เกิดจากการเรียนรู้ใด","o":["การวางเงื่อนไขจากการกระทำ","การวางเงื่อนไขแบบคลาสสิก","การเรียนรู้จากการเลียนแบบ","ปัจจัยด้านสิ่งแวดล้อม"],"a":2,"e":"เจตคติที่เกิดจากการเรียนรู้โดยการวางเงื่อนไขคลาสสิก (Classical Conditioning) หรือการตอบสนองที่ถูก กระตุ้น โดยสิ่งเร้าที่ปรากฏชัดเจนในสถานการณ์การเรียนรู้ ซึ่งนักจิตวิทยาที่สำคัญในทฤษฎีนี้ คือ พาฟลอฟ (Pavlov) เชื่อว่า การเรียนรู้ของสิ่งที่มีชีวิตเกิดจากการวางเงื่อนไข (Conditioning) กล่าวคือ การตอบสนองหรือการเรียนรู้ที่เกิดขึ้น ต่อสิ่งเร้านั้น ๆ ต้องมีเงื่อนไขหรือมีการสร้างสถานการณ์ให้เกิดขึ้นที่เป็นผลของการเรียนรู้ เช่น ลิลลี่เคยโดนเพื่อนล้อ เพราะพูดเหน่อ ทำให้กลัวการพูดในที่สาธารณะ, นายเอกลัวการเข้าสังคมเนื่องจากเคยได้รับประสบการณ์จากการใช้ ความรุนแรงในโรงเรียน เป็นต้น"},{"n":49,"q":"การที่คนเรารับรู้ว่า ฉันเป็นคนอย่างไร มีความรู้ความสามารถเฉพาะตัวอย่างไร เป็นตัวตนในแบบใด ตามทฤษฎี \"ตัวตน\" (Self Theory) ของโรเจอร์ส (Carl Rogers)","o":["Self Concept","Self – Esteem","Ideal Self","Real Self"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 40. ประกอบ"},{"n":50,"q":"ข้อใดกล่าวถึงการเกิดเจตคติที่มีต่อตนเอง ตามทฤษฎีการวางเงื่อนไขด้วยวิธีการให้แรงเสริม (Reinforcement) ได้อย่างถูกต้อง","o":["การชมที่ดีควรชมที่ความสำเร็จ","ถ้าไม่มีคนชม เราสามารถชื้นชมตนเองได้","คำชมของผู้อื่นมีคุณค่ามากกว่าการชมตัวเอง","คำชมที่มีประสิทธิภาพต้องมีของรางวัล"],"a":1,"e":"เจตคติที่เกิดจากการเรียนรู้โดยการวางเงื่อนไขจากการกระทำ (Operant Conditioning) หรือการวางเงื่อนไขแบบ ปฏิบัติการ พัฒนาขึ้นโดยสกินเนอร์ (Skinner) นักจิตวิทยาชาวอเมริกัน เชื่อว่า การเสริมแรง หรือการให้แรงเสริม ถือ เป็นปัจจัยสำคัญในการเปลี่ยนแปลงพฤติกรรมหรือการเรียนรู้ของบุคคล ได้แก่ 1. การเสริมแรงทางบวก คือ ให้สิ่งที่ผู้แสดงพฤติกรรมชอบหลังจากแสดงพฤติกรรมนั้น ๆ ออกมา (เพิ่มพฤติกรรม) เช่น การให้คำชมเมื่อทำสำเร็จ (การชมที่ดีควรชมที่ความสำเร็จ) 2. การเสริมแรงทางลบ คือ การยกเลิกหรือถอนในสิ่งที่ผู้แสดงพฤติกรรมไม่ชอบออกไปหลังจากได้แสดงพฤติกรรม (เพิ่มพฤติกรรม)"},{"n":51,"q":"ข้อใดกล่าวถูกต้องเกี่ยวกับความสำคัญของการมีเจตคติที่ดีต่อผู้อื่น","o":["ทำให้อยู่กับคนที่เรารู้สึกไม่ดีได้","ทำให้กล้ารับมือกับพฤติกรรมของบุคคลอื่น","ทำให้เกิดการปรับตัว","ทำให้มีความกล้าหาญในทุกสถานการณ์"],"a":3,"e":"ความสำคัญของการมีเจตคติที่ดีต่อผู้อื่น ได้แก่ 1. ทำให้เกิดการปรับตัว (Adjustment) 2. เป็นกลไกสำคัญในการป้องกันตัว (Ego Defense) 3. เป็นการแสดงความหมายของค่านิยม (Value Expression) 4. เป็นตัวจัดระเบียบความรู้ (Knowledge)"},{"n":52,"q":"ข้อใดต่อไปนี้ไม่ใช่องค์ประกอบที่สำคัญของเจตคติที่มีต่อผู้อื่น","o":["ด้านความรู้ ความเข้าใจ","ด้านความรับผิดชอบ","ด้านพฤติกรรม","ด้านอารมณ์ ความรู้สึก"],"a":2,"e":"องค์ประกอบที่สำคัญของเจตคติต่อผู้อื่นมีอยู่ 3 ประการ ดังนี้ 1. ด้านความรู้ ความเข้าใจ (Cognitive Component) 2. ด้านอารมณ์ ความรู้สึก (Affective Component) 3. ด้านพฤติกรรม (Behavioral Component)"},{"n":53,"q":"ข้อใดต่อไปนี้กล่าวถึงเจตคติในด้านบวกได้ชัดเจนที่สุด","o":["เป็นการไม่แสดงออกถึงความคิดความรู้สึกใด ๆ","เป็นการกระทำที่ขัดแย้งต่อความรู้สึก","เป็นเจตคติที่แสดงออกในทิศทางที่เห็นด้วยและชื่นชม","เป็นความรู้สึกต่อสถานการณ์รอบตัวที่ไม่ชัดเจน"],"a":3,"e":"ประเภทของเจตคติที่มีต่อผู้อื่น แบ่งออกเป็น 1. เจตคติในทางบวก (Positive Attitude) คือ ความรู้สึกต่อผู้อื่น หรือสิ่งแวดล้อมในทางที่ดีหรือยอมรับ พึงพอใจหรือ ชอบ เห็นด้วยและชื่นชม 2. เจตคติในทางลบ (Negative Attitude) คือ ความรู้สึกหรือการแสดงออกต่อผู้อื่นหรือสิ่งแวดล้อมทิไม่พึงพอใจ ไม่ ชอบ ไม่ยอมรับ ไม่เห็นด้วย 3. การไม่แสดงออกทางเจตคติ (Passive Attitude) คือ การไม่มีความรู้สึกใด ๆ ต่อบุคคล"},{"n":54,"q":"ข้อใดไม่ใช่ขั้นตอนของการเปลี่ยนเจตคติที่มีต่อผู้อื่น","o":["การใส่ใจ","ความกล้าหาญ","ความเข้าใจ","การยอมรับ"],"a":2,"e":"ขั้นตอนของการเปลี่ยนเจตคติต่อผู้อื่นมี 4 ขั้นตอน คือ 1. การใส่ใจ (Attention) 2. ความเข้าใจ (Comprehension) 3. การยอมรับ (Acceptance) 4. ความคงอยู่ (Retention)"},{"n":55,"q":"ปัจจัยใดต่อไปนี้เกี่ยวข้องต่อการเกิดและการเปลี่ยนแปลงเจตคติต่อผู้อื่นมากที่สุด","o":["ครอบครัว","พระ","บรรยากาศ","ครูแนะแนว"],"a":1,"e":"ปัจจัยที่มีอิทธิพลต่อการเกิดและการเปลี่ยนแปลงเจตคติที่มีต่อบุคคลอื่นจะมีอิทธิพลมาจากสิ่งแวดล้อมรอบตัวบุคคล ได้แก่ 1. ครอบครัว 2. บุคคลรอบตัว 3. สื่อมวลชน 4. ประสบการณ์ทางตรงที่สอดคล้องกับเจตคติเดิม"},{"n":56,"q":"\"นายสุดหล่อรู้สึกไม่ชอบนายน ้าแดง เพราะนายน ้าแดงหน้าตาคล้ายคนที่เคยแย่งแฟนตนเอง\" จาก ข้อความ ข้างต้น ท่านคิดว่าน่าจะมีสาเหตุมาจากสิ่งใด","o":["ครอบครัว","การได้รับบาดแผลฝังใจ","ความเชื่อในเรื่องการย้อนคืน","ประสบการณ์ทางตรงที่สอดคล้องกับเจตคติเดิม"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 55. ประกอบ"},{"n":57,"q":"\"นางสาวดาวเรื่องรู้สึกดีต่อนายสุดหล่อ เพราะนายสุดหล่อซื้อขนมมาฝากบ่อย ๆ\" จากข้อความ ข้างต้น ท่านคิดว่าน่าจะมีสาเหตุมาจากสิ่งใด","o":["ประสบการณ์เฉพาะอย่างที่ยุคคลพึ่งพอใจ","การได้รับการตอบสนอง","การติดต่อสื่อสารที่ชัดเจน","ความไว้วางใจ"],"a":1,"e":"สาเหตุสำคัญประการแรกที่ทำให้บุคคลเกิดเจตคติต่อสิ่งใดสิ่งหนึ่ง คือ ประสบการณ์เฉพาะอย่าง (Specific Experiences) คือ การมีประสบการณ์เฉพาะอย่างกับ สิ่งที่เกี่ยวข้องกับเจตคตินั้น เช่น ถ้าหากเรามีประสบการณ์ที่ดีในการ ติดต่อกับบุคคลหนึ่ง เราจะ มีความรู้สึกชอบบุคคลนั้น แต่ถ้ามีประสบการณ์ที่ไม่ดีก็จะมีความรู้สึกไม่ชอบบุคคลนั้น ฯลฯ"},{"n":58,"q":"บุคคลใดต่อไปนี้มีเจตคติที่ดีต่อผู้อื่น","o":["นายโควิดไม่ชอบอาจารย์ เพราะอาจารย์ดุ","นางสาวแสนดีรู้สึกโกรธที่แฟนนอกใจ","นายนกฮูกดีใจที่ตนเองสอบได้คะแนนมากกว่านายนกเอี้ยง","นายแดงชอบทำงานกับนายเขียว เพราะในเขียวเป็นคนเก่งและรับผิดชอบ"],"a":4,"e":"อัลพอร์ท (Allport) ได้ให้ความหมายว่า เจตคติต่อผู้อื่นเป็นสภาวะความพร้อมทาง จิตใจ อันมาจากกระบวนการ ทางความคิดความเข้าใจ อารมณ์ความรู้สึกของบุคคลที่มีต่อผู้อื่นโดยอาศัยประสบการณ์และความพร้อมเป็นตัวกำหนด ทิศทางของพฤติกรรมบุคคลที่มีต่อผู้อื่น วัตถุ สิ่งของ หรือสถานการณ์ต่าง ๆ ดังนั้นจึงสรุปได้ว่า เจตคติต่อผู้อื่น คือ ความคิดความเข้าใจอารมณ์ความรู้สึก และแนวโน้มของพฤติกรรมของบุคคลที่มีต่อบุคคลอื่น แบ่งออกเป็นลักษณะ ที่ เป็นทางบวก คือ เห็นด้วย พึงพอใจหรือชอบ กับลักษณะที่เป็นทางลบ คือ ความไม่เห็นด้วยไม่ชอบ ไม่พึงพอใจ"},{"n":59,"q":"การเปลี่ยนเจตคติจะเกิดขึ้นในทิศทางที่ดีหรือไม่ดี ขึ้นอยู่กับปัจจัยใดเป็นสำคัญ","o":["การจูงใจ","สติปัญญา","ความมีส่วนร่วมระหว่างกัน","ความชัดเจนในข้อมูลใหม่ที่สื่อสาร"],"a":4,"e":"คาร์ล ฮอฟแลนด์ (Cart Hovland) นักจิตวิทยาแห่งมหาวิทยาลัยเยลที่สร้างทฤษฎีการเปลี่ยนเจตคติ (The Yale Attitude Approach) เชื่อว่า องค์ประกอบของเจตคติด้านอารมณ์ความรู้สึก (Affective Component) สามารถเปลี่ยนได้ โดยความคิดหรือความเชื่อ (Cognitive Component) ของบุคคลที่เกี่ยวข้องกับเรื่องนั้น ๆ ซึ่งหมายความว่า การเรียนรู้ ข้อมูลใหม่ผ่านการสื่อสารที่จูงใจหรือการโน้มน้าวใจ (Persuasive Communication) จะไปเปลี่ยนแปลงความเชื้อและการ สื่อสารที่มีประสิทธิภาพจะทำให้ได้ข้อมูลใหม่ที่สนับสนุนให้เกิดความเชื่อที่เหมาะสมและมากพอต่อการเปลี่ยนเจตคติ"},{"n":60,"q":"บุคคลใดมีการพัฒนาเจตคติการทำงานร่วมกับผู้อื่นได้เหมาะสมที่สุด","o":["นายสุดหล่อ ช่วยแสดงความคิดเห็นและจัดการแก้งานให้คนอื่นแม้ไม่ใช่งานตน","น.ส.คนดี ชื่นชมผลงานเพื่อนแม้จะไม่ถูกต้องและตนไม่เห็นด้วยก็ตาม","น.ส.สุดสวย คอยให้กำลังใจเพื่อนร่วมงานเสมอ","นายสุดเท่ ชอบแสดงความสามารถให้ผู้อื่นชื่นชมเสมอ"],"a":3,"e":"การพัฒนาเจตคติการทำงานร่วมกับผู้อื่นประการหนึ่ง คือ การสร้างแรงจูงใจในการทำงานร่วมกัน หมายถึง การ ปฏิบัติงานให้บรรลุถึงเป้าหมายหรือผลสำเร็จที่ตั้งไว้นั้น ย่อมขาดไม่ได้ที่จะกล่าวถึงแรงจูงใจในการปฏิบัติงาน โดยเฉพาะแรงจูงใจในการทำงานเป็นทีม เป็นพลัง ที่มีอยู่ในตัวของบุคคลในทีม เป็นสิ่งเร้า แรงขับ แรงกระตุ้น ผ่านการ ตั้งเป้าหมายความสำเร็จ ร่วมกัน ซึ่งต้องอาศัยสัมพันธภาพที่ดี และความรู้สึกเป็นหนึ่งเดียวระหว่างกัน"},{"n":61,"q":"ข้อใดกล่าวได้ถูกต้องมากที่สุดเกี่ยวกับการสื่อสาร","o":["การสื่อสารพัฒนาได้ตลอดชีวิต","บุคคลมีความสามารถในการสื่อสารมาตั้งแต่เกิด","การสื่อสารเป็นกระบวนการเรียนรู้ในการดำเนินชีวิต","ลักษณะการสื่อสารส่งผลให้บุคลิกภาพของผู้คนเหมือนกัน"],"a":1,"e":"ความหมายของการสื่อสารประการหนึ่ง คือ บุคคลสามารถสื่อสารได้จากการเรียนรู้จากสิ่งแวดล้อม ซึ่งบางคน สื่อสารได้ดี มีความมั่นใจในการสื่อสาร แต่บางคนเกิดความวิตกกังวลและหวาดกลัวที่จะสื่อสารกับคนแปลกหน้า ทั้งนี้ บุคคลสามารถพัฒนาการสื่อสารได้ทุกช่วงวัยหรือตลอดชีวิต โดยคุณลักษณะด้านการสื่อสารจะบ่งบอกถึงบุคลิกภาพ ของบุคคล"},{"n":62,"q":"ข้อใดไม่เกี่ยวข้องกับทักษะการสื่อสาร","o":["ทักษะการดู","ทักษะการฟัง","ทักษะการเขียน","ทักษะการอ่าน"],"a":1,"e":"บุคคลที่สื่อสารได้อย่างมีประสิทธิภาพจะมีความสามารถและทักษะการสื่อสารที่ดีอันจะทำให้กระบวนการสื่อสาร มีความสมบูรณ์ ซึ่งทักษะการสื่อสารที่สำคัญ มีดังนี้ 1. ทักษะการฟัง 2. ทักษะการพูด 3. ทักษะการอ่าน 4. ทักษะการเขียน"},{"n":63,"q":"สารที่มีประสิทธิภาพ ประกอบด้วยรายละเอียดอะไรบ้าง","o":["สัญลักษณ์ + ระบบ + การเรียนรู้","รหัส + เนื้อหา + การจัดสาร","การพิจารณา + การวิเคราะห์ + การสังเคราะห์","สถานการณ์ + ความเข้าใจ + การรับรู้"],"a":2,"e":"สาร (Message) เป็นสัญลักษณ์ที่แสดงออกถึงความคิด อารมณ์ ความรู้สึก หรือความต้องการที่อยู่ในรูปของ ข้อความ ข้อมูล หรือเรื่องราว ซึ่งจะถูกส่งผ่านช่องทางการสื่อสาร ด้วยการแสดงท่าทาง การพูด การเขียน หรือการใช้สื่อ ประเภทต่าง ๆ โดยสารที่มีประสิทธิภาพประกอบด้วย 1. รหัส (Code) 2. เนื้อหา (Content) 3. การจัดสาร (Treatment)"},{"n":64,"q":"ข้อใดไม่ใช่รูปแบบของการสื่อสารระหว่างบุคคล","o":["แบบเผชิญหน้า","แบบเจริญสติ","แบบมวลชน","แบบกึ่งกลาง"],"a":2,"e":"หมายเหตุ: ไฟล์ต้นฉบับพิมพ์เลขเฉลยเป็น 4 แต่ข้อความเฉลยคือ “แบบเจริญสติ” (ข้อ 2) จึงใช้ข้อ 2. การสื่อสารจะมีหลายรูปแบบตามโอกาสและความเจริญก้าวหน้าทางเทคโนโลยีโดยการสื่อสารระหว่างบุคคล สามารถจำแนกออกได้เป็น 2 รูปแบบ ดังนี้ 1. การสื่อสารทางเดียว (One - Way Communication) เป็นการสื่อสารจากผู้ส่งสารถึงผู้รับสารฝ่ายเดียว โดยผู้รับสาร จะไม่สามารถตอบกลับความคิด ความรู้สึก หรือแสดงพฤติกรรมใดๆ กลับไปยังผู้ส่งสาร ดังนั้นการสื่อสารทางเดียวจะ ไม่เกิดการปฏิสัมพันธ์ระหว่างผู้ส่งสารกับผู้รับสารในทันทีทันใด เช่น การสื่อสารมวลชน และการสื่อสารแบบ กึ่งกลาง 2. การสื่อสารสองทาง (Two - Way Communication) เป็นการสื่อสารในลักษณะของการตอบโต้กันระหว่างผู้ส่งสาร กับผู้รับสาร ทั้งในกรณีที่มีการสื่อสาร์สองทางพร้อมกันเมือผู้ส่งสารและผู้รับสารอยู่ในสถานที่เดียวกัน และในกรณีการ สื่อสารสองทางสลับกันในลักษณะผู้ส่งสารและผู้รับสารอยู่คนละสถานที่ โดยต่างฝ่ายต่างสลับกันทำหน้าที่เป็น ผู้ส่งสาร และผู้รับสาร เช่น การสื่อสารแบบเผชิญหน้า เป็นต้น"},{"n":65,"q":"การสื่อสารตามแนวคิดทฤษฎีของอีริค เบิร์น (Eric Berne) ที่ส่งผลต่อบุคลิกภาพของบุคคล ตรงกับ ข้อใด","o":["การสื่อสารแบบพี่น้อง","การสื่อสารแบบกัลยาณมิตร","การสื่อสารแบบผู้ใหญ่","การสื่อสารแบบเพื่อนฝูง"],"a":3,"e":"บุคคลสามารถรับรู้และเข้าใจถึงความคิด ความรู้สึก และพฤติกรรมของผู้คนรอบข้าง ด้วยการวิเคราะห์การสื่อสาร โดยอีริค เบิร์น (Eric Berne) ได้แบ่งบุคลิกภาพที่เกิดจากแรงขับ (Ego State) ที่ส่งผลต่อพฤติกรรมการสื่อสารของบุคคล ออกเป็น 3 ลักษณะ ดังนี้ 1. การสื่อสารแบบพ่อแม่ (Parent Ego State) 2. การสื่อสารแบบผู้ใหญ่ (Adult Ego State) 3. การสื่อสารแบบเด็ก (Child Ego State)"},{"n":66,"q":"ข้อใดไม่เกี่ยวข้องกับการส่งสารที่มีประสิทธิภาพของบุคคล","o":["ความเชื่อหรือค่านิยม","สถานภาพทางสังคม","เจตคติที่ดีต่อตนเองและผู้อื่น","ฐานะทางเศรษฐกิจ"],"a":4,"e":"ผู้ส่งสารที่มีประสิทธิภาพจะมีคุณลักษณะ ดังนี้ 1. ทักษะการสื่อสาร (ดูคำอธิบายข้อ 62. ประกอบ) 2. เจตคติต่อตนเองและผู้อื่น 3. ความรู้ของผู้ส่งสาร 4. ระบบสังคม สถานภาพทางสังคม กลุ่มทางสังคม 5. ระบบวัฒนธรรม ขนบธรรมเนียม ค่านิยมหรือความเชื่อ"},{"n":67,"q":"ข้อใดไม่เกี่ยวข้องกับจริยธรรมการสื่อสาร","o":["ยึดมั่นต่อคุณธรรมตามบรรทัดฐานทางสังคม","เคารพศักดิ์ศรีความเป็นเพื่อนมนุษย์","มีความรับผิดชอบต่อสังคม","เข้าใจถึงความต้องการของตนเองต่อการตอบสนองทางสังคม"],"a":4,"e":"Louis Lay ได้กล่าวถึงจริยธรรมการสื่อสาร 4 ประการ ได้แก่ 1. การสร้างสังคมแห่งเหตุผล 2. การมีศรัทธาต่อเสรีภาพและความรับผิดชอบต่อสังคม 3. การเคารพต่อศักดิ์ศรีความเป็นเพื่อนมนุษย์ 4. การอดทนและยึด มั่นต่อความยุติธรรมตามบรรทัดฐานทางสังคมบนหลักของความจริง"},{"n":68,"q":"นางสาวเอเลือกที่จะคุยกับคุณยายผ่านโทรศัพท์ เพราะมีประสิทธิภาพมากกว่าคุยผ่านไลน์","o":["ใช้ถ้อยคำที่เหมาะสม","รักษาข้อมูลสำคัญเป็นความลับ","ปฏิบัติตามกฎหมายเกี่ยวกับ คอมพิวเตอร์","เรียนรู้วิธีการใช้สื่ออิเล็กทรอนิกส์ที่ถูกต้อง"],"a":4,"e":"การสื่อสารผ่านอุปกรณ์อิเล็กทรอนิกส์ เป็นการสื่อสารที่ทันสมัยและมีประสิทธิภาพ ช่วยให้การดำเนินชีวิตมี ความสะดวกสบายจากการส่งและรับข้อมูลที่เชื่อมโยงสังคมเข้าด้วยกันและควรคำนึงถึงความปลอดภัยในการใช้สื่อ ออนไลน์ที่เหมาะสม ดังนี้ 1. ควรเรียนรู้วิธีการใช้สื่ออีเล็กทรอนิกส์ที่ถูกต้อง 2. รักษาข้อมูลสำคัญให้เป็นความลับ 3. ใช้ถ้อยคำที่เหมาะสม 4. ปฏิบัติตามกฎหมายเกี่ยวกับคอมพิวเตอร์"},{"n":69,"q":"นางบีระมัดระวังในการแสดงความคิดเห็นในเฟสบุ๊ค โดยไม่กล่าวโทษหรือว่าร้ายใคร","o":["ใช้ถ้อยคำที่เหมาะสม","รักษาข้อมูลสำคัญเป็นความลับ","ปฏิบัติตามกฎหมายเกี่ยวกับ คอมพิวเตอร์","เรียนรู้วิธีการใช้สื่ออิเล็กทรอนิกส์ที่ถูกต้อง"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 68. ประกอบ"},{"n":70,"q":"นายซีจะกล่าวสวัสดีและแนะนำตัวก่อนเสมอ หากต้องส่งข้อความถึงเพื่อนนักศึกษาคนใหม่","o":["ใช้ถ้อยคำที่เหมาะสม","รักษาข้อมูลสำคัญเป็นความลับ","ปฏิบัติตามกฎหมายเกี่ยวกับ คอมพิวเตอร์","เรียนรู้วิธีการใช้สื่ออิเล็กทรอนิกส์ที่ถูกต้อง"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 68. ประกอบ"},{"n":71,"q":"การสร้างสัมพันธ์ภาพที่ดีในครอบครัว ควรเริ่มสร้างในวัยใดมากที่สุด","o":["วัยเด็ก","วัยรุ่น","วัยผู้ใหญ่","วัยเริ่มสร้างครอบครัวใหม่"],"a":1,"e":"การสร้างสัมพันธภาพกับผู้อื่นจะเริ่มขึ้นตั้งแต่เกิด ดังนั้นการสร้าง สัมพันธภาพที่ดีในครอบครัว ควรเริ่มสร้างใน วัยเด็กมากที่สุด เพราะประสบการณ์ในวัยเด็กจะมีอิทธิพลต่อสุขภาพจิต และแนวทางในการดำเนินชีวิต"},{"n":72,"q":"การปฏิสัมพันธ์ที่สามารถใช้ภาษาแบบเป็นกันเอง สนิทกัน ถือเป็นระยะห่างระหว่างบุคคลรูปแบบ ใด","o":["ระยะส่วนตัว","ระยะใกล้ชิด","ระยะสังคม","ระยะสาธารณะ"],"a":2,"e":"ระยะใกล้ชิด (Intimate Distance) มีระยะห่างระหว่างบุคคลประมาณ 0-15 เซนติเมตร โดยมีลักษณะดังนี้ 1. สื่อสารอย่างใกล้ชิด ใช้ภาษาแบบเป็นกันเอง 2. สัมผัสใกล้ชิดกันได้ 3. เป็นระยะของคนพิเศษ เช่น คู่รัก คนในครอบครัว"},{"n":73,"q":"การติดต่อสื่อสารที่ต้องอาศัยมารยาททางสังคม ถือเป็นระยะห่างระหว่างบุคคลรูปแบบใด","o":["ระยะส่วนตัว","ระยะใกล้ชิด","ระยะสังคม","ระยะสาธารณะ"],"a":3,"e":"ระยะสังคม (Social Distance) มีระยะห่างระหว่างบุคคลประมาณ 2-3.5 เมตร โดยมีลักษณะดังนี้ 1. ติดต่อสื่อสารภายใต้มารยาททางสังคม 2. ไม่ใกล้ชิด สัมผัสกันไม่ได้ 3. ภาษาที่ใช้เป็นทางการมากขึ้น 4. ระยะสังคม เช่น คนที่อยู่ในโรงเรียนเดียวกัน"},{"n":74,"q":"ข้อใดกล่าวถึงความหมายของสัมพันธภาพระหว่างบุคคลได้ถูกต้องที่สุด","o":["ความผูกพันของบุคคลในครอบครัว","ปฏิสัมพันธ์กับสังคมของคนตั้งแต่ 2 คนขึ้นไป","การตีค่า ให้คุณค่ากับการกระทำของคนในสังคม","การทำงานร่วมกันของคนในที่ทำงานเดียวกัน"],"a":2,"e":"คำว่า \"สัมพันธภาพ\" (Relationship) หมายถึง ความผูกพัน ความเกี่ยวข้อง ส่วนความหมายของคำว่า \"สัมพันธภาพระหว่างบุคคล\" (Interpersonal Relationship) คือการมีปฏิสัมพันธ์กับสังคมของมนุษย์ตั้งแต่ 2 คนขึ้นไป ไม่คงที่ มีการเปลี่ยนแปลงอยู่ตลอดเวลา"},{"n":75,"q":"บุคคลในข้อใดที่มีการมองเห็นคุณค่าในตนเองระดับต ่า","o":["นางสาววุ้นเส้นตัดสินใจได้อย่างแน่วแน่ว่าตนเองจะทำสิ่งใด","นายวาฟเฟิลเชื่อมั่นในการทำงานของตัวเองและตั้งใจทำงาน","นางสาววิปครีมสามารถปรับตัวได้ดีเมื่อพบเจอผู้คนกลุ่มใหม่ ๆ","นายเวสป้ามองว่าความสามารถของตนเองน้อย ทำให้เลี่ยงการแก้ไขปัญหา"],"a":4,"e":"หากบุคคลมีการมองเห็นคุณค่าในตัวเองระดับตำจะส่งผล ดังนี้ 1. มีความทุกข์ทรมานจากความรู้สึกไร้ค่า ความไม่มันใจ และความไม่มั่นคงทางอารมณ์ 2. มีทัศนคติเชิงลบต่อทุกสิ่งทุกอย่าง 3. ไม่สามารถจัดการความยุ่งยากในชีวิต 4. ไม่พึงพอใจในชีวิตตนเอง 5. กระตุ้นให้เกิดพฤติกรรมเชิงลบ เช่น ซึมเศร้า ก้าวร้าว วิตกกังวล 6. เป็นสาเหตุของภาวะทางจิตเวช เช่น โรคซึมเศร้า โรคการกินผิดปกติ การเสพติด ฯลฯ"},{"n":76,"q":"ความสามารถในการตัดสินใจและแก้ไขปัญหา เป็นความฉลาดทางอารมณ์ด้านใด","o":["ดี","เก่ง","สุข","เข้าใจ"],"a":2,"e":"การพัฒนาความฉลาดทางอารมณ์ (E.O.) ด้าน \"เก่ง\" เพื่อสร้างสัมพันธภาพที่ดีกับผู้อื่น ได้แก่ 1. ตัดสินใจและแก้ไขปัญหาได้ 2. รู้ศักยภาพที่แท้จริงของตนเอง 3. ให้กำลังใจตนเองอยู่เสมอ 4. มุ่งมั่นไปให้ถึงเป้าหมายที่ตั้งไว้ 5. มีความยืดหยุ่น 6. รับผิดชอบในสิ่งที่ตัดสินใจ 7. สร้างสัมพันธภาพที่ดีกับผู้อื่น"},{"n":77,"q":"การควบคุมความต้องการและแรงกระตุ้นให้เหมาะสม เป็นความฉลาดทางอารมณ์ด้านใด","o":["ดี","เก่ง","สุข","เข้าใจ"],"a":1,"e":"การพัฒนาความฉลาดทางอารมณ์ (E.Q.) ด้าน \"ดี\" เพื่อสร้างสัมพันธภาพที่ดีกับผู้อื่น ได้แก่ 1. เข้าใจความต้องการของตนเอง 2. รู้เท่าทันอารมณ์และควบคุมได้ 3. รอคอยได้เพื่อสิ่งที่ต้องการ 4. มีสมาธิจดจ่อได้แม้ถูกกดดัน 5. มีความเห็นอกเห็นใจผู้อื่น"},{"n":78,"q":"ข้อใดกล่าวถึงความหมายของการเห็นคุณค่าในตัวเองได้ถูกต้องมากที่สุด","o":["การมีสุขภาพจิตที่ดี มีความสุขในทุก ๆ วันที่ตื่นขึ้นมา","ความรู้สึกชอบหรือพอใจในตนเองต่อการสร้างสัมพันธภาพ","ทัศนคติที่บุคคลมีต่อตัวเองทั้งในแง่บวกและลบ","การรับรู้ความสามารถที่ซ่อนเร้นของตนเอง"],"a":3,"e":"การเห็นคุณค่าในตัวเอง (Self Esteem) หมายถึง ทัศนคติที่บุคคลมีต่อตัวเอง ทั้งในแง่บวกและลบ รวมทั้งการ ประเมินความคิดและความรู้สึกของตนเองต่อการมีสัมพันธภาพ กับผู้อื่น ดังนั้นการเห็นคุณค่าในตัวเองจึงเป็นลักษณะ ส่วนบุคคลที่เกี่ยวข้องกับการตัดสินใจตามค่านิยมที่มีต่อผู้อื่น"},{"n":79,"q":"ตามหลักการสร้างมนุษย์สัมพันธ์ในที่ทำงานแบบ R-E-L-A-T-I-O-N-S ข้อใดไม่ถูกต้อง","o":["R – Reason","E – Energetic","L – Listening","A - Adaptability"],"a":1,"e":"เทคนิคการสร้างมนุษยสัมพันธ์ในที่ทำงานตามหลักของ \"การสร้างความสัมพันธ์\" ซึ่งตรงกับภาษาอังกฤษว่า \"RELATIONS\" มีดังนี้ 1. R = Reality คือ เข้าใจและยอมรับสภาพที่เป็นจริง มีความจริงใจ 2. E = Energy/Energetic คือ มีความกระตือรือร้นทำสิ่งต่าง ๆ และมีชีวิตชีวา 3. L = Listening คือ เป็นผู้ฟังที่ดี รับฟังผู้อื่นอย่างตั้งใจและเต็มใจ 4. A = Adaptability คือ มีความสามารถในการปรับตัวเข้ากับผู้อื่นและสังคมได้ดี 5. T = Tolerance คือ มีความอดทนและพยายามที่จะสร้างหรือรักษาความสัมพันธ์นั้นโดยการอดทนต่อคำพูดและการ กระทำต่าง ๆ ที่อาจปั่นทอนจิตใจเรา 6. 1 = Integrity คือ มีความชื่อสัตย์ทั้งต่อตนเองและผู้อื่น 7. 0 = Oral Communication Skills คือ มีทักษะการพูดเพื่อการสื่อสาร 8. N = Networking คือ แสวงหาเครือข่าย หมันสร้างมิตรภาพ 9. S = Smile คือ ยิ้มแย้มแจ่มใส แสดงออกถึงมิตรภาพ"},{"n":80,"q":"ข้อใดเป็นการพัฒนาสัมพันธ์ภาหระหว่างเพื่อน โดยการแสดงการยอมรับนับถือ","o":["การแบ่งปันประสบการณ์ซึ่งกันและกัน","การให้อิสระเพื่อนในการตัดสินใจ","การชื่นชมเมื่อเพื่อนประสบความสำเร็จ","การสนใจในความคิดและความรู้สึก"],"a":3,"e":"หลักการสร้างสัมพันธภาพที่ดีกับเพื่อน สามารถทำได้ดังนี้ 1. แสดงความเอาใจใส่ เช่น สนใจในปัญหาที่ต้องเผชิญ 2. แสดงความไว้ใจ เช่น การตรงต่อเวลา การรักษาสัญญา 3. แสดงการยอมรับนับถือ เช่น แสดงความชื่นชมยินดีเมื่อเพื่อนประสบความสำเร็จ 4. แสดงความมีส่วนร่วมและการแบ่งปัน เช่น แบ่งปันประสบการณ์ แบ่งปันความคิดความรู้สึก 5. แสดงความยืดหยุ่น เช่น สามารถยอมรับและปรับตัวเข้ากับเพื่อนได้ 6. แสดงความเห็นอกเห็นใจ ต้องอาศัยความใกล้ชิดและสังเกต จึงจะสามารถเข้าใจผู้อื่นได้ ฯลฯ"},{"n":81,"q":"จำชอบทำคุกกี้ให้แฟนหรือเพื่อนสนิทเมื่อถึงเทศกาลต่าง ๆ เพราะเธอเชื่อว่า ของที่ทำด้วยมือจะสื่อถึง ความรักที่จริงใจได้ ถือเป็นภาษารักแบบใด","o":["บอกรักด้วยการให้ของขวัญ","บอกรักด้วยการทำให้","บอกรักด้วยการใช้เวลาร่วมกัน","บอกรักด้วยคำพูด"],"a":1,"e":"หลักการสร้างสัมพันธภาพที่ดีกับคนรัก ต้องอาศัยภาษารักทั้ง 5 รูปแบบ ได้แก่ 1. บอกรักด้วยคำพูด คือ คนกลุ่มนี้ชอบสื่อสารผ่านคำพูด อ่อนไหวต่อคำพูดอย่างมาก ต้องการให้อีกฝ่ายพูดคุยด้วย หรือเขียนข้อความบอกรัก ชื่นชม ขอบคุณ 2. บอกรักด้วยการใช้เวลาร่วมกัน คือ คนกลุ่มนี้ต้องการใช้เวลาหรือทำกิจกรรมร่วมกับคนรักโดยไม่มีคนอื่นมา รบกวน ต้องการให้อีกฝ่ายทำกิจกรรมที่ชอบด้วยกัน หรือพูดคุยกันอย่างใส่ใจ ไม่ถูกรบกวน 3. การบอกรักด้วยการให้ของขวัญ คือ คนกลุ่มนี้เชื่อว่าของขวัญหรือสิ่งที่ทำให้พิเศษ นับเป็น สัญลักษณ์ของการสื่อ ความรัก ต้องการให้อีกฝ่ายให้ความสำคัญผ่านการมอบสิ่งของ ทำให้รู้สึกว่าได้รับการคืดถึง 4. การบอกรักด้วยการทำให้ คือ คนกลุ่มนี้เชื่อว่าการกระทำสำคัญกว่าคำพูด จึงชอบช่วยเหลืออาสาทำงาน ให้ คำแนะนำ ดังนั้นคนกลุ่มนี้ก็ต้องการได้รับการดูแลช่วยเหลือเช่นกัน 5. การบอกรักด้วยการสัมผัส เช่น กอด หอมแก้ม โอบไหล่ ฯลฯ"},{"n":82,"q":"ข้อใดไม่ใช่แนวคิดธรรมชาติของมนุษย์ที่อธิบายเรื่องมนุษยสัมพันธ์","o":["มนุษย์มีความซับช้อน","มนุษย์ไม่ถูกมองในองค์รวม","มนุษย์มีคุณค่าและศักดิ์ศรี","คำตอบทุกข้อเป็นแนวคิดนี้"],"a":2,"e":"แนวคิดเรื่องธรรมชาติของมนุษย์ที่อธิบายเรื่องมนุษยสัมพันธ์ ได้แก่ 1. ความแตกต่างระหว่างบุคคล (Individual Differences) คือ มนุษย์มีทั้งความคล้ายคลึงและมีความแตกต่างจากผู้อื่น 2. การคำนึงถึงบุคคลในลักษณะรวม (A Whole Person) คือ เราไม่อาจศึกษาบุคคลโดยการแยกศึกษาเป็นส่วนย่อย ๆ แต่ละส่วน 3. สาเหตุของการเกิดพฤติกรรม (A Caused Behavior) คือ พฤติกรรมเกิดจากความต้องการ ซึ่งถือว่าความต้องการเป็น แรงขับหรือแรงจูงใจภายในที่ทำให้เกิดพฤติกรรม นอกจากนี้แล้วเรายังสามารถทำให้มนุษย์แสดงพฤติกรรมโดยใช้ สิ่งจูงใจภายนอกได้ 4. มนุษย์มีคุณค่าและศักดิ์ศรี (Dignity) คือ มนุษย์ทุกคนมีคุณค่าและศักดิ์ศรีเท่าเทียมกัน 5. มนุษย์มีความชับข้อน (Complex) คือ มนุษย์จัดเป็นสัตว์ชั้นสูงที่ซับซ้อนและมีพฤติกรรม ผันแปรอยู่ตลอดเวลาตาม ความต้องการหรือแรงจูงใจที่มีอยู่"},{"n":83,"q":"ข้อใดไม่ใช่เทคนิคการสร้างมนุษยสัมพันธ์ตามทัศนะของเดล คาร์เนกี้","o":["ทำให้ผู้อื่นรู้สึกว่าเป็นคนสำคัญ","จดจำชื่อของบุคคลให้ได้มากที่สุด","สนทนาในเรื่องที่เราสนใจ","ยกย่องสรรเสริญผู้อื่นอย่างสุจริตใจ"],"a":3,"e":"เทคนิคการสร้างมนุษยสัมพันธ์เพื่อเอาชนะใจผู้อื่นของ เดล คาร์เนกี้ มีดังนี้ 1. อย่าตำหนิ ประณาม พร ่าบ่น หรือนินทา 2. จงยกย่องสรรเสริญผู้อื่นด้วยความสุจริตใจ 3. จงเอาใจใส่ผู้อื่นอย่างแท้จริง 4. การยิ้ม 5. จดจำชื่อบุคคล 6. จงเป็นนักฟังที่ดี 7. จงทำให้ผู้อื่นเกิดความรู้สึกว่าเป็นคนสำคัญ"},{"n":84,"q":"จากที่กล่าวว่าบุคลิกภาพเกิดจากการเรียนรู้ ดังนั้นการฝึกพัฒนาบุคลิกภาพควรเริ่มต้นด้วยขั้นตอนใด","o":["ปรับชีวิตให้เข้ากับสังคม","ฝึกควบคุมอารมณ์ตนเอง","สร้างความเชื่อมั่นในตนเอง","ปรับทัศนคติให้มองด้านดี"],"a":4,"e":"หลักการฝึกพัฒนาบุคลิกภาพภายในเพื่อสร้างมนุษยสัมพันธ์ มีดังนี้ 1. ปรับทัศนคติของเคนเองให้มองทุกสิ่งในด้านที่ดี หรือการมองทุกคนในแง่ดี เพราะทัศนคติที่ดีคือ จุดเริ่มต้นของ บุคลิกง่าย ๆ เพียงแต่มองทุกสิ่งในด้านที่ดี ก็จะทำให้มีความสุข 2. สร้างความเชื่อมั่นและศรัทธาในตนเอง 3. พยายามวิเคราะห์ประเมินตนเองอย่างแท้จริง 4. ทำใจให้พร้อมในการเผชิญความจริง 5. ฝึกให้มีความสามารถในการควบคุมอารมณ์ของตนเองไม่ว่าจะอยู่ในสถานการณ์ใด 6. ฝึกตนเองให้มีความอดทนและอดกลั้นในปัญหาต่าง ๆ ฯลฯ"},{"n":85,"q":"ข้อใดคือคำอธิบายความขัดแย้งตามแนวคิดสมัยดั้งเดิม","o":["ความขัดแย้งตั้งอยู่บนรากฐานที่ทำให้องค์กรที่มีความสามัคคีและความร่วมมือ","ความขัดแย้งอาจจะมีประโยชน์ต่อองค์กรได้บ้างในบางเวลา","ความขัดแย้งเป็นสิงที่ไม่ดี หากหลีกเลียงได้ควรหลีกเลียง","ถูกทุกข้อ"],"a":3,"e":"แนวความคิดเกี่ยวกับความขัดแย้งสมัยดั้งเดิม (Traditional View) เป็นมุมมองสมัยดั้งเดิม ซึ่งสันนิษฐานว่า ความขัดแย้งเป็นสิ่งไม่ดี และมีผลกระทบด้านลบต่อองค์กรอยู่เสมอ ดังนั้นความขัดแย้งจึงกลายเป็นคำที่มีความหมาย เหมือนกับความรุนแรง หรือการทำลาย และการไร้เหตุผล เพราะความขัดแย้งจะทำให้เสียหาย หากหลีกเลี่ยงได้ควรเลี่ยง ไม่ให้เกิดขึ้น"},{"n":86,"q":"พฤติกรรมการจัดการความขัดแย้งที่มีลักษณะหลีกเลี่ยง ไม่เผชิญหน้ากับคู่กรณี ตรงกับสัตว์ชนิดใด","o":["แบบฉลาม","แบบนกฮูก","แบบเต่า","แบบสุนัขจิ้งจอก"],"a":3,"e":"พฤติกรรมในการจัดการความขัดแย้งของจอห์นสัน (Johnson & Johnson) แบบแรก ได้แก่ ลักษณะการหลีกเลี่ยง แบบเต่า (Avoiding : ถอนตัวหรือหดหัว) คือ หลีกหนี่ความขัดแย้ง ยอมสละวัตถุประสงค์และความสัมพันธ์ส่วนตัว โดย การหลีกเลี่ยงไม่เผชิญหน้ากับคู่กรณี และจะไม่ตัดสินใจอย่างใดอย่างหนึ่งเพื่อแก้ปัญหา"},{"n":87,"q":"พฤติกรรมการจัดการความขัดแย้งที่มีมุมมองว่า เมื่อมีความขัดแย้งขึ้นจะต้องมีผู้ชนะและผู้แพ้ตรงกับ สัตว์ชนิดใด","o":["แบบนกฮูก","แบบฉลาม","แบบเต่า","แบบสุนัขจิ้งจอก"],"a":2,"e":"พฤติกรรมในการจัดการความขัดแย้งของจอห์นสัน (Johnson & Johnson) แบบที่ 2 ได้แก่ ลักษณะการใช้กำลังใน การแข่งขันแบบฉลาม (Competing : บังคับหรือชอบใช้กำลัง) คือ แก้ปัญหาความขัดแย้งโดยใช้อำนาจตามตำแหน่ง และ คำนึง ถึงเป้าหมายของงานหรือความต้องการของตนเองมากกว่าความสัมพันธ์กับเพื่อนร่วมงาน ดังนั้นจึงมักใช้อำนาจที่ เหนือกว่าเข้าบังคับ โดยไม่คำนึงถึงเป้าหมายของผู้อื่น เพราะถือว่าการชนะ คือ ความสำเร็จ ส่วนการพ่ายแพ้นั้น คือ ความอ่อนแอ"},{"n":88,"q":"สถานการณ์หนีเสือปะจระเข้ ตรงกับความขัดแย้งในข้อใด","o":["Approach - Approach Conflict","Avoidance - Avoidance Conflict","Approach - Avoidance Conflict","Double Approach - Avoidance Conflict"],"a":2,"e":"ความขัดแย้งภายในตัวบุคคล สามารถแบ่งออกเป็น 3 ชนิด ดังนี้ 1. รักพี่เสียดายน้อง (Approach - Approach Conflict) คือ ความขัดแย้งที่บุคคลต้องเลือกทำสิ่งใดระหว่างตัวเลือกที่มี มากกว่า 1 ตัว และทุกตัวเลือกเป็นสิ่งที่จะให้ผลทางบวก แต่ว่าเลือกได้อย่างเดียว เช่น ต้องเลือกงานเพียงงานเดียว ทั้ง ๆ ที่ผ่านสัมภาษณ์งานทั้ง 2 แห่ง 2. หนีเสือปะจระเข้ (Avoidance - Avoidance Conflict) คือ ความชัดแย้งที่เกิดขึ้นจากความรู้สึกของบุคคลที่ไม่ ต้องการ ไม่ปรารถนาทั้ง 2 อย่าง แต่จำเป็นต้องเลือก 1 อย่างเช่น ไม่อยากนั่งรถตู้ เพราะอันตราย และก็ไม่อยากนั่งรถเมล์ เพราะแน่นและช้า 3. เกลียดตัวกินไข่ (Approach - Avoidance Conflict) คือ ความขัดแย้งที่เกิดขึ้น เพราะต้องเลือกทำในสิ่งที่เป็นทั้งผล ทางบวกและผลทางลบ แต่จำเป็นต้องเผชิญหน้าทั้ง 2 อย่างในเวลาเดียวกัน เช่น ไม่อยากใช้สินค้าจีน เพราะไม่ได้คุณภาพ แต่ราคาถูกดี"},{"n":89,"q":"สถานการณ์รักพี่เสียดายน้อง ตรงกับความขัดแย้งในข้อใด","o":["Approach - Approach Conflict","Avoidance - Avoidance Conflict","Approach - Avoidance Conflict","Double Approach - Avoidance Conflict"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 88. ประกอบ"},{"n":90,"q":"ความขัดแย้งที่เกิดขึ้นโดยต้องเลือกทั้งผลทางบวกและผลทางลบ ตรงกับข้อใด","o":["Approach - Approach Conflict","Avoidance - Avoidance Conflict","Approach - Avoidance Conflict","Double Approach - Avoidance Conflict"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 88. ประกอบ"},{"n":91,"q":"ทักษะที่สื่อสารทางอวัจนภาษา รวมถึงคุณสมบัติทางเสียง","o":["ทักษะการสื่อสาร","ทักษะการควบคุมอารมณ์","ทักษะทางปัญญา","ทักษะการแก้ปัญหาสังคม"],"a":1,"e":"องค์ประกอบของทักษะทางสังคมมี 4 ประการ ได้แก่ 1. ทักษะการสื่อสาร (Communication Skills) คือ การสื่อสารประกอบด้วยส่วนประกอบ ทั้งทางวาจา ซึ่งรวมถึงการ ใช้ภาษาเป็นหลัก และอวัจนภาษา รวมถึงคุณสมบัติทางเสียง ที่ใช้โต้ตอบ เพื่ออำนวยความสะดวกในการทำความเข้าใจ ร่วมกัน 2. การควบคุมอารมณ์ (Emotion Regulation) คือ ความสามารถทางสังคมและทักษะทาง สังคมที่แต่ละบุคคล แสดงออกของประสบการณ์ทางอารมณ์ โดยการเปลี่ยนความคิดของตนเองเกี่ยวกับสถานการณ์ (การเปลี่ยนแปลงทาง ปัญญา) และหลีกเลี่ยงสถานการณ์หรือ บุคคลที่กระตุ้นอารมณ์รุนแรง (การเลือกสถานการณ์) หรือการมุ่งความสนใจไป ที่แง่มุม ที่น่าพึงพอใจมากขึ้นของสถานการณ์ เช่น บุคคลที่มีการตอบสนองอารมณ์เชิงบวกและสบสามารถควบคุมการ ตอบสนองตนเองได้ เป็นต้น 3. ทักษะท่างปัญญา (Cognitive Skills) คือ ความรู้ ความคิด และการใช้เหตุผลที่เกี่ยวข้อง กับปฏิสัมพันธ์ทางสังคม เช่น ความรอบรู้ด้านข้อมูลช่วยให้แต่ละคนเข้าใจและคาดการณ์เกี่ยวกับบทบาทของแต่ละคน โดยดำเนินการที่จำเป็นใน บริบททางสังคมที่เฉพาะเจาะจง 4. ทักษะการแก้ปัญหาสังคม (Social Problem - Solving Skills) คือ ความสัมพันธ์ระหว่าง บุคคลหรือทางสังคมที่ กว้างขึ้น ซึ่งปัญหาความสัมพันธ์ทางสังคม เช่น การตกงาน การเกิดความขัดแย้งกับเพื่อน หรือประสบการณ์การเลือก ปฏิบัติเมื่อปัญหาเกิดขึ้นจะไม่มีวิธีแก้ปัญหาที่ชัดเจน บุคคลต่าง ๆ จะใช้ทักษะการแก้ปัญหาสังคม เพื่อเพิ่มผลลัพธ์เชิง บวกและลดผลกระทบเชิงลบให้เหลือน้อยที่สุด"},{"n":92,"q":"ความรอบรู้ด้านข้อมูลช่วยให้แต่ละคนเข้าใจเกี่ยวกับบทบาทของแต่ละคน","o":["ทักษะการสื่อสาร","ทักษะการควบคุมอารมณ์","ทักษะทางปัญญา","ทักษะการแก้ปัญหาสังคม"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 91. ประกอบ"},{"n":93,"q":"การเปลี่ยนความคิดของตนเองและหลีกเลี่ยงสถานการณ์หรือการกระตุ้นอารมณ์","o":["ทักษะการสื่อสาร","ทักษะการควบคุมอารมณ์","ทักษะทางปัญญา","ทักษะการแก้ปัญหาสังคม"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 91. ประกอบ"},{"n":94,"q":"เหตุการณ์ที่เกิดขึ้นอาจมาจากปัญหาหรือความสัมพันธ์ทางสังคม","o":["ทักษะการสื่อสาร","ทักษะการควบคุมอารมณ์","ทักษะทางปัญญา","ทักษะการแก้ปัญหาสังคม"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 91. ประกอบ"},{"n":95,"q":"การฝึกทักษะทางสังคมของบุคคลที่อยู่ในวัยเด็กเล็ก ควรฝึกทักษะสังคมอย่างไร","o":["การเล่น","การร้อง","การปืนป่าย","การเดิน"],"a":1,"e":"ทักษะทางสังคม เป็นทักษะพื้นฐานที่ควรได้รับการฝึกฝนปลูกฝังตั้งแต่วัยเด็ก ๆเพื่อให้ทุกคน ซึ่งเป็นหน่วยหนึ่ง ของสังคมสามารถดำรงชีวิตอยู่ในสังคมได้อย่างมีสุข ดังนั้นการฝึกทักษะทางสังคมให้กับวัยเด็กเล็กก่อนเข้าโรงเรียน โดยเฉพาะการเล่น ถือเป็นกิจกรรม ที่สำคัญในชีวิตเด็กทุกคน เพราะทำให้เด็กมีโอกาสเคลื่อนไหวส่วนต่าง ๆ ของ ร่างกาย ได้ใช้ประสาทสัมผัสและการรับรู้ ได้ผ่อนคลายอารมณ์ แสดงออกถึงตนเอง และเรียนรู้ความรู้สึกของผู้อื่น ดังนั้นการเล่นจึงเป็นทางที่ดีที่เด็กจะสร้างประสบการณ์เรียนรู้สิ่งแวดล้อม เรียนรู้ความเป็นอยู่ของผู้อื่น และสร้าง ความสัมพันธ์อยู่ร่วมกับผู้อื่น"},{"n":96,"q":"การฝึกทักษะทางสังคมทางด้านการปรับตัวให้กับบุคคล ควรฝึกในช่วงวัยใด","o":["วัยเด็กเล็ก","เด็กวัยเรียน","วัยรุ่น","วัยผู้ใหญ่"],"a":2,"e":"เด็กวัยเรียน เป็นช่วงวัยที่ได้รู้จักบุคคลอื่น ๆ ที่นอกจากครอบครัว โดยลักษณะทาง สังคมของเด็กวัยนี้จะขึ้นอยู่กับ การอบรมที่ได้รับจากทางครอบครัว ลักษณะสังคมจึงเริ่มอยู่กันเป็นกลุ่ม ซึ่งแต่ละกลุ่มมีการเปลี่ยนหน้ากันอยู่บ่อย ๆ ใน ลักษณะมารวมกัน ดังนั้นเด็กวัยเรียน จึงต้องฝึกการปรับตัวให้เข้ากับบุคคลอื่น เพื่อให้เป็นที่ยอมรับทางสังคม"},{"n":97,"q":"การฝึกทักษะทางสังคมของวัยรุ่น จะต้องฝึกทักษะทางสังคมอย่างไร","o":["ฝึกแก้ไขปัญหา","ฝึกการควบคุมตัวเอง","ฝึกการปฏิบัติตัวให้เป็นที่ยอมรับทางสังคม","ฝึกการสื่อสาร"],"a":3,"e":"สังคมของวัยรุ่นเริ่มขยายทางสังคมมากขึ้นกว่าช่วงวัยเด็ก เด็กผู้ชายจะมีขนาด สังคมใหญ่กว่าเด็กผู้หญิง วัยรุ่นจะ ทำทุกสิ่งทุกอย่างตามที่กลุ่มต้องการเพื่อให้เป็นที่ยอมรับของกลุ่ม โดยกลุ่มจะมีอิทธิพลต่อวัยรุ่นทั้งในด้านความ ประพฤติ การแต่งกาย กิริยาท่าทางเจตคติ ความสนใจ และค่านิยม วัยรุ่นจะชอบเลียนแบบพฤติกรรมต่าง ๆ จากผู้ใหญ่ ดังนั้น วัยรุ่นจึงต้องเน้นฝึกทักษะทางสังคม คือ ฝึกการปฏิบัติตัวให้เป็นที่ยอมรับทางสังคม"},{"n":98,"q":"กระบวนการเรียนรู้ของบุคคลโดยการสังเกต ประกอบด้วยอะไรบ้าง","o":["การคงไว้ และการเสริมแรง","ความตั้งใจ และการคงไว้","ความตั้งใจ และการทำตาม","ความตั้งใจ การคงไว้ การทำตาม และการเสริมแรง"],"a":4,"e":"Albert Bandura นักจิตวิทยาชาวอเมริกัน เป็นผู้ริเริ่มพัฒนาทฤษฎีปัญญา สังคม (Social Cognitive Theory) ที่ เน้นหลักการเรียนรู้โดยการสังเกต (Observational Learning) คือ การที่บุคคลสังเกตการกระทำของผู้อื่นแล้วพยายาม เลียนแบบพฤติกรรมนั้น ซึ่งกระบวนการเรียนรู้ของบุคคลโดยการสังเกต ประกอบด้วย 4 องค์ประกอบ ดังนี้ 1. ความใส่ใจ (Attention Processes) หรือความตั้งใจ 2. การเก็บจำ (Retention Processes) หรือการคงไว้ 3. การปฏิบัติ (Production Processes) หรือการทำตาม 4. การจูงใจ (Motivation Process) หรือการเสริมแรง"},{"n":99,"q":"การไหว้ปู่ย่าตายาย เป็นการไหว้ระดับใด","o":["ระดับที่ 1","ระดับที่ 2","ระดับที่ 3","ระดับที่ 4"],"a":2,"e":"เอกลักษณ์การไหว้ของไทย เป็นธรรมเนียมปฏิบัติที่แสดงออกถึงการมีมารยาทในการทักทายและแสดงความเคารพ ต่อกันของวัฒนธรรมไทย แบ่งออกเป็น 3 ลักษณะ ดังนี้ 1. การไหว้พระ คือ ค้อมตัวลงให้ต ่า พร้อมกับประนมมือขึ้นให้หัวแม่มือจรดระหว่างคิ้วปลายนิ้วแนบหน้าผาก 2. การไหว้ผู้มีพระคุณและผู้อาวุโส คือ ค้อมตัวลงให้ต ่า พร้อมกับประนมมือขึ้นให้หัวแม่มือจรดปลายจมูก ปลายนิ้ว แนบระหว่างคิ้ว 3. การไหว้บุคคลทั่วไปผู้มีอาวุโสกว่าเล็กน้อย หรือผู้เสมอกัน คือ ประนมมือแล้วยกขึ้นพร้อมกับค้อมศีรยะลงให้หัว แม่มือจรดปลายคาง ปลายนิ้วแนบปลายจมูก"},{"n":100,"q":"การฝึกพฤติกรรมที่ปฏิบัติตามแบบแผนกฎเกณฑ์และข้อบังคับของสังคม ตรงกับทักษะทางสังคม ข้อใด","o":["ความรับผิดชอบ","ระเบียบวินัย","ความยึดหยุ่น","รู้จักให้อภัย"],"a":2,"e":"ระเบียบวินัย คือ บุคคลที่มีระเบียบวินัยจะต้องเป็นบุคคลที่มีแบบแผน กฎเกณฑ์ที่กำหนดไว้เป็นแนวปฏิบัติ ดังนั้น คนที่มีระเบียบวินัยจึงเป็นบุคคลที่สามารถควบคุมตนเองให้ประพฤติปฏิบัติตนได้ตามแบบแผน กฎเกณฑ์ และข้อบังคับ ของสังคมนั้นได้"},{"n":101,"q":"การฝึกการปฏิบัติหน้าที่การเรียนและการทำงานให้ประสบความสำเร็จ ตรงกับทักษะทางสังคมข้อ ใด","o":["ความรับผิดชอบ","ระเบียบวินัย","ความยึดหยุ่น","รู้จักให้อภัย"],"a":1,"e":"ความรับผิดชอบ คือ บุคคลที่มีความรับผิดชอบในการปฏิบัติหน้าที่การเรียนและการทำงานให้ประสบความสำเร็จ ตามสิ่งที่มุ่งหวัง โดยพัฒนาตนเองและปรับปรุงหน้าที่ให้ดีขึ้นสำหรับการฝึกทักษะความรับผิดชอบนั้น เราจะมุ่งเน้นให้ บุคคลมีความรับผิดชอบในการปฏิบัติหน้าที่การงานของตนเองเป็นสำคัญ"},{"n":102,"q":"การฝึกให้บุคคลรับมือกับปัญหาและความพ่ายแพ้ต่าง ๆ ที่เกิดขึ้นได้เป็นอย่างดี ตรงกับทักษะทาง สังคม ข้อใด","o":["ความรับผิดชอบ","ระเบียบวินัย","ความยึดหยุ่น","รู้จักให้อภัย"],"a":3,"e":"ความยืดหยุ่น คือ บุคคลที่มีความสามารถในการยืดหยุ่นจะเป็นบุคคลที่รับมือกับ ปัญหาและความพ่ายแพ้ต่าง ๆ ที่ เกิดขึ้นได้ดี โดยผู้ที่มีความยืดหยุ่นจะสามารถใช้ทักษะและ จุดแข็งของตัวเอง เพื่อรับมือและฟื้นตัวต่อปัญหาต่าง ๆ ได้ดี"},{"n":103,"q":"ข้อใดเป็นบุคลิกภาพส่วนแรกที่สังเกตได้ง่าย สร้างความประทับใจให้กับผู้อื่นตั้งแต่แรกเห็น","o":["รูปร่างผอมสูง หน้าตาดี ผิวสวย ผมสวย","มีสติปัญญาสูง ฉลาด","มีความมั่นใจ เป็นตัวของตัวเองสูง","จิตใจดี อบอุ่น เป็นมิตร"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 42. ประกอบ"},{"n":104,"q":"ข้อใดเป็นบุคลิกภาพภายในของบุคคลที่ไม่ปรากฏอย่างชัดเจน แต่อาจทราบได้จากการคาดเดา","o":["หนึ่งเป็นคนเก็บตัว","สองเป็นคนรูปร่างดี","สามเป็นคนยิ้มสวย","สี่เป็นคนฉลาด"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 42. ประกอบ"},{"n":105,"q":"ผู้ที่มีบุคลิกภาพที่ดีมีลักษณะอย่างไร","o":["ไม่หวั่นไหวต่ออารมณ์ของผู้อื่น","เชื่อมั่นยึดมั่นในความเห็นของตนเอง","แสดงความสามารถอย่างเต็มศักยภาพ","ปฏิบัติตามแผนอย่างเคร่งครัด"],"a":3,"e":"ความสำคัญของบุคลิกภาพ มีดังนี้ 1. ผู้ที่มีบุคลิกภาพที่ดีมีอิทธิพลต่อความรู้สึกและอารมณ์ของผู้ที่พบเห็น ทำให้ได้รับการยอมรับ นับถือและประทับใจ ต่อผู้พบเห็น เรียกว่า \"มีเสน่ห์น่าคบหา\" 2. ผู้ที่มีบุคลิกภาพที่ดีจะรู้สึกมั่นใจในตนเอง มีความเป็นตัวของตัวเอง และสามารถแสดงออก ถึงความสามารถได้ อย่างเต็มศักยภาพ ได้รับความร่วมมือในการทำงาน 3. ผู้ที่มีบุคลิกภาพเหมาะสมสอดคล้องกับงานอาชีพจะสามารถทำงานได้ดี 4. ผู้ที่มีบุคลิกภาพที่ดีจะมองเห็นและยอมรับในความแตกต่างของบุคคล รู้จักและเข้าใจผู้อื่นสามารถสร้าง สัมพันธภาพกับผู้อื่นได้ดี"},{"n":106,"q":"หากบุคคลต้องการเปลี่ยนแปลงบุคลิกภาพที่ไม่เหมาะสมจากการเรียนรู้ ควรทำอย่างไร","o":["ค้นหาศักยภาพเชิงบวกเพื่อพัฒนาตนเอง","เสริมแรงช่วยเพิ่มความถี่ของพฤติกรรมที่เหมาะสม","ควบคุมจิตใต้สำนึกให้มีพฤติกรรมที่เหมาะสม","ระบายความคับข้องใจ"],"a":2,"e":"ทฤษฎีพฤติกรรมนิยม (Behaviorism Theory) ของสกินเนอร์ (B.F.Skinner) เชื่อว่า บุคลิกภาพสั่งสมมาจาก พฤติกรรมที่เกิดจากการเรียนรู้ ดังนี้ 1. พฤติกรรมของมนุษย์จะคงอยู่ตลอดไป จำเป็นต้องมีการเสริมแรง 2. การเสริมแรงเป็นสิ่งที่ช่วยเพิ่มความถี่ของพฤติกรรมที่เหมาะสม (การเสริมแรงทางบวกและการเสริมแรงทางลบ) 3. หลักการให้รางวัลเพื่อเสริมสร้างบุคลิกลักษณะที่พึงประสงค์ 4. หลักการลงโทษเพื่อระงับพฤติกรรมไม่เหมาะสม ลดความถี่ของพฤติกรรม"},{"n":107,"q":"แดงฝึกตนเองให้มีใจกว้าง เคารพความคิดเห็นของผู้อื่น แดงกำลังพัฒนาบุคลิกภาพด้านใด","o":["สติปัญญา","จิตใจ","อารมณ์","สังคม"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 7. ประกอบ"},{"n":108,"q":"ข้อใดกล่าวถูกต้องเกี่ยวกับมารยาท","o":["มารยาทเป็นแบบแผนแห่งความประพฤติ","มารยาทไม่ใช่มรดกทางวัฒนธรรม","มารยาทเกิดขึ้นเฉพาะบุคคล ไม่สามารถฝึกฝนและเรียนรู้ได้","มารยาทเป็นเรื่องที่เกิดขึ้นเฉพาะในพิธีการต่าง ๆ"],"a":1,"e":"นักวิชาการหลายท่าน อธิบายว่า มารยาทเป็นกิริยาวาจา ที่ถือว่าเรียบร้อย เหมาะสมกับกาลเทศะ ดังนั้นมารยาท เป็นสิ่งที่ทุกคนต้องยึดถือเป็นหลักปฏิบัติ เป็นแบบแผนแห่งความประพฤติ เพื่ออยู่ร่วมกับคนอื่น ๆ ในสังคมได้ โดย มารยาทเป็นส่วนหนึ่งของวิถีชีวิต เป็นมรดกทางวัฒนธรรม และช่วยให้เกิดการจัดระเบียบทางสังคมให้มีความเรียบร้อย เละมีบรรยากาศน่าอยู่"},{"n":109,"q":"การไหว้พ่อแม่ที่ถูกต้องนั้น มีลักษณะใด","o":["หัวแม่มือจรดปลายจมูก ปลายนิ้วชี้แนบหว่างคิ้ว","หัวแม่มือจรดปลายคาง ปลายนิ้วชี้แนบปลายจมูก","หัวแม่มือจรดปลายปาก ปลายนิ้วชี้แนบเหนือปลายจมูก","หัวแม่มือจรดหว่างคิ้ว ปลายนิ้วชี้แนบส่วนของหน้าผาก"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 99. ประกอบ"},{"n":110,"q":"ข้อใดคือการทักทายแบบสากลที่ถูกต้อง","o":["มือซ้ายหุ้มกำปั้นขวาและโค้งคำนับ","ใช้มือขวาของแต่ละฝ่ายยื่นมาจับมือกัน","โค้งคำนับโดยโน้มลำตัวด้านบนลงต ่าทำมุมประมาณ 30 องศา","นำแก้มของทั้งสองฝ่ายมาชนกัน หรือจุ๊บแก้มกันเบา ๆ"],"a":2,"e":"นานาชาติมักทักทายกันด้วยวิธีจับมือทักทาย ซึ่งถือว่าเป็นมารยาทในการทักทายแบบสากล โดยสิ่งที่สำคัญ คือ การใช้มือขวาของแต่ละฝ่ายยื่นมาจับมือกัน ด้วยกิริยาที่มั่นใจและดูเป็นมิตร"},{"n":111,"q":"บุคคลในข้อใดมีมารยาทในการรับประทานอาหาร","o":["นายหนึ่งพูดขณะที่มีอาหารอยู่ในปาก","น.ส.บี ตักอาหารคำใหญ่เข้าปาก","นายเอเอื้อมมือหยิบอาหารข้ามผู้อื่น","น.ส.สอง ใช้ช้อนกลางตักกับข้าว"],"a":4,"e":"มารยาทในการรับประทานอาหารแบบสากล มีหลักปฏิบัติที่ถูกต้องเหมาะสม ดังนี้ 1. นั่งตามที่เจ้าภาพจัดไว้ให้ หรือนั่งตามชื่อบนโต๊ะที่เจ้าภาพจัดไว้ 2. ไม่นำแก้วเครื่องดื่มที่หน้างานเข้ามายังโต๊ะอาหาร 3. สุภาพบุรุษควรดึงเก้าอี้ให้สุภาพสตรีเข้านั่งก่อน แล้วคลี่ผ้าเช็ดปากบนโต๊ะให้สุภาพสตรีด้วยอาจพับเป็นสามเหลี่ยม และนำพาดไว้ที่หน้าตักก็ได้ เมื่อต้องลุกจากโต๊ะระหว่างรับประทานอาหาร ให้วางผ้าเซ็ตปากนั้นลงบนเก้าอี้หรือพนัก วางแขน ไม่ควรวางบนโต๊ะอาหาร 4. โทรศัพท์มือถือไม่ควรเปิดเสียง และห้ามวางไว้บนโต๊ะอาหาร เพราะผิดมารยาท ถือว่าไม่ให้ความสำคัญกับคนที่นั่ง ร่วมโต๊ะด้วย 5. ตะกร้าขนมปังที่วางบนโต๊ะอาหาร สำหรับแขก 3 - 4 คน ต่อหนึ่งตะกร้า สามารถใช้มือหยิบขนมปังที่ต้องการทาน มาใส่ในจานขนมปังของเราด้านซ้ายมือ (ใช้มือหยิบได้เฉพาะของเรา) ถ้าจะแสดงความเอื้อเฟื้อให้ผู้อื่น ให้ยกตะกร้าส่งให้เขาหยิบ ไม่ใช้มือหยิบให้เขา 6. แก้วน ้า แก้วไวน์ อยู่ทางขวามือ อย่าใช้ผิด จะผิดทั้งโต๊ะ 7. การใช้ช้อน ส้อม มีด จากด้านนอกสุดเข้าหาด้านในสุดเสมอ 8. ไม่ควรเอื้อมหยิบอาหารข้ามผู้อื่น และควรใช้ช้อนกลางในการตักอาหาร 9. การพูดคุยกันขณะรับประทานอาหาร ต้องระวังไม่ให้เสียงดังจนเกินไป ไม่พูดเรื่องการเมืองศาสนา หรือความเชื่อ ต่าง ๆ ที่อาจก่อให้เกิดความบาดหมางกันได้ และไม่ควรพูดในขณะที่มีอาหารอยู่เต็มปาก รวมทั้งอย่าเคี้ยวอาหารคำใหญ่ จนเกิดเสียงดังเวลารับประทาน ฯลฯ"},{"n":112,"q":"ข้อใดกล่าวไม่ถูกต้องเกี่ยวกับการรับประทานอาหารที่โต๊ะอาหารตามหลักสากล (Dining Etiquette)","o":["นำผ้าเช็ดปากวางบนโต๊ะอาหาร","วางแก้วน ้า แก้วไวน์ ไว้ทางขวามือ","การใช้ช้อน ส้อม มีด ควรหยิบจากด้านนอกสุดเข้าหาด้านในสุดเสมอ","เมื่อตะกร้าขนมปังอยู่ทางซ้ายมือให้ใช้มือหยิบขนมปังต้องการทานมาใส่ในจาน"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 111. ประกอบ"},{"n":113,"q":"การส่งข้อความแจ้งถึงผู้ที่ทำผิดพลาดโดยตรงผ่านทางอีเมลและให้คำแนะนำอย่างสุภาพ","o":["กฎข้อที่ 7 ยับยั้งการโต้ตอบกันด้วยถ้อยคำที่รุนแรง (Help Keep Flame Wars Under Control)","กฎข้อที่ 8 เคารพความเป็นส่วนตัวของผู้อื่น (Respect Other People's privacy)","กฎข้อที่ 9 อย่าใช้อำนาจไปในทางที่ผิด (Don't Abuse Your Power)","กฎข้อที่ 10 รู้จักให้อภัยผู้อื่น (Be Forgiving of Other People's mistakes)"],"a":1,"e":"มารยาททางอินเทอร์เน็ต (Netiquette) : กฎข้อที่ 7 ยับยั้งการโต้ตอบกันด้วยถ้อยคำที่รุนแรง (Help Keep Flame Wars Under Control) คือ ผู้ที่ใช้อินเทอร์เน็ตควรร่วมมือกันเพื่อช่วยควบคุมและลดปัญหาที่อาจเกิดขึ้นจากการส่งความ คิดเห็น ด้วยการใช้คำที่หยายคาย เติมอารมณ์ความรู้สึกอย่างรุนแรงจนเป็นขนวนให้เกิดกรณีทะเลาะ วิวาทกันในกลุ่ม สมาชิก ซึ่งรู้จักกันในกลุ่มผู้ใช้อินเทอร์เน็ตว่า \"Flame\" เช่น การส่งข้อความแจ้งถึงผู้ที่ทำผิดพลาดโดยตรงผ่านทางอีเมล และให้คำแนะนำอย่างสุภาพ เป็นต้น นอกจากนี้ยังต้องช่วยกันควบคุมสิ่งที่เราเรียกว่า \"Flame Wars\" ได้แก่ จดหมายยุยง หรือจดหมายจากกลุ่มคนที่จะก่อให้เกิดความเสียหาย และความบาดหมางภายในกลุ่มสนทนา"},{"n":114,"q":"การไม่สวมรอยบัญชีของผู้อื่นเพื่อใช้งาน","o":["กฎข้อที่ 7 ยับยั้งการโต้ตอบกันด้วยถ้อยคำที่รุนแรง (Help Keep Flame Wars Under Control)","กฎข้อที่ 8 เคารพความเป็นส่วนตัวของผู้อื่น (Respect Other People's privacy)","กฎข้อที่ 9 อย่าใช้อำนาจไปในทางที่ผิด (Don't Abuse Your Power)","กฎข้อที่ 10 รู้จักให้อภัยผู้อื่น (Be Forgiving of Other People's mistakes)"],"a":3,"e":"มารยาททางอินเทอร์เน็ต (Netiquette) : กฎข้อที่ 9 อย่าใช้อำนาจไปในทางที่ผิด (Don't Abuse Your Power) คือ ไม่ใช้สิทธิที่มีเหนือผู้อื่นในทางที่ผิดเช่น บางคนมีความสามารถและเชี่ยวชาญในการลักลอบเข้าใช้ระบบต่าง ๆ รวมทั้ง การแฮก ข้อมูลหรือสวมรอยบัญชีการใช้งานผู้อื่น ซึ่งเป็นการกระทำที่ไม่สมควรยิ่ง เพราะนอกจากจะ ผิดมารยาทแล้วยัง ผิดกฎหมายอีกด้วย"},{"n":115,"q":"ข้อใดกล่าวไม่ถูกต้องในการเข้านั่งที่โต๊ะอาหาร (Seating) ตามหลักสากล","o":["นำแก้วเครื่องดื่มที่หน้างานเข้ามายังโต๊ะอาหาร","นั่งตามที่เจ้าภาพจัดไว้ให้ หรือนั่งตามชื่อบนโต๊ะที่เจ้าภาพจัดไว้","สุภาพบุรุษควรดึงเก้าอีให้สุภาพสตรีนั่ง","ปิดเสียงโทรศัพท์มือถือ"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 111. ประกอบ"},{"n":116,"q":"วัฒนธรรมมีอิทธิพลต่อวิถีชีวิตของมนุษย์หลายด้าน ยกเว้นข้อใด","o":["การดูแลสุขภาพ","พฤติกรรมความร่วมมือ","ความเชื่อทางการเมือง","ความพิการทางกาย"],"a":4,"e":"วัฒนธรรม คือ รูปแบบของความรู้ ความเชื่อ ทัศนคติ และพฤติกรรม อันเป็น สิ่งที่กลุ่มบุคคลยอมรับและยึดถือ ประกอบกับการมีจุดร่วมทางประวัติศาสตร์ ประเพณี ค่านิยม ทัศนคติ เป้าหมาย และการปฏิบัติที่เป็นลักษณะเฉพาะของ กลุ่ม ดังนั้นวัฒนธรรมจึงถือได้ว่าเป็นส่วนหนึ่งของมุมมองที่ผู้คนใช้เพื่อทำความเข้าใจโลก ทำให้ภูมิหลังทางวัฒนธรรม เป็นสิ่งที่กำหนดรูปแบบและมีอิทธิพลต่อการชี้นำวิถีชีวิตของแต่ละบุคคล เช่น ความรู้ในการดูแลสุขภาพความเชื่อทาง การเมือง พฤติกรรมความร่วมมือต่าง ๆ เป็นต้น"},{"n":117,"q":"ข้อใดไม่ใช่ผลกระทบจากการขาดความตระหนักถึงความแตกต่างทางวัฒนธรรม","o":["ทำให้เข้ากับบุคคลต่างวัฒนธรรมได้ง่ายขึ้น","ทำให้รู้สึกแปลกแยก","ทำให้เกิดอคติและการแบ่งแยก","ทำให้วิตกกังวล"],"a":1,"e":"ความแตกต่างทางวัฒนธรรมไม่ว่าจะเกิดจากปัจจัยใด ล้วนมีผลต่อบุคลิกภาพของมนุษย์ ดังนั้นการเรียนรู้และ สร้างความตระหนักถึงความแตกต่างทางวัฒนธรรม จึงเป็นหนทาง ที่จะช่วยให้มนุษย์เข้าใจและเรียนรู้ซึ่งกันและกัน ซึ่ง การยอมรับในความแตกต่างจะนำไปสู่การไตร่ตรองทบทวนความเชื่อเดิม การปรับตัวให้เข้ากับบุคคลต่างวัฒนธรรมได้ ง่ายขึ้น การเคารพในความแตกต่าง และนำไปสู่การสร้างสังคมที่มีความหลากหลายทางวัฒนธรรม (ส่วนตัวเลือก ข้ออื่น เป็นผลกระทบจากการขาดความตระหนักถึงความแตกต่างทางวัฒนธรรม)"},{"n":118,"q":"ปัจจัยใดต่อไปนี้ไม่ทำให้เกิดความแตกต่างทางวัฒนธรรม","o":["ที่ตั้งทางภูมิศาสตร์","ลักษณะทางพันธุกรรม","การควบคุมการระบาดของเชื้อโรค","วิถีชีวิต"],"a":3,"e":"ปัจจัยใดที่ทำให้เกิดความแตกต่างท่างวัฒนธรรม มีดังนี้ 1. ลักษณะที่ตั้งทางภูมิศาสตร์ 2. ลักษณะทางพันธุกรรม 3. ลักษณะวิถีชีวิตของผู้คน 4. การอพยพย้ายถิ่นฐาน ฯลฯ"},{"n":119,"q":"ข้อใดไม่ใช่ลักษณะของวัฒนธรรมแบบปัจเจกนิยม","o":["ให้ความสำคัญกับการพึ่งพาตนเอง","เน้นการเสียสละเพื่อส่วนรวม","เน้นอิสระ","เห็นความสำคัญของการพัฒนาตนเอง"],"a":2,"e":"ความแตกต่างทางวัฒนธรรมที่ถูกนำมาศึกษา แบ่งออกเป็น 1. วัฒนธรรมปัจเจกนิยม (Individualism) หมายถึง รูปแบบวัฒนธรรมที่คนในสังคมมุ่งให้ความสำคัญกับความ ต้องการของตนเองมากกว่าความต้องการของผู้อื่นและสังคม รวมทั้งเน้นเสรีภาพในการสร้างตัวตน เน้นการมีอิสระทาง ความคิด ให้ความสนใจเฉพาะครอบครัวของตัวเอง มีความเป็นผู้ริเริ่มและเป็นตัวของตัวเองสูง โดยต้องการยืนบน ความสามารถของ ตัวเอง ไม่ชอบพึ่งพาผู้อื่น ให้ความสำคัญกับการพัฒนาตนเอง เจตคติ ความคิด ความรู้สึกของตัวเอง เป็นหลัก จึงมักประพฤติตนโดยยึดตนเองเป็นศูนย์กลาง 2. วัฒนธรรมกลุ่มนิยม (Collectivism) หมายถึง รูปแบบวัฒนธรรมที่ให้ความสำคัญกับผู้อื่นและกลุ่มสังคม ต้องการ การยอมรับจากสังคมรอบข้าง พอใจกับการพึ่งพาระหว่างกันทาง จิตใจและวัตถุในระดับสูง ให้ความสำคัญมากกับการ อยู่ร่วมกันและต้องการให้ตนเองเป็น ที่ยอมรับของกลุ่ม เน้นการเสียสละเพื่อส่วนรวม รวมทั้งยังให้ความสำคัญกับ ความสัมพันธ์ของสมาชิกในกลุ่มแม้ว่าจะทำให้เกิดผลเสียก็ตาม โดยมักประพฤติตนสอดคล้องกับกฎเกณฑ์ข้อบังคับ บรรทัดฐานที่กลุ่มกำหนดไว้ และหน้าที่ต่าง ๆ ตามที่ได้รับมอบหมาย นอกจากนี้การสร้างตัวตนหรือบุคลิกภาพของ บุคคลจะยึดโยงกับกลุ่มในสังคม และการรับรู้ตัวตนว่าเป็นส่วนหนึ่งของกลุ่ม"},{"n":120,"q":"ข้อใดกล่าวไม่ถูกต้องเกี่ยวกับวัฒนธรรม","o":["วัฒนธรรมสามารถเปลี่ยนแปลงได้","มนุษย์เรียนรู้วัฒนธรรมจากผลิตผลทางวัฒนธรรมได้","ข้อความทางวัฒนธรรมแฝงอยู่ในผลิตผลทางวัฒนธรรม","วัฒนธรรมคงอยู่ได้ด้วยตัวของมันเอง ไม่เกี่ยวข้องกับปัจเจกบุคคล"],"a":4,"e":"วัฒนธรรมและบุคลิกภาพเป็นผลผลิตมาจากปัจเจกบุคคล โดยวัฒนธรรมเป็นเสมือนนวัตกรรมของสังคมที่กำหนด คุณค่า ความเชื่อ และค่านิยมให้ปัจเจกบุคคล ดังนั้น วัฒนธรรมจึงอาจมีการแปรเปลี่ยนได้ เมื่อปัจเจกบุคคลซึ่งอยู่ภายใต้ วัฒนธรรมเดิมเริ่มตั้งคำถามต่อความเชื่อเดิมและเสนอแนวคิดใหม่ต่อสังคม"}]}];
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let wrong=store.get('r1141wrong',{});
let S={view:'home',set:'all',count:20,shuffle:true,mode:'practice',msg:''};
let Q=null;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const all=()=>D.flatMap((e,ei)=>e.items.map(it=>({...it,k:ei+'-'+it.n,src:e.title})));
const wcount=()=>Object.keys(wrong).length;

function start(kind){
  let p=all();
  if(kind==='wrong')p=p.filter(x=>wrong[x.k]);
  else if(S.set!=='all')p=p.filter(x=>x.k.startsWith(S.set+'-'));
  if(!p.length){S.msg='ยังไม่มีข้อที่เคยตอบผิด';render();return}
  if(S.shuffle||kind==='wrong')p=shuf(p);
  if(S.count>0&&kind!=='wrong')p=p.slice(0,S.count);
  Q={list:p,pos:0,ans:{},kind};S.view='quiz';S.msg='';render();window.scrollTo(0,0);
}
function finish(){
  Q.list.forEach((x,i)=>{const c=Q.ans[i];if(c==null)return;if(c===x.a)delete wrong[x.k];else wrong[x.k]=1});
  store.set('r1141wrong',wrong);S.view='result';render();window.scrollTo(0,0);
}
function qhtml(x){
  const i=x.q.indexOf(' | ');
  return (i>0?'<div class="ctx">'+esc(x.q.slice(0,i))+'</div>':'')+'<div class="q">'+esc(i>0?x.q.slice(i+3):x.q)+'</div>';
}
function home(){
  const chips=(arr,cur,key)=>arr.map(([v,l])=>`<button class="chip ${cur===v?'on':''}" data-k="${key}" data-v="${v}">${l}</button>`).join('');
  return `<h1>ฝึกทำข้อสอบ RAM1141</h1><div class="mu">ศาสตร์แห่งบุคลิกภาพ · 4 ชุด รวม ${D.reduce((n,e)=>n+e.items.length,0)} ข้อ</div>
  <div class="card"><h2 style="margin-top:0">เลือกชุดข้อสอบ</h2><div class="row">${chips([['all','รวมทุกชุด'],...D.map((e,i)=>[String(i),e.title.replace('ปีการศึกษา','ปี')])],S.set,'set')}</div>
  <h2>จำนวนข้อ</h2><div class="row">${chips([[10,'10'],[20,'20'],[50,'50'],[0,'ทั้งหมด']],S.count,'count')}</div>
  <h2>รูปแบบ</h2><div class="row">${chips([['practice','ฝึกทำ (เฉลยทันที)'],['exam','จำลองสอบ (เฉลยตอนจบ)']],S.mode,'mode')}</div>
  <h2>ลำดับข้อ</h2><div class="row">${chips([[true,'สุ่ม'],[false,'เรียงตามต้นฉบับ']],S.shuffle,'shuffle')}</div>
  <div style="margin-top:18px"><button class="btn" data-act="start">เริ่มทำข้อสอบ</button></div></div>
  <div class="card"><b>ข้อที่เคยตอบผิด: ${wcount()} ข้อ</b><div class="mu">ระบบจำข้อที่ผิดไว้ในเบราว์เซอร์เครื่องนี้ และลบออกเมื่อทำถูก</div>
  <div class="row" style="margin-top:10px"><button class="btn alt" data-act="startwrong">ฝึกเฉพาะข้อที่เคยผิด</button>${wcount()?'<button class="btn alt" data-act="clear">ล้างรายการ</button>':''}</div>
  ${S.msg?`<div class="res bad" style="margin-top:8px">${S.msg}</div>`:''}</div>
  <footer class="mu">ใช้เพื่อการฝึกส่วนตัวเท่านั้น · ไฟล์ต้นฉบับระบุห้ามส่งต่อ/เผยแพร่</footer>`;
}
function quiz(){
  const x=Q.list[Q.pos],c=Q.ans[Q.pos],n=Q.list.length,prac=S.mode==='practice',locked=prac&&c!=null,last=Q.pos===n-1;
  const opts=x.o.map((t,i)=>{const v=i+1;let cl='';
    if(locked)cl=v===x.a?'ok':(v===c?'bad':'');else if(c===v)cl='sel';
    return `<button class="opt ${cl}" data-act="pick" data-v="${v}"><b>(${v})</b><span>${esc(t)}</span></button>`}).join('');
  const fb=locked?`<div class="res ${c===x.a?'ok':'bad'}">${c===x.a?'ถูกต้อง ✓':'ตอบผิด · เฉลยคือข้อ '+x.a}</div>${x.e?`<div class="ex">${esc(x.e)}</div>`:''}`:'';
  const un=n-Object.keys(Q.ans).length;
  const next=prac?`<button class="btn" data-act="${last?'finish':'next'}" ${c==null?'disabled':''}>${last?'ดูผลคะแนน':'ถัดไป'}</button>`
    :(last?`<button class="btn" data-act="finish">ส่งคำตอบ${un?` (ยังไม่ตอบ ${un})`:''}</button>`:`<button class="btn" data-act="next">ถัดไป</button>`);
  return `<div class="row" style="justify-content:space-between"><span class="mu">ข้อ ${Q.pos+1} / ${n} · ${esc(x.src)} ข้อ ${x.n}</span><button class="chip" data-act="home">ออก</button></div>
  <div class="bar"><i style="width:${(Q.pos+(locked?1:0))/n*100}%"></i></div>${qhtml(x)}${opts}${fb}
  <div class="nav">${prac?'<span></span>':`<button class="btn alt" data-act="prev" ${Q.pos?'':'disabled'}>ก่อนหน้า</button>`}${next}</div>`;
}
function result(){
  const n=Q.list.length;let ok=0;const bad=[];
  Q.list.forEach((x,i)=>{if(Q.ans[i]===x.a)ok++;else bad.push(i)});
  const pct=Math.round(ok/n*100);
  const items=bad.map(i=>{const x=Q.list[i],c=Q.ans[i];
    return `<div class="card">${qhtml(x)}<div class="res bad">${c==null?'ไม่ได้ตอบ':'คุณตอบ ('+c+') '+esc(x.o[c-1]||'')}</div><div class="res ok">เฉลย (${x.a}) ${esc(x.o[x.a-1]||'')}</div>${x.e?`<details><summary>ดูคำอธิบาย</summary><div class="ex">${esc(x.e)}</div></details>`:''}<div class="mu">${esc(x.src)} ข้อ ${x.n}</div></div>`}).join('');
  return `<h1>ผลคะแนน</h1><div class="score">${ok} / ${n}</div><div class="mu" style="text-align:center">${pct}%</div>
  <div class="row" style="margin:16px 0;justify-content:center"><button class="btn" data-act="start">ทำชุดใหม่</button>${wcount()?'<button class="btn alt" data-act="startwrong">ฝึกข้อที่เคยผิด ('+wcount()+')</button>':''}<button class="btn alt" data-act="home">หน้าหลัก</button></div>
  ${bad.length?'<h2>ข้อที่ต้องทบทวน ('+bad.length+')</h2>'+items:'<div class="card res ok">ถูกทุกข้อ เยี่ยมมาก!</div>'}`;
}
function render(){$('#app').innerHTML=S.view==='home'?home():S.view==='quiz'?quiz():result()}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const a=b.dataset.act,k=b.dataset.k;
  if(k){const v=b.dataset.v;S[k]=k==='count'?+v:k==='shuffle'?v==='true':v;render();return}
  if(a==='start')start('normal');
  else if(a==='startwrong')start('wrong');
  else if(a==='clear'){wrong={};store.set('r1141wrong',wrong);render()}
  else if(a==='home'){S.view='home';render()}
  else if(a==='pick'){const v=+b.dataset.v;if(S.mode==='practice'&&Q.ans[Q.pos]!=null)return;Q.ans[Q.pos]=v;render()}
  else if(a==='next'){Q.pos++;render();window.scrollTo(0,0)}
  else if(a==='prev'){Q.pos--;render();window.scrollTo(0,0)}
  else if(a==='finish')finish();
});
render();
</script>
</body>
</html>
