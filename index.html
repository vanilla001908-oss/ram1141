<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ฝึกทำข้อสอบ RAM1141</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f7f6f3;--sf:#fff;--tx:#1f2328;--mu:#656d76;--bd:#e1ded8;--ac:#2f6f5e;--act:#fff;--okb:#e3f4e8;--ok:#1d7a3e;--badb:#fbe5e3;--bad:#b3261e;--seb:#e7f0ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181a;--sf:#202325;--tx:#e8eaec;--mu:#9aa3ab;--bd:#33383c;--ac:#5fb59d;--act:#10201b;--okb:#17301f;--ok:#6fd08c;--badb:#3a1c1a;--bad:#ff8a80;--seb:#1d2f2a}}
:root[data-theme="dark"]{--bg:#16181a;--sf:#202325;--tx:#e8eaec;--mu:#9aa3ab;--bd:#33383c;--ac:#5fb59d;--act:#10201b;--okb:#17301f;--ok:#6fd08c;--badb:#3a1c1a;--bad:#ff8a80;--seb:#1d2f2a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 "Sarabun",system-ui,"Noto Sans Thai",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.35rem;margin:8px 0 2px}h2{font-size:1.1rem;margin:20px 0 8px}
.mu{color:var(--mu);font-size:.9rem}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.chip{border:1px solid var(--bd);background:var(--sf);border-radius:999px;padding:6px 14px}
.chip.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
.btn{border:0;border-radius:12px;padding:12px 18px;background:var(--ac);color:var(--act);font-weight:600}
.btn.alt{background:var(--sf);color:var(--tx);border:1px solid var(--bd);font-weight:400}
.btn[disabled]{opacity:.4;cursor:default}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--ac)}
.q{font-size:1.1rem;font-weight:600;margin:6px 0 14px;white-space:pre-wrap}
.ctx{background:var(--seb);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:.95rem}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1px solid var(--bd);background:var(--sf);border-radius:12px;padding:11px 13px;margin:8px 0}
.opt b{min-width:1.6em;color:var(--mu)}
.opt.sel{border-color:var(--ac);background:var(--seb)}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.bad{border-color:var(--bad);background:var(--badb)}
.ex{background:var(--sf);border-left:4px solid var(--ac);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:.95rem}
.res{font-weight:600}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.score{font-size:2.6rem;font-weight:700;text-align:center;margin:8px 0 0}
details{margin-top:6px}summary{cursor:pointer;color:var(--ac)}
footer{margin-top:28px;text-align:center}
</style>
</head>

<main id="app"></main>
<script>
const D=[{"title":"ภาค 1 ปีการศึกษา 2568","items":[{"n":1,"q":"ข้อใดต่อไปนี้ตรงกับความหมายของบุคลิกภาพมากที่สุด","o":["บุคลิกภาพภายนอกมีความสำคัญกว่าบุคลิกภาพภายใน","ทุกคนมีความเป็นเอกลักษณ์เฉพาะตน","มนุษย์ทุกคนมีความสมบูรณ์พร้อมทุกด้านแล้ว","ถูกต้องทุกข้อที่กล่าวมา"],"a":2,"e":"บุคลิกภาพ หมายถึง ลักษณะโดยรวมของบุคคลแต่ละคน ซึ่งมีความเป็นเอกลักษณ์ทำให้บุคคลมีความแตกต่างกัน โดยประเภทของบุคลิกภาพ แบ่งออกเป็น 1. บุคลิกภาพภายนอก คือ ลักษณะภายนอกที่ปรากฏให้เห็นเด่นชัดแตกต่างกันในแต่ละคนเป็นส่วนที่สร้างความ ประทับใจให้กับผู้อื่นตั้งแต่แรกเห็น เช่น การแต่งกาย รูปร่างหน้าตา กิริยามารยาท เป็นต้น 2. บุคลิกภาพภายใน คือ ลักษณะภายในของบุคคลไม่ปรากฏอย่างชัดเจน อยู่ภายในมองไม่เห็นแต่อาจทราบได้จาก การคาดเดา เช่น นิสัย สติปัญญา ความถนัด ค่านิยม อารมณ์ ความรู้สึกความเป็นตัวของตัวเอง เป็นต้น"},{"n":2,"q":"ข้อใดต่อไปนี้ตรงกับลักษณะบุคลิกภาพภายนอก","o":["เบลชอบช่วยเหลือผู้อื่นอยากสมัครจิตอาสาของมูลนิธิ","โบ๊ตเป็นคนมีเล่ห์เหลี่ยมเพื่อนๆ เกรงกลัว","แยมมีความเป็นผู้นำและได้รับเลือกเป็นประธานนักเรียน","ไบร์ทลดน ้าหนักให้ผอมเพื่อทันงานแต่งงาน"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 1. ประกอบ"},{"n":3,"q":"ข้อใดไม่ใช่ความเข้าใจเกี่ยวกับบุคลิกภาพที่ถูกต้อง","o":["บุคลิกภาพภายใน คือ ลักษณะของบุคคลที่มองเห็นได้ยาก แต่เปลี่ยนแปลงง่าย","บุคคลควรได้ทำงานประกอบอาชีพที่สอดคล้องต้องกันกับบุคลิกภาพของเขา","สิ่งแวดล้อมที่มีอิทธิพลต่อบุคลิกภาพอันดับแรก คือ การเลี้ยงดูจากพ่อแม่","ผู้ที่มีบุคลิกภาพที่ดีสามารถแสดงออกความสามารถได้อย่างเต็มศักยภาพ"],"a":1,"e":"ในทางจิตวิทยา บุคลิกภาพภายใน (Internal Personality) เช่น นิสัยใจคอ ค่านิยม ทัศนคติ และระบบความคิด เป็น สิ่งที่ถูกหล่อหลอมและฝังลึกผ่านการเลี้ยงดูรวมถึงประสบการณ์มาตั้งแต่เด็ก เมื่อบุคคลเติบโตเป็นผู้ใหญ่แล้ว โครงสร้าง เหล่านี้จะมีความคงเส้นคงวาและเปลี่ยนแปลงหรือแก้ไขได้ยากมาก ไม่ได้เปลี่ยนแปลงได้ง่ายๆสำหรับตัวเลือกอื่นๆ (ข้อ 2, 3, และ 4) ล้วนเป็นหลักการทางจิตวิทยาบุคลิกภาพที่ถูกต้องอยู่แล้ว"},{"n":4,"q":"ตามทฤษฎีจิตวิเคราะห์ข้อใดกล่าวไม่ถูกต้อง","o":["มนุษย์มีสัญชาตญาณแห่งความตายติดตัวมา","ซุปเปอร์อีโก้เกี่ยวกับคุณธรรม","การทำงานจิตไร้สำนึกเกิดจากปมในวัยเด็ก","อิดเป็นความต้องการที่ไม่ผ่านการขัดเกลา"],"a":3,"e":"ในทางจิตวิเคราะห์ มนุษย์ทุกคนมี \"จิตไร้สำนึก\" ติดตัวมาตั้งแต่เกิดเพื่อเก็บข้อมูล สัญชาตญาณ และความต้องการ ต่างๆ ดังนั้น ปมในวัยเด็กไม่ได้เป็นตัวทำให้เกิดจิตไร้สำนึก แต่ปมในวัยเด็กต่างหากที่ถูกเก็บกดลงไปซ่อนอยู่ในจิตไร้ สำนึก ส่วนข้ออื่นๆ (1, 2, 4) ล้วนอธิบายเรื่องสัญชาตญาณความตาย, Id และ Superego ได้ถูกต้องตามทฤษฎีของฟรอยด์ ทั้งหมด"},{"n":5,"q":"ธรรมชาติมนุษย์นั้นแสดงพฤติกรรมเพื่อตอบสนองต่อเงื่อนไขต่าง ๆ ในสิ่งแวดล้อม","o":["แนวคิดมนุษยนิยม","แนวคิดพฤติกรรมนิยม","แนวคิดจิตวิเคราะห์","แนวคิดผสานวิธี"],"a":2,"e":"ทฤษฎีพฤติกรรมนิยม (Behaviorism Theory) ของสกินเนอร์ (B.F.Skinner) เชื่อว่า บุคลิกภาพสั่งสมมาจาก พฤติกรรมที่เกิดจากการเรียนรู้ ดังนี้ 1. พฤติกรรมของมนุษย์จะคงอยู่ตลอดไป จำเป็นต้องมีการเสริมแรง 2. การเสริมแรงเป็นสิ่งที่ช่วยเพิ่มความถี่ของพฤติกรรมที่เหมาะสม (การเสริมแรงทางบวกและการเสริมแรงทางลบ) 3. หลักการให้รางวัลเพื่อเสริมสร้างบุคลิกลักษณะที่พึงประสงค์ 4. หลักการลงโทษเพื่อระงับพฤติกรรมไม่เหมาะสม ลดความถี่ของพฤติกรรม"},{"n":6,"q":"โครงสร้างของจิตมนุษย์มี 3 ระดับ 1. จิตไร้สำนึก 2. จิตสำนึก 3. จิตก่อนสำนึก","o":["แนวคิดมนุษยนิยม","แนวคิดพฤติกรรมนิยม","แนวคิดจิตวิเคราะห์","แนวคิดผสานวิธี"],"a":3,"e":"ทฤษฎีจิตวิเคราะห์ (Psychoanalytic theory) ของฟรอยด์ (Sigmund Freud) กล่าวถึง วิธีการจัดระบบของ บุคลิกภาพว่าขึ้นอยู่กับระดับการรู้ตัว (Levels of Consciousness) แบ่งระดับการรู้ตัวของ บุคคล เป็น 3 ระดับคือ 1. ระดับที่ 1 จิตสำนึก (Conscious) คือ มีสติ รู้ตัว ว่ากำลังทำอะไร 2. ระดับที่ 2 จิตใต้สำนึก (Preconscious) คือ ไม่รู้ตัวในบางขณะ 3. ระดับที่ 3 จิตไร้สำนึก (Unconscious) คือ ไม่รู้ตัว อยู่ลึกที่สุด"},{"n":7,"q":"บุคลิกภาพของมนุษย์มี 3 ส่วนสำคัญ 1. ตนที่ตนมองเห็น 2. ตนตามที่เป็นจริง 3. คนตามอุดมคติ","o":["แนวคิดมนุษยนิยม","แนวคิดพฤติกรรมนิยม","แนวคิดจิตวิเคราะห์","แนวคิดผสานวิธี"],"a":1,"e":"ทฤษฎี \"ตัวตน\" (Self Theory) ของคาร์ล โรเจอร์ส (Cart Rogers) เชื่อว่ามนุษย์ทุกคนมีตัวตน 3 แบบ ได้แก่ 1. ตัวตนที่ตนมองเห็น (Self Concept) คือ ภาพที่ตนเห็นเองว่า ตนเป็นอย่างไร มีความรู้ความสามารถ ลักษณะเฉพาะ ตนอย่างไร เช่น สวย รวย เก่ง ขี้อาย ช่างพูด เก็บตัว เงียบ ต ่าต้อย เป็นต้น ซึ่งการมองเห็นอาจจะไม่ตรงกับข้อเท็จจริงหรือ ภาพที่คนอื่นเห็น 2. ตัวตนตามที่เป็นจริง (Real Self) คือ ตัวตนตามข้อเท็จจริง แต่บ่อยครั้งที่ตนมองไม่เห็น ข้อเท็จจริง เพราะอาจเป็น สิ่งที่ทำให้รู้สึกเสียใจ ไม่เท่าเทียมกับบุคคลอื่น 3. ตัวตนตามอุดมคติ (Ideal Self) คือ ตัวตนที่อยากมีอยากเป็น แต่ยังไม่มีไม่เป็นในสภาวะ ปัจจุบัน เช่น ชองเก็บตัว แต่อยากเข้าสังคมเก่ง เป็นต้น"},{"n":8,"q":"บุคลิกภาพข้อใดกล่าวถูกต้องเกี่ยวกับการชะงักงันในขั้นทวารหนักตามทฤษฎีวิเคราะห์ของฟรอยด์","o":["บุคลิกภาพจู้จี้ขี้บ่น","บุคลิกภาพกินจุกจิก","บุคลิกภาพชอบนินทา","บุคลิกภาพเจ้าระเบียบเข้มงวด"],"a":4,"e":"ตามทฤษฎีพัฒนาการทางจิตเพศของ ซิกมันด์ ฟรอยด์ หากบุคคลเกิด การชะงักงัน (Fixation) ในช่วง ขั้นทวารหนัก (Anal Stage) จะส่งผลต่อบุคลิกภาพในวัยผู้ใหญ่ โดยลักษณะที่พบบ่อยคือ รักความเป็นระเบียบ เจ้าระเบียบ เข้มงวด ควบคุมตนเองและผู้อื่นสูง ฯลฯ"},{"n":9,"q":"ข้อใดไม่ใช่ลักษณะสำคัญเกี่ยวกับแบบคัดกรองโรคซึมเศร้าและแบบประเมินการฆ่าตัวตาย","o":["2Q","3Q","8Q","9Q"],"a":2,"e":"แบบคัดกรอง/ประเมินที่ใช้เกี่ยวข้องกับ โรคซึมเศร้าและการฆ่าตัวตาย ในระบบสาธารณสุขไทย ได้แก่ - 2Q : แบบคัดกรองโรคซึมเศร้าเบื้องต้น - 8Q : แบบประเมินความเสี่ยงต่อการฆ่าตัวตาย - 9Q : แบบประเมินระดับความรุนแรงของโรคซึมเศร้า"},{"n":10,"q":"ข้อใดไม่ใช่คุณลักษณะที่นักจิตวิทยาระบุว่าเป็นผู้ที่มีบุคลิกภาพที่ดีจากภายนอก","o":["แต่งกายให้มีรสนิยม ไม่ยึดติดกับยุคสมัย","ดูแลสุขภาพอนามัยของตนเองให้ดี","กายวาจาสุภาพเรียบร้อยตามกาลเทศะ","ถูกทุกข้อ"],"a":4,"e":"คุณลักษณะที่นักจิตวิทยาระบุว่าเป็นผู้ที่มีบุคลิกภาพที่ดีจากภายนอก (External Personality) คือ ลักษณะทาง กายภาพ พฤติกรรม และการแสดงออกทางสังคมที่บุคคลอื่นสามารถมองเห็นและสัมผัสได้ทันที ซึ่งส่งเสริมให้ผู้พบเห็น เกิดความประทับใจ ศรัทธา และเลื่อมใส โดยมีองค์ประกอบสำคัญ 4 ด้าน ดังนี้ ด้านที่ 1: ร่างกายและสุขภาพ – ร่างกายสะอาดสะอ้าน ดูแข็งแรง กระฉับกระเฉง และมีแววตาสดใส ด้านที่ 2: การแต่งกายและท่าทาง – เสื้อผ้าสะอาด เหมาะสมกับรูปร่างและกาลเทศะ ท่าทางการเดิน นั่ง ยืน ดูสง่างาม และมั่นคง ด้านที่ 3: วาจาและการสื่อสาร – พูดจาสุภาพ น ้าเสียงนุ่มนวลชวนฟัง รู้จักกาลเทศะ และเป็นผู้ฟังที่ดี ด้านที่ 4: การวางตัวทางสังคม – ยิ้มแย้มแจ่มใส แสดงความเป็นมิตร มีมารยาท และควบคุมอารมณ์ท่าทางภายนอกได้ดี"},{"n":11,"q":"ข้อใดกล่าวไม่ถูกต้องเกี่ยวกับการวิเคราะห์ประเมินบุคลิกภาพ","o":["เป็นเครื่องมือประกอบการพิจารณาคดีทางกฎหมาย","เป็นแนวทางทำความเข้าใจรูปแบบพฤติกรรมเพื่อพัฒนาตนเอง","เป็นแนวทางทำความเข้าใจรูปแบบพฤติกรรมเพื่อควบคุมผู้อื่น","เป็นเครื่องมือคัดสรรบุคคลเพื่อปฏิบัติงานในองค์การ"],"a":3,"e":"วัตถุประสงค์ของการวิเคราะห์และประเมินบุคลิกภาพ ไม่ได้มีไว้เพื่อการครอบงำ บงการ หรือ \"ควบคุมผู้อื่น\" แต่มี ไว้เพื่อสร้างความเข้าใจ ยอมรับความแตกต่าง และนำข้อมูลมาใช้ประโยชน์ในเชิงบวก เช่น การพัฒนาตนเอง หรือการ บริหารงานบุคคล ดังนั้น ข้อ (3) จึงเป็นข้อความที่กล่าวไม่ถูกต้อง"},{"n":12,"q":"ข้อใดไม่ได้ปฏิบัติตามหลักการพื้นฐานในการวิเคราะห์และประเมินบุคลิกภาพ","o":["เลือกใช้เครื่องมือประเมิน 1 วิธี","ดำเนินการโดยผู้เชี่ยวชาญและมีความรู้เพียงพอ","เลือกใช้เครื่องมือประเมินตรงกับพฤติกรรมเป้าหมายที่ต้องการวัด","คำนึงถึงความเหนื่อยล้าของผู้ที่ถูกวัดประเมิน"],"a":1,"e":"หลักการพื้นฐานที่สำคัญของการประเมินบุคลิกภาพ คือ \"ไม่ควรสรุปบุคลิกภาพของบุคคลจากเครื่องมือเพียงชนิด เดียว\" (Multi-method assessment) เนื่องจากบุคลิกภาพของมนุษย์มีความซับซ้อนมาก การใช้เครื่องมือเพียงวิธีเดียวอาจ ทำให้เกิดความลำเอียง (Bias) หรือได้ข้อมูลไม่ครบถ้วน ดังนั้น นักจิตวิทยาจึงต้องใช้เครื่องมือและวิธีการที่หลากหลาย ร่วมกันเสมอ เช่น การทำแบบทดสอบ ควบคู่ไปกับการสัมภาษณ์และการสังเกตพฤติกรรม ข้อ (1) จึงเป็นข้อที่ไม่ปฏิบัติ ตามหลักการพื้นฐาน"},{"n":13,"q":"ข้อใดอธิบายหลักการสังเกตพฤติกรรมได้ถูกต้องมากที่สุด","o":["การสัมภาษณ์นักศึกษา","การเฝ้าดูพฤติกรรมการเข้าเรียนของนักศึกษาโดยใช้แบบสอบถาม","การเฝ้าดูพฤติกรรมการเข้าเรียนของนักศึกษาตลอดคาบโดยใช้แบบสำรวจรายการ","การเฝ้าดูพฤติกรรมการเรียนของนักศึกษาตลอดคาบ"],"a":3,"e":"หลักการสังเกตพฤติกรรม (Behavioral Observation)ในทางจิตวิทยาและการวิจัย \"การสังเกต\" ไม่ใช่แค่การ มองดูเฉยๆ แต่หมายถึง กระบวนการเฝ้าดูและบันทึกพฤติกรรมเป้าหมายของบุคคลอย่างมีจุดมุ่งหมาย เป็นระบบ และ เป็นวิทยาศาสตร์ โดยที่ผู้ถูกสังเกตต้องแสดงพฤติกรรมนั้นออกมาตามธรรมชาติหลักการสำคัญที่จะทำให้การสังเกตมี ความถูกต้องแม่นยำและน่าเชื่อถือ มี 2 อย่าง คือ 1. กำหนดขอบเขตเวลาและพฤติกรรมชัดเจน : ต้องรู้ว่าจะดูพฤติกรรมอะไร และดูในช่วงเวลาไหน (เช่น ตลอดคาบ เรียน) 2. ต้องมีเครื่องมือบันทึกที่เป็นระบบ (Systematic Recording) : เพื่อป้องกันไม่ให้ผู้สังเกตใช้ความรู้สึกส่วนตัวตัดสิน หรือหลงลืมข้อมูล ซึ่งข้อ 3. มีองค์ประกอบครบถ้วนและชัดเจนที่สุดค (ตลอดคาบ , ใช้แบบสำรวจรายการ)"},{"n":14,"q":"ข้อใดเป็นการสัมภาษณ์เพื่อวิเคราะห์และประเมินบุคลิกภาพของบุคคล","o":["การพูดคุยอย่างเจาะจงเพื่อรวบรวมข้อมูลสำคัญเฉพาะตัวของบุคคล","การให้บุคคลตอบคำถามผ่านแบบสอบถามที่เตรียมไว้ล่วงหน้า","การให้บุคคลตอบคำถามโดยเขียนบรรยายความรู้สึก","การพูดคุยด้วยเรื่องทั่วไป"],"a":1,"e":"การสัมภาษณ์เพื่อประเมินบุคลิกภาพ (Personality Interview) ในทางจิตวิทยา \"การสัมภาษณ์\" คือกระบวนการ สื่อสารแบบสองทางผ่านการพูดคุยอย่างมีจุดมุ่งหมาย โดยมีจุดประสงค์เพื่อเจาะลึกข้อมูลเกี่ยวกับตัวบุคคล เช่น ทัศนคติ ค่านิยม การควบคุมอารมณ์ ปฏิกิริยาตอบสนอง และประสบการณ์ในอดีต ซึ่งเป็นสิ่งสะท้อนบุคลิกภาพภายในและ ภายนอกของผู้รับการประเมิน ข้อ 1. อธิบายหัวใจสำคัญของการสัมภาษณ์ทางจิตวิทยาได้ตรงจุดที่สุด เพราะเป็นการพูดคุย ซึ่งเป็นรูปแบบหลัก ของการสัมภาษณ์ (ต่างจากแบบทดสอบที่เป็นข้อเขียน) มีความเจาะจง มุ่งรวบรวมข้อมูลสำคัญเฉพาะตัว"},{"n":15,"q":"ข้อใดเป็นคุณลักษณะที่ดีของแบบสอบถามวิเคราะห์และประเมินบุคลิกภาพ","o":["สามารถวัดซ ้าแล้วได้ผลเหมือนกัน","สามารถวัดในสิ่งที่ต้องการวัดได้","ถูกทั้งข้อ 1 และ 2","ผิดทั้งข้อ 1 และ 2"],"a":4,"e":"คุณลักษณะที่ดีของแบบสอบถามวิเคราะห์และประเมินบุคลิกภาพ ได้แก่ 1. สามารถประเมินคุณลักษณะภายในของบุคคลได้ 2. รวบรวมข้อมูลได้รวดเร็วและประหยัดเวลา 3. มีมาตรฐานระดับหนึ่ง เนื่องจากชุดคำถามเดียวกันกับผู้ตอบแบบสอบถามทุกคน 4. วิเคราะห์ผลทางสถิติได้ง่าย 5. สามารถเข้าถึงกลุ่มตัวอย่างที่หลากหลาย 6. รวบรวมข้อมูลได้ โดยไม่ต้องเผชิญหน้ากับผู้ประเมิน 7. จัดการรูปแบบง่ายทั้งในรูปแบบกระดาษ หรือแบบออนไลน์ 8. ค่าใช้จ่ายต ่าเมื่อเทียบกับวิธีการประเมินอื่น เช่น การใช้แบบทดสอบทางจิตวิทยา"},{"n":16,"q":"ข้อใดกล่าวถูกต้องเกี่ยวกับกภาษากาย","o":["การอ่านภาษากายไม่จำเป็นในการสื่อสารเพราะมนุษย์ใช้ภาษาพูดเป็นหลัก","การอ่านภาษากายทำให้ง่าย เข้าใจความหมายได้เหมือนกันทุกคน","ใช้การวิเคราะห์ภาษากายร่วมกับวิธีการประเมินแบบอื่นๆ เพื่อทำความเข้าใจบุคลิกภาพ","ถูกทุกข้อ"],"a":3,"e":"ภาษากาย (Body Language / Non-verbal Communication) หรืออวัจนภาษา คือ การสื่อสารผ่านท่าทาง แววตา สี หน้า การเคลื่อนไหว และน ้าเสียง ซึ่งมักสะท้อนถึงความรู้สึกที่แท้จริง ทัศนคติ และสภาวะอารมณ์ภายในของบุคคลที่ อาจไม่ได้แสดงออกผ่านคำพูด ข้อ 3. ถูกต้อง เพราะเป็นไปตามหลักการประเมินทางจิตวิทยาที่ถูกต้อง : ภาษากายของมนุษย์มีความซับซ้อน และอาจ ตีความผิดพลาดได้ง่าย (เช่น คนที่กอดอกอาจไม่ได้กำลังปิดกั้น แต่อาจแค่หนาว) นักจิตวิทยาจึงไม่เคยสรุปบุคลิกภาพ หรือตัวตนของใครจากภาษากายเพียงอย่างเดียว แต่จะต้องนำผลการวิเคราะห์ภาษากายไปใช้ร่วมกับการประเมินวิธีอื่นๆ เช่น การสัมภาษณ์เจาะลึก หรือการทำแบบทดสอบมาตรฐาน เพื่อให้ได้ข้อมูลที่แม่นยำและรอบด้านที่สุด"},{"n":17,"q":"ข้อใดกล่าวไม่ถูกต้องเกี่ยวกับการแสดงออกทางสีหน้า","o":["การแสดงสีหน้าที่เป็นสากลมี 6 ลักษณะ","ความคิดและอารมณ์ที่เกิดขึ้นทำให้มีการเปลี่ยนแปลงกล้ามเนื้อบนใบหน้าได้","ลักษณะการยิ้มที่แตกต่างกันสะท้อนความรู้สึกที่แตกต่างกันได้","เราควรใช้ประโยชน์จากการวิเคราะห์การแสดงออกทางใบหน้าเพื่อตัดสินใจรับคนเข้าทำงาน"],"a":4,"e":"ในทางจิตวิทยาและการบริหารงานบุคคล ไม่แนะนำให้ใช้การวิเคราะห์สีหน้ามาเป็นเกณฑ์หลักในการตัดสินใจรับ คนเข้าทำงาน เนื่องจากสีหน้าของผู้สมัครขณะสัมภาษณ์มักเกิดจากความตื่นเต้นหรือความกดดันชั่วคราว ไม่ได้สะท้อน ความสามารถและบุคลิกภาพที่แท้จริง อีกทั้งการตีความสีหน้ายังมีโอกาสผิดพลาดและเกิดอคติส่วนตัวของผู้สัมภาษณ์ ได้ง่ายมาก ข้อ 4 จึงเป็นคำกล่าวที่ \"ไม่ถูกต้อง\" ส่วนข้อ 1, 2, 3 นั้นถูกต้องตามหลักวิทยาศาสตร์และทฤษฎีอารมณ์สากล ของมนุษย์"},{"n":18,"q":"ข้อใดเป็นความแตกต่างระหว่างการวิเคราะห์และประเมินบุคคลโดยใช้ภาษาพูดกับการแสดงออก ทางสีหน้า","o":["การแสดงออกทางสีหน้าซ่อนเร้นและปิดบังได้","การวิเคราะห์ภาษาพูดทำได้ง่ายกว่า","ถูกทั้งข้อ 1 และ 2","ผิดทั้งข้อ 1 และ 2"],"a":4,"e":"ความแตกต่างที่สำคัญที่สุดระหว่างการวิเคราะห์และประเมินบุคคลโดยใช้ ภาษาพูด (วัจนภาษา) กับ การ แสดงออกทางสีหน้า (อวัจนภาษา) ตามหลักจิตวิทยามีอยู่ 2 ด้านหลักๆ ดังนี้ 1. ภาษาพูด (วัจนภาษา) : \"โกหกง่าย แต่เข้าใจยาก\" เพราะคนเราเลือกคำพูดมาหลอกกันได้ และมีความซับซ้อน ตามภาษาและวัฒนธรรม 2. การแสดงออกทางสีหน้า (อวัจนภาษา) : \"โกหกยาก แต่เข้าใจง่าย\" เพราะถูกควบคุมด้วยระบบประสาท อัตโนมัติ ทำให้หลุดความรู้สึกจริงออกมารวดเร็ว และเป็นสากลที่คนทั่วโลกมองปุ๊บก็เข้าใจได้ทันที ข้อ 1. ผิดเพราะ : บอกว่าสีหน้าซ่อนเร้นง่าย แต่จริงๆ แล้ว \"ภาษาพูด\" ต่างหากที่ซ่อนเร้น/โกหกง่ายกว่า ส่วนสีหน้าจะ หลุดความรู้สึกจริงออกมาอัตโนมัติทำให้ซ่อนยาก ข้อ 2. ผิดเพราะ: บอกว่าภาษาพูดวิเคราะห์ง่ายกว่า แต่จริงๆ แล้ว \"สีหน้า\" วิเคราะห์ง่ายกว่า เพราะเป็นสากลทั่วโลก มองปุ๊บรู้ปั๊บ ส่วนภาษาพูดมีความซับซ้อนและต้องแปลความหมายเยอะกว่า"},{"n":19,"q":"ข้อใดไม่เป็นการใช้ประโยชน์จากการวิเคราะห์ภาษากาย","o":["เจ้าหน้าที่บุคคลพิจารณาการสบตาและการใช้มือของผู้สมัครในขณะที่สัมภาษณ์งาน","นักจิตวิทยาวิเคราะห์ปัญหาสุขภาพจิตจากการสังเกตพฤติกรรมหุนหันพลันแล่นควบคู่กับการใช้ แบบทดสอบ","อาจารย์วิเคราะห์ความสามารถในการเรียนของผู้เรียนด้วยการใช้แบบวัดสติปัญญา","นักจิตวิทยาสังเกตลักษณะการเว้นไม่ตอบแบบสอบถามหลายข้อของผู้ขอรับการปรึกษาซึ่งอาจ สะท้อนถึงความกังวลใจ"],"a":3,"e":"การใช้ประโยชน์จากการวิเคราะห์ภาษากาย (Body Language / Non-verbal Communication) คือ การนำสัญญาณ ทางกายภาพที่บุคคลแสดงออกโดยไม่ได้ใช้คำพูด เช่น สีหน้า แววตา ท่าทาง การเคลื่อนไหว และน ้าเสียง มาใช้ประเมิน สภาวะอารมณ์ ความคิด หรือความรู้สึกที่แท้จริงในทางจิตวิทยาและการทำงาน มีการนำไปใช้ประโยชน์ใน 4 ด้านหลัก ดังนี้ 1. ด้านการคัดเลือกและบริหารงานบุคคล (HR & Management) (ข้อ 1.) 2. ด้านจิตวิทยาและการแพทย์ (Psychology & Healthcare) (ข้อ 2 , ข้อ 4.) 3. ด้านการสื่อสารและความสัมพันธ์ (Interpersonal Skills) 4. ด้านความมั่นคงและการสืบสวน (Security & Investigation) ข้อ 3. ไม่เป็นการใช้ประโยชน์จากการวิเคราะห์ภาษากาย เพราะในทางจิตวิทยา \"แบบวัดสติปัญญา\" (Intelligence Test / IQ Test) เป็นเครื่องมือวัดความสามารถทางสติปัญญา โครงสร้างทางความคิด และทักษะการแก้ปัญหาโดยใช้ข้อเขียน หรือการตอบคำถามที่เป็นระบบ ไม่ใช่การวิเคราะห์ภาษากาย (Body Language / Non-verbal Communication) ที่ดูจาก ท่าทาง สีหน้า แววตา หรือพฤติกรรมทางกายภาพ"},{"n":20,"q":"ข้อใดแสดงถึงการวิเคราะห์คำซ่อนเร้นในการสื่อสาร","o":["“ฉันเรียนปริญญาเพิ่มอีกใบแหล่ะ” คำว่า “อีก” อาจสะท้อนถึงการต้องการคำชมเชยเพื่อให้รู้สึกถึง คุณค่า","“ฉันเรียนปริญญาเพิ่มอีกใบแหล่ะ” พูดพร้อมการยิ้ม อาจสะท้อนถึงอารมณ์เชิงบวกในขณะที่พูด","“ฉันเรียนปริญญาเพิ่มอีกใบแหล่ะ” พูดด้วยน ้าเสียงราบเรียบ อาจสะท้อนถึงการไม่มีทักษะในการ สื่อสาร","“ฉันเรียนปริญญาเพิ่มอีกใบแหล่ะ” พูดพร้อมการชู 1 นิ้วประกอบความหมายของการเรียนเพิ่ม 1 ใบ"],"a":1,"e":"ถึงคุณค่า บรรยายเพิ่มเติม คำซ่อนเร้นในการสื่อสาร\" (Hidden / Latent Meaning in Communication) ซึ่งหมายถึง การตีความความหมาย ส่วนลึก เจตนาซ่อนเร้น หรือความต้องการทางจิตวิทยาที่ซ่อนอยู่ภายใต้คำพูดหรือตัวอักษร โดยไม่ได้แสดงออกมาตรงๆ ตัวเลือกที่ (1) มีการหยิบคำว่า \"อีก\" มาวิเคราะห์เพื่อหาเจตนาที่ซ่อนอยู่ภายในใจของผู้พูด ว่าแท้จริงแล้วอาจต้องการการ ยอมรับหรือคำชมเชยจากคนรอบข้างเพื่อให้ตนเองรู้สึกภาคภูมิใจและมีคุณค่า ซึ่งเป็นไปตามหลักการวิเคราะห์คำซ่อน เร้นทางจิตวิทยาโดยตรง"},{"n":21,"q":"ข้อใดอธิบายเกี่ยวกับความหมายของสุขภาพจิตได้ถูกต้อง","o":["เป็นบุคลิกภาพที่โดดเด่น","เน้นแก้ปัญหาเฉพาะทางด้านอารมณ์และจิตใจ","เป็นสภาวะของความอยู่ดีมีสุขที่บุคคลจัดการกับความเครียดได้ดี","เป็นการใช้ความสามารถของตนเองช่วยเหลือปัญหาชุมชน"],"a":3,"e":"สุขภาพจิต (Mental Health) ตามนิยามของ องค์การอนามัยโลก (WHO) และหลักจิตวิทยา สุขภาพจิต ไม่ได้ หมายถึงเพียงแค่การไม่เจ็บป่วยด้วยโรคทางจิตเวชเท่านั้น แต่หมายถึง สภาวะแห่งสุขภาวะหรือความอยู่ดีมีสุขทางจิตใจ อารมณ์ และสังคม (Well-being) ซึ่งช่วยให้บุคคลสามารถตระหนักในศักยภาพของตนเอง มีความยืดหยุ่นทางจิตใจ และ สามารถรับมือหรือจัดการกับความเครียดและปัญหากดดันในชีวิตประจำวันได้อย่างเหมาะสม พร้อมทั้งดำเนินชีวิตใน สังคมได้อย่างมีความสุข"},{"n":22,"q":"ข้อใดไม่ใช่ปัจจัยทางชีวภาพที่เป็นสาเหตุของการเกิดปัญหาสุขภาพจิต","o":["ความดันโลหิตสูง","การติดเชื้อทางสมอง","สารสื่อประสาทในสมอง","การใช้ยาเสพติด"],"a":4,"e":"ปัจจัยทางชีวภาพ (Biological Factors) ที่เป็นสาเหตุของการเกิดปัญหาสุขภาพจิต คือ ปัจจัยทางร่างกาย ระบบ ประสาท และสารเคมี ที่ทำงานผิดปกติแล้วส่งผลกระทบต่ออารมณ์ ความคิด และพฤติกรรมโดยตรง โดยสรุปปัจจัย สำคัญได้ 4 กลุ่มหลัก ดังนี้ 1. ความไม่สมดุลของสารสื่อประสาทในสมอง (Neurotransmitters) (ข้อ 3.) 2. พันธุกรรม (Genetics) 3. ความเสียหายและการติดเชื้อทางสมอง (Brain Injury & Infection) (ข้อ 2.) 4. การใช้ยาเสพติดและสารเคมีจากภายนอก (Substance Abuse) (ข้อ 4.) ข้อ 3. ไม่ใช่ปัจจัยทางชีวภาพที่เป็นสาเหตุของการเกิดปัญหาสุขภาพจิต เพราะในทางจิตวิทยาคลินิกและประสาท วิทยา \"ความดันโลหิตสูง\" (High blood pressure) จัดเป็นภาวะทางระบบไหลเวียนโลหิตและหลอดเลือด ซึ่งแม้จะเป็น โรคทางกายทางชีวภาพเหมือนกัน แต่ทางการแพทย์ไม่ได้ระบุว่าความดันโลหิตสูงเป็นปัจจัยทางชีวภาพหรือสาเหตุโดย ตรงที่ทำให้เกิดโรคหรือปัญหาสุขภาพจิตครับ (ส่วนใหญ่ปัญหาจิตใจหรือความเครียดต่างหากที่เป็นตัวกระตุ้นให้ความ ดันสูงขึ้น)"},{"n":23,"q":"เหตุการณ์ใดส่งผลกระทบด้านจิตใจของบุคคลและก่อให้เกิดปัญหาสุขภาพจิตได้อย่างชัดเจน","o":["การได้รับการเลื่อนตำแหน่งที่สูงขึ้น","การบาดเจ็บทางร่างกาย","การสูญเสียบุคคลอันเป็นที่รัก","การย้ายสถานที่ทำงาน"],"a":3,"e":"การสูญเสียบุคคลอันเป็นที่รักเป็นเหตุการณ์ที่ส่งผลกระทบทางอารมณ์และจิตใจอย่างรุนแรงและชัดเจน เช่น ความโศกเศร้า ความเครียด ความรู้สึกว่างเปล่า ซึ่งอาจนำไปสู่ปัญหาสุขภาพจิตได้หากบุคคลไม่สามารถปรับตัวหรือ จัดการกับความรู้สึกได้อย่างเหมาะสม"},{"n":24,"q":"ข้อใดไม่ใช่อาการของบุคคลที่ป่วยเป็นโรคซึมเศร้า","o":["ร่าเริงเกินกว่าเหตุ","อารมณ์เศร้าเกือบตลอด","รู้สึกว่าตนเองไม่มีคุณค่า","อ่อนเพลีย"],"a":1,"e":"สัญญาณเตือนโรคซึมเศร้า มีดังนี้ 1. ซึมเศร้า ท้อแท้ เบื่อไม่อยากทำอะไร 2. ขาดความสนใจสิ่งรอบข้าง 3. ไม่มีสมาธิ 4. อ่อนเพลีย 5. เชื่องช้า 6. รับประทานอาหารมากขึ้นหรือน้อยลง 7. นอนมากขึ้น 8. ตำหนิตัวเอง 9. พยายามฆ่าตัวตาย"},{"n":25,"q":"ภาวะซึมเศร้าจัดว่าเป็นปัญหาสุขภาพจิตตรงกับข้อใด","o":["ปัญหาทางด้านอารมณ์","ปัญหาทางด้านร่างกาย","ปัญหาทางด้านความสามารถ","ถูกทุกข้อ"],"a":1,"e":"ภาวะซึมเศร้า (Depression) จัดเป็นปัญหาสุขภาพจิตที่เกี่ยวข้องโดยตรงกับ อารมณ์และความรู้สึก เช่น อารมณ์ เศร้า หดหู่ สิ้นหวัง เบื่อหน่าย ไม่สนใจสิ่งรอบตัว รู้สึกไร้คุณค่า"},{"n":26,"q":"อาการเหงื่อออก เจ็บหน้าอก การเต้นของหัวใจผิดปกติรู้สึกเหมือนหัวใจวายตรงกับโรคใด","o":["อารมณ์สองขั้ว","ซึมเศร้า","ตื่นตระหนก","วิตกกังวลทั่วไป"],"a":3,"e":"โรคตื่นตระหนก คือ บุคคลจะรู้สึกตื่นกลัวอย่างทันทีทันใดร่วมกับอาการอื่น เช่น เหงื่อออก เจ็บหน้าอก การเต้น ของหัวใจผิดปกติ และอาจช็อก บุคคลอาจรู้สึกเสมือนหัวใจวาย หรือรู้สึกว่ากำลังเป็นบ้า"},{"n":27,"q":"Specific Phobia คือโรคอะไร","o":["โรคหวาดกระแวง","โรคกังวล","โรคย ้าคิดย ้าทำ","โรคกลัวบางอย่างที่ระบุเฉพาะ"],"a":4,"e":"Specific Phobia คือ โรคกลัวเฉพาะเจาะจง หมายถึง ความกลัวอย่างรุนแรงต่อวัตถุหรือสถานการณ์บางอย่าง โดยเฉพาะ เช่น กลัวความสูง กลัวสัตว์บางชนิด กลัวการฉีดยา กลัวที่แคบ แม้ผู้ป่วยจะรู้ว่าไม่สมเหตุสมผล แต่ไม่ สามารถควบคุมความกลัวได้"},{"n":28,"q":"ข้อใดไม่ใช่สาเหตุหลักของบุคลิกภาพผิดปกติของบุคคล","o":["ความผิดปกติของสารสื่อประสาทในสมอง","รูปแบบการเลี้ยงดูที่ไม่เหมาะสม","ความเครียดและความกดดัน","ประเพณีและค่านิยมทางสังคม"],"a":4,"e":"บุคลิกภาพผิดปกติ (Personality Disorder) มักมีสาเหตุหลักจากปัจจัยสำคัญ ได้แก่ ปัจจัยทางชีวภาพ เช่น ความ ผิดปกติของสารสื่อประสาทในสมองปัจจัยทางจิตใจ เช่น ความเครียด ความกดดัน ประสบการณ์รุนแรง ปัจจัยด้านครอบครัวและการเลี้ยงดู โดยเฉพาะรูปแบบการเลี้ยงดูที่ไม่เหมาะสมในวัยเด็กส่วน ประเพณีและค่านิยมทาง สังคม เป็นเพียงบริบททางวัฒนธรรมที่มีอิทธิพลต่อพฤติกรรมหรือการแสดงออกของบุคคล แต่ไม่ถือเป็นสาเหตุหลัก โดยตรง ของการเกิดบุคลิกภาพผิดปกติ"},{"n":29,"q":"ข้อใดไม่ใช่คุณลักษณะที่นักจิตวิทยาระบุว่าเป็นผู้ที่มีบุคลิกภาพที่ดีจากภายใน","o":["รู้จักตนเอง ยอมรับอารมณ์เชิงบวกปฏิเสธอารมณ์เชิงลบ","มั่นคงทางอารมณ์และเผชิญหน้ากับสถานการณ์กดดันได้","เปิดประสบการณ์ตัวเองและผสมผสานเรียนรู้มาเป็นปรัชญาในชีวิต","ถูกทุกข้อ"],"a":1,"e":"คุณลักษณะที่นักจิตวิทยาระบุว่าเป็นผู้ที่มี บุคลิกภาพที่ดีจากภายใน (Internal Personality) คือ ลักษณะโครงสร้าง ทางจิตใจ ความคิด ความรู้สึก ทัศนคติ และค่านิยมส่วนลึกที่อยู่ภายในตัวบุคคล ซึ่งแม้จะมองเห็นได้ยากจากภายนอก แต่ เป็นรากฐานสำคัญที่คุมพฤติกรรมและการแสดงออกทั้งหมดตามหลักจิตวิทยา (โดยเฉพาะทฤษฎีตัวตนและจิตวิทยาเชิง บวก) คุณลักษณะของบุคลิกภาพภายในที่ดี สรุปได้ 4 ด้านหลัก ดังนี้ 1. การรู้จักและการยอมรับตนเองอย่างแท้จริง (Self-Awareness & Self-Acceptance) 2. ความมั่นคงทางอารมณ์ (Emotional Stability & Resilience) 3. การเปิดรับประสบการณ์และใฝ่เรียนรู้ (Openness to Experience) 4. คุณธรรม จริยธรรม และความรับผิดชอบ (Integrity & Responsibility) ข้อ 1. ในทางจิตวิทยา บุคคลที่มีบุคลิกภาพภายในที่ดีจะต้อง \"ยอมรับอารมณ์ทุกรูปแบบตามความจริง\" ไม่ว่าจะเป็น อารมณ์เชิงบวกหรือเชิงลบ (เช่น ความกลัว ความเศร้า หรือความโกรธ) แล้วเรียนรู้วิธีอยู่ร่วมกับมันอย่างเท่าทัน การ ปฏิเสธหรือกดข่มอารมณ์เชิงลบไว้จะทำให้เกิดความบิดเบือนทางบุคลิกภาพและนำไปสู่ปัญหาสุขภาพจิตได้ ข้อ 1 จึง เป็นคำกล่าวที่ \"ไม่ใช่\" คุณลักษณะที่ถูกต้อง"},{"n":30,"q":"บุคคลควรเลือกใช้วิธีการใดเพื่อช่วยฝึกให้จิตใจสงบและร่างกายผ่อนคลาย","o":["การฝึกสติ โยคะ","รับประทานอาหารที่ชอบ","การวิ่งออกกำลังกาย","การอ่านเรื่องสั้นอารมณ์ขัน"],"a":1,"e":"การฝึกสติ (Mindfulness) และโยคะ เป็นวิธีที่ช่วย ควบคุมลมหายใจ ผ่อนคลายกล้ามเนื้อ และทำให้จิตใจสงบ อย่าง เป็นระบบ ส่งผลดีทั้งต่อสุขภาพจิตและร่างกาย เช่น ลดความเครียด ความวิตกกังวล และเพิ่มสมาธิ"},{"n":31,"q":"การสัมผัสได้ถึงความปลอดภัย เห็นอกเห็นใจ เคารพนับถือให้เกียรติ ตรงกับข้อใด","o":["พฤติกรรม","อารมณ์ ความรู้สึก","ความฝัน","ความรู้ ความเข้าใจ"],"a":2,"e":"การสัมผัสได้ถึงความปลอดภัย เห็นอกเห็นใจ เคารพนับถือให้เกียรติ เป็นสภาวะภายในที่เกี่ยวข้องกับความรู้สึก และอารมณ์ของบุคคล"},{"n":32,"q":"ข้อมูลการคิดวิเคราะห์ที่บุคคลได้ข้อสรุปเกี่ยวกับตนเอง บุคคลอื่นหรือสิ่งของตรงกับข้อใด","o":["พฤติกรรม","อารมณ์ ความรู้สึก","ความฝัน","ความรู้ ความเข้าใจ"],"a":4,"e":"ข้อมูลการคิดวิเคราะห์ที่บุคคลได้ข้อสรุปเกี่ยวกับตนเอง บุคคลอื่นหรือสิ่งของ เป็นกระบวนการทางสติปัญญา การ คิด การรับรู้ และการสรุปความหมาย"},{"n":33,"q":"การกระทำในทิศทางใดทิศทางหนึ่ง ซึ่งเป็นผลมาจากการประเมินสิ่งเร้า ตรงกับข้อใด","o":["พฤติกรรม","อารมณ์ ความรู้สึก","ความฝัน","ความรู้ ความเข้าใจ"],"a":1,"e":"การกระทำในทิศทางใดทิศทางหนึ่ง ซึ่งเป็นผลมาจากการประเมินสิ่งเร้า เป็นการแสดงออกที่สังเกตได้ภายนอก อัน เกิดจากการประเมินและตัดสินใจ"},{"n":34,"q":"ข้อใดไม่ใช่ความสำคัญของเจตคติ","o":["เป็นกลไกในการป้องกันตัว","ทำให้เกิดการปรับตัว","เป็นการจัดระเบียบสังคม","เป็นการแสดงความหมายของค่านิยม"],"a":3,"e":"เจตคติ (Attitude) คือ ความรู้สึก นึกคิด และความพร้อมของจิตใจ ที่บุคคลมีต่อสิ่งใดสิ่งหนึ่ง (เช่น บุคคล สิ่งของ หรือสถานการณ์) ซึ่งเป็นเรื่องเฉพาะตัวของแต่ละบุคคล และเป็นตัวกำหนดแนวโน้มของพฤติกรรมว่าจะแสดงออกใน แง่บวก (ชอบ/เห็นด้วย) หรือแง่ลบ (ไม่ชอบ/ไม่เห็นด้วย) ข้อ 3. การจัดระเบียบสังคม นั้น เป็นบทบาทหน้าที่ของ \"กฎหมาย กฎเกณฑ์ จารีต หรือบรรทัดฐานของสังคม\" (Social Norms) ที่ใช้คุมคนหมู่มากในภาพรวม ไม่ใช่หน้าที่หรือความสำคัญโดยตรงของ \"เจตคติ\" ซึ่งเป็นสภาวะจิตใจ ส่วนบุคคล ไม่ใช่ความสำคัญของเจตคติ"},{"n":35,"q":"ปัจจัยภายในที่มีผลต่อการเกิดเจตคติ ตรงกับข้อใด","o":["การได้รับรู้สถานการณ์มาจากผู้คนรอบข้าง","การได้รับอิทธิพลจากครอบครัว","การได้รับประสบการณ์ทางตรงที่สอดคล้องกับเจตคติเดิม","การได้รับข่าวสารจากสื่อ"],"a":3,"e":"ปัจจัยที่มีผลต่อการเกิดและการเปลี่ยนแปลงเจตคติ (Attitude) ทางจิตวิทยาจะแบ่งปัจจัยออกเป็น 2 ประเภทหลัก คือ ปัจจัยภายใน (เกิดจากตัวบุคคลเอง) และ ปัจจัยภายนอก (เกิดจากสิ่งแวดล้อมรอบตัว) ข้อ 3. เป็นเรื่องของระบบความคิด ความรู้สึก ประสบการณ์เดิม ค่านิยม และกลไกทางจิตใจเฉพาะบุคคล ซึ่งการ ได้รับประสบการณ์ทางตรงที่สอดคล้องกับเจตคติเดิม จัดเป็นปัจจัยภายใน ตัวเลือกที่เหลือทั้งหมดจัดเป็น ปัจจัยภายนอก (External Factors) เนื่องจากเป็นสิ่งเร้า อิทธิพล หรือข้อมูลข่าวสารที่ส่ง มาจากสิ่งแวดล้อมและสังคมรอบตัวบุคคล"},{"n":36,"q":"เด็กหญิงมะระหวานรู้สึกอายที่ถูกเพื่อนล้อเลียนขณะที่ออกมาพูดหน้าชั้น ส่งผลทำให้ไม่กล้าพูดในที่ สาธารณชนตรงกับข้อใด","o":["เจตคติที่เกิดจากการเรียนรู้โดยการวางเงื่อนไขแบบเฉพาะเจาะจง","เจตคติที่เกิดจากการเรียนรู้โดยการวางเงื่อนไขจากการเลียนแบบ","เจตคติที่เกิดจากการเรียนรู้โดยการวางเงื่อนไขจากการกระทำ","เจตคติที่เกิดจากการเรียนรู้โดยการวางเงื่อนไขแบบคลาสสิค"],"a":4,"e":"เจตคติที่เกิดจากการเรียนรู้โดยการวางเงื่อนไขแบบคลาสสิค เป็นการเชื่อมโยง สถานการณ์ (การพูดหน้าชั้น) กับ อารมณ์เชิงลบ (ความอาย/อับอาย) จนเกิดความกลัวและหลีกเลี่ยงสถานการณ์นั้นในภายหลัง ซึ่งตรงกับการวางเงื่อนไข แบบคลาสสิค"},{"n":37,"q":"เด็กชายมะละกอแกงได้รับคำชมจากคุณครู จึงทำให้มีความกระตือรือร้นในการทำกิจกรรมมากขึ้น ตรงกับข้อใด","o":["เจตคติที่เกิดจากการเรียนรู้โดยการวางเงื่อนไขแบบเฉพาะเจาะจง","เจตคติที่เกิดจากการเรียนรู้โดยการวางเงื่อนไขจากการเลียนแบบ","เจตคติที่เกิดจากการเรียนรู้โดยการวางเงื่อนไขจากการกระทำ","เจตคติที่เกิดจากการเรียนรู้โดยการวางเงื่อนไขแบบคลาสสิค"],"a":3,"e":"คำชม เป็นแรงเสริมทางบวก (Positive Reinforcement) ทำให้พฤติกรรมที่พึงประสงค์เกิดซ ้าและมีทัศนคติที่ดีต่อ กิจกรรมมากขึ้น ซึ่งเป็นการวางเงื่อนไขจากการกระทำ (Operant Conditioning)"},{"n":38,"q":"เจตคติเดิมของบุคคลที่เป็นไปในทางบวกก็จะเพิ่มากกขึ้นในทางบวก ตรงกับข้อใด","o":["การเปลี่ยนแปลงเจตคติแบบกระจาย","การเปลี่ยนแปลงเจตคติไปคนละทาง","การเปลี่ยนแปลงเจตคติชนิดรวมกลุ่ม","การเปลี่ยนแปลงเจตคติในทางเดียวกัน"],"a":4,"e":"เป็นการเปลี่ยนแปลงที่ทิศทางเดิมยังคงเดิม แต่มีความเข้มข้นเพิ่มขึ้น เช่น จากชอบ → ชอบมากขึ้น"},{"n":39,"q":"การเปลี่ยนแปลงเจตคติเดิมของบุคคลที่เป็นไปในทิศทางตรงกันข้าม ตรงกับข้อใด","o":["การเปลี่ยนแปลงเจตคติแบบกระจาย","การเปลี่ยนแปลงเจตคติไปคนละทาง","การเปลี่ยนแปลงเจตคติชนิดรวมกลุ่ม","การเปลี่ยนแปลงเจตคติในทางเดียวกัน"],"a":2,"e":"เป็นการเปลี่ยนแปลงที่ ทิศทางของเจตคติกลับขั้ว เช่น จากไม่ชอบ → ชอบ หรือจากเห็นด้วย → ไม่เห็นด้วย"},{"n":40,"q":"กระบวนการเปลี่ยนแปลงเจตคติ ตรงกับข้อใด","o":["การเข้าใจ + การยอมรับ + การเปลี่ยนแปลง + การคงอยู่","การใส่ใจ + ความเข้าใจ + การยอมรับ + ความคงอยู่","การเปลี่ยนแปลง + การรับรู้ + การยอมรับ + การเข้าใจ","การคงอยู่ + การยอมรับ + การใส่ใจ + การรับรู้"],"a":2,"e":"คาร์ล ฮอฟแลนด์ (Carl Hovland) นักจิตวิทยาแห่งมหาวิทยาลัยเยล ผู้สร้างทฤษฎีการเปลี่ยนเจตคติ (The Yale Attitude Approach) เชื่อว่าองค์ประกอบของเจตคติด้านอารมณ์ความรู้สึก สามารถเปลี่ยนได้โดยความคิดหรือความเชื่อ ของบุคลที่เกี่ยวข้องกับเรื่องนั้น ๆ กระบวนการเปลี่ยนแปลงเจตคติ4 ขั้นตอน คือ 1. การใส่ใจ (Attention) 2. ความเข้าใจ (Comprehension) 3. การยอมรับ (Acceptance) 4. ความคงอยู่ (Retention)"},{"n":41,"q":"ข้อใดอธิบายความหมายของการมีเจตคติเชิงบวกให้ถูกต้องมากที่สุด","o":["ยอมรับว่าตนเองเรียนไม่เก่ง อาจารย์สอนไม่เข้าใจ แต่มีเพื่อนร่วมชั้นเรียนที่ดี","ยอมรับว่าตนเองเรียนไม่เก่งจึงกลัวเลยอ่านหนังสือมากขึ้น","ยอมรับว่าตนเองเรียนไม่เก่งจึงพยายามอ่านหนังสือและขอคำปรึกษาจากเพื่อนมากขึ้น","ยอมรับว่าตนเองเรียนไม่เก่ง"],"a":3,"e":"เจตคติเชิงบวก หมายถึง การยอมรับความจริงของตนเอง พร้อมมุ่งแก้ไข พัฒนา และลงมือปฏิบัติอย่างสร้างสรรค์ เพื่อให้เกิดผลที่ดีขึ้น"},{"n":42,"q":"ข้อใดไม่ใช่ประโยชน์ของการมีเจตคติเชิงบวก","o":["มีพลังงานมากขึ้น","บรรลุได้เป้าหมายยากขึ้น","เพิ่มความสำเร็จเร็วขึ้น","เชื่อมั่นในตนเอง"],"a":2,"e":"การมีเจตคติเชิงบวก ส่งผลดีต่อการดำเนินชีวิตและการทำงาน ไม่ได้ทำให้การบรรลุเป้าหมายยากขึ้นตรงกันข้าม กลับช่วยสนับสนุนให้ประสบความสำเร็จได้ง่ายขึ้น"},{"n":43,"q":"ข้อใดอธิบายลำดับขั้นตอนการพัฒนาเจตคติเชิงบวกต่อตนเองได้ถูกต้อง","o":["ประเมินตนตามความจริง → เชื่อมั่นว่าตนเองพัฒนาได้ → รับรู้ความคิดความรู้สึกที่มีต่อตนเอง","เชื่อมั่นว่าตนเองพัฒนาได้ → รับรู้ความคิดความรู้สึกที่มีต่อตนเอง → ประเมินตนตามความจริง","รับรู้คววามคิดความรู้สึกที่มีต่อตนเอง → ประเมินผลตามความจริง → เชื่อมั่นว่าตนพัฒนาได้","ไม่มีข้อใดถูก"],"a":3,"e":"ลำดับขั้นตอนการพัฒนาเจตคติเชิงบวกต่อตนเอง (Developing Positive Self-Attitude) ตามหลักจิตวิทยาเพื่อ สร้างความภาคภูมิใจและเห็นคุณค่าในตัวเอง (Self-Esteem) ประกอบด้วย 5 ขั้นตอนสำคัญ ที่ต้องทำอย่างเป็นระบบจาก ภายในสู่ภายนอก ดังนี้ ขั้นที่ 1: การตระหนักรู้และเท่าทันตนเอง (Self-Awareness) “รับรู้ความคิดความรู้สึกที่มีต่อตนเอง” ขั้นที่ 2: การยอมรับตนเองตามความเป็นจริง (Self-Acceptance) “ประเมินผลตามความจริง” ขั้นที่ 3: การปรับเปลี่ยนมุมมองและความคิด (Cognitive Reframing) “เชื่อมั่นว่าตนพัฒนาได้” ขั้นที่ 4: การลงมือทำเพื่อสร้างความสำเร็จเล็กๆ (Positive Action & Small Wins) ขั้นที่ 5: การสร้างสิ่งแวดล้อมที่เกื้อกูล (Positive Environment)"},{"n":44,"q":"ข้อใดสะท้อนถึงการเสริมสร้างพลังอำนาจในตนเอง (Self-Empowerment) ได้ถูกต้องมากที่สุด","o":["สมัครเข้าร่วมการฝึกอบรมตามกลุ่มเพื่อนสนิท","เชื่อมั่นในความสามารถของตนเองว่าจะสามารถรับมือกับสถานการณ์ปัญหาได้","ตั้งเป้าหมายในชีวิตของตนเองให้เป็นไปตามที่ครอบครัวต้องการ","ไม่พอใจในความสามารถของตัวเองจึงหาทางพัฒนาตัวเองให้เก่งมากขึ้น"],"a":2,"e":"Self-Empowerment หมายถึง การที่บุคคลมีพลังจากภายใน เห็นคุณค่าในตนเอง เชื่อมั่นในศักยภาพ และรู้สึกว่าตน สามารถควบคุมชีวิต ตัดสินใจ และรับมือกับปัญหาได้ด้วยตนเอง"},{"n":45,"q":"ข้อใดอธิบายลำดับขั้นตอนการเสริมสร้างพลังอำนาจในตนเองได้ถูกต้อง","o":["ค้นหาสภาพจริง → สะท้อนคิด → เลือกปฏิบัติ → คงวิธีปฏิบัติที่ดีไว้","ค้นหาสภาพจริง → เลือกวิธีปฏิบัติ → คงวิธีปฏิบัติที่ดีไว้ →สะท้อนคิด","สะท้อนคิด → ค้นหาสภาพจริง → เลือกวิธีปฏิบัติ → คงวิธีปฏิบัติที่ดีไว้","เลือกวิธีปฏิบัติ → คงวีปฏิบัติที่ดีไว้ → ค้นหาสภาพจริง → สะท้อนคิด"],"a":1,"e":"ลำดับขั้นตอนของการเสริมสร้างพลังอำนาจในตนเองควรเป็นไปอย่างมีเหตุผลและต่อเนื่อง ดังนี้ 1. ค้นหาสภาพจริง – รับรู้สถานการณ์จริงของตนเอง จุดแข็ง จุดอ่อน และข้อจำกัด 2. สะท้อนคิด – วิเคราะห์และทบทวนความคิด ความรู้สึก และทางเลือก 3. เลือกปฏิบัติ – ตัดสินใจลงมือทำด้วยตนเองอย่างเหมาะสม 4. คงวิธีปฏิบัติที่ดีไว้ – รักษาและพัฒนาพฤติกรรมที่นำไปสู่ผลลัพธ์ที่ดีอย่างต่อเนื่อง"},{"n":46,"q":"ข้อใดแสดงถึงการมีความกรุณาต่อตนเอง","o":["ไม่ตัดสินคุณค่าของตัวเองจากความล้มเหลวที่เกิดขึ้นในชีวิต","ไม่วิพากษ์วิจารณ์ตนเองแต่หันกลับไปโทษสิ่งแวดล้อมเพื่อให้สบายใจขึ้น","บอกตัวเองว่าคนอื่น ๆ ไม่ทำผิดพลาดแบบที่เราทำ","ไม่ให้โอกาสตัวเองแก้มือกับความผิดพลาดที่กระทำลงไป"],"a":1,"e":"การมีความกรุณาต่อตนเอง (Self-Compassion) ตามหลักจิตวิทยา (ทฤษฎีของ Kristin Neff) หมายถึง การปฏิบัติ ต่อตนเองด้วยความเข้าใจ ความเห็นใจ และความอ่อนโยนเมื่อเผชิญกับความทุกข์ ความล้มเหลว หรือความผิดพลาดใน ชีวิต แทนที่จะตอกย ้า บั่นทอน หรือซ ้าเติมตัวเอง"},{"n":47,"q":"ข้อใดกล่าวไม่ถูกต้องเกี่ยวกับการเพิ่มทักษะความกรุณาต่อตนเอง","o":["พูดให้กำลังใจตัวเอง","ยอมรับได้ว่าเรากำลังมีความทุกข์","ยอมรับได้ว่าความไม่สมบูรณ์แบบของเราเป็นเรื่องธรรมดา","เขียนระบายถึงสถานการณ์ที่เจ็บปวดและกล่าวโทษตัวเองเพื่อให้ยอมรับความจริง"],"a":4,"e":"การเพิ่มทักษะความกรุณาต่อตนเอง (Self-Compassion) คือ กระบวนการฝึกฝนจิตใจให้ปฏิบัติต่อตนเองด้วยความ เข้าใจ เห็นอกเห็นใจ และอ่อนโยน ในเวลาที่เราทำสิ่งผิดพลาด ประสบความสำเร็จล้มเหลว หรือต้องเผชิญกับความทุกข์ ใจในชีวิต แทนที่จะใช้ถ้อยคำรุนแรงมาซ ้าเติม โบยตี หรือวิพากษ์วิจารณ์ตัวเอง ข้อ 4. ในทางจิตวิทยา การพัฒนาทักษะ \"การมีความกรุณาต่อตนเอง\" (Self-Compassion) มุ่งเน้นไปที่การลด ละ เลิก พฤติกรรมการซ ้าเติมหรือใจร้ายกับตนเอง ดังนั้น ข้อความในส่วนท้ายที่ระบุว่า \"กล่าวโทษตัวเอง\" จึงเป็นสิ่งที่ผิด หลักการอย่างรุนแรง"},{"n":48,"q":"ข้อใดเป็นคำพูดที่สะท้อนถึงการมองโลกในแง่ดี","o":["ฉันสอบไม่ผ่านบางวิชา ไม่ได้จะหมายความว่าฉันจะไม่ผ่านการสัมภาษณ์เข้าทำงาน","นานๆ ทีถึงจะมีเรื่องดีๆ เกิดขึ้นในชีวิตฉัน แล้วมันก็อยู่กับฉันแค่ช่วงเวลาสั้น ๆ","เมื่อวานก็เข้าเรียนสายเพราะน ้าท่วม วันนี้ก็สายเพราะรถติด เกิดแต่กับฉันจริง ๆ","ที่ฉันสอบผ่านทุกวิชาในเทอมนี้คงเป็นเพราะอาจารย์เมตตาฉัน"],"a":1,"e":"การมองโลกในแง่ดี คือการ มองสถานการณ์อย่างมีความหวัง แยกแยะปัญหาเป็นเรื่อง ๆ ไม่เหมารวมความล้มเหลว บางส่วนว่าเป็นความล้มเหลวทั้งหมด และเชื่อว่ายังมีโอกาสที่ดีเกิดขึ้นได้ ข้อ 1 ถูกต้อง แสดงการคิดเชิงบวก ไม่เหมา รวมความล้มเหลว และยังมองเห็นโอกาสในอนาคต"},{"n":49,"q":"ข้อใดเป็นแนวทางฝึกฝนตนในการคิดเชิงบวก (Positive Thinking)","o":["เอาตัวไปอยู่ใกล้ๆ กับบุคคลที่คิดบวก","ยิ้มและหัวเราะในช่วงเวลาที่ยากลำบาก","ถูกทั้งข้อ 1 และ 2","ผิดทั้งข้อ 1 และ 2"],"a":3,"e":"แนวทางการฝึกฝนตนเองในการคิดเชิงบวก (Positive Thinking) ตามหลักจิตวิทยา ไม่ใช่การหลอกตัวเองว่าไม่มี ปัญหา (Toxic Positivity) แต่คือการฝึกสมองให้มองหาโอกาส ข้อดี หรือแนวทางแก้ไขปัญหาท่ามกลางสถานการณ์ที่ ยากลำบาก ซึ่งสามารถทำได้ผ่าน 4 แนวทางหลัก ดังนี้ 1. การปรับกระบวนการคิดและบทสนทนากับตัวเอง (Cognitive Reframing & Self-Talk) 2. การควบคุมและการตอบสนองทางอารมณ์ (Emotional Regulation) \"ยิ้มและหัวเราะในช่วงเวลาที่ยากลำบาก\" 3. การเลือกสภาพแวดล้อมและสังคม (Positive Environment) “เอาตัวไปอยู่ใกล้ๆ กับบุคคลที่คิดบวก” 4. การลงมือทำเพื่อสร้างพลังกายและใจที่ดี (Positive Actions) ข้อ 1. และข้อ 2. ต่างก็เป็นแนวทางการฝึกฝนตนเองในการคิดเชิงบวก (Positive Thinking) ที่ถูกต้องและได้รับ การยอมรับตามหลักจิตวิทยาเชิงบวก"},{"n":50,"q":"ข้อใดไม่ใช่แนวทางพัฒนาเจตคติเชิงบวกในการดำเนินชีวิตร่วมกับผู้อื่น","o":["คิดหาหนทางแก้ไขปัญหาในทิศทางที่สร้างสรรค์","เลือกที่จะคิดถึงสถานการณ์ที่เราชอบ","ทำความเข้าใจและปรับความคิดของตัวเองในทางบวกมากขึ้น","ตีความหมายของสถานการณ์ที่เลวร้ายด้วยความเชื่อทางบวกและเป็นประโยชน์ต่อตัวเอง"],"a":2,"e":"การพัฒนาเจตคติเชิงบวกในการอยู่ร่วมกับผู้อื่น เน้นการ เผชิญความจริง ปรับมุมมอง และแก้ไขปัญหาอย่าง สร้างสรรค์ ไม่ใช่การหลีกเลี่ยงหรือเลือกคิดเฉพาะสิ่งที่ตนเองชอบ"},{"n":51,"q":"ข้อใดกล่าวลักษณะของความแตกต่างระหว่างบุคคลได้ถูกต้อง","o":["มนุษย์มีความต้องการที่เหมือนๆ กัน","อัตลักษณ์เป็นสิ่งที่เปลี่ยนแปลงได้และแตกต่างกัน","บุคคลต่างเพศย่อมมีความสนใจที่เหมือนกัน","แฝดแท้มีลักษณะกายภาพทางเพศที่ต่างกัน"],"a":2,"e":"ความแตกต่างระหว่างบุคคล หมายถึง ความแตกต่างด้านความคิด ความรู้สึก บุคลิกภาพ ความสนใจและอัตลักษณ์ ซึ่งสามารถ แตกต่างกันระหว่างบุคคล และ เปลี่ยนแปลงได้ตามประสบการณ์ เวลา และบริบททางสังคม"},{"n":52,"q":"อัลเฟรด บิเนต์ (Alfred Binet) เป็นผู้พัฒนาเครื่องมือวัดเกี่ยวกับอะไร","o":["ความฉลาดปัญญา","ความฉลาดอารมณ์","ความฉลาดศิลปะ","ความฉลาดคุณธรรม"],"a":1,"e":"อัลเฟรด บิเนต์ (Alfred Binet) เป็นนักจิตวิทยาชาวฝรั่งเศส ผู้พัฒนา แบบทดสอบวัดเชาวน์ปัญญา (Intelligence Test / IQ Test) ร่วมกับ Théodore Simon เพื่อใช้ประเมินความสามารถทางสติปัญญาของเด็ก โดยมุ่งเน้นด้านการคิด การ ใช้เหตุผล ความจำ และการแก้ปัญหา"},{"n":53,"q":"ลักษณะของยีนส์ด้อย (Recessive gene) ตรงกับข้อใดมากที่สุด","o":["สิ่งปรากฏชัดปรากฏเฉพาะในรุ่นลูกที่เหมือนกับพ่อแม่","ยีนส์ที่ทำให้เกิดโดดเด่นและความแตกต่างจากพ่อแม่","ลักษณะแอบแฝงซึ่งจะถ่ายทอดทางกรรมพันธุ์ไปยังรุ่นต่อไป","คุณลักษณะทางชีวภาพที่ปรากฏให้สังเกตเห็นได้จากภายนอก"],"a":3,"e":"ยีนส์ด้อย (Recessive gene) เป็นยีนส์ที่มีลักษณะไม่แสดงออกให้เห็นภายนอกทันที หากอยู่ร่วมกับยีนส์เด่น แต่ สามารถ ถ่ายทอดแฝงไปยังรุ่นถัดไป และจะแสดงลักษณะนั้นได้เมื่อได้รับยีนส์ด้อยเหมือนกันทั้งสองข้าง"},{"n":54,"q":"ข้อใดจัดว่าเป็นสิ่งแวดล้อมหลังคลอดของมารดา","o":["ผิดปกติทางโครโมโซมหลังคลอด","การบำรุงดูแลทารกในครรภ์","การดื่มสุราของมารดาตั้งครรภ์","การโอบกอดและให้ความรักทารก"],"a":4,"e":"สิ่งแวดล้อมหลังคลอด หมายถึง ปัจจัยด้านการเลี้ยงดู การดูแล และปฏิสัมพันธ์ระหว่างมารดากับทารก หลังจาก ทารกคลอดแล้ว ซึ่งมีผลต่อพัฒนาการทางอารมณ์ บุคลิกภาพ และสุขภาพจิตของเด็ก"},{"n":55,"q":"บุคคลมีอัตราการเจริญเติบโตทางร่างกายที่แตกต่างเกิดจากสาเหตุหลักในข้อใด","o":["อารมณ์และสุขภาพจิตของมารดา","การพร้อมทางร่างกายและจิตใจ","การหลั่งโกรทฮอร์โมนของต่อมใต้สมอง","ความผิดปกติทางอารมณ์ของเด็ก"],"a":3,"e":"อัตราการเจริญเติบโตทางร่างกายของบุคคลแตกต่างกัน โดยมีสาเหตุหลักจากปัจจัยทางชีวภาพโดยเฉพาะ การหลั่ง ฮอร์โมนการเจริญเติบโต (Growth Hormone) จาก ต่อมใต้สมอง (Pituitary Gland) ซึ่งมีผลโดยตรงต่อความสูง น ้าหนัก และพัฒนาการของร่างกาย"},{"n":56,"q":"ข้อใดไม่ใช่องค์ประกอบของความเฉลียวฉลาดทางอารมณ์ตามแนวคิดของปีเตอร์ ชาโลเว่","o":["การรับรู้อารมณ์ของตนเอง","การสร้างแรงจูงใจที่ดีให้แก่ตนเอง","การจัดการอารมณ์ของตนเอง","การยอมรับความแตกต่างทางอารมณ์"],"a":4,"e":"ทฤษฎีความฉลาดทางอารมณ์ (Emotional Intelligence) ของ Peter Salovey และ John Mayer มีองค์ประกอบ ได้แก่ 1. การตระหนักรู้ในอารมณ์ตนเอง 2. การบริหารจัดการอารมณ์ของตนเอง 3. การสร้างแรงจูงใจให้ตนเอง 4. การรู้จักอารมณ์ผู้อื่น 5. การบริหารจัดการความสัมพันธ์กับผู้อื่น"},{"n":57,"q":"ความผิดปกติดาวน์ซินโดรมมีสาเหตุมาจากอะไร","o":["ความผิดปกติบนยีนส์ของบิดา","ความผิดปกติบนยีนส์ของมารดา","ความผิดปกติโครโมโซมคู่ที่ 21 เกินมา","ความผิดปกติโครโมโซมคู่ที่ 20 เกินมา"],"a":3,"e":"ดาวน์ซินโดรม เกิดจากความผิดปกติของโครโมโซม โดยเฉพาะกรณีที่พบบ่อยที่สุดคือมีโครโมโซม คู่ที่ 21 เกินมา 1 แท่ง (เรียกว่า Trisomy 21) ทำให้มีโครโมโซมรวมเป็น 47 แท่ง ส่งผลต่อพัฒนาการทางร่างกาย สติปัญญา และ บุคลิกภาพ"},{"n":58,"q":"Realistic ตรงกับบุคลิกภาพสนใจในอาชีพในข้อใด","o":["นักวิทยาศาสตร์","นักประชาสัมพันธ์","วิศวกร","นักสังคมสงเคราะห์"],"a":3,"e":"บุคลิกภาพแบบ Realistic (R) ตามแนวคิดของ Holland หมายถึง บุคคลที่ชอบทำงานเชิงปฏิบัติใช้ทักษะทาง เทคนิค เครื่องมือ อุปกรณ์ หรือการทำงานที่เป็นรูปธรรม จับต้องได้ เมื่อพิจารณาตัวเลือก 1. Realistic - ชอบกิจกรรมที่ใช้แรงกาย เครื่องมือ เครื่องจักร เช่น งานช่าง วิศวกร 2. Investigative – ชอบงานที่ต้องใช้การคิดวิเคราะห์ เช่น นักวิจัย นักคณิตศาสตร์ 3. Artistic – ชอบงานสร้างสรรค์ เช่น นักเขียน นักออกแบบ 4. Social – ชอบช่วยเหลือผู้อื่น เช่น นักสังคมสงเคราะห์ ครู 5. Enterprising – ชอบชักจูงโน้มน้าว เช่น นักธุรกิจ นักขาย 6. Conventional – ชอบงานที่มีระเบียบแบบแผน เช่น เจ้าหน้าที่บัญชี"},{"n":59,"q":"ทัศนะต่อชีวิตในรูปแบบใดตามแนวคิดของอีริค เบิร์น (Eric Berne) ที่ก่อให้เกิดการสิ้นหวัง สุขภาพจิตแย่","o":["I’m O.K. – You’re O.K.","I’m not O.K. – You’re O.K.","I’m O.K. – You’re not O.K.","I’m not O.K. – You’re not O.K."],"a":4,"e":"ตามทฤษฎี Transactional Analysis (TA) ของอีริค เบิร์น (Eric Berne) ทัศนะต่อชีวิต (Life Position) แบ่ง ออกเป็น 4 แบบ คือ 1. I’m O.K. – You’re O.K. คือ ทัศนะที่ดีที่สุด มีสุขภาพจิตดีมองตนเองและผู้อื่นในแง่บวก 2. I’m O.K. – You’re not O.K. คือ มองตนเองดีกว่าผู้อื่น มักก้าวร้าว ดูถูกคนอื่น 3. I’m not O.K. – You’re O.K. คือ ขาดความมั่นใจ รู้สึกด้อยค่า แต่มองผู้อื่นดีกว่าตนเอง 4. I’m not O.K. – You’re not O.K. คือ ทัศนะที่เลวร้ายที่สุด โดยมองว่าตนเองก็ไม่ดี มองว่าผู้อื่นก็ไม่ดีก่อให้เกิด ความสิ้นหวัง (hopelessness) ส่งผลให้ สุขภาพจิตแย่ ซึมเศร้า หมดแรงจูงใจในชีวิต"},{"n":60,"q":"ข้อใดไม่ใช่ลักษณะลีลาการเรียนรู้ตามแนวคิดของ Fleming and Mills","o":["ลีลาการเรียนรู้ที่สื่อด้วยภาพและสัญลักษณ์","ลีลาการเรียนรู้ที่สื่อด้วยเสียง","ลีลาการเรียนรู้ที่สื่อด้วยอักษร","ลีลาการเรียนรู้ที่สื่อด้วยการสัมผัสใจ"],"a":4,"e":"ตามแนวคิดของ Fleming and Mills (1992) ผู้พัฒนา VARK Learning Styles ได้จำแนกลีลาการเรียนรู้หลักไว้ 4 ประเภท ได้แก่ 1. Visual (V) – เรียนรู้ผ่านการมองเห็น เช่น ภาพ แผนผัง สัญลักษณ์ 2. Aural (A) – เรียนรู้ผ่านการฟัง เช่น บรรยาย การพูดคุย 3. Read/Write (R) – เรียนรู้ผ่านการอ่านและการเขียน 4. Kinesthetic (K) – เรียนรู้ผ่านการลงมือทำ หรือการสัมผัสโดยตรง เช่น การทดลอง การปฏิบัติจริง ไม่มีประเภทใดที่ เรียกว่า “การสัมผัสใจ” หรือ “สัมผัสทางอารมณ์” ตามที่ตัวเลือกที่ 4 กล่าวไว้ จึงถือว่า ไม่ใช่ลักษณะลีลาการเรียนรู้ตาม แนวคิดของ Fleming and Mills"},{"n":61,"q":"การวิเคราะห์การสื่อสาร ตรงกับข้อใด","o":["ทำความเข้าใจปัญหา","การสื่อสารแบบผู้ใหญ่","การสร้างสังคมแห่งเหตุผล","เลือกวิธีการสื่อสารที่เหมาะสม"],"a":2,"e":"การวิเคราะห์การสื่อสารของบุคคล ของอีริค เบิร์น (Eric Berne) แบ่งออกเป็น 3 ลักษณะ ดังนี้ 1. การสื่อสารแบบพ่อแม่ (Parent ego state) 2. การสื่อสารแบบผู้ใหญ่ (Adult Ego State) 3. การสื่อสารแบบเด็ก (Child Ego State)"},{"n":62,"q":"จริยธรรมการสื่อสาร 4 ประการ ตรงกับข้อใด","o":["ทำความเข้าใจปัญหา","การสื่อสารแบบผู้ใหญ่","การสร้างสังคมแห่งเหตุผล","เลือกวิธีการสื่อสารที่เหมาะสม"],"a":3,"e":"Louis Day ได้กล่าวถึงจริยธรรมการสื่อสาร 4 ประการ คือ 1. การสร้างสังคมแห่งเหตุผล 2. การมีศรัทธาต่อเสรีภาพและความรับผิดชอบต่อสังคม 3. การเคารพต่อศักดิ์ศรีความเป็นเพื่อนมนุษย์ 4. การอดทนและยึดมั่นต่อความยุติธรรมตามบรรทัดฐานทางสังคมบนหลักของความจริง เช่น การให้ข้อมูล ที่เป็นจริง ฯลฯ"},{"n":63,"q":"การสื่อสารเพื่อพัฒนาบุคคลด้วยการปรึกษา ตรงกับข้อใด","o":["ทำความเข้าใจปัญหา","การสื่อสารแบบผู้ใหญ่","การสร้างสังคมแห่งเหตุผล","เลือกวิธีการสื่อสารที่เหมาะสม"],"a":1,"e":"การให้การปรึกษาเป็นการช่วยเหลือให้บุคคลสามารถรับรู้ เข้าใจ ยอมรับ และปรับตัวต่อสถานการณ์ที่เกิดขึ้นผ่าน การสื่อสารระหว่างผู้ให้การปรึกษากับผู้รับการปรึกษา โดยมีกระบวนการ ดังนี้ 1. สร้างสัมพันธภาพ 2. สำรวจปัญหา 3. ทำความเข้าใจปัญหา 4. วางแผนคลี่คลายปัญหา 5. ยุติการปรึกษา"},{"n":64,"q":"การสื่อสารภายในกลุ่มทางสังคมที่มีประสิทธิภาพ ตรงกับข้อใด","o":["ทำความเข้าใจปัญหา","การสื่อสารแบบผู้ใหญ่","การสร้างสังคมแห่งเหตุผล","เลือกวิธีการสื่อสารที่เหมาะสม"],"a":4,"e":"การสื่อสารภายในกลุ่มสังคมที่มีประสิทธิภาพต้องคำนึงถึงประเด็นสำคัญ ต่อไปนี้ 1. เลือกวิธีการสื่อสารที่เหมาะสม 2. ใช้ภาษาที่เหมาะสม 3. คำนึงถึงประสิทธิภาพการสื่อสาร"},{"n":65,"q":"ข้อใดต่อไปนี้ไม่ถือเป็นองค์ประกอบของการสื่อสาร","o":["โทรศัพท์","ร้านขายโทรศัพท์","เสียงพูดของนาย A","นางสาว B กดรับโทรศัพท์"],"a":2,"e":"องค์ประกอบของการสื่อสาร (Elements of Communication) ประกอบด้วยสิ่งสำคัญ ได้แก่ 1. ผู้ส่งสาร (Sender) 2. สาร (Message) 3. ช่องทางหรือสื่อ (Channel) 4. ผู้รับสาร (Receiver) 5. การตอบสนองกลับ (Feedback) 6. สิ่งรบกวน (Noise) ข้อ 1. โทรศัพท์ = เป็น ช่องทาง (Channel) หรือ สื่อกลาง ในการส่งสาร ข้อ 3. เสียงพูดของนาย A = เป็น สาร (Message) ที่ส่งไปยังผู้รับ ข้อ 4. นางสาว B กดรับโทรศัพท์ = เป็น ผู้รับสาร (Receiver) และเป็นส่วนหนึ่งของ กระบวนการตอบสนอง (Feedback)"},{"n":66,"q":"ข้อใดถูกต้องเกี่ยวกับรูปแบบการสื่อสารระหว่างบุคคล","o":["การสื่อสารแบบปิดกับการสื่อสารแบบเปิด","การสื่อสารแบบเดี่ยว กับการสื่อสารแบบคู่","การสื่อสารทางเดียวหรือสองทาง","การสื่อสารภาคพื้นดินกับทางอากาศ"],"a":3,"e":"รูปแบบการสื่อสารระหว่างบุคคล (Interpersonal Communication) มักจำแนกตาม ทิศทางของการสื่อสาร ได้แก่ 1. การสื่อสารทางเดียว (One-way communication) 2. การสื่อสารสองทาง (Two-way communication)"},{"n":67,"q":"ข้อใดคือคุณสมบัติของผู้รับสาร","o":["วัจนภาษา","การให้ข้อมูลที่เป็นจริง","เคเบิลใยแก้วนำแสง","การมีเจตคติที่ดีต่อสาร"],"a":4,"e":"บุคคลที่จะรับสารได้อย่างมีประสิทธิภาพหรือไม่ขึ้นอยู่กับ 5 องค์ประกอบ ดังนี้ 1. ทักษะในการสื่อสาร 2. เจตคติแบ่งออกเป็น การมีเจตคติที่ดีต่อตนเอง การมีเจตคติที่ดีต่อสาร และการมีเจตคติที่ดีต่อผู้ส่งสาร 3. ความรู้ 4. ระบบสังคม 5. วัฒนธรรม"},{"n":68,"q":"ข้อใดตรงกับช่องทางการสื่อสารระยะใกล้","o":["วัจนภาษา","การให้ข้อมูลที่เป็นจริง","เคเบิลใยแก้วนำแสง","การมีเจตคติที่ดีต่อสาร"],"a":1,"e":"ช่องทางการสื่อสารสามารถแบ่งออกเป็น 2 ลักษณะ คือ 1. ช่องทางการสื่อสารระยะใกล้เช่น วัจนภาษาและอวัจนภาษา เป็นต้น 2. ช่องทางการสื่อสารระยะไกล เช่น เคเบิลใยแก้วนำแสง เป็นต้น"},{"n":69,"q":"ข้อใดตรงกับช่องทางการสื่อสารระยะไกล","o":["วัจนภาษา","การให้ข้อมูลที่เป็นจริง","เคเบิลใยแก้วนำแสง","การมีเจตคติที่ดีต่อสาร"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 68. ประกอบ"},{"n":70,"q":"ข้อใดตรงกับจริยธรรมการสื่อสาร","o":["วัจนภาษา","การให้ข้อมูลที่เป็นจริง","เคเบิลใยแก้วนำแสง","การมีเจตคติที่ดีต่อสาร"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 62. ประกอบ"},{"n":71,"q":"ข้อใดไม่ถูกต้องเกี่ยวกับแนวคิดธรรมชาติของมนุษย์","o":["มนุษย์มีทั้งความคล้ายคลึงและมีความแตกต่างจากผู้อื่น","มนุษย์มีความซับซ้อนสูงดังนั้นควรศึกษาแบบแยกส่วนพฤติกรรม","มนุษย์ทุกคนมีคุณค่าและศักดิ์ศรีเท่าเทียมกัน","ไม่มีข้อใดไม่ถูกต้อง"],"a":2,"e":"แนวคิดเรื่องธรรมชาติของมนุษย์ ได้แก่ 1. ความแตกต่างระหว่างบุคคลคือ มนุษย์มีทั้งความคล้ายคลึงและมีความแตกต่างจากผู้อื่น 2. การคำนึงถึงบุคคลในลักษณะรวม คือ เราไม่อาจศึกษาบุคคลโดยการแยกศึกษาเป็นส่วนย่อย ๆ แต่ละส่วน 3. สาเหตุของการเกิดพฤติกรรม คือ พฤติกรรมจากความต้องการซึ่งถือว่าความต้องการเป็นแรงขับหรือแรงจูงใจ ภายในที่ทำให้เกิดพฤติกรรม 4. มนุษย์มีคุณค่าและศักดิ์ศรี คือ มนุษย์ทุกคนมีคุณค่าและศักดิ์ศรีเท่าเทียมกัน 5. มนุษย์มีความซับซ้อน คือ มนุษย์จัดเป็นสัตว์ชั้นสูงที่ซับซ้อนและมีพฤติกรรมผันแปรอยู่ตลอดเวลาตามความ ต้องการหรือแรงจูงใจที่มีอยู่"},{"n":72,"q":"ข้อใดไม่ใช่เทคนิคตามแนวคิด “Conflict” เพื่อการจัดการความขัดแย้งอย่างสร้างสรรค์","o":["N = Negotiation","F = Fairness","T = Tolerance","C = Control"],"a":3,"e":"เทคนิคตามแนวคิดคำว่า “CONFLICT” เพื่อการจัดการความขัดแย้งอย่างสร้างสรรค์ ถอดรหัสตัวย่อของ คำศัพท์ภาษาอังกฤษทั้ง 8 ตัวออกมาได้ดังนี้ C = Control : การควบคุมอารมณ์ สติ และท่าทีของตนเองไม่ให้ใช้ความรุนแรง O = Optimistic / Openness : การเปิดใจกว้างรับฟัง และการมองสถานการณ์ในแง่ดีเพื่อหาโอกาสแก้ไข N = Negotiation : การเจราต่อรองร่วมกัน เพื่อหาข้อตกลงที่ยอมรับได้ทั้งสองฝ่าย (Win-Win) F = Fairness : ความยุติธรรม ความเท่าเทียม และความเป็นกลางในการพิจารณาปัญหา L = Love : ความรัก ความเมตตา และความปรารถนาดีที่จะรักษาความสัมพันธ์ที่ดีต่อกันไว้ I = Individual / Identity : การเคารพในความแตกต่างและอัตลักษณ์เฉพาะบุคคลของแต่ละฝ่าย C = Communication : การสื่อสารอย่างสร้างสรรค์ ชัดเจน ตรงไปตรงมา และการฟังอย่างตั้งใจ (Active Listening) T = Togetherness : ความร่วมมือร่วมใจ ความเป็นอันหนึ่งอันเดียวกันเพื่อก้าวข้ามผ่านความขัดแย้งไปด้วยกัน"},{"n":73,"q":"ข้อใดกล่าวถูกต้องเกี่ยวกับ “ความขัดแย้ง” ตามแนวคิดด้านมนุษยสัมพันธ์","o":["สนับสนุนความขัดแย้งบนรากฐานความสามัคคีและความสงบสุข","ควรสนับสนุนและยอมรับความขัดแย้งเพราะบางครั้งอาจมีประโยชน์","ความขัดแย้งเป็นสิ่งที่ไม่ดี หากหลีกเลี่ยงได้ควรเลี่ยงไม่ให้เกิดขึ้น","ถูกทุกข้อ"],"a":2,"e":"ตามแนวคิดด้านมนุษยสัมพันธ์ (Human Relations Approach) มองว่า ความขัดแย้งไม่ใช่สิ่งเลวร้ายเสมอไป หากได้รับการจัดการอย่างเหมาะสม ความขัดแย้งสามารถก่อให้เกิดประโยชน์ เช่น การแลกเปลี่ยนความคิดเห็น การ ปรับปรุงการทำงาน และการพัฒนาองค์กร"},{"n":74,"q":"ข้อใดไม่ใช่เทคนิคการสร้างมนุษยสัมพันธ์ในที่ทำงานตามหลัก R-E-L-A-T-I-O-N","o":["T = Trust","N = Networking","A = Adaptability","I = Integrity"],"a":1,"e":"เทคนิคการสร้างมนุษยสัมพันธ์ในที่ทำงานตามหลัก R-E-L-A-T-I-O-N ประกอบด้วย ดังนี้ R = Reality (ความจริงใจ) : การติดต่อปฏิสัมพันธ์กับเพื่อนร่วมงานด้วยความจริงใจ โปร่งใส และไม่เสแสร้ง E = Energetic (ความกระตือรือร้น) : การแสดงความกระตือรือร้น พลังงานเชิงบวก และความพร้อมที่จะเรียนรู้หรือ ปฏิบัติงานอยู่เสมอ L = Listening (ตั้งใจฟัง) : การพัฒนาทักษะการฟังอย่างตั้งใจ (Active Listening) รับฟังความคิดเห็นและปัญหาของ เพื่อนร่วมงานโดยไม่ด่วนตัดสิน A = Adaptability (การปรับตัว) : การยืดหยุ่น ยอมรับความเปลี่ยนแปลง และพร้อมปรับเปลี่ยนพฤติกรรมให้เข้ากับ วัฒนธรรมองค์กรและเพื่อนร่วมงานที่หลากหลาย T = Tolerance (ความอดทน) : การมีความอดตาอดใจ อดทนต่อแรงกดดัน และความสามารถในการควบคุมอารมณ์ เมื่อเผชิญกับสถานการณ์ที่ขัดแย้ง I = Integrity (ความซื่อสัตย์) : การรักษาคำพูด มีความซื่อสัตย์สุจริตในหน้าที่ และปฏิบัติงานอย่างตรงไปตรงมาเพื่อ สร้างความไว้วางใจ O = Oral Communication (การพูดจาไพเราะ) : การสื่อสารด้วยคำพูดและน ้าเสียงที่สุภาพ นุ่มนวล ชัดเจน และ เหมาะสมกับกาลเทศะ N = Network (การมีเครือข่าย) : การสร้างสายสัมพันธ์อันดี ความร่วมมือร่วมใจ และความเป็นมิตรกับเพื่อนร่วมงาน ต่างแผนกเพื่อเกื้อกูลกันในการทำงาน"},{"n":75,"q":"การแก้ปัญหาความขัดแย้งโดยใช้อำนาจตามตำแหน่งที่คำนึงถึงงานมากกว่าความสัมพันธ์","o":["ลักษณะแบบเต่า","ลักษณะแบบฉลาม","ลักษณะแบบสุนัขจิ้งจอก","ลักษณะแบบนกฮูก"],"a":2,"e":"ลักษณะแบบ \"ฉลาม\" (การเอาชนะ) เป็นการแก้ปัญหาความขัดแย้งโดยใช้อำนาจตาม ตำแหนง (Authority) คำนึงถึงเป้าหมายงานหรือความต้องการของตนเองมากกวาความสัมพันธ์กบ พยายามทำทุกอยางให้บรรลุเป้าหมายโดย ไม่คำนึงถึงความเสียหายใด ๆ ไม่สนใจ ในความต้องการของคนอื่นไม่สนใจที่คนอื่นไม่ชอบหรือไม่ยอมรับตน มีความ เชื่อวาความขัดแย้ง จะยุติได้เมื่อมีฝ่ายหนึ่งเป็นผู้ชนและอีกฝ่ายเป็นผู้แพ้ ลักษณะแบบฉลามต้องการเป็นผู้ชนะ ก่อให้เกิด ความรู้สึกภาคภูมิใจและประสบความสำเร็จแต่ความพายแพ้ก่อให้เกิดความรู้สึกอ่อนแอ"},{"n":76,"q":"การจัดการความขัดแย้งที่คำนึงถึงสัมพันธภาพกับบุคคลโดยใช้การประนีประนอม","o":["ลักษณะแบบเต่า","ลักษณะแบบฉลาม","ลักษณะแบบสุนัขจิ้งจอก","ลักษณะแบบนกฮูก"],"a":3,"e":"ลักษณะแบบ “สุนัขจิ้งจอก” (การประนีประนอม) (แก้ปัญหาเฉพาะหน้า : Compromising) จะคำนึงถึง เป้าหมายส่วนตนและสัมพันธภาพกับบุคคลอื่นในระดับปานกลาง แสวงหาการประนีประนอมยอมละเป้าหมายส่วนตน บางส่วนและชักจูงให้ผู้อื่นยอมสละเป้าหมายบางส่วน พยายามหาข้อสรุปต่อข้อขัดแย้งที่ได้ประโยชน์ทั้งสองฝ่ายพร้อม และเต็มใจที่จะสละ วัตถุประสงค์และสัมพันธภาพบางส่วนเพื่อหาข้อตกลงร่วมที่ดี"},{"n":77,"q":"การแก้ไขความขัดแย้งโดยใช้วิธีการให้ร่วมมือซึ่งกันและกันบนพื้นฐานการเปิดเผยและไว้ใจ","o":["ลักษณะแบบเต่า","ลักษณะแบบฉลาม","ลักษณะแบบสุนัขจิ้งจอก","ลักษณะแบบนกฮูก"],"a":4,"e":"ลักษณะแบบ “นกฮูก” (การร่วมมือ) จะมองความขัดแย้งเป็นปัญหาที่จะต้องแก้ไขให้คุณค่าแก่เป้าหมาย และ สัมพันธภาพและหาทางออกที่สนองต่อเป้าหมายทั้งของตนและของผู้อื่นถือว่าความขัดแย้งเป็นสิ่งที่ปรับปรุง สัมพันธภาพโดยการลดความตึงเครียดระหว่างบุคคลทั้งสอง พยายามที่จะถกประเด็นเพื่อระบุถึงความขัดแย้งที่เป็น ปัญหา การหาทางแก้ไขโดยใช้วิธีให้ความร่วมมือซึ่งกันและกันบนพื้นฐานการเปิดเผยและไว้ใจ จะทำให้เกิดความพอใจ คือการบรรลุเป้าหมายของตนเองและผู้อื่น ความเครียดและความรู้สึกในทางลบได้รับการคลี่คลายแล้ว"},{"n":78,"q":"ข้อใดไม่ใช่หลักมนุษยสัมพันธ์ 9 ประการของ Carnegie","o":["เป็นนักฟังที่ดี","การยิ้ม","เอาใจใส่ผู้อื่น","ทำให้ตนเองเป็นคนสำคัญ"],"a":4,"e":"เทคนิคการสร้างมนุษย์สัมพันธ์เพื่อเอาชนะใจผู้อื่น ของ เดล คาร์เนกี้ (Carnegie) มีดังนี้ 1. อย่าตำหนิ ประนาม พร ่าบ่น หรือนินทา 2. จงยกย่องสรรเสริญผู้อื่นด้วยความสุจริตใจ 3. จงกระตุ้นให้อีกฝ่ายหนึ่งประสบความสำเร็จตามที่เขาต้องการ 4. จงเอาใจใส่ต่อผู้อื่นอย่างแท้จริง 5. การยิ้ม 6. จดจำชื่อบุคคล 7. จงเป็นนักฟังที่ดี 8. จงสนทนาเรื่องที่อีกฝ่ายหนึ่งสนใจ 9.จงทำให้ผู้อื่นเกิดความรู้สึกเป็นคนสำคัญ"},{"n":79,"q":"ข้อใดไม่ใช่เทคนิคการสร้างความสัมพันธ์ในกลุ่ม","o":["ตั้งเป้าหมายให้กลุ่มด้วยผู้นำกลุ่ม","ให้เวลาสมาชิกในกลุ่มได้รู้จักกัน","จัดลำดับความสำคัญของงานในกลุ่ม","ให้สมาชิกของกลุ่มเข้าใจวงจรชีวิตกลุ่ม"],"a":1,"e":"เทคนิคการสร้างความสัมพันธ์ภายในกลุ่ม มีดังนี้ 1. เปิดโอกาสให้มีช่วงเวลาที่สมาชิกจะทำความรู้จัก และคุ้นเคยกัน 2. ให้เวลาสมาชิกในการสื่อสารเกี่ยวกับความต้องการและจุดมุ่งหมายร่วมกัน 3. การสื่อสารเกี่ยวกับวงจรชีวิตของกลุ่ม โดยสมาชิกร่วมกันทำความเข้าใจในพัฒนาการกลุ่ม 4. สร้างเสียงหัวเราะและอารมณ์ขัน 5. ให้เวลาในการกำหนดเป้าหมายร่วมกัน 6. จัดลำดับความสำคัญการทำกิจกรรมให้เหมาะสม"},{"n":80,"q":"ข้อใดเรียงลำดับขั้นตอนในการพัฒนาตนเองได้อย่างถูกต้อง","o":["วิเคราะห์จุดเด่น จุดบกพร่อง – การสำรวจตนเอง – ปฏิบัติ - หาวิธีปรับปรุง - จัดแผนพัฒนา","การสำรวจตนเอง – วิเคราะห์จุดเด่น จุดบกพร่อง - หาวิธีปรับปรุง – จัดแผนพัฒนา - ปฏิบัติ","จัดแผนพัฒนา - การสำรวจตนเอง - หาวิธีปรับปรุง – วิเคราะห์จุดเด่นจุดบกพร่อง - ปฏิบัติ","หาวิธีปรับปรุง - จัดแผนพัฒนา - สำรวจตนเอง – ปฏิบัติ – วิเคราะห์จุดเด่นจุดบกพร่อง"],"a":2,"e":"ขั้นตอนการพัฒนาตนเองตามหลักทั่วไปควรเป็นกระบวนการที่มีลำดับตรรกะ ดังนี้ 1. การสำรวจตนเอง รู้จักตนเองก่อน 2. วิเคราะห์จุดเด่น จุดบกพร่อง 3. หาวิธีปรับปรุง กำหนดแนวทางแก้ไขและพัฒนา 4. จัดแผนพัฒนา วางแผนอย่างเป็นระบบ 5. ปฏิบัติและ ลงมือทำตามแผน"},{"n":81,"q":"ข้อใดอธิบายความหมายสัมพันธภาพระหว่างบุคคลได้ถูกต้อง","o":["การเว้นพื้นที่ทางสังคมในการมีปฏิสัมพันธ์","การเกิดรแงจูงใจทำงานร่วมกันตามเป้าหมายระหว่างคน 2 คน","การที่มนุษย์ตั้งแต่ 2 คนขึ้นไปมีปฏิสัมพันธ์ระหว่างกัน","การยอมรับนับถือระหว่างคนที่อยู่ร่วมกันในสังคม"],"a":3,"e":"“สัมพันธภาพระหว่างบุคคล (Interpersonal Relationship)” หมายถึง ความสัมพันธ์ที่เกิดจากการมีปฏิสัมพันธ์ ระหว่างบุคคลตั้งแต่ 2 คนขึ้นไป ไม่ว่าจะเป็นการสื่อสาร การร่วมกิจกรรม หรือการแลกเปลี่ยนความรู้สึกและความ คิดเห็น"},{"n":82,"q":"มีความเป็นทางการ ส่วนใหญ่เป็นการสื่อสารทางเดียว เป็นระยะห่างระหว่างบุคคลแบบใด","o":["ระยะใกล้ชิด","ระยะส่วนตัว","ระยะสังคม","ระยะสาธารณะ"],"a":4,"e":"การสร้างสัมพันธภาพและระยะห่างระหว่างบุคคล มีดังนี้ 1. ระยะใกล้ชิด (Intimate Distance) มีระยะห่างประมาณ 0 – 15 เซนติเมตร ) เป็นระยะที่ใกล้ที่สุด เราสามารถสื่อสาร กันได้อย่างใกล้ชิด การใช้ภาษาในระดับกันเอง มีภาษากายในการสัมผัสใกล้ชิดกัน โดยระยะนี้จะเป็นระยะเฉพาะคน พิเศษ เช่น คู่รัก สมาชิกในครอบครัว เพื่อนที่สนิทกันมาก ๆ หรือในเหตุการณ์เฉพาะอย่าการเล่นกีฬาบางประเภทที่ต้อง อยู่ในระยะประชิดตัว 2. ระยะส่วนตัว (Personal Distance) มีระยะห่างประมาณ 45 – 60 เซนติเมตร เป็นระยะที่มีอาณาเขตส่วนตัว แม้จะ ใกล้ชิดกันแค่ไหน สามารถเอื้อมมือถึงกันได้ สัมผัสกันได้ พูดคุยด้วยน ้าเสียงปกติ เช่น ระยะของเพื่อน เพื่อนร่วมงาน เพื่อนร่วมชั้นเรียน 3. ระยะสังคม (Social Distance) มีระยะห่างประมาณ 2 - 3.5 เมตร เป็นระยะที่การติดต่อสื่อสารภายใต้มารยาททาง สังคม ไม่ใกล่ชิด สัมผัสกันไม่ได้ ภาษาที่ใช้เป็นทางการมากขึ้น เช่น คนที่เรียนอยู่ในโรงเรียนเดียวกัน 4. ระยะสาธารณะ (Public Distance) มีระยะห่างตั้งแต่ 3.5 เมตรขึ้นไป มักเป็นการสื่อสารทางเดียว ภาษาที่ใช้มีความ เป็นทางการสูง มีความสุภาพสูง เช่น การพบเจอผู้คนในที่สาธารณะ"},{"n":83,"q":"มีการสัมผัสใกล้ชิดกันได้อย่างสนิทใจ เป็นระยะห่างระหว่างบุคคลแบบใด","o":["ระยะใกล้ชิด","ระยะส่วนตัว","ระยะสังคม","ระยะสาธารณะ"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 82. ประกอบ"},{"n":84,"q":"การเห็นคุณค่าในตัวเอง มีความหมายตามข้อใด","o":["แนวโน้มการแสดงออกของบุคคลที่มีต่อบุคคลอื่น","การสื่อสารและการถ่ายทอดข้อมูลเมื่อตนเองสร้างสัมพันธภาพกับผู้อื่น","เจตคติที่บุคคลมีต่อตนเองในการประเมินความคิดและความรู้สึกต่อการสร้างสัมพันธภาพ","ความต้องการของบุคคลในการสร้างสัมพันธภาพระหว่างบุคคล"],"a":3,"e":"การเห็นคุณค่าในตัวเอง (Self Esteem) หมายถึง ทัศนคติที่บุคคลมีต่อตัวเองทั้งในแง่บวกและลบรวมทั้งการ ประเมินความคิดและความรู้สึกของตนเองต่อการมีสัมพันธภาพกับผู้อื่น ดังนั้นการเห็นคุณค่าในตัวเองจึงเป็นลักษณะ ส่วนบุคคลที่เกี่ยวข้องกับการตัดสินใจตามค่านิยมที่มีต่อผู้อื่น"},{"n":85,"q":"การมองเห็นคุณค่าในตัวเองระดับสูง มีลักษณะตรงกับบุคคลข้อใด","o":["มะลิมีความอดทนสูงต่อความคับข้องใจ","ลิลลี่อยากได้รับคำชมจากคนรอบข้างตลอดเวลา","ทิวลิปมองว่าตนเองเจอแต่ปัญหาในชีวิตเสมอ","กุหลาบชอบแต่งตัวตามเพื่อน"],"a":1,"e":"หากบุคคลมีการมองเห็นคุณค่าในตัวเองระดับสูง จะส่งผลในทางบวกต่อคุณภาพชีวิต ดังนี้ 1. สามารถจูงใจผู้อื่น ด้วยการเสนอความคิดเห็นและแสดงพฤติกรรมเชิงบวก 2. มีความมั่นใจในการจัดการสถานการณ์ใหม่ ๆ ด้วนทัศนคติเชิงบวก 3. มีความอดทนสูงต่อความคับข้องใจ 4. มีความรู้สึกต่อตนเองในทางบวก เคารพนับถือตัวเอง 5. มีการควบคุมตนเองที่ดี มีความรับผิดชอบ และเชื่อว่าสิ่งที่เผชิญเป็นผลมาจากการกระทำของตนเอง 6. พัฒนาตนเองให้ดีขึ้นอยู่เสมอ"},{"n":86,"q":"จิ๊บตั้งใจให้ถึงเป้าหมาที่ตนเองตั้งไว้ ด้วยความมุ่งมั่น เป็นความฉลาดทางอารมณ์ด้านใด","o":["เก่ง","ดี","สุข","สุขุม"],"a":1,"e":"การพัฒนาความฉลาดทางอารมณ์ (E.Q.) ด้าน “เก่ง” เพื่อสร้างสัมพันธ์ภาพที่ดีกับผู้อื่น ได้แก่ 1. ตัดสินใจและแก้ไขปัญหาได้ 2. รู้ศักยภาพที่แท้จริงของตนเอง 3. ให้กำลังใจตนเองอยู่เสมอ 4. มุ่งมั่นไปให้ถึงเป้าหมายที่ตั้งไว้ 5. มีความยืดหยุ่น 6. รับผิดชอบในสิ่งที่ตัดสินใจทำ 7. สร้างสัมพันธภาพที่ดีกับผู้อื่น 8. กล้าแสดงออกอย่างเหมาะสม 9. แสดงความเห็นที่ขัดแย้งได้อย่างสร้างสรรค์"},{"n":87,"q":"เจี๊ยบมองโลกในแง่ดี ชอบให้อภัย เป็นความฉลาดทางอารมณ์ด้านใด","o":["เก่ง","ดี","สุข","สุขุม"],"a":3,"e":"การพัฒนาความฉลาดทางอารมณ์ (E.Q.) ด้าน “สุข” เพื่อสร้างสัมพันธ์ภาพที่ดีกับผู้อื่น ได้แก่ การมองเห็นคุณค่า ในตนเอง เคารพและยอมรับตนเอง พอใจในสิ่งที่มีอยู่ รู้จักให้อภัย มองโลกในแง่ดี มีอารมณ์ขัน รู้จักผ่อนคลาย"},{"n":88,"q":"ข้อใดไม่ใช่หลักการสร้างสัมพันธภาพที่ดีกับเพื่อน","o":["การแสดงความเอาใจใส่","การแสดงความเห็นอกเห็นใจ","การแสดงความไว้เนื้อเชื่อใจ","การไม่สนใจความรู้สึกของตนเอง"],"a":4,"e":"หลักการสร้างมีสัมพันธภาพที่ดีกับ “เพื่อน” สามารถทำได้ ดังนี้ 1. แสดงความเอาใจใส่ 2. แสดงความไว้เนื้อเชื่อใจ 3. แสดงการยอมรับนับถือ 4. แสดงความมีส่วนร่วมและการแบ่งปัน 5. แสดงความยืดหยุ่น 6. แสดงความเห็นอกเห็นใจ"},{"n":89,"q":"น ้าตาลชมแฟนว่าแต่งตัวได้หล่อเข้ม เท่ห์ไม่เหมือนใคร เป็นการแสดงออกภาษารักแบบใด","o":["บอกรักด้วยคำพูด","บอกรักด้วยการใช้เวลาร่วมกัน","การบอกรักด้วยการสัมผัส","การบอกรักด้วยการทำให้"],"a":1,"e":"หลักการสร้างสัมพันธภาพที่ดีกับ“คนรัก”อาศัยการสื่อสารที่เหมาะสมหรือภาษารัก ทั้ง 5 รูปแบบได้แก่ 1. บอกรักด้วยคำพูด : คนกลุ่มนี้ชอบสื่อสารผ่านคำพูด อ่อนไหวต่อคำพูดอย่างมาก ต้องการให้อีกฝ่ายพูดคุยด้วย เขียนข้อความบอกรัก ชื่นชม ขอบคุณ 2. บอกรักด้วยการใช้เวลาร่วมกัน : คนกลุ่มนี้ต้องการใช้เวลาหรือทำกิจกรรรมร่วมกับคนรัก โดยไม่มีคนอื่นมา รบกวน ต้องการให้อีกฝ่ายทำกิจกรรมที่ชอบด้วยกัน หรือพูดคุยกันอย่างใส่ใจ ไม่ถูกรบกวน 3. การบอกรักด้วยการให้ของขวัญ : คนกลุ่มนี้เชื่อว่าของขวัญหรือสิ่งที่ทำให้พิเศษ เป็นสัญลักษณ์ของการสื่อความรัก ต้องการให้อีกฝ่ายให้ความสำคัญผ่านการมอบสิ่งของ ทำให้รู้สึกว่าได้รับการคิดถึง 4. การบอกรักด้วยการทำให้ : คนกลุ่มนี้เชื่อว่าการกระทำสำคัญกว่าคำพูด ชอบช่วยเหลือ อาสาทำงานให้คำแนะนำ ดังนั้นคนกลุ่มนี้ต้องการได้รับการดูแลช่วยเหลือเช่นกัน 5. การบอกรักด้วยการสัมผัส : เช่น กอด หอมแก้ม จับมือ โอบไหล่ คนกลุ่มนี้ต้องการให้อีกฝ่ายสัมผัสเช่นกัน"},{"n":90,"q":"น ้าหวานจับมือแฟนเพื่อแสดงออกถึงความรักและคิดถึง เป็นการแสดงออกภาษารักแบบใด","o":["บอกรักด้วยคำพูด","บอกรักด้วยการใช้เวลาร่วมกัน","การบอกรักด้วยการสัมผัส","การบอกรักด้วยการทำให้"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 89. ประกอบ"},{"n":91,"q":"ข้อใดอธิบายความหมายของทักษะทางสังคมได้ถูกต้อง","o":["การมีความเอาใจใส่ในการสร้างปฏิสัมพันธ์กับผู้อื่น","การเผชิญหน้ากับปัญหาที่เกิดจากการสร้างปฏิสัมพันธ์กับผู้อื่น","การมีความสามารถในการสร้างปฏิสัมพันธ์กับผู้อื่น","การคำนึงถึงผลกระทบทางบวกในการสร้างปฏิสัมพันธ์กับผู้อื่น"],"a":3,"e":"ทักษะทางสังคม คือ ความสามารถของบุคคลในการใช้ปฏิสัมพันธ์ทางสังคม บุคคลมีความรู้ความเข้าใจและเป็น ทักษะเชิงพฤติกรรมที่ช่วยให้บุคคลมีการปฏิสัมพันธ์กันและมีการสื่อสารกับผู้อื่นหรือกับสังคม ทักษะทางสังคมจึงเป็น พฤติกรรมทางสังคมที่มีความสำคัญอย่างมาก"},{"n":92,"q":"การหาวิธีการแก้ปัญหาที่เหมาะสมในชีวิตประจำวัน ถือเป็นทักษะทางสังคมใด","o":["ทักษะควบคุมอารมณ์","ทักษะเอาตัวรอด","ทักษะการเผชิญหน้า","ทักษะการแก้ปัญหาสังคม"],"a":4,"e":"การหาวิธีการแก้ปัญหาที่เหมาะสมในชีวิตประจำวัน ไม่ว่าจะเป็นปัญหาการทำงาน การอยู่ร่วมกับผู้อื่น หรือ สถานการณ์ทางสังคมต่าง ๆ จัดเป็น ทักษะการแก้ปัญหาสังคม (Social Problem-Solving Skills) ซึ่งเน้นการคิด วิเคราะห์ ทางเลือก และตัดสินใจอย่างเหมาะสมต่อบริบททางสังคม"},{"n":93,"q":"ข้อใดไม่ใช่องค์ประกอบของทักษะทางสังคม","o":["ทักษะการแก้ปัญหาสังคม","ทักษะเอาตัวรอด","ทักษะควบคุมอารมณ์","ทักษะการเผชิญหน้า"],"a":2,"e":"องค์ประกอบของทักษะทางสังคม มี 4 องค์ประกอบด้วยกัน ได้แก่ 1. ทักษะการสื่อสาร 2. ทักษะการควบคุมอารมณ์ 3. ทักษะทางปัญญา 4. ทักษะการแก้ปัญหาสังคม"},{"n":94,"q":"มีความเข้าใจและตีความข้อมูลทางสังคม ได้ถือเป็นทักษะทางสังคมใด","o":["ทักษะการสื่อสาร","ทักษะทางการรู้คิด","ทักษะการแก้ปัญหาสังคม","ทักษะการควบคุมอารมณ์"],"a":2,"e":"ทักษะทางปัญญาหรือทักษะทางการรู้คิด (Cognitive Skills) คือ ผู้ที่มีความรู้ ความคิด และการใช้เหตุผลที่ เกี่ยวข้องกับปฏิสัมพันธ์ทางสังคม ตัวอย่างเช่น ความรอบรู้ด้านข้อมูลช่วยให้แต่ละคนเข้าใจและตีความข้อมูลทางสังคม ได้ และคาดการณ์เกี่ยวกับบทบาทของแต่ละคนและการดำเนินการที่อาจจำเป็นในบริบททางสังคมที่เฉพาะเจาะจง"},{"n":95,"q":"รากฐานของความสัมพันธ์ทางสังคมของวัยรุ่นคือข้อใด","o":["การเล่น","การเลียนแบบคนดัง","การฝึกระเบียบวินัย","สนใจในกิจกรรมกับกลุ่มเพื่อน"],"a":4,"e":"ในช่วงวัยรุ่น ความสัมพันธ์ทางสังคมจะเปลี่ยนจากการยึดโยงกับครอบครัวไปสู่ กลุ่มเพื่อน (Peer Group) เป็น หลัก การทำกิจกรรมร่วมกับเพื่อนช่วยพัฒนาทักษะทางสังคม การสื่อสาร การยอมรับซึ่งกันและกัน และการสร้างอัต ลักษณ์ของตนเอง"},{"n":96,"q":"แพนเค้กอ่านหนังสือและออกกำลังกายเป็นประจำอย่างสม ่าเสมอ เป็นการแสดงออกแบบใด","o":["ความรับผิดชอบ","ระเบียบวินัย","ความยืดหยุ่น","รู้จักให้อภัย"],"a":2,"e":"การมีระเบียบวินัย คือ บุคคลที่มีระเบียบวินัยจะต้องเป็นบุคคลที่มีระเบียบวินัยแบบแผน กฎเกณฑ์ที่กำหนดไว้ เป็นแนวปฏิบัติ คนที่มีระเบียบวินัยเป็นคนที่สามารถควบคุมตนเองให้ประพฤติปฏิบัติตนได้ตามกฎเกณฑ์ และข้อบังคับ ของสังคมนั้นได้"},{"n":97,"q":"ขนมปังเป็นคนใจเย็น ไม่ค่อยโกรธใครและมีความเมตตาต่อผู้อื่น เป็นการแสดงออกแบบใด","o":["ความรับผิดชอบ","ระเบียบวินัย","ความยืดหยุ่น","รู้จักให้อภัย"],"a":4,"e":"ลักษณะที่ว่า ใจเย็น ไม่ค่อยโกรธใคร และมีความเมตตาต่อผู้อื่น สะท้อนถึงความสามารถในการควบคุมอารมณ์ ไม่ผูกโกรธ และยอมรับผู้อื่น ซึ่งตรงกับ การรู้จักให้อภัย"},{"n":98,"q":"ข้อใดคือแนวทางพัฒนาทักษะทางสังคมที่สำคัญของวัยเด็กก่อนเข้าโรงเรียน","o":["การเล่น","การสื่อสารทางเดียว","กิจกรรมกับกลุ่มเพื่อน","การเลียนแบบคนดัง"],"a":1,"e":"วัยเด็กก่อนเข้าโรงเรียน ทักษะทางสังคมเป็นทักษะพื้นฐาน ควรได้รับการฝึกฝนปลูกฝังตั้งแต่วัยเด็ก ๆ เพื่อให้ทุก คนซึ่งเป็นหน่วยหนึ่งของสังคมสามารถดำรงชีวิตอยู่ในสังคมได้อย่างมีสุข การเล่นเป็นกิจกรรมที่สำคัญในชีวิตในชีวิต เด็กทุกคน เด็กจะรู้สึกสนุกสนาน เพลิดเพลินได้ สังเกต มีโอกาสทำการทดลอง สร้างสรรค์คิดแก้ปัญหาและค้นพบด้วย ตัวเอง การเล่นจะมีอิทธิพลและมีผลต่อการเจริญเติบโตช่วยพัฒนาร่างกาย อารมณ์ จิตใจ สังคมและสติปัญญา จากการ เล่นเด็กมีโอกาสเคลื่อนไหวส่วนต่าง ๆ ของร่างกาย"},{"n":99,"q":"มุ่งความสนใจไปที่หน้าที่การงาน การสร้างครอบครัว ตรงกับข้อใด","o":["เด็กวัยเรียน","วัยรุ่น","วัยผู้ใหญ่","วัยสูงอายุ"],"a":3,"e":"วัยผู้ใหญ่ เป็นช่วงวัยที่มีการเจริญเติบโตเต็มที่และมีวุฒิภาวะทุกด้านแล้ว สามารถรับผิดชอบชีวิตของตนเองและ ครอบครัวได้ และเป็นที่ยอมรับของสังคมแล้ว วัยนี้จะให้ความสำคัญกับกลุ่มเพื่อนลดลง และเป็นวัยที่จะเริ่มใช้ชีวิต ครอบครัวกับคู่ของตนเอง"},{"n":100,"q":"แสดงพฤติกรรมตามกลุ่ม เพื่อให้เป็นที่ยอมรับของกลุ่ม ตรงกับข้อใด","o":["เด็กวัยเรียน","วัยรุ่น","วัยผู้ใหญ่","วัยสูงอายุ"],"a":2,"e":"วัยรุ่น เริ่มขยายทางสังคมมากขึ้นกว่าช่วงวัยเด็ก เด็กผู้ชายจะมีขนาดสังคมใหญ่กว่าเด็กผู้หญิง จะทำทุกสิ่งทุก อย่างตามที่กลุ่มต้องการเพื่อให้เป็นที่ยอมรับของกลุ่ม กลุ่มมีอิทธิพลต่อวัยรุ่นในด้านความประพฤติการแต่งกาย กิริยา ท่าทาง เจตคติ ความสนใจ และค่านิยม"},{"n":101,"q":"ความหมายของมารยาททางจิตวิทยาคือข้อใด","o":["แบบแผนวิถีชีวิตตามบริบททางสังคม","แบบแผนแห่งความคิดและพฤติกรรม","สัญญาณที่แสดงออกในการสื่อสารเพื่อสร้างปฏิสัมพันธ์กับผู้อื่น","พฤติกรรมการที่มีการแสดงออกที่เหมาะสมตามโอกาสและสถานที่"],"a":4,"e":"“มารยาททางจิตวิทยา” หมายถึง การแสดงออกทางพฤติกรรมที่เหมาะสมกับบุคคล สถานการณ์ โอกาส และ สถานที่ โดยคำนึงถึงความรู้สึกของผู้อื่นและการอยู่ร่วมกันในสังคม"},{"n":102,"q":"ข้อใดเป็นอิทธิพลของสิ่งแวดล้อมที่มีอิทธิพลต่อบุคลิกภาพ","o":["สติปัญญา","รูปร่างหน้าตา","การเลี้ยงดู","อารมณ์พื้นฐานตั้งแรกเกิด"],"a":3,"e":"ปัจจัยที่มีอิทธิพลของสิ่งแวดล้อมที่มีอิทธิพลต่อบุคลิกภาพ ได้แก่ 1. การอบรมเลี้ยงดูจากครอบครัว 2. สถานศึกษา 3. ศาสนา 4. สื่อมวลชน 5. สังคมทุกระดับที่บุคคลได้มีโอกาสปฏิสัมพันธ์หรือเกี่ยวข้องด้วย 6. ระบบคุณค่าที่ยึดถือเป็นวัฒนธรรมและค่านิยมของแต่ละสังคม"},{"n":103,"q":"การทักทายแบบสากล คือข้อใด","o":["การโค้งคำนับและยกมือสัมผัสกัน","การพนมมือไหว้และกล่าวสวัสดี","การจับมือขวาทักทายกันระหว่างแนะนำตัว","การก้มศีรษะลงและย่อตัวลงอย่างช้าๆ"],"a":3,"e":"มารยาทในการทักทายแบบสากล นานาชาติมักทักทายกันด้วยวิธีจับมือทักทาย ซึ่งถือว่าเป็นการทักทายแบบสากล สิ่งที่สำคัญต้องยื่นมือขวาออกไปด้วยกริยาที่มั่นใจ แลดูเป็นมิตร"},{"n":104,"q":"มารยาทในการแต่งกายเข้าห้องประชุมที่เหมาะสมคือข้อใด","o":["แต่งกายตามนโยบายที่องค์กรนั้นกำหนดไว้","ใส่เสื้อยืดกางเกงยีนส์เข้าประชุม","สวมใส่เครื่องประดับที่แพงและอลังการ","ใส่รองเท้าหรือถุงเท้าสีฉูดฉาด"],"a":1,"e":"มารยาทในการแต่งกาย หมายถึง การแต่งกายให้เหมาะสมกับกาละและเทศะ ซึ่งการใช้เสื้อผ้ารวมถึงเครื่องต่าง กายตั้งแต่ศีรษะจรดเท้าควรสะอาด สุภาพและเรียบร้อย เหมาะกับรูปร่างลักษณะผิวพรรณของตนเองมารยาทในการแต่ง กายเข้าห้องประชุมที่เหมาะสม ควรแต่งกายตามนโยบายที่องค์กรนั้นกำหนดไว้"},{"n":105,"q":"ข้อใดกล่าวถูกต้องเกี่ยวกับการมีมารยาททางอินเทอร์เน็ต","o":["ก่อนส่งข้อความหรือข้อมูลควรคิดให้รอบคอบก่อนส่ง","ไม่ควรกลัวการแสดงพฤติกรรมไม่เหมาะสมโนโลกอินเทอร์เน็ต","ข้อมูลสามารถแชร์ในอินเทอร์เน็ตได้อย่างอิสระ โดยไม่ต้องตรวจสอบ","การรักษาข้อมูลเป็นหน้าที่ของเจ้าของข้อมูลเท่านั้น หากเกิดการแชร์ข้อมูลระหว่างกัน"],"a":1,"e":"มารยาททางอินเทอร์เน็ตประการหนึ่ง เน้นย ้าเรื่อง \"คิดก่อนคลิก\" เพราะข้อมูลที่ถูกส่งออกไปแล้วมักจะทิ้ง ร่องรอยดิจิทัล (Digital Footprint) ไว้ถาวร การไตร่ตรองก่อนจะช่วยป้องกันการสร้างความขัดแย้ง การละเมิดสิทธิผู้อื่น หรือการแพร่กระจายข้อมูลเท็จ"},{"n":106,"q":"การแต่งกายแบบทางการของบุคคลในบริบทใดที่ควรให้ความสำคัญมากที่สุด","o":["การบริการลูกค้า","งานสังสรรค์ในครอบครัว","งานประชุมในองค์กร","งานแต่งงานเพื่อน"],"a":3,"e":"การประชุมในองค์กรเป็นบริบททางวิชาชีพ ที่สะท้อนความเป็นทางการ ภาพลักษณ์ และความน่าเชื่อถือ ของ บุคคลและองค์กร การแต่งกายที่เหมาะสมจึงมีผลต่อการสื่อสาร ความเป็นมืออาชีพ และการได้รับความเคารพจากผู้ร่วม ประชุมมากที่สุด"},{"n":107,"q":"การแต่งกายเข้าประชุมแบบใดที่เหมาะสมที่สุด","o":["ผู้หญิงควรใส่ชุดรัดรูปเข้าประชุม เพื่อทำให้ได้รับความสนใจ","ใส่แว่นกันแดดเข้าร่วมการประชุม","ผู้บริหารใส่เสื้อยืดและกางเกงชาสั้นเข้าประชุม","ใส่เครื่องประดับน้อยชิ้น และเน้นแบบเรียบง่ายเข้าประชุม"],"a":4,"e":"การเข้าประชุมควรแต่งกายสุภาพ เรียบร้อยและเป็นทางการในระดับที่เหมาะสม เพื่อสะท้อนความเป็นมืออาชีพ และให้ความสำคัญกับสาระของการประชุม การเลือกเครื่องประดับน้อยชิ้นและเรียบง่าย ช่วยให้ไม่รบกวนสมาธิ และ สร้างภาพลักษณ์ที่เหมาะสมต่อบริบททางองค์กร"},{"n":108,"q":"ข้อใดคือความสำคัญของมารยาทและบุคลิกภาพ","o":["ช่วยวางแผนเชิงปริมาณ","เสริมสร้างการคิดวิเคราะห์","ช่วยเสริมสร้างจิตสำนึกที่ดี","สร้างความรู้ความเข้าใจ"],"a":3,"e":"มารยาทและบุคลิกภาพมีบทบาทสำคัญในการหล่อหลอมพฤติกรรมและทัศนคติที่เหมาะสม ทำให้บุคคลรู้จักเคารพ ตนเองและผู้อื่น มีความรับผิดชอบ และอยู่ร่วมกันในสังคมได้อย่างราบรื่น ซึ่งสะท้อนถึงการมีจิตสำนึกที่ดี มากที่สุด"},{"n":109,"q":"เมื่อพบบุคคลกระทำพฤติกรรมไม่เหมาะสม แล้วสามารถให้อภัย โดยแนะนำและชี้แนะข้อผิดพลาด อย่างสุภาพ สอดคล้องกับมารยาทการใช้อินเทอร์เน็ตข้อใดที่สุด","o":["รู้จักให้อภัย","ยับยั้งการโต้ตอบด้วยคำที่รุนแรง","แบ่งปันความรู้ซึ่งกันและกัน","เคารพผู้อื่น โดยตระหนักถึงสัญญาณและช่วงเวลา"],"a":1,"e":"มารยาทในการใช้อินเทอร์เน็ตที่พึงตระหนักและยึดเป็นแนวปฏิบัติ 10 ข้อ ตรงกับกฎข้อที่ 10 รู้จักให้อภัยผู้อื่น (Be Forgiving of Other People's mistakes) คือ การให้อภัยผู้อื่น เมื่อเห็นคนทำผิด ไม่ควรเข้าไปรุมกระหน่ําหรือประจาน ควรชี้แนะอย่างสุภาพ: หากต้องการเตือน ควรทำอย่างเป็นส่วนตัว (เช่น ทักแชทส่วนตัว) และใช้ถ้อยคำที่สุภาพ ไม่ดูถูก เหยียดหยาม"},{"n":110,"q":"ข้อใดไม่จัดว่าเป็นผลิตผลทางวัฒนธรรม","o":["ภูมิประเทศ","วรรณกรรม","เนื้อเพลง โฆษณา","หนังสือ เนื้อเพลง"],"a":1,"e":"ผลิตผลทางวัฒนธรรมหมายถึงสิ่งที่มนุษย์สร้างขึ้นจากความคิด ความเชื่อ ค่านิยม และการดำรงชีวิต เช่น วรรณกรรม หนังสือ เนื้อเพลง หรือโฆษณา ส่วน ภูมิประเทศ เป็นลักษณะทางธรรมชาติ ไม่ได้เกิดจากการสร้างสรรค์ ของมนุษย์ จึงไม่จัดเป็นผลิตผลทางวัฒนธรรม"},{"n":111,"q":"การมีมารยาททางอินเทอร์เน็ต ตรงกับข้อใด","o":["แชร์ข้อมูลในอินเทอร์เน็ต โดยไม่ต้องตรวจสอบความถูกต้อง","เมื่อมีการแชร์ข้อมูลระหว่างกัน เจ้าของข้อมูลเท่านั้นที่ต้องรักษารักษาข้อมูลของตนเอง","การส่งข้อมูลใดในอินเทอร์เน็ตต้องตรวจสอบ และระมัดระวังว่ามีผลเสียหรือไม่","พิมพ์คำหยาบคายใส่กันระหว่างผู้ใช้อินเทอร์เน็ต"],"a":3,"e":"มารยาททางอินเทอร์เน็ต (Netiquette) เน้นการใช้งานอย่างรับผิดชอบ คิดก่อนส่ง ตรวจสอบความถูกต้อง และ คำนึงถึงผลกระทบต่อผู้อื่น ข้อ 3 สอดคล้องกับหลักดังกล่าวมากที่สุด ส่วนข้ออื่นเป็นพฤติกรรมที่ไม่เหมาะสมหรือขาด ความรับผิดชอบในการใช้อินเทอร์เน็ต"},{"n":112,"q":"วัฒนธรรมแบบใดที่ให้ความสำคัญกับความต้องการของตนเอง มากกว่าความต้องการของผู้อื่นและ สังคม","o":["วัฒนธรรมกลุ่มนิยม (Collectivism)","วัฒนธรรมปัจเจกนิยม (Individualism)","วัฒนธรรมแบบผสม (Mixed Culture)","วัฒนธรรมสังคมนิยม (Socialism)"],"a":2,"e":"ข้อสังเกตเกี่ยวกับวัฒนธรรมปัจเจกนิยม (Individualism) มีดังนี้ 1. ให้ความสำคัญกับความต้องการของตนเองมากกว่าความต้องการของผู้อื่นและสังคม 2. ให้ความสำคัญกับเป้าหมายส่วนบุคคลเป็นอันดับแรก 3. ยึดถือระบบความคิดส่วนบุคคลและความสำเร็จส่วนบุคคลเป็นที่ตั้ง 4. ชื่นชมการพึ่งพาตนเอง (Self – reliance) และความเป็นอิสระ 5. แนวคิดเกี่ยวกับ “พวกเขา” และ “พวกเรา” มีอิทธิพลน้อยกว่ากลุ่มนิยม 6. มีแนวโน้มที่จะตัดสินผู้อื่นตามระบบความคิดส่วนบุคคลของตน 7. มักมีการอนุมานสาเหตุภายใน (Internal Attribution) คือ วิธีการคิดที่กำหนดสาเหตุของพฤติกรรมว่าเกิดจาก คุณลักษณะภายในของบุคคล เช่น บุคลิกภาพ นิสัย อารมณ์ เป็นต้น"},{"n":113,"q":"ข้อใดไม่ใช่ลักษณะค่านิยมตามวัฒนธรรมปัจเจกนิยม","o":["ชื่นชมการพึ่งพาตนเอง","วิถีการปฏิบัติจะยึดโยงกับตนเอง","พิจารณามุมมองของผู้อื่นก่อนลงมือทำ","แสดงออกถึงความเป็นตัวเอง"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 112. ประกอบ"},{"n":114,"q":"ข้อใดบ่งบอกถึงลักษณะของการอนุมานสาเหตุภายใน","o":["การยอมรับความผิดพลาดในการทำงานที่เกิดจากความไม่พร้อมของตนเอง","สภาพอากาศเป็นส่วนสำคัญที่ทำให้การทำงานไม่สำเร็จ","เพื่อนร่วมงานไม่ให้ความร่วมมือและตั้งใจ จึงทำให้งานไม่สำเร็จ","การผิดพลาดระหว่างการทำงาน เป็นเรื่องของโชคชะตาที่ลี่"],"a":1,"e":"การอนุมานสาเหตุภายใน (Internal Attribution) คือการอธิบายสาเหตุของพฤติกรรมหรือผลลัพธ์ว่าเกิดจากปัจจัย ภายในตัวบุคคล เช่น ความสามารถ ความพยายาม หรือความพร้อมของตนเอง ซึ่งตรงกับข้อ 1. ที่ยอมรับว่าความ ผิดพลาดเกิดจากตนเองส่วนข้ออื่นเป็นการอนุมานสาเหตุภายนอก (External Attribution) เช่น โชคชะตา ผู้อื่น หรือ สภาพแวดล้อม"},{"n":115,"q":"ข้อใดกล่าวถึงลักษณะของวัฒนธรรมได้ถูกต้อง","o":["มีความคงที่ตลอดเวลา","มีการเปลี่ยนแปลงไปตามกาลเวลา","ไม่ได้รับผลกระทบจากการเปลี่ยน","มีความยึดมั่นในประเพณีที่ไม่เปลี่ยนแปลง"],"a":2,"e":"วัฒนธรรม เป็นสิ่งที่มนุษย์สร้างขึ้นและถ่ายทอดจากรุ่นสู่รุ่น แต่ไม่ได้หยุดนิ่ง หากมีการปรับตัวและเปลี่ยนแปลง ตามสภาพสังคม เศรษฐกิจ เทคโนโลยี และกาลเวลา ตัวเลือกอื่นมองว่าวัฒนธรรมคงที่หรือไม่เปลี่ยนแปลง ซึ่งไม่ สอดคล้องกับความเป็นจริงของวัฒนธรรม"},{"n":116,"q":"การปรับตัวของบุคคลให้เข้ากับความแตกต่างทางวัฒนธรรม จะส่งผลให้เกิดอย่างไร","o":["ทำให้บุคคลกลายเป็นชนกลุ่มน้อย","ทำให้บุคคลมีความยากลำบากในการเข้าใจตนเอง","ทำให้บุคคลแสดงออกถึงตัวตนได้ชัดเจนยิ่งขึ้น","ทำให้บุคคลสามารถปรับตัวเข้ากับความเปลี่ยนแปลงได้"],"a":4,"e":"การปรับตัวให้เข้ากับความแตกต่างทางวัฒนธรรม ช่วยให้บุคคลเรียนรู้ เข้าใจ และยอมรับความหลากหลาย ส่งผล ให้มีความยืดหยุ่นทางความคิดและพฤติกรรม สามารถอยู่ร่วมกับผู้อื่นในสังคมที่เปลี่ยนแปลงได้อย่างเหมาะสม ซึ่งตรง กับข้อ 4 มากที่สุด"},{"n":117,"q":"คำว่า \"ความเข้าอกเข้าใจผู้อื่น\" ตรงกับลักษณะของความคิดแบบใด","o":["แบบปัจเจกนิยม","แบบกลุ่มนิยม","แบบทุนนิยม","แบบเสรีนิยม"],"a":2,"e":"“ความเข้าอกเข้าใจผู้อื่น (Empathy)” เป็นลักษณะของความคิดที่ให้ความสำคัญกับผู้อื่นความสัมพันธ์ และการอยู่ ร่วมกันของสังคมโดยรวม ซึ่งสอดคล้องกับ แนวคิดแบบกลุ่มนิยม (Collectivism) ที่เน้นประโยชน์ส่วนรวม ความ ร่วมมือ และความรู้สึกร่วมกันของสมาชิกในกลุ่ม มากกว่าการยึดตัวบุคคลเป็นศูนย์กลาง"},{"n":118,"q":"ข้อใดไม่ใช่อิทธิพลของการให้ความหมายร่วมกันในวัฒนธรรมที่บุคคลนั้น ๆ สังกัดอยู่","o":["บ้านเกิด","เชื้อชาติ","ความเป็นพลเมือง","ลักษณะเฉพาะตัวบุคคล"],"a":4,"e":"การให้ความหมายร่วมกันในวัฒนธรรม (Shared Meaning) เกิดจากกรอบทางสังคมและวัฒนธรรมที่บุคคลสังกัด อยู่ เช่น เชื้อชาติ บ้านเกิด หรือความเป็นพลเมือง ซึ่งหล่อหลอมค่านิยม ความเชื่อ และการตีความร่วมกันในสังคม ส่วน ข้อ 4 ลักษณะเฉพาะตัวบุคคล เป็นปัจจัยส่วนบุคคล ไม่ใช่ความหมาย “ร่วมกัน” ทางวัฒนธรรม"},{"n":119,"q":"เมื่อบุคคลอยู่ในสภาพวัฒนธรรมที่ไม่คุ้นเคย อาจส่งให้เกิดลักษณะในข้อใดเป็นเบื้องต้น","o":["การปรับความคิดมองโลกแง่ดี","มีการเห็นคุณค่าในตนเองสูงขึ้น","ความสับสน คับข้องใจ","การเลือกสร้างวิถีชีวิตที่เป็นสุข"],"a":3,"e":"เมื่อบุคคลเข้าไปอยู่ในวัฒนธรรมที่ไม่คุ้นเคย มักเกิดภาวะที่เรียกอาการปรับตัวไม่ทันทางวัฒนธรรม (Culture Shock) ในระยะเริ่มต้น ซึ่งแสดงออกเป็นความสับสน ความไม่สบายใจ ความคับข้องใจ หรือความวิตกกังวล ก่อนที่จะ ค่อย ๆ เรียนรู้และปรับตัวได้ในระยะต่อมา"},{"n":120,"q":"ข้อใดไม่ใช่การสื่อสารแบบวัจนภาษาในสังคม","o":["การแสดงออกท่าที อารมณ์","การสื่อสารด้วยเหตุและผล","การเจรจาต่อรองระหว่างกัน","การเล่าเรื่องอธิบายความรู้สึก"],"a":1,"e":"วัจนภาษา (Verbal Communication) คือ การสื่อสารที่ใช้ \"ถ้อยคำ\" ไม่ว่าจะอยู่ในรูปแบบของ ภาษาพูด (การ เปล่งเสียงออกมาเป็นคำ) หรือ ภาษาเขียน (ตัวอักษร ตัวเลข หรือสัญลักษณ์ทางภาษาที่มีระบบ) เพื่อถ่ายทอดความคิด เหตุผล หรือความรู้สึก ข้อ 1. การแสดงออกท่าที อารมณ์ จัดเป็น \"อวัจนภาษา\" (Non-verbal) อย่างเด่นชัด เนื่องจากเป็นการใช้สีหน้า แววตา กิริยาอาการ และท่าทางทางกายภาพในการสื่อความหมายแทนคำพูด"}]},{"title":"ภาค S ปีการศึกษา 2567","items":[{"n":1,"q":"ข้อใดไม่ถูกต้องเกี่ยวกับความหมายของบุคลิกภาพตามมุมมองจิตวิทยา","o":["บุคลิกภาพเป็นคุณลักษณะที่ปรากฏแก่สังคมภายนอกเท่านั้น","บุคลิกภาพมีลักษณะซับซ้อน ได้รับอิทธิพลทั้งปัจจัยทางพันธุกรรมและปัจจัยจากสิ่งแวดล้อม","บุคลิกภาพเป็นคุณลักษณะที่ค่อนข้างติดตัว คงที่ เปลี่ยนแปลงยาก","บุคลิกภาพของแต่ละบุคคลเป็นคุณลักษณะที่เป็นเอกลักษณ์เฉพาะตัวของบุคคลนั้น ๆ"],"a":1,"e":"ความหมายใหม่ของบุคลิกภาพตามมุมมองจิตวิทยา หมายถึง แบบแผนความคิด อารมณ์ พฤติกรรมที่มีความเป็น เอกลักษณ์ เป็นลักษณะเฉพาะตัว มีความคงที่ และ ค่อนข้างเปลี่ยนแปลงยาก โดยได้รับอิทธิพลจากหลายส่วน ได้แก่ พันธุกรรม การเจริญเติบโต วุฒิภาวะ การเรียนรู้ สิ่งแวดล้อม และวัฒนธรรม"},{"n":2,"q":"พนักงานออฟฟิศท่านหนึ่งมีลักษณะตื่นกังวลและเครียดง่าย มักมีอารมณ์ที่ละเอียดอ่อนกับทุกเรื่อง","o":["บุคลิกภาพแบบมีมโนสำนึก","บุคลิกภาพแบบประนีประนอม","บุคลิกภาพเก็บตัว","บุคลิกภาพแบบหวั่นไหว"],"a":4,"e":"Costa & McCrae, 1987 ได้แบ่งประเภทบุคลิกภาพไว้ ดังนี้ 1. บุคลิกภาพแบบแสดงตัว คือ ชอบเข้าสังคม สัมพันธภาพกับผู้อื่นดดี 2. บุคลิกภาพแบบประนีประนอม คือ จิตใจดี ยืดหยุ่น รับฟัง ร่วมมือ 3. บุคลิกภาพแบบมีมโนสำนึก คือ รับผิดชอบ มีหลักการ มุ่งสำเร็จ 4. บุคลิกภาพแบบหวั่นไหว คือ ไม่มั่นคงในอารมณ์ เครียดหรือวิตกกังวลเกินไป 5. บุคลิกภาพแบบเปิดกว้าง คือ เปิดกว้าง ช่างคิด สร้างสรรค์"},{"n":3,"q":"บุคคลที่มีลักษณะรักสันโดษชอบทำงานสร้างสรรค์ของตนเองที่บ้านมากกว่าพบปะคนอื่น ๆ ข้างนอก","o":["บุคลิกภาพแบบมีมโนสำนึก","บุคลิกภาพแบบประนีประนอม","บุคลิกภาพเก็บตัว","บุคลิกภาพแบบหวั่นไหว"],"a":3,"e":"บุคลิกภาพที่ผิดปกติแบ่งออกเป็น 5 ชนิด ได้แก่ 1. เก็บตัว คือ ไม่ชอบเข้าสังคม มักหลีกเลี่ยงการเข้าสังคม 2. หวาดระแวง คือ สงสัยในการกระทำของบุคคลอื่น 3. ต่อต้านสังคม คือ ไม่รู้สึกผิด ไม่มีความรับผิดชอบ ไม่ทำตามกฎเกณฑ์สังคม 4. แบบถ ้ากึ่ง คือ อารมณ์ไม่มั่นคง เปลี่ยนแปลงง่าย หุนหันพลันแล่น มีอารมณ์โกรธที่รุนแรง 5. แบบพึ่งพิง คือ ขาดความมั่นใจในตนเอง ไม่กล้าตัดสินใจ กลัวการอยู่คนเดียว ไม่กล้าปฏิเสธ"},{"n":4,"q":"ตามแนวคิดจิตวิเคราะห์ โครงสร้างของจิตส่วนใดเปรียบเหมือนภูเขาน ้าแข็งใต้น ้า ทำให้บุคคลแสดง พฤติกรรมแบบไม่รู้ตัว","o":["จิตภวังค์","จิตกึ่งสำนึก","จิตใต้สำนึก","จิตสำนึก"],"a":3,"e":"ทฤษฎีจิตวิเคราะห์ (Psychoanalytic Theory) ของซิกมันด์ ฟรอยด์ (Sigmund Freud) ได้กล่าวถึง วิธีการ จัดระบบของบุคลิกภาพว่าขึ้นอยู่กับระดับของการรู้ตัว ซึ่งระดับการรู้ตัวของบุคคลระดับที่ 3 จิตใต้สำนึก (Unconscious) คือ โครงสร้างของจิตที่อยู่ลึกที่สุด ซึ่งเปรียบเหมือนภูเขาน ้าแข็งใต้น ้า ทำให้บุคคลแสดงพฤติกรรมแบบไม่รู้ตัว เป็น แหล่งสะสมแรงขับ ความปรารถนาที่ซ่อนเร้น สัญชาตญาณทางเพศและความก้าวร้าว"},{"n":5,"q":"ตามแนวคิดจิตวิเคราะห์ โครงสร้างบุคลิกภาพแบบใดเป็นการแสดงแบบแผนพฤติกรรมเพื่อ ตอบสนองหลักความจริง","o":["ID","Ego","Superego","Under Ego"],"a":2,"e":"ตามแนวคิดจิตวิเคราะห์ของซิกมันด์ ฟรอยด์ แบ่งโครงสร้างบุคลิกภาพออกเป็น 3 ส่วน ได้แก่ 1. อิด (Id) คือ หลักความพอใจ เป็นความต้องการพื้นฐานที่ทำงานตามความพึงพอใจ 2. อีโก้ (Ego) คือ หลักความจริง เป็นกฎเกณฑ์ทางสังคมที่ควบคุมความต้องการ 3. ซุปเปอร์อีโก้ (Superego) คือ หลักศีลธรรม ประกอบด้วย มโนธรรม ศีลธรรม และขนบธรรมเนียม"},{"n":6,"q":"จากรูปพีระมิดที่แสดงลำดับขั้นความต้องการของมาสโลว์ ขั้นที่อยู่ในหมายเลข 3 เป็นขั้นของความ ต้องการในด้านใด","o":["ความต้องการทางร่างกาย","ความต้องการเข้าใจตนเองอย่างแท้จริง","ความต้องการความรักและเป็นเจ้าของ","ความต้องการความปลอดภัย"],"a":3,"e":"ตามแนวคิดมนุษยนิยม มาสโลว์ (Abraham Maslow) อธิบายว่าพฤติกรรมเป็นผลมาจากแรงจูงใจของบุคคลที่ต้อง การตอบสนองความต้องการพื้นฐานตามลำดับขั้น ซึ่งทฤษฎีลำดับขั้นความต้องการของมาสโลว์แบ่งออกเป็น 5 ชั้น ได้แก่ 1. ความต้องการด้านร่างกาย 2. ความต้องการความปลอดภัย 3. ความต้องการความรักและเป็นเจ้าของ 4. ความต้องการความภาคภูมิใจ 5. ความต้องการที่จะเข้าใจตนเองอย่างแท้จริง"},{"n":7,"q":"ข้อใดถูกต้องเกี่ยวกับโครงสร้างบุคลิกภาพตามแนวคิดตัวตนของโรเจอร์ส","o":["มนุษย์มีจิตใต้สำนึกที่เป็นแหล่งสะสมแรงปรารถนาที่ซ่อนเร้น","เด็กที่พ่อแม่ผู้ปกครองเลี้ยงดูด้วยความรักเอาใจใส่ ยอมรับอย่างไม่มีเงื่อนไข จะพัฒนาตัวตนตาม ความเป็นจริง (Real Self) และตัวตนตามอุดมคติ (Ideal Self) ได้อย่างกลมกลื่นกัน","ตัวตนตามความเป็นจริง (Real Self) และตัวตนตามอุดมคติ (Ideal Self) ไม่ได้มีส่วนในการ พัฒนา บุคลิกภาพของบุคคล","ผู้ที่มีตัวตนตามความเป็นจริง (Real Self) และตัวตนตามอุดมคติ (Ideal Self) ที่กลมกลืนกัน มัก เป็นผู้มีปัญหาทางจิตใจ"],"a":2,"e":"ความเป็นจริง (Real Self) และตัวตนตามอุดมคติ (Ideal Self) ได้อย่างกลมกลื่นกัน บรรยายเพิ่มเติม ตามแนวคิดมนุษยนิยมนั้น โครงสร้างบุคลิกภาพตามทฤษฎีตัวตน (Self Theory) ของคาร์ล โรเจอร์ส (Carl Rogers) มีลักษณะสำคัญดังนี้ 1. มนุษย์ทุกคนมีตัวตนอยู่ 3 แบบ ได้แก่ ตัวตนที่ตนมองเห็น (Self Concept) ตัวตนตามความเป็นจริง (Real Self) และ ตัวตนตามอุดมคติ (Ideal Self) 2. ตัวตนตามความเป็นจริง (Real Self) และตัวตนตามอุดมคติ (Ideal Self) มีส่วนในการ พัฒนาบุคลิกภาพของบุคคล 3. เด็กที่พ่อแม่ผู้ปกครองเลี้ยงดูด้วยความรักเอาใจใส่ ยอมรับอย่างไม่มีเงื่อนไข จะพัฒนาตัวตนตามความเป็นจริง (Real Self) และตัวตนตามอุดมคติ (Ideal Self) ได้อย่างกลมกลืนกัน 4. ผู้ที่มีตัวตนตามความเป็นจริง (Real Self) และตัวตนตามอุดมคติ (Ideal Self) กลมกลืนกัน มักเป็นผู้ที่ไม่มีปัญหา ทางจิตใจ ฯลฯ"},{"n":8,"q":"ข้อใดไม่ใช่ความสำคัญของการพัฒนาบุคลิกภาพในทางจิตวิทยา","o":["บุคลิกภาพกำหนดบรรยากาศการทำงานในองค์กร","ทำให้เป็นผู้มีสุขภาพจิตดี","ทำให้สามารถทำงานได้ โดยไม่เกิดความขัดแย้งภายในจิตใจ","ทำให้สามารถกลบเกลื่อนตัวตนที่แท้จริง เมื่อต้องแสดงออกต่อหน้าผู้อื่น"],"a":4,"e":"ความสำคัญของการพัฒนาบุคลิกภาพในทางจิตวิทยา มีดังนี้ 1. ทำให้เกิดการพัฒนาตนเอง เพราะรู้จักและเข้าใจตนเอง 2. ทำให้เกิดความมั่นใจในตนเอง รู้สึกดีต่อตนเอง 3. ทำให้เกิดความมั่นคงทางอารมณ์และจิตใจ มีสุขภาพจิตดี ควบคุมอารมณ์ได้อย่างเหมาะสม 4. ทำให้สามารถทำงานได้ โดยไม่เกิดความขัดแย้งภายในจิตใจ และมีโอกาสทำงานนั้นได้ดี 5. มีแรงจูงใจในการทำงาน 6. บุคลิกภาพกำหนดบรรยากาศการทำงาน และการทำงานร่วมกับผู้อื่น ฯลฯ"},{"n":9,"q":"ข้อใดเป็นลักษณะของบุคลิกภาพภายนอกที่ดี","o":["แต่งกายตามแฟชั่นตลอดเวลา","มีสีหน้าบึ้งตึงเพื่อให้ผู้อื่นหวั่นเกรง","พูดด้วยเสียงดังเพื่อดึงดูดความสนใจ","เดินโน้มตัวเมื่อผ่านหน้าผู้อื่น"],"a":4,"e":"แนวทางการพัฒนาบุคลิกภาพภายนอก มีดังนี้ 1. รูปร่างหน้าตา คือ ฝึกให้เป็นคนอารมณ์ดี มีใบหน้ายิ้มแย้มแจ่มใส ฯลฯ 2. การแต่งกาย คือ เลือกสวมใส่เสื้อผ้าเหมาะสมกับอายุหรือวัย กาลเทศะ เลือกเสื้อผ้า ที่พรางจุดด้อยและเสริมจุดเด่น ใช้เครื่องประดับ กระเป๋า รองเท้าที่เหมาะสม ฯลฯ 3. กิริยาท่าทาง คือ ฝึกฝนให้เป็นผู้มีกิริยาท่าทางที่สุภาพ ถูกต้องตามกาลเทศะ การพูดหรือใช้ภาษาให้ถูกต้อง มี น ้าเสียงนุ่มนวลจริงใจ มองผู้อื่นด้วยสายตาเป็นมิตร ยืน/นั่งอย่างงามสง่า เดินโน้มตัวเมื่อผ่านหน้าผู้อื่น ฯลฯ 4. สุขภาพอนามัย คือ รักษาสุขภาพร่างกายให้แข็งแรง รับประทานอาหาร ดื่มน ้า และ พักผ่อนให้เพียงพอกับวัย ออก กำลังกายเป็นประจำ ฯลฯ"},{"n":10,"q":"ข้อใดไม่ใช่วิธีการพัฒนาบุคลิกภาพภายในที่ดี","o":["มองโลกในแง่ดี","การรับมือกับความล้มเหลว โดยการโทษผู้อื่น","นำหลักคุณธรรมปรับใช้ในการอยู่ร่วมกัน","จัดการกับความรู้สึกของตนเองได้"],"a":2,"e":"แนวทางการพัฒนาบุคลิกภาพภายใน มีดังนี้ 1. จิตใจ คือ ฝึกให้มีความเชื่อมั่นในตนเอง เข้าใจและยอมรับจุดเด่นจุดด้อยของตนเองแก้ไขจุดด้อย พัฒนาจุดเด่น เป็น ผู้มีเมตตา รู้จักให้อภัย มองโลกในแง่ดี ฯลฯ 2. สติปัญญา คือ ฝึกฝนตนให้มีความรอบรู้ เป็นผู้เรียนรู้ตลอดชีวิต เรียนรู้สิ่งใหม่ ค้นหาความสามารถด้านอื่น ๆ หมั่น แสวงหาประสบการณ์ใหม่ ฯลฯ 3. อารมณ์ คือ รู้จักมารยาทและกาลเทศะ ปฏิบัติต่อผู้อื่นด้วยความสุภาพ ควบคุมอารมณ์ไม่ให้หงุดหงิดหรือโกรธง่าย หรือสามารถจัดการกับความรู้สึกของตนเองได้ ฝึกให้เป็นคนยิ้มแย้มแจ่มใส มีอารมณ์ขัน ฯลฯ 4. สังคม คือ นำหลักคุณธรรมจริยธรรมปรับใช้ในการอยู่ร่วมกัน เช่น เมตตากรุณา มีน ้าใจ ต่อเพื่อนมนุษย์ มิจิต สาธารณะ เคารพความคิดเห็นของผู้อื่น สามารถเข้ากับผู้อื่นได้ ฯลฯ"},{"n":11,"q":"วิธีการใดเป็นวิธีการที่มีความเป็นมาตรฐานสูง ส่วนใหญ่ดำเนินการโดยผู้เชี่ยวชาญหรือนักวิชาชีพ","o":["การสังเกต","การสัมภาษณ์","การใช้แบบสอบถาม","การใช้แบบทดสอบ"],"a":4,"e":"การใช้แบบทดสอบทางจิตวิทยา เป็นวิธีการที่ได้รับความนิยมโดยเฉพาะบทบาทวิชาชีพที่เกี่ยวข้องกับการประเมิน ทางจิตวิทยา เช่น นักจิตวิทยา หรือนักจิตวิทยาคลินิกฯลฯ เพราะคุณสมบัติและลักษณะของแบบทดสอบที่มีความเป็น มาตรฐาน กระบวนการทดสอบและแปลผลที่ชัดเจน และมีการศึกษาถึงคุณภาพของเครื่องมือที่น่าเชื่อถือ จึงได้รับการ ยอมรับเป็นวงกว้าง แต่ไม่ไช่เครื่องมือสำหรับบุคคลทั่วไป ส่วนใหญ่จะดำเนินการโดยผู้เชี่ยวชาญหรือนักวิชาชีพ ซึ
