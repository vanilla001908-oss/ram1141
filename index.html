่ชอบเข้าสังคม มักหลีกเลี่ยงการเข้าสังคม 2. หวาดระแวง คือ สงสัยในการกระทำของบุคคลอื่น 3. ต่อห้านสังคม คือ ไม่รู้สึกผิด ไม่มีความรับผิดชอบ ไม่ทำตามกฎเกณฑ์สังคม 4. แบบก ้ากึ่ง คือ อารมณ์ไม่มั่นคง เปลี่ยนแปลงง่าย หุนทันพลันแล่น มีอารมณ์โกรธที่รุนแรง 5. แบบพึ่งพิง คือ ขาดความมั่นใจในตนเอง ไม่กล้าตัดสินใจ กลัวการอยู่คนเดียว ไม่กล้าปฏิเสธ"},{"n":30,"q":"การเสริมสร้างสุขภาพจิตด้วยตนเองไม่สามารถกระทำได้ด้วยวิธีใด","o":["ออกกำลังกาย","ขอความช่วยเหลือจากจิตแพทย์","ตั้งเป้าหมายที่เป็นจริงไม่ได้","เป็นจิตอาสา"],"a":3,"e":"บุคคลสามารถ์ดูแลสุขภาพจิตของตนเองได้ ดังนี้ 1. การให้คุณค่าตนเอง 2. ดูแลสุขภาพร่างกาย 3. การเป็นจิตอาสา 4. การเรียนรู้วิธีที่จะจัดการกับความเครียดอย่างถูกวิธี 5. การผ่อนคลายจิตใจด้วยการออกกำลังกาย 6. การตั้งเป้าหมายที่เป็นไปได้ตามความเป็นจริง 7. ปรับเปลี่ยนรูปแบบการดำเนินชีวิตประจำวันเพื่อลดความน่าเบื่อหน่าย 8. หาทั่วช่วย เช่น ขอความช่วยเหลือจากเพื่อน ครอบครัว จิตแพทย์ ฯลฯ"},{"n":31,"q":"ข้อใดกล่าวถึงเจตคติต่อตนเองถูกต้องที่สุด","o":["ได้รับอิทธิพลมาจากพันธุกรรมมากกว่าสิ่งแวดล้อม","เป็นผลมาจากการตรวจสอบและการรับรู้ในด้านสังคม","เป็นแบบแผนที่บุคคลได้พิจารณาและจัดระบบความรู้สึกในตนเอง","เป็นแนวโน้มที่ทำให้บุคคลแสดงพฤติกรรมต่อผู้อื่น"],"a":3,"e":"แนวคิดเกี่ยวกับเจตคติต่อตนเอง มีดังนี้ 1. เป็นแบบแผนที่บุคคลได้พิจารณาจัดระบบความรู้สึกนึกคิดในตนเอง 2. เป็นผลมาจากการตรวจสอบและการรับรู้ในด้านค่านิยม และความเชื่อที่มีต่อสิ่งใดสิ่งหนึ่ง ทั้งทางบวกและทางลบ 3. เป็นสิ่งสำคัญที่ทำให้บุคคลแสดงพฤติกรรมต่อสิ่งต่าง ๆ ออกมาในทิศทางใดทิศทางหนึ่ง 4. เจตคติไม่ใช่สิ่งที่มิมาแต่กำเนิด แต่เกิดจากการเรียนรู้ ประสบการณ์ การอบรมเลี้ยงดูดังนั้นเจตคติจึงมีอิทธิพลมาจาก สิ่งแวดล้อมมากกว่าพันธุกรรม ฯลฯ"},{"n":32,"q":"ข้อใดไม่ใช่ความสำคัญของเจตคติต่อตนเอง","o":["เป็นกลไกในการป้องกันตนเอง","ช่วยให้จัดการปัญหาทางความสัมพันธ์ได้ดี","ช่วยให้แสดงออกทางด้านพฤติกรรมต่าง ๆ เพื่อไปถึงจุดมุ่งหมาย","ทำให้สามารถปรับตัว"],"a":2,"e":"หน้าที่ของเจตคติต่อตนเองตามทฤษฎีเครื่องล่อใจ (Incentive Theories) 1. เจตคติเป็นเครื่องมือทำให้บุคคลไปถึงจุดมุ่งหมาย และช่วยในการปรับตัว 2. เจตคติช่วยป้องกันตนเองได้ 3. เจตคติช่วยให้แสดงออกทางด้านพฤติกรรมต่าง ๆ 4. เจตคติช่วยทำให้เกิดความรู้"},{"n":33,"q":"\"ลักษณะตัวตนที่เป็นไปตามข้อเท็จจริง และบ่อยครั้งที่ตนเองมักมองไม่เห็นข้อเท็จจริงของตน\" เป็น ตัวตนในแบบใดตามทฤษฎี \"ตัวตน\" (Self Theory) ของโรเจอร์ส (Carl Rogers)","o":["Self – Esteem","Self Concept","Real Self","Ideal Self"],"a":3,"e":"ทฤษฎี \"ตัวตน\" (Self Theory) ของคาร์ล โรเจอร์ส (Carl Rogers) เชื่อว่ามนุษย์ ทุกคนมีตัวตน 3 แบบ ได้แก่ 1. ตัวทนที่ตนมองเห็น (Self Concept) คือ ภาพที่ตนเห็นเองว่า ตนเป็นอย่างไร มีความรู้ \"ความสามารถ ลักษณะเฉพาะตนอย่างไร เช่น สวย รวย เก่ง ขี้อาย ช่างพูด เก็บตัว เงียบ ต ่าต้อย เป็นต้น ซึ่งการมองเห็นอาจจะไม่ตรงกับ ข้อเท็จจริงหรือภาพที่คนอื่นเห็น 2. ตัวตนตามที่เป็นจริง (Real Self) คือ ตัวตนตามข้อเท็จจริง แต่บ่อยครั้งที่ตนมองไม่เห็น ข้อเท็จจริง เพราะอาจเป็น สิ่งที่ทำให้รู้สึกเสียใจ ไม่เท่าเทียมกับบุคคลอื่น 3. ตัวทนตามอุดมคติ (Ideal Self) คือ ตัวตนที่อยากมีอยากเป็น แต่ยังไม่มีไม่เป็นในสภาวะ ปัจจุบัน เช่น ชอบเก็บตัว แต่อยากเข้าสังคมเก่ง เป็นต้น"},{"n":34,"q":"ข้อใดเป็นลักษณะของบุคคลตามการรับรู้ตนเอง","o":["บุคคลที่มองเห็นตนเองตรงกับตัวตนตามความเป็นจริง จะมีความคาดหวังในตนเองสูง","บุคคลที่มองเห็นตนเองสูงกว่าความเป็นจริง เมื่อไม่สมหวังมักโทษบุคคลอื่น","บุคคลที่มองตนเองต ่ากว่าความเป็นจริง มักกระตือรือร้นเมื่อต้องทำสิ่งต่าง ๆ","บุคคลที่มองตนเองตรงตามความเป็นจริง มักยอมรับความผิดพลาดไม่ได้"],"a":2,"e":"ลักษณะของบุคคลตามการรับรู้ตนเองที่ถูกต้อง คือ หากบุคคลมองเห็นตนเอง สูงกว่าตัวตนที่แท้จริง ย่อมไม่เห็น ข้อบกพร่องของตน ทำให้ไม่มีโอกาสปรับปรุงตนเองให้ดีขึ้นและมีแนวโน้มที่จะมองตนในอุดมคติอย่างเพ้อฝัน ดังนั้น เมื่อพบกับความผิดหวังบ่อยๆ ก็มักกล่าวโทษว่าบุคคลหรือสถานการณ์ต่าง ๆ เป็นต้นเหตุของความล้มเหลว"},{"n":35,"q":"\"นักศึกษาที่มีเจตคติลบต่อการพูดเสนอหน้าชั้นเรียน เพราะเคยมีประสบการณ์ไม่ดี โดนล้อ\" น่าจะมี สาเหตุมาจากการวางเงื่อนไขในรูปแบบใด","o":["การวางเงื่อนไขแบบคลาสสิก","การเลียนแบบ","การวางเงื่อนไขจากการกระทำ","การเสริมแรงทางลบ"],"a":1,"e":"เจตคติที่เกิดจากการเรียนรู้โดยการวางเงื่อนไขคลาสสิก (Classical Conditioning) หรือการตอบสนองที่ถูกกระตุ้น โดยสิ่งเร้าที่ปรากฏชัดเจนในสถานการณ์การเรียนรู้ ซึ่งนักจิตวิทยาที่สำคัญในทฤษฎีนี้ คือ พาฟลอฟ (Pavlov) เชื่อว่า การ เรียนรู้ของสิ่งที่มีชีวิตเกิดจากการวางเงื่อนไข (Conditioning) กล่าวคือ การตอบสนองหรือการเรียนรู้ที่เกิดขึ้น ต่อสิ่งเร้า นั้น ๆ ต้องมีเงื่อนไขหรือมีการสร้างสถานการณ์ให้เกิดขึ้นที่เป็นผลของการเรียนรู้ เช่น นักศึกษาที่มีเจตคติลบต่อการพูด เสนอหน้าชั้นเรียน อาจเกิดจากการที่เคยมีประสบการณ์ไม่ดีโดนล้อ ตำหนิ จนทำให้รู้สึกเสียความมั่นใจ ซึ่งความรู้สึกไม่ มั่นใจนั้นได้ถูกนำมาใช้ควบคู่ไปกับการพูดต่อหน้าสาธารณะ เป็นต้น"},{"n":36,"q":"บุคคลใดเปลี่ยนเจตคติโดยการโน้มน้าวใจตนเอง (Self - persuasion)","o":["เอบอกเพื่อนว่า ตนจะตั้งใจเรียนทุกวัน","บีซื้อของขวัญ:หัตนเองเมื่อสอบผ่าน","ซีชื่นชมเพื่อนที่มาเรียนทันเวลา","ดีบอกตนเองทุกวันว่า จะอ่านหนังสือวันละ 10 หน้า"],"a":4,"e":"การเปลี่ยนเจตคติโดยการโน้มน้าวใจตนเอง (Self - persuasion) คือ การเปิดโอกาสให้พูดหรือแสดงออกไปใน ทิศทางที่พึงประสงค์ด้วยการคิดหาเหตุผลประกอบด้วยตนเอง (แม้ว่าอาจจะไม่เห็นด้วยกับสิ่งนั้นก็ตาม) จะสามารถ เปลี่ยนแปลงเจตคติไปในทิศทางที่พึงประสงค์ได้โดยบุคคลสามารถเปลี่ยนเจตคติตนเองด้วยการพูดกับตนเองเสมอ ๆ กระบวนการรำพึงรำพันใคร่ครวญบ่อย ๆ เช่น ดีบอกตนเองทุกวันว่า จะอ่านหนังสือวันละ 10 หน้า เป็นต้น"},{"n":37,"q":"ข้อใดกล่าวถึงการเกิดเจตคติที่มีต่อตนเอง ตามทฤษฎีการวางเงื่อนไขด้วยวิธีการให้แรงเสริม (Reinforcement) ได้อย่างถูกต้อง","o":["การชมที่ดีควรชมที่ความสำเร็จ","คำชมของผู้อื่นมีคุณค่ามากกว่าการชมตัวเอง","คำชมที่มีประสิทธิภาพต้องมีของรางวัล","ถ้าไม่มีคนชม เราสามารถชื่นชมตนเองได้"],"a":1,"e":"เจตคติที่เกิดจากการเรียนรู้โดยการวางเงื่อนไขจากการกระทำ (Operant Conditioning) หรือการวางเงื่อนไขแบบ ปฏิบัติการ พัฒนาขึ้นโดย สกินเนอร์ (Skinner) นักจิตวิทยาชาวอเมริกัน เชื่อว่า การเสริมแรง หรือการให้แรงเสริม ถือ เป็นปัจจัยสำคัญในการเปลี่ยนแปลงพฤติกรรมหรือการเรียนรู้ของบุคคล ได้แก่ 1. การเสริมแรงทางบวก คือ ให้สิ่งที่ผู้แสดงพฤติกรรมชอบหลังจากแสดงพฤติกรรมนั้น ๆ ออกมา (เพิ่มพฤติกรรม) เช่น การให้คำชมเมื่อทำสำเร็จ (การชมที่ดีควรชมที่ความสำเร็จ) 2. การเสริมแรงทางลบ คือ การยกเลิกหรือถอนในสิ่งที่ผู้แสดงพฤติกรรมไม่ชอบออกไปหลังจากได้แสดงพฤติกรรม (เพิ่มพฤติกรรม)"},{"n":38,"q":"\"อิงน ้ากอดตนเองและบอกตนเองว่า ไม่เป็นไร ๆ ความผิดพลาดเป็นบทเรียน\" อิงน ้ากำลังใช้วิธีการ ใดในการจัดการความรู้สึกที่มีต่อตนเอง","o":["ความกรุณาต่อตนเอง (Self - compassion)","การเสริมสร้างพลังอำนาจแห่งตน (Self - empowerment)","การโน้มน้าวใยตนเอง (Self - persuasion)","การรับรู้ตนเอง (Self - perception Theory)"],"a":1,"e":"ความกรุณาต่อตนเอง (Self - compassion) หมายถึงความสามารถของบุคคลในการให้ความรัก และมีความเห็นใจ ต่อตนเองเมื่อมีความทุกข์ซึ่งเทคนิคการฝึกเพิ่มทักษะความกรุณาต่อตนเอง ได้แก่ 1. การฝึกเมตตาตนเอง คือ รู้จักให้อภัยตนเอง ให้การช่วยเหลือ และเห็นอกเห็นใจ 2. ฝึกการยอมรับและเข้าใจการเป็นมนุษย์อย่างธรรมดาสามัญ คือ การเข้าใจว่ามนุษย์เกิดมา ต้องประสบพบเจอทั้ง ความสุขและความทุกข์ เป็นเรื่องธรรมดาที่ทุกคนบนโลกต้องประสบ 3. การฝึกสติและฝึกการปล่อยวาง คือ การที่บุคคลสามารถรับรู้ความคิดและอารมณ์ที่เกิดขึ้นโดยไม่คล้อยตามอารมณ์ หรือความคิดเหล่านั้น สามารถควบคุมอารมณ์และการแสดงออกให้เป็นปกติ ไม่หมกมุ่นหรือจมดิ่งไปกับอารมณ์ ความรู้สึกที่เกิดขึ้น"},{"n":39,"q":"บุคคลใดฝึกการยอมรับและเข้าใจการเป็นมนุษย์อย่างธรรมดาสามัญได้ถูกต้องเหมาะสมที่สุด","o":["ฟ้าคิดเสมอว่า เป็นพี่คนโตต้องเข้มแข็ง ไม่ร้องไห้","แดงคิดเสมอว่า ตนต้องเก่งให้ได้เท่ากับคนอื่น","เขียวคิดเสมอว่า การทำงานผิดพลาดไม่ได้","ชมพูร้องไห้ รู้สึกไม่ดีต่อตนเองที่ทำงานผิดพลาด"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 38. ประกอบ"},{"n":40,"q":"ข้อใดไม่ใช่ปัจจัยรายในที่ส่งผลต่อการเสริมสร้างพลังอำนาจในตนเองตามทฤษฎีของกิ๊บสัน (Gibson)","o":["การสนับสนุนทางสังคม","ประสบการณ์ส่วนบุคคล","ค่านิยม","ความเชื่อ"],"a":1,"e":"เจตคติที่ดีกับการเสริมสร้างพลังอำนาจแห่งตน มีปัจจัยที่เกี่ยวข้องดังนี้ 1. ปัจจัยภายในบุคคล (Interpersonal Factors) ได้แก่ ค่านิยม (Value), ความเชื่อ (Beliefs), เป้าหมายในชีวิต (Determine) และประสบการณ์ส่วนบุคคล (Experience) 2. ปัจจัยภายนอกบุคคล (Intrapersonal Factors) ได้แก่ การสนับสนุนทางสังคม, ปัจจัยด้าน สิ่งแวดล้อม, สัมพันธภาพ ระหว่างบุคคล และปัจจัยด้านบุคคล"},{"n":41,"q":"บุคคลใดต่อไปนี้มีเจตคติที่ดีต่อผู้อื่น","o":["นางสาวเอรู้สึกโกรธที่แฟนนอกใจ","นายบีไม่ชอบอาจารย์ เพราะอาจารย์ดุ","นายซีดีใจที่ตนเองสอบได้คะแนนมากกว่านายนกเอี้ยง","นายเอฟชอบทำงานกับนายเอ เพราะนายเอเป็นคนเก่งและรับผิดชอบ"],"a":4,"e":"อัลพอร์ท (Allport) ได้ให้ความหมายว่า เจตคติต่อผู้อื่นเป็นสภาวะความพร้อมทาง จิตใจ อันมาจากกระบวนการ ทางความคิดความเข้าใจ อารมณ์ความรู้สึกของบุคคลที่มีต่อผู้อื่นโดยอาศัยประสบการณ์และความพร้อมเป็นตัวกำหนด ทิศทางของพฤติกรรมบุคคลที่มีต่อผู้อื่น วัตถุ ลิงของ หรือสถานการณ์ต่าง ๆ ดังนั้นจึงสรุปได้ว่า เจตคติต่อผู้อื่น คือ ความคิดความเข้าใจอารมน์ความรู้สึก และแนวโน้มของพฤติกรรมของบุคคลที่มีต่อบุคคลอื่น แบ่งออกเป็น 1. ลักษณะที่เป็นทางบวก คือ เห็นด้วย พึงพอใจหรือชอบ 2. ลักษณะที่เป็นทางลบ คือ ความไม่เห็นด้วย ไม่ชอบ ไม่พึงพอใจ"},{"n":42,"q":"ข้อใดไม่ใช่องค์ประกอบที่สำคัญของเจตคติต่อผู้อื่น","o":["ด้านความรู้ ความเข้าใจ (Cognitive Component)","ด้านความรับผิดชอบ (Responsibility Component)","ด้านพฤติกรรม (Behavioral Component)","ด้านอารมณ์ ความรู้สึก (Affective Component)"],"a":2,"e":"องค์ประกอบที่สำคัญของเจตคติต่อผู้อื่นมีอยู่ 3 ประการ ดังนี้ 1. ด้านความรู้ ความเข้าใจ (Cognitive Component) 2. ด้านอารมณ์ ความรู้สึก (Affective Component) 3. ด้านพฤติกรรม (Behavioral Component)"},{"n":43,"q":"ข้อใดต่อไปนี้กล่าวถึงเจตคติในด้านบวกที่ชัดเจนที่สุด","o":["เป็นการกระทำที่ขัดแย้งต่อความคิด","เป็นการไม่แสดงออกถึงความคิดความรู้สึกใด ๆ","เป็นเจตคติที่แสดงออกในทางที่เห็นด้วยชื่นชม","เป็นความรู้สึกต่อสถานการณ์รอบตัวที่ไม่ชัดเจน"],"a":3,"e":"ประเภทของเจตคติที่มีต่อผู้อื่น แบ่งออกเป็น 1. เจตคติในทางบวก (Positive Attitude) คือ ความรู้สึกต่อผู้อื่น หรือสิ่งแวดล้อมในทางที่ดีหรือยอมรับ พึงพอใจหรือ ชอบ เห็นด้วยและชื่นชม 2. เจตคติในทางลบ (Negative Attitude) คือ ความรู้สึกหรือการแสดงออกต่อผู้อื่นหรือสิ่งแวดล้อมชิไม่พึงพอใจ ไม่ ชอบ ไม่ยอมรับ ไม่เห็นด้วย 3. การไม่แสดงออกทางเจตคติ (Passive Attitude) คือ การไม่มีความรู้สึกใด ๆ ต่อบุคคล"},{"n":44,"q":"ข้อใดกล่าวถูกต้องเกี่ยวกับความสำคัญของการมีเจตคติที่ดีต่อผู้อื่น","o":["ทำให้อยู่กับคนที่เรารู้สึกไม่ดีได้","ทำให้กล้าสะท้อนทุกพฤติกรรมของบุคคลอื่น","ทำให้เกิดการปรับตัว","ทำให้มีความกล้าหาญในทุกสถานการณ์"],"a":3,"e":"ความสำคัญของการมีเจตคติที่ดีต่อผู้อื่น ได้แก่ 1. ทำให้เกิดการปรับตัว (Adjustment) 2. เป็นกลไกสำคัญในการป้องกันตัว (Ego Defense) 3. เป็นการแสดงความหมายของค่านิยม (Value Expression) 4. เป็นตัวจัดระเบียบความรู้ (Knowledge)"},{"n":45,"q":"ปัจจัยใตต่อไปนี้เกี่ยวข้องต่อการเกิดและการเปลี่ยนแปลงเจตคติต่อผู้อื่นมากที่สุด","o":["ครอบครัว","พระ","บรรยากาศ","ครูแนะแนว"],"a":1,"e":"ปัจจัยที่มีอิทธิพลต่อการเกิดและการเปลี่ยนแปลงเจตคติที่มีต่อบุคคลอื่น มักจะ มีอิทธิพลมาจากสิ่งแวดล้อมรอบตัว บุคคล ได้แก่ 1. ครอบครัว 2. บุคคลรอบตัว 3. สื่อมวลชน 4. ประสบการณ์ทางตรงที่สอดคล้องกับเจตคติเดิม"},{"n":46,"q":"\"นายเอรู้สึกไม่ชอบนายบี เพราะนายบีหน้าตาคล้ายคนที่เคยกลั่นแกล้งตนตอนเด็ก\" ท่านคิดว่าน่าจะ มีสาเหตุมาจากสิ่งใจ","o":["การได้รับบาดแผลฝังใจ","ความเชื่อในเรื่องการย้อนคืน","ครอบครัว","ประสบการณ์ทางตรงที่สอดคล้องกับเจตคติเดิม"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 45. ประกอบ"},{"n":47,"q":"\"นางสาวสุดสวยรู้สึกดีต่อนายสุดหล่อ เพราะนายสุดหล่อมักช่วยเหลือสุดสวยบ่อย ๆ\" ท่านคิดว่า ที่สุดสวย รู้สึกดีต่อสุดหล่อนาจะมีสาเหตุมาจากสิ่งใด","o":["ประสบการณ์เฉพาะอย่างที่บุคคลพึงพอใจ","การได้รับการตอบสนอง","การติดต่อสื่อสารที่ชัดเจน","ความไว้วางใจ"],"a":1,"e":"สาเหตุสำคัญประการแรกที่ทำให้บุคคลเกิดเจตคติต่อสิ่งใดสิ่งหนึ่ง คือ ประสบการณ์เฉพาะอย่าง (Specific Experiences) คือ การมีประสบการณ์เฉพาะอย่างกับ สิ่งที่เกี่ยวข้องกับเจตคตินั้น เช่น ถ้าหากเรามีประสบการณ์ที่ดีในการ ติดต่อกับบุคคลหนึ่ง เราจะ มีความรู้สึกขอบบุคคลนั้น แต่ถ้ามีประสบการณ์ที่ไม่ดีก็จะมีความรู้สึกไม่ชอบบุคคลนั้น ฯลฯ"},{"n":48,"q":"ข้อใดไม่ใช่ขั้นตอนของการเปลี่ยนเจตคติต่อผู้อื่น","o":["การใส่ใจ","ความกล้าหาญ","การยอมรับ","ความเข้าใจ"],"a":2,"e":"ขั้นตอนของการเปลี่ยนเจตคติต่อผู้อื่นมี 4 ขั้นตอน คือ 1. การใส่ใจ (Attention) 2. ความเข้าใจ (Comprehension) 3. การยอมรับ (Acceptance) 4. ความคงอยู่ (Retention)"},{"n":49,"q":"การเปลี่ยนเจตคติจะเกิดขึ้นได้เร็วหรือช้า เกิดในทางที่ดีหรือไม่ ขึ้นอยู่กับปัจจัยใดเป็นสำคัญ","o":["ความชัดเจนในข้อมูลใหม่ที่สื่อสาร","การจูงใจ","สติปัญญา","ความมีส่วนร่วมระหว่างกัน"],"a":1,"e":"คาร์ล ฮอฟแลนด์ (Carl Hovland) นักจิตวิทยาแห่งมหาวิทยาลัยเยลที่สร้างทฤษฎีการเปลี่ยนเจตคติ (The Yale Attitude Approach) เชื่อว่า องค์ประกอบของเจตคติด้านอารมณ์ความรู้สึก (Affective Component) สามารถเปลี่ยนได้ โดยความคิดหรือความเชื่อ (Cognitive Component) ของบุคคลที่เกี่ยวข้องกับเรื่องนั้น ๆ ซึ่งหมายความว่า การเรียนรู้ข้อ มูลใหม่ผ่านการสื่อสารที่จูงใจหรือการโน้มน้าวใจ (Persuasive Communication) จะไปเปลี่ยนแปลงความเชื่อ และการ สื่อสารที่มีประสิทธิภาพจะทำให้ได้ข้อมูลใหม่ที่สนับสนุนให้เกิดความเชื่อที่เหมาะสมและมากพอต่อการเปลี่ยนเจตคติ"},{"n":50,"q":"บุคคลใดมีการพัฒนาเจตคติการทำงานร่วมกับผู้อื่นได้เหมาะสมที่สุด","o":["นายสุดหล่อ รวยแสดงความคิดเห็นและจัดการแก้งานให้คนอื่นแม้ไม่ใช่งานตน","น.ส.คนดี ชื่นรมผลงานเพื่อนแม้จะไม่ถูกต้องและตนไม่เห็นด้วยก็ตาม","น.ส.สุดสวย ยอมรับความแตกต่างและคอยให้กำลังใจเพื่อนร่วมงานเสมอ","นายสุดเท่ ชอบแสดงความสามารถให้ผู้อื่นชื่นชมเสมอ"],"a":3,"e":"การพัฒนาเจตคติการทำงานร่วมกับผู้อื่นประการหนึ่ง คือ การสร้างแรงจูงใจในการทำงานร่วมกัน หมายถึง การ ปฏิบัติงานให้บรรลุถึงเป้าหมายหรือผลสำเร็จที่ตั้งไว้นั้น ย่อมขาดไม่ได้ที่จะกล่าวถึงแรงจูงใจในการปฏิบัติงาน โดย เฉพาะแรงจูงใจในการทำงานเป็นทีม เป็นพลัง ที่มีอยู่ในตัวของบุคคลในทีม เป็นสิ่งเร้า แรงขับ แรงกระตุ้น ผ่านการ ตั้งเป้าหมายความสำเร็จ ร่วมกัน ซึ่งต้องอาศัยสัมพันธภาพที่ดี และความรู้สึกเป็นหนึ่งเดียวระหว่างกัน"},{"n":51,"q":"ข้อใดต่อไปนี้กล่าวถึงความแตกต่างระหว่างบุคคลได้ถูกต้องที่สุด","o":["เป็นความไม่เหมือนกันทางภายภาพ","คนเราแตกต่างกันตามบรรพบุรุษ","ไม่มีผู้ใดในโลกนี้ที่เหมือนกันทุกอย่างแม้แต่แฝดใบเดียวกัน","การมีสติปัญถาและความสนใจที่ต่างกัน"],"a":3,"e":"ศรีสมร สุริยาศสิน (2560) ให้ความหมายของความแตกต่างระหว่างบุคคล หมายถึงความแตกต่างระหว่างบุคคลใน ทุก ๆ ด้าน ไม่ว่าจะเป็นทางด้านร่างกาย จิตใจ สติปัญญา และ สังคม ไม่มีบุคคลใดที่เหมือนกันทุกอย่างแม้กระทั่งฝาแฝด ที่เกิดจากไข่ใบเดียวกันก็ตาม"},{"n":52,"q":"ความแตกต่างของมนุษย์ มีสาเหตุมาจากข้อใดต่อไปนี้","o":["ร่างกาย – จิตใจ","สิ่งแวดล้อม – พันธุกรรม","เชื้อชาติ - ภูมี ลำเนา","ครอบครัว - พันธุกรรม"],"a":2,"e":"ในทางจิตวิทยาส่วนใหญ่ เมื่อมีการอธิบายถึงความแตกต่างระหว่างบุคคลพบว่า มีสาเหตุหลักสำคัญ 2 ประการ คือ 1. พันธุกรรม (Genetic) เป็นการถ่ายทอดคุณลักษณะทางด้านชีวภาพทั้งหมดจากพ่อและแม่ไปสู่ลูก โดยมียีน (Gene) เป็นหน่วยของพันธุกรรมที่กำหนดคุณลักษณะทางชีวภาพ ซึ่งการ ถ่างทอดทางพันธุกรรมจะทำให้เกิดความแตกต่างทาง สายพันธุ์และเชื้อชาติ รวมถึงโรค หรือความผิดปกติทางร่างกายบางด้านที่ถูกถ่ายทอดทางพันธุกรรม เช่น ตาบอดสี ความ บกพร่องทางสติปัญญา ดาวน์ชินโดรม ฯลฯ 2. สิ่งแวดล้อม (Environment) มีส่วนสำคัญกับคนเราตั้งแต่เริ่มมีการปฏิสนธิในครรภ์มารดาจนกระทั่งคลอด และ เติบโตกลายมาเป็นส่วนหนึ่งของสังคม โดยสิ่งแวดล้อมที่มีผลทำให้เกิดความแตกต่างระหว่างบุคคลสามารถจำแนก ออกเป็น 3 ช่วง ได้แก่ สิ่งแวดล้อมก่อนคลอด สิ่งแวดล้อมขณะคลอด และสิ่งแวดล้อมหลังคลอด"},{"n":53,"q":"ความยากลำบากในการทำคลอด ส่งผลให้เด็กทารกขาดออกซิเจนชั่วขณะ ตรงกับสิ่งแวดล้อมข้อใด","o":["ก่อนคลอด","หลังคลอด","ขณะคลอด","สิ่งแวดล้อมและพันธุกรรม"],"a":3,"e":"สิ่งแวดล้อมขณะคลอด คือ หลังจากที่ทารกเจริญเติบโตอยู่ในครรภ์มารดาจนครบ 9 เดือนแล้ว มารดาก็เริ่มมีอาการ ปวดท้องจะคลอดบุตร ซึ่งในช่วงระหว่างการคลอดนี้ ถ้าหากทารกได้รับการกระทบกระเทือน หรือมีความยากลำบากใน การคลอด อาจส่งผลต่อพัฒนาการของทารกต่อไปได้ ดังนั้นสภาพแวดล้อมขณะคลอดจึงมีความสำคัญ ถ้าหากมีสภาวะ การขาดออกซิเจน การได้รับบาดเจ็บทางระบบประสาท ก็จะเป็นอันตรายและส่งผลกระทบกับทารก"},{"n":54,"q":"คำกล่าวข้อใดต่อไปนี้ถูกต้องที่สุด","o":["สีตาที่มองเห็นเป็นการถ่ายทอดแบบจีโนไทป์","โครโมโซมเพศ คือ คู่ที่ 23","ยีนเด่นเขียนด้วยสัญลักษณ์ RR หรือ tt","ผู้ชายโครโมโซม xx ผู้หญิงโครโมโซม xy"],"a":2,"e":"ข้อสังเกตเกี่ยวกับพันธุกรรมที่ถูกต้อง ได้แก่ 1. ตาที่มองเห็นเป็นการถ่ายทอดแบบฟีโนไทป์ (Phenotype) คือ ลักษณะที่ปรากฏให้เห็นอยู่ภายนอก ซึ่งเป็นการ แสดงออกของยีน 2. คนเรามีโครโมโซม 23 คู่ หรือ 46 แท่ง โดยมีโครโมโซมคู่ที่ 1 ถึง 22 เป็นโครโมโซมร่างกายและมีโครโมโชมดู สุดท้ายในลำดับที่ 23 เป็นโครโมโซมเพศ 3. ผู้ชายโครโมโซม xy ผู้หญิงโครโมโซม xx 4. จิโนไทป์ (Genotype) คือ ลักษณะของยีนที่อยู่ภายใน จะอยู่กันเป็นคู่ ๆ นิยมใช้สัญลักษณ์เป็นอักษรภาษาอังกฤษ ตัวพิมพ์ใหญ่แทนยีนที่ควบคุมลักษณะเด่น เช่น TT และจะใช้อักษร ตัวพิมพ์เล็กแทนยีนที่ควบคุมลักษณะด้อย เช่น tt"},{"n":55,"q":"\"นักเรียนที่ชอบการอ่านหนังสือด้วยตนเอง แล้วทำแผนผังความคิดเพื่อให้เข้าใจมากขึ้น\" มีสไตล์การ เรียนรู้แบบใดตามหลักการ VARK Leaming Styles","o":["Aural","Visual","Read/Write","Kinesthetic"],"a":3,"e":"Fleming and Mill (1992) ได้แบ่งลีลาการเรียนรู้ตามความชอบหรือความถนัดในการรับข้อมูลของบุคคลออกเป็น 4 กลุ่ม เรียกว่า \"VARK Learning Styles\" ดังนี้ 1. ลีลาการเรียนรู้ที่สื่อด้วยภาพและสัญลักษณ์ V (Visual)) ผ่านทางการได้เห็นข้อมูลต่าง ๆ - ในรูปแบบแผนภาพ กราฟ แผนภูมิ และสัญลักษณ์ต่าง ๆ 2. ลีลาการเรียนรู้ที่สื่อด้วยเสียง A (AuraV/Auditory) ผ่านทางการได้ยินได้ฟัง ชื่นชอบการฟังบรรยาย การพูดคุย หรือ คิดออกมาดัง ๆ เป็นการใช้ความคิดผ่านการพูด 3. ลีลาการเรียนรู้ที่สื่อด้วยอักษร R (Read/Write) เน้นการรับและส่งข้อมูลผ่านการอ่านและการเขียน บุคคลกลุ่มนี้มัก มีสมุดบันทึกติดตัวเพื่อจดบันทึก. 4. ลีลาการเรียนรู้ที่สื่อด้วยสัมผัสและการกระทำ K (Kinesthetic) เมื่อใช้ประสบการณ์และการลงมือปฏิบัติ"},{"n":56,"q":"\"หนูชอบเรียนแบบเห็นหน้าครู ได้คุยกับครู่ในห้องเรียน มากกว่าเรียนผ่านคลิปวิดีโอ\" จากคำกล่าว ข้างต้นแสดงว่าผู้เรียนมีสไตล์การเรียนรู้แบบใดตามหลักการ VARK Learning Styles","o":["Aural","Visual","Read/Write","Kinesthetic"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 55. ประกอบ"},{"n":57,"q":"ข้อใดไม่เป็นลักษณะที่บ่งชี้ถึงความแตกต่างระหว่างบุคคลที่ได้รับอิทธิพลจากสังคม","o":["เอกลักษณ์ของนักศึกษาแต่ละมหาวิทยาลัย","รสนิยมและความสนใจทางเพศ","ฝาแฝดที่เกิดรากไข่ใบเดียวกัน","เจตคติเกี่ยวกับความเชื่อในสิ่งศักดิ์สิทธิ์"],"a":3,"e":"ลักษณะที่บ่งชี้ถึงความแตกต่างระหว่างบุคคลที่ได้รับอิทธิพลจากสังคม ได้แก่ รสนิยมและความสนใจทางเพศ ประสบการณ์ การปรับตัว ทัศนคติ เจตคติ เอกลักษณ์ ฯลฯ (ส่วนตัวเลือกข้อ 3 บ่งชี้ถึงความแตกต่างระหว่างบุคคลที่ ได้รับอิทธิพลจากพันธุกรรม)"},{"n":58,"q":"\"บีมีบุคลิกภาพที่ขาดความมั่นใจและชอบตำหนิตนเอง ทั้งยังยกย่องชมเชยผู้อื่นว่าเก่งกว่าตนเสมอ\" บีมีทัศนะการมองตนเองเป็นอย่างไรตามทฤษฎีของอีริค เบิร์น (Eric Berne)","o":["I'm OK. - You're OK.","I'm OK. - You're not OK.","I'm not OK - You're OK.","I'm not OK. - You're not OK."],"a":3,"e":"ฉันเลวแต่คุณดี (I'm not OK., You're OK.) เป็นทัศนคติที่แสดงถึงภาวะจิตของคนที่ไม่มีความสุข จึงเป็นบุคคลที่ ต้องการกำลังใจ ต้องการความสนใจและเอาใจใส่จาก ผู้อื่นหรือผู้บังคับบัญชา ดังนั้นจึงมักมองตนเองในแง่ลบ ขาดความ มั่นใจและชอบตำหนิตนเองแต่กลับมองผู้อื่นในแง่ดีและยกย่องชมเชยผู้อื่นว่าเก่งกว่าตนเสมอ"},{"n":59,"q":"พฤติกรรมของบุคคลในข้อใดที่สะท้อนถึงการนำหลักความแตกต่างระหว่างบุคคลไปปรับใช้ในชีวิต ได้ดี","o":["เอใช้ความพยายามตั้งใจทำงาน เพื่อแก้ไขความผิดพลาดในงานของตนเอง","บีสอบถามความถนัดของสมาชิกกลุ่ม เพื่อมอบหมายงานตามความถนัดของแต่ละคน","ซีพยายามโน้มน้าวเพื่อนนักเรียนคนอื่น ๆ ให้สมัครเข้าชมรมดนตรีไทยของตนเอง","เอฟสมัครเรียนต่อมหาวิทยาลัยในสาขาที่เพื่อนสนิทของตนเองได้เลือกเรียนให้"],"a":2,"e":"การศึกษาและทำความเข้าใจเกี่ยวกับความแตกต่างระหว่างบุคคล จะช่วยให้บุคคล มีความรู้ความเข้าใจเกี่ยวกับ บุคลิกภาพของแต่ละคนเป็นพื้นฐาน ซึ่งถือได้ว่าเป็นปรากฏการณ์ธรรมชาติของมนุษย์แต่ละคนที่จะมีความคิด ความรู้สึก และมีบุคลิกภาพที่แตกต่างกันไปตามประสบการณ์ ดังนั้นในฐานะที่มนุษย์ต้องพึ่งพาอาศัยและมีปฏิสัมพันธ์ร่วมกับ บุคคลอื่น ๆ ใน สังคม การเรียนรู้ที่จะยอมรับถึงความแตกต่างระหว่างบุคคลจึงถือเป็นสิ่งสำคัญที่ช่วยให้บุคคลสามารถ ขจัดอคติส่วนตนออกไปได้และนำไปสู่บรรยากาศที่ดี จนเกิดความร่วมมือกันมากกว่า ที่จะเกิดความขัดแย้งระหว่างกัน"},{"n":60,"q":"ข้อใดไม่ใช่ความผิดปกติที่มีสาเหตุหลักมาจากพันธุกรรม","o":["ตาบอดสี","ความบกพร่อง ทางสติปัญญา","ดาวน์ซินโดรม","ความฉลาดทางอารมณ์"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 52. ประกอบ"},{"n":61,"q":"ข้อใดต่อไปนี้ไม่ใช่ความหม่ายของการสื่อสาร (Communication)","o":["การเข้าใจความแตกต่างระหว่างบุคคล","การถ่ายทอดข่าวสารจากผู้ส่งสาร - ผู้รับสาร","การสื่อสารสามารถใช้ในการระบายอารมณ์","การส่งต่อข้อมูลเพื่อนำมาพิจารณาตัดสินใจ"],"a":1,"e":"ความหมายของการสื่อสาร (Communication) มีดังนี้ 1. การสื่อสาร (Communication) มาจากภาษาลาติน คือ \"Communis\" หมายถึงความเหมือนกันหรือร่วมกัน 2. กระบวนการถ่ายทอดข่าวสาร ข้อมูล ความรู้ ประสบการณ์ ความรู้สึก ความคิดเห็นความต้องการจากผู้ส่งสาร - ผู้รับสาร 3. การสื่อสารเป็นช่องทางในการบอกเล่าความคิด ความรู้สึก รวมถึงสามารถใช้การสื่อสารในการระบายอารมณ์ 4. การสื่อสารช่วยให้บุคคลเกิดแรงบันดาลใจจากการพูดคุย และยังช่วยให้ได้ข้อมูลเพื่อนำมา พิจารณาตัดสินใจที่จะ กระทำหรือไม่กระทำ"},{"n":62,"q":"ข้อใดต่อไปนี้เป็นการสื่อสารแบบ อวัจนภาษา (Nonverbal)","o":["สำนวนสุภาษิตไทย","ตัวอักษรบนป้ายโฆษณา","ภาษามือจากผู้สื่อข่าว","การพูดคุยระหว่าง 2 คน"],"a":3,"e":"ภาษาที่ใช้ในการติดต่อสื่อสารในชีวิตประจำวันแบ่งได้เป็น 2 ชนิด ดังนี้ 1. วัจนภาษา (Verbal) หมายถึง การสื่อสารด้วยถ้อยคำ ตัวหนังสือ ไม่ว่าจะเป็นคำพูดการเขียน การอ่าน 2. อวังนภาษา (Nonverbal) หมายถึง การสื่อสารโดยไม่ใช้การพูด การอ่านตามตัวหนังสือและการเขียนเป็นตัวหนังสือ หรือหมายถึง การสื่อสารโดยไม่ใช้ระบบ คำ และประโยคเช่น ป้ายจราจร ภาษามือ สัญรูปอารมณ์ (อิโมติคอน) เป็นต้น"},{"n":63,"q":"ข้อใดคือความสำคัญของการสื่อสารด้วยการสัมผัส","o":["ช่วยให้มองเห็นและยอมรับในความแตกต่างของบุคคล","ช่วยให้ความอบอุ่นทางใจแก่สัตว์เลี้ยงลูกด้วยนม","เป็นสัญชาตญาณทางเพศ","ถูกทุกข้อ"],"a":2,"e":"การสื่อสารด้วยการสัมผัส (Physical Contact/Tactile Communication) คือพฤติกรรมทางสังคมที่ใช้อวัยวะ สัมผัสร่างกายอีกฝ่าย เป็นสื่อบอกความหมายของกันและกัน ช่วยให้ความอบอุ่นทางใจ ซึ่งการสื่อสารด้วยการสัมผัสนี้ ถือเป็นการสื่อสารที่มีบทบาทอย่างยิ่งในกลุ่มสัตว์เลี้ยงลูกด้วยนม และยังรวมไปถึงมนุษย์ด้วย"},{"n":64,"q":"ข้อใดไม่ใช่องค์ประกอบของการสื่อสาร","o":["สาร (Message)","ผู้ส่งสาร (Serder)","จิตใจ (Mind)","ช่องทางการสื่อสาร (Channel)"],"a":3,"e":"องค์ประกอบของการสื่อสารมีอยู่ 4 ประการ ดังนี้ 1. ผู้ส่งสาร (Sender) 2. สาร (Message) 3. ช่องท่างการสื่อสาร (Channel) 4. ผู้รับสาร (Receiver)"},{"n":65,"q":"สมศรีเป็นผู้ส่งสาร ทักษะใดที่จำเป็นต่อการสื่อสารน้อยที่สุด","o":["ความรู้","เจตคติ","ระบบสังคม","ฐานะทางเศรษฐกิจ"],"a":4,"e":"ผู้ส่งสาร (Sender) เป็นจุดเริ่มต้นของการสื่อสาร ทั้งที่เป็นบุคคลหรือองค์กร มีจุดมุ่งหมายในการถ่ายทอดความคิด ความรู้สึก ข้อมูล หรือความต้องการไปยังผู้รับสาร ซึ่งผู้ส่งสารที่มีประสิทธิภาพจะมีคุณลักษณะดังนี้ 1. ทักษะการสื่อสาร (Communication Skills) 2. เจตคติ (Attitudes) 3. ความรู้ (Knowledge) 4. ระบบสังคม (Social System) 5. วัฒนธรรม (Culture)"},{"n":66,"q":"การสอนออนไลน์ผ่าน Google Meet เป็นช่องทางการสื่อสารแบบใด","o":["ระยะใกล้","ระยะไกล","เชิงกลาง","ต่อหน้า"],"a":2,"e":"ช่องทางการสื่อสารแบ่งออกเป็น 2 ลักษณะ คือ 1. ช่องทางการสื่อสารระยะใกล้ (Short Range Communication Channel) เช่น วัจนภาษา และอวัจนภาษา เป็นต้น 2. ช่องทางการสื่อสารระยะไกล (Long Range Communication Channel) เช่นเคเบิลใยแก้วนำแสง, การสอนออนไลน์ ผ่าน Google Meet เป็นต้น"},{"n":67,"q":"การสื่อสารระบบสองทาง (Two Way Communication) ตรงกับข้อใด","o":["แอนโทเนีย มิสยูนิเวิร์สไทยแลนด์ 2023 กล่าวคำขอบคุณผ่านรายการโทรทัศน์","พิมรี่พาย แม่ค่าออนไลน์ไลฟ์สดขายของใน TikTok","เจ้าสัวธนินท์ เจียรวนนท์ ให้แง่คิดแก่คนทำงานยุคใหม่ในบทสัมภาษณ์วารสาร","อาจารย์อัดเทปสอนวิชา RAM 1141 และลงคลิปสอนใน Couse on Demand"],"a":2,"e":"การสื่อสารจะมีหลายรูปแบบตามโอกาสและความเจริญก้าวหน้าทางเทคโนโลยีโดยการสื่อสารระหว่างบุคคล สามารถจำแนกออกได้เป็น 2 รูปแบบ ดังนี้ 1. การสื่อสารทางเดียว (One - Way Communication) เป็นการสื่อสารจากผู้ส่งสารถึง ผู้รับสารฝ่ายเดียว โดยผู้รับ สารจะไม่สามารถตอบกลับความคิด ความรู้สึก หรือแสดงพฤติกรรมใด ๆ กลับไปยังผู้ส่งสาร ดังนั้นการสื่อสารทางเดียว จะไม่เกิดการปฏิสัมพันธ์ระหว่างผู้ส่งสารกับผู้รับสารในทันที่ทันใด เช่น การสื่อสารมวลชน และการสื่อสารแบบ กึ่งกลาง เป็นต้น 2. การสื่อสารสองทาง (Two - Way Communication) เป็นการสื่อสารในลักษณะของการตอบโต้กันระหว่างผู้ส่ง สารกับผู้รับสาร ทั้งในกรณีที่มีการสื่อสารสองทางพร้อมกันเมื่อผู้ส่งสารและผู้รับสารอยู่ในสถานที่เดียวกัน เช่น การ สื่อสารแบบเผชิญหน้า เป็นต้นและในกรณีการสื่อสารสองทางสลับกันในลักษณะผู้ส่งสารและผู้รับสารอยู่คนละสถานที่ โดยต่างฝ่ายต่างสลับกันทำหน้าที่เป็นผู้ส่งสารและผู้รับสาร เช่น แม่ค้าออนไลน์ไลฟ์สดขายของใน TikTok และตอบ คอมเมนต์ลูกค้า เป็นต้น"},{"n":68,"q":"ข้อใดเป็นการสื่อสารแบบพ่อแม่ผู้ปกครอง (Parent Ego State หรือ P)","o":["แก้วบ่นที่น้องสาวกลับบ้านค ่า เพราะเป็นห่วงความปลอดภัย","น้องเล็กพูดอ้อนคุณพ่อให้ซื้อโทรศัพท์ iPhone รุ่นใหม่ให้","สายไหมปฏิเสธชายหนุ่มที่มาจีบเธอด้วยการพูดตรง ๆ ว่า เธอไม่ชอบเขา","ชบาพูดจาประชดแฟนหนุ่มที่ออกไปเที่ยวกับเพื่อน"],"a":1,"e":"บุคคลสามารถรับรู้และเข้าใจถึงความคิด ความรู้สึก และพฤติกรรมของผู้คนรอบข้าง ด้วยการวิเคราะห์การสื่อสาร โดยอีริค เบิร์น (Eric Berne) ได้แบ่งบุคลิกภาพที่เกิดจากแรงขับ (Ego State) ที่ส่งผลต่อพฤติกรรมการสื่อสารของบุคคล ออกเป็น 3 ลักษณะ ดังนี้ 1. การสื่อสารแบบพ่อแม่ (Parent Ego State) ได้แก่ รู้จี้ ขี้บ่น จุกจิก เข้มงวดกวดขัน 2. การสื่อสารแบบผู้ใหญ่ (Adult Ego State) ได้แก่ พูดจาตรงไปตรงมา มีเหตุมีผล 3. การสื่อสารแบบเด็ก (Child Ego State) ได้แก่ พูดอ้อน เปิดเผย อิสระ"},{"n":69,"q":"คนที่อาศัยอยู่จังหวัดเชียงใหม่จะพูดภาษาเหนือที่มีจังหวะช้ากว่าจังหวัดอื่น ๆ ในภาคเหนือ เกี่ยวข้องกับ","o":["คนที่อาศัยอยู่จังหวัดเชียงใหม่มีบุคลิกภาพใจเย็น","ความเจริญของเชียงใหม่มีมากกว่าจังหวัดอื่น","ความแตกต่างของวัฒนธรรม","ความแตกต่างของภูมิอากาศของเชียงใหม่"],"a":3,"e":"การสื่อสารของบุคคลที่มีความแตกต่างทางวัฒนธรรม จะส่งผลให้บุคคลมีลักษณะและบุคลิกภาพที่แตกต่างกัน ด้วยเช่นกัน เช่น กลุ่มคนที่อาศัยอยู่จังหวัดเชียงใหม่จะพูดข้ากว่ากลุ่มคนที่อาศัยอยู่จังหวัดร้อยเอ็ด, กลุ่มคนที่อาศัยอยู่ จังหวัดสงขลาจะพูดภาษาใต้ที่มีจังหวะรวดเร็ว เป็นต้น"},{"n":70,"q":"เนื้อหาใดที่สามารถสื่อสารลงในช่องทางออนไลน์ได้อย่างเหมาะสม","o":["ข้อความด่า ยั่วย หยาบคาย","ข้อความเหยียดเพศ เชื้อชาติ ศาสนา","ภาพการดื่มสุราหรือใช้ยาเสพติด","ข้อความค้าขายประชาสัมพันธ์"],"a":4,"e":"การสื่อสารผ่านอุปกรณ์อิเล็กทรอนิกส์ เป็นการสื่อสารที่ทันสมัยและมีประสิทธิภาพ ช่วยใช้การดำเนินชีวิตมีความ สะดวกสบายจากการส่งและรับข้อมูลที่เชื่อมโยงสังคมเข้าด้วยกันและควรคำนึงถึงความปลอดภัยในการใช้สื่อออนไลน์ ที่เหมาะสม ดังนี้ 1. ควรเรียนรู้วิธีการใช้สื่ออิเล็กทรอนิกส์ที่ถูกต้อง 2. รักษาข้อมูลสำคัญให้เป็นความลับ 3. ใช้ถ้อยคำที่เหมาะสม 4. ปฏิบัติตามกฎหมายเกี่ยวกับคอมพิวเตอร์"},{"n":71,"q":"ข้อใดกล่าวไม่ถูกต้องเกี่ยวกับมนุษยสัมพันธ์","o":["ช่วยให้มนุษย์ไม่ว้าเหว่","ช่วยให้มนุษย์ได้รับความรักและการยอมรับ","ช่วยให้มนุษย์มีความมั่นคงปลอดภัย","ช่วยเปลี่ยนแปลงวัฒนธรรม"],"a":4,"e":"ความสำคัญของมนุษยสัมพันธ์ที่มีต่อการดำเนินชีวิตในสังคม ได้แก่ 1. มนุษยสัมพันธ์จะช่วยให้มนุษย์ไม่ว้าเหว่ หรือไม่รู้สึกโดดเดี่ยว 2. มนุษยสัมพันธ์ทำให้มนุษย์ได้รับความช่วยเหลือและได้รับความสำเร็จ เช่น ทำให้ได้รับคำแนะนำดี ๆ ในการเรียน จากอาจารย์ รุ่นพี่ เพื่อนร่วมชั้น ฯลฯ 3. มนุษยสัมพันธ์ช่วยให้มนุษย์มีความมั่นคงปลอดภัย 4. มนุษยสัมพันธ์ช่วยให้มนุษย์ได้รับความรักและการยอมรับ"},{"n":72,"q":"ข้อใดกล่าวไม่ถูกต้องเกี่ยวกับมนุษยสัมพันธ์","o":["ช่วยให้ประสบ ความสำเร็จทางการเรียนและอาชีพ","ทำให้เกิดความสามัคคี","อาจก่อให้เกิดความเกลียดชังระหว่างบุคคล","ช่วยให้งานราบรื่นขึ้น"],"a":3,"e":"ประโยชน์ของการมีมนุษยสัมพันธ์ที่ดี ได้แก่ 1. เป็นประโยชน์อย่างยิ่งในการทำงานและการอยู่ร่วมกันเป็นสังคม 2. ช่วยลดความเกลียดชัง 3. ทำให้การดำเนินชีวิตส่วนตัวและการงานทุกด้านมีความราบรื่นเรียบร้อย 4. ทำให้ประสบความสำเร็จในการศึกษาและการประกอบกิจกรรมหรือการอาชีพ 5. ช่วยสร้างความสามัคคีกลมเกลียวขึ้นในหมู่คณะ"},{"n":73,"q":"ข้อใดกล่าวไม่ถูกต้อง","o":["ผลิตผลทางวัฒนธรรมไม่สามารถสะท้อนความแตกต่างทางวัฒนธรรมได้","การสร้างตัวตนอยู่ภายใต้เจตจำนงเสรีและวัฒนธรรม","บุคลิกภาพส่งผลต่อวัฒนธรรม","วัฒนธรรมส่งผลต่อบุคลิกภาพ"],"a":1,"e":"ข้อสังเกตเกี่ยวกับวัฒนธรรม สรุปได้ดังนี้ 1. วัฒนธรรมและบุคลิกภาพเป็นสิ่งที่ส่งอิทธิพลต่อกัน กำหนดหรือเปลี่ยนแปลงซึ่งกันและกัน มีความต่อเนื่องกัน เป็นวงจรที่ไม่สามารถแยกออกจากกันได้ 2. ปัจเจกบุคคลจะเป็นศูนย์กลางของประสบการณ์ และการสร้างความเป็นตัวตนจะอยู่ภายใต้เจดจำนงอันเสรีของ ตนเองและวัฒนธรรม 3. ผลิตผลทางวัฒนธรรมสามารถสะท้อนความแตกต่างทางวัฒนธรรมได้ ฯลฯ"},{"n":74,"q":"ข้อใดไม่ใช่กระบวนการสร้างมนุษยสัมพันธ์","o":["การศึกษาตนเองและผู้อื่น","การแก้ไขปรับปรุงตนเอง","ศึกษาสภาพวัฒนธรรม ประเพณี และสังคม","ศึกษาความต้องการ"],"a":4,"e":"กระบวนการสร้างมนุษยสัมพันธ์ มีดังนี้ 1. การศึกษาตนเองและผู้อื่น 2. การแก้ไขปรับปรุงตนเอง 3. ศึกษาสภาพวัฒนธรรม ประเพณี และสังคม 4. ศึกษาหลักและวิธีสร้างมนุษยสัมพันธ์ 5. นำหลักและวิธีสร้างมนุษยสัมพันธ์ไปใช้ในชีวิตจริง"},{"n":75,"q":"ข้อใดไม่ใช่เทคนิคการสร้างมนุษยสัมพันธ์เพื่อเอาชนะใจผู้อื่น","o":["ยกย่องสรรเสริญผู้อื่นอย่างสุจริตใจ","อย่าตำหนิ ประณาม พร ่าบ่น หรือนินทา","การยิ้ม","ใช้สรรพนามเป็นคำเรียกบุคคล"],"a":4,"e":"เทคนิคการสร้างมนุษยสัมพันธ์เพื่อเอาชนะใจผู้อื่นของ เดล คาร์เนกี้ มีดังนี้ 1. อย่าตำหนิ ประณาม พร ่าบ่น หรือนินทา 2. จงยกย่องสรรเสริญผู้อื่นด้วยความสุจริตใจ 3. จงเอาใจใส่ผู้อื่นอย่างแท้จริง 4. การยิ้ม 5. จดจำชื่อบุคคล 6. จงเป็นนักฟังที่ดี 7. จงทำให้ผู้อื่นเกิดความรู้สึกว่าเป็นคนสำคัญ"},{"n":76,"q":"ข้อใดไม่ใช่เทคนิคการสร้างความสัมพันธ์ภายในกลุ่ม","o":["การเปิดโอกาสให้มีช่วงเวลาทำความรู้จักและคุ้นเคยกัน","ให้เวลาสมาชิกในการสื่อสารเกี่ยวกับความต้องการและจุดมุ่งหมายร่วมกัน","สร้างแรงกดดันร่วมกัน","ให้เวลาในการกำหนดเป้าหมายร่วมกัน"],"a":3,"e":"เทคนิคการสร้างความสัมพันธ์ภายในกลุ่ม มีดังนี้ 1. การเปิดโอกาสให้มีช่วงเวลาที่สมาชิกจะทำความรู้จักและคุ้นเคยกัน 2. ให้เวลาสมาชิกในการสื่อสารเกี่ยวกับความต้องการและจุดมุ่งหมายร่วมกัน 3. สร้างเสียงหัวเราะและอารมณ์ขัน 4. ให้เวลาในการกำหนดเป้าหมายร่วมกัน"},{"n":77,"q":"ข้อใดไม่ใช่เทคนิคการสร้างความสัมพันธ์ในที่ทำงาน","o":["เป็นตัวของเราเอง จริงใจ","มีความอดทน","รับฟังผู้อื่น","พูดจาตรง ๆ ไม่ต้องไพเราะ"],"a":4,"e":"เทคนิคการสร้างมนุษยสัมพันธ์ในที่ทำงาน มีดังนี้ 1. เป็นตัวของเราเองและแสดงออกถึงความจริงใจ 2. กระตือรือร้นและสร้างความประทับใจ 3. รับฟังที่ดีและสามารถเข้าถึงจิตใจได้ 4. ปรับตัวเป็นเลิศ สร้างสายสัมพันธ์ 5. มีความอดทนและอดกลั้น ให้อภัย และไม่คิดมาก 6. วายาไพเราะและรักษามิตรภาพเอาไว้ 7. แสวงหาเครือข่ายและขยายมิตรสัมพันธ์"},{"n":78,"q":"ในการทำงานร่วมกับผู้อื่น วิธีการจัดการความขัดแย้งที่มีประสิทธิภาพที่สุด คือ ลักษณะใด","o":["ลักษณะการหลีกเลี่ยงแบบเต่า","ลักษณะการใช้กำลังในการแข่งขันแบบฉลาม","ลักษณะการยินยอมให้ผู้อื่นแบบตุ๊กตาหมี","ลักษณะการร่วมมือซึ่งกันและกันแบบนกฮูก"],"a":4,"e":"จอห์นสัน (Johnson & Johnson) ได้จำแนกพฤติกรรมการจัดการความวัดแย้งในองค์กรไว้ 5 แบบ โดยวิธีการ จัดการความขัดแย้งในการทำงานร่วมกับผู้อื่นที่มีประสิทธิภาพที่สุด ได้แก่ ลักษณะการร่วมมือซึ่งกันและกันแบบนกฮูก (เผชิญหน้ากันและสุขุม : Collaborating) คือ มองความขัดแย้งว่าเป็นปัญหาที่จะต้องแก้ไข โดยใช้วิธีให้ร่วมมือซึ่งกัน และกันบนพื้นฐานของการเปิดเผยและไว้ใจ ดังนั้นจึงมักให้คุณค่าแก่เป้าหมายและสัมพันธภาพ ซึ่งมีสิ่งที่ต้องการ ได้แก่ การบรรลุเป้าหมายของตนเองและผู้อื่น"},{"n":79,"q":"ข้อใดกล่าวถูกต้องเกี่ยวกับความขัดแย้ง","o":["ความขัดแย้งไม่ทำให้เกิดความรู้สึกร่วม","ความขัดแย้งทำให้เกิดความคงที่ในความสัมพันธ์","ความขัดแย้งทำให้ไม่เกิดการรับรู้ปัญหา","ความขัดแย้งก่อเกิดการเปลี่ยนแปลงด้านต่าง ๆ"],"a":4,"e":"ผลดีและผลเสียของความขัดแย้ง มีดังนี้ 1. ก่อให้เกิดความตระหนักและรับรู้ในปัญหาที่เกิด 2. ความขัดแย้งก่อเกิดการเปลี่ยนแปลงในด้านต่าง ๆ 3. ช่วยให้มีการปรับปรุงทางเลือกในการแก้ปัญหาอย่างมีประสิทธิภาพ 4. สร้างความรู้สึกร่วมในปัญหาที่เกิดขึ้น 5. ก่อให้เกิดการเรียนรู้และปรับปรุงพฤติกรรมซึ่งกันและกัน 6. สัมพันธภาพระหว่างบุคคลเสื่อมลงไป ฯลฯ"},{"n":80,"q":"ข้อใดไม่ใช่สาเหตุของความขัดแย้ง","o":["การรับรู้เป้าหมายที่แตกต่างกัน","มีความต้องการตรงกัน","ไม่เข้าใจในวัตถุประสงค์","ต้องการความเท่าเทียมกันทั้งด้านวัตถุประสงค์และคุณค่า"],"a":2,"e":"สาเหตุของความขัดแย้ง มีดังนี้ 1. มีการรับรู้เป้าหมายที่แตกต่างกัน 2. มีความเข้าใจผิดหรือไม่เข้าใจในวัตถุประสงค์ 3. มีความต้องการที่แตกต่างกัน 4. มีการแย่งชิงในสิ่งเดียวกัน 5. ต้องการความเท่าเทียมกันทั้งด้านวัตถุประสงค์และคุณค่า"},{"n":81,"q":"ข้อใดกล่าวถึงความหมายของสัมพันธภาพระหว่างบุคคลได้ถูกต้องที่สุด","o":["ความผูกพันขวงบุคคลในครอบครัว","ปฏิสัมพันธ์กับ สังคมของคนตั้งแต่ 2 คนขึ้นไป","การตีค่า ให้คุณนค่ากับการกระทำของคนในสังคม","การทำงานร่วมกันของคนในที่ทำงานเดียวกัน"],"a":2,"e":"คำว่า \"สัมพันธภาพ\" (Relationship) หมายถึง ความผูกพัน ความเกี่ยวข้อง ส่วนความหมายของคำว่า \"สัมพันธภาพ ระหว่างบุคคล\" (Interpersonal Relationship) คือ การมีปฏิสัมพันธ์กับสังคมของมนุษย์ตั้งแต่ 2 คนขึ้นไป ไม่คงที่ มีการ เปลี่ยนแปลงอยู่ตลอดเวลา"},{"n":82,"q":"การปฏิสัมพันธ์ระหว่างเพื่อนร่วมชั้นเรียน ถือเป็นระยะห่างระหว่างบุคคลรูปแบบใด","o":["ระยะส่วนตัว","ระยะใกล้ชิด","ระยะสังคม","ระยะสาธารณะ"],"a":1,"e":"ระยะส่วนตัว (Personal Distance) มีระยะห่างระหว่างบุคคลประมาณ 45 - 50 เมตร โดยมีลักษณะดังนี้ 1. มีอาณาเขตส่วนตัว แม้จะใกล้ชิดกันแค่ไหน 2. เอื้อมมือถึงกัน สัมผัสกันได้ 3. พูดคุยด้วยน ้าเสียงปกติ 4. ตัวอย่างข่องระยะส่วนตัว เช่น ระยะของเพื่อน เพื่อนร่วมงาน เพื่อนร่วมชั้นเรียน"},{"n":83,"q":"การสื่อสารทางเดียว ใช้ภาษาที่มีความเป็นทางการสูง ถือเป็นระยะห่างระหว่างบุคคลรูปแบบใด","o":["ระยะส่วนตัว","ระยะใกล้ชิด","ระยะสังคม","ระยะสาธารณะ"],"a":4,"e":"ระยะสาธารณะ (Public Distance) มีระยะห่างระหว่างบุคคลตั้งแต่ 3.5 เมตรขึ้นไป โดยมีลักษณะดังนี้ 1. มักเป็นการสื่อสารทางเดียว 2. ภาษาที่ใช้มีความเป็นทางการสูง 3. มีความสุภาพสูง เช่น การพบเจอผู้คนในที่สาธารณะ"},{"n":84,"q":"ข้อใดกล่าวถึงความหมายของการเห็นคุณค่าในตัวเองได้ถูกต้องมากที่สุด","o":["การรับรู้ความสามารถที่ช่อนเร้นของตนเอง","การมีความสุขในทุก ๆ วันที่ตื่นขึ้นมา","ทัศนคติที่บุคคลมีต่อตัวเองทั้งในแง่บวกและลบ","ความรู้สึกพอใจตนเองต่อการสร้างสัมพันธภาพ"],"a":3,"e":"การเห็นคุณค่าในตัวเอง (Self Esteem) หมายถึง ทัศนคติที่บุคคลมีต่อตัวเอง ทั้งในแง่บวกและลบ รวมทั้งการ ประเมินความคิดและความรู้สึกของตนเองต่อการมีสัมพันธภาพ กับผู้อื่น ดังนั้นการเห็นคุณค่าในตัวเองจึงเป็นลักษณะ ส่วนบุคคลที่เกี่ยวข้องกับการตัดสินใจตาม ค่านิยมที่มีต่อผู้อื่น"},{"n":85,"q":"บุคคลในข้อใดที่มีการมองเห็นคุณค่าในตนเองระดับสูง","o":["วาฟเฟิลหงุดหงิดง่ายเมื่อถูกขัดใจ","วิปครีมวิตกกังวลทุกครั้งที่ต้องออกงานสังคม","วุ้นเส้นมักคิดว่าปัญหาทุกอย่างเป็นอุปสรรค","เวสป้าเชื่อมั่นในตนเอง พร้อมแก้ไขปัญหา"],"a":4,"e":"หากบุคคลมีการมองเห็นคุณค่าในตัวเองระดับสูง จะส่งผลในทางบวกต่อคุณภาพชีวิต ดังนี้ 1. สามารถจูงใจผู้อื่น ด้วยการเสนอความคิดเห็นและแสดงพฤติกรรมเชิงบวก 2. มีความมั่นใจในการจัดการกับสถานการณ์ใหม่ ๆ ด้วยทัศนคติเชิงบวก 3. มีความอดทนสูงต่อความคับข้องใจ 4. มีความรู้สึกต่อตนเองในทางบวก เคารพนับถือตัวเอง 5. มีการควบคุมตนเองที่ดี มีความรับผิดชอบ และเชื่อว่าสิ่งที่เผชิญเป็นผลมาจากการกระทำของตนเอง 6. พัฒนาตนเองให้ดีขึ้นอยู่เสมอ"},{"n":86,"q":"การเข้าใจความต้องการของตัวเอง เป็นความฉลาดทางอารมณ์ด้านใด","o":["ดี","เก่ง","สุข","เข้าใจ"],"a":1,"e":"การพัฒนาความฉลาดทางอารมณ์ (E.Q.) ด้าน \"ดี\" เพื่อสร้างสัมพันธภาพที่ดีกับผู้อื่น ได้แก่ 1. เข้าใจความต้องการของตนเอง 2. รู้เขาทันอารมณ์และควบคุมได้ 3. รอคอยได้เพื่อสิ่งที่ต้องการ 4. มีสมาธิจดจ่อได้แม้ถูกกดดัน 5. มีความเห็นอกเห็นใจผู้อื่น"},{"n":87,"q":"การกล้าแสดงความเห็นที่แตกต่างอย่างสร้างสรรค์ เป็นความฉลาดทางอารมณ์ด้านใด","o":["ดี","เก่ง","สุข","เข้าใจ"],"a":2,"e":"การพัฒนาความฉลาดทางอารมณ์ (E.Q.) ด้าน \"เก่ง\" เพื่อสร้างสัมพันธภาพที่ดีกับผู้อื่น ได้แก่ 1. ตัดสินใจและแก้ไขปัญหาได้ 2. รู้ศักยภาพที่แท้จริงของตนเอง 3. ให้กำลังใจตนเองอยู่เสมอ 4. มุ่งมั่นไปให้ถึงเป้าหมายที่ตั้งไว้ 5. มีความยืดหยุ่น 6. รับผิดชอบในสิ่งที่ตัดสินใจทำ 7. สร้างสัมพันธภาพที่ดีกับผู้อื่น 8. กล้าแสดงออกอย่างเหมาะสม 9. แสดงความเห็นที่ขัดแย้งได้อย่างสร้างสรรค์"},{"n":88,"q":"หากเด็กโตมาในครอบครัวที่เลี้ยงดูอย่างปล่อยปละละเลย จะส่งผลต่อระยะห่างระหว่างบุคคล อย่างไร","o":["ไม่กล้าไว้วางใจผู้อื่น","กล้าแสดงออก ชอบสังคม","สามารถเข้ากับผู้อื่นได้ง่าย","ไม่เกี่ยวข้องกัน"],"a":1,"e":"จากการศึกษาพบว่า การเลี้ยงดูที่ขาดระเบียบวินัยหรือการเลี้ยงดูเชิงลบ ปล่อยปละละเลย ผู้ปกครองไม่ค่อยให้ ความสนใจ จะส่งผลต่อระยะห่างระหว่างบุคคล คือ เด็กที่เติบโตมาจะไม่ไว้วางใจผู้อื่น เก็บตัว เจ้าอารมณ์ ทำงานร่วมกับ ผู้อื่นได้ไม่ค่อยดี"},{"n":89,"q":"เวลาไปเที่ยว เจมระดูแลแฟนอยางดี ถือกระเป๋าให้ ขับรถให้ ถือเป็นภาษารักแบบใด","o":["การให้ของขวัญ","การใช้เวลาร่วมกัน","บอกรักด้วยคำพูด","บอกรักด้วยการทำให้"],"a":4,"e":"หลักการสร้างสัมพันธภาพที่ดีกับคนรัก ต้องอาศัยภาษารักทั้ง 5 รูปแบบ ได้แก่ 1. บอกรักด้วยคำพูด คือ คนกลุ่มนี้ชอบสื่อสารผ่านคำพูด อ่อนไหวต่อคำพูดอย่างมาก ต้องการให้อีกฝ่ายพูดคุยด้วย หรือเขียนข้อความบอกรัก ชื่นชม ขอบคุณ 2. บอกรักด้วยการใช้เวลาร่วมกัน คือ คนกลุ่มนี้ต้องการใช้เวลาหรือทำกิจกรรมร่วมกับคนรักโดยไม่มีคนอื่นมา รบกวน ต้องการให้อีกฝ่ายทำกิจกรรมที่ชอบด้วยกัน หรือพูดคุยกันอย่างใส่ใจ ไม่ถูกรบกวน 3. การบอกรักด้วยการให้ของขวัญ คือ คนกลุ่มนี้เชื่อว่าของขวัญหรือสิ่งที่ทำให้พิเศษ นับเป็นสัญลักษณ์ของการสื่อ ความรัก ต้องการให้อีกฝ่ายให้ความสำคัญผ่านการมอบสิ่งของ ทำให้รู้สึกว่าได้รับการคิดถึง 4. การบอกรักด้วยการทำให้ คือ คนกลุ่มนี้เชื่อว่าการกระทำสำคัญกว่าคำพูด จึงชอบช่วยเหลืออาสาทำงาน ให้ คำแนะนำ ดังนั้นคนกลุ่มนี้ก็ต้องการได้รับการดูแลช่วยเหลือเช่นกัน 5. การบอกรักด้วยการสัมผัส เช่น กอด หอมแก้ม โอบไหล่ ฯลฯ"},{"n":90,"q":"ข้อใดเป็นการพัฒนาสัมพันธภาพระหว่างเพื่อน โดยการแสดงความเอาใจใส่","o":["การสนใจในความคิดและความรู้สึก","การให้อิสระเพื่อนในการตัดสินใจ","การแบ่งปันประสบการณ์ซึ่งกันและกัน","การชื่นชมเมื่อเพื่อนประสบความสำเร็จ"],"a":1,"e":"หลักการสร้างสัมพันธภาพที่ดีกับเพื่อน สามารถทำได้ดังนี้ 1. แสดงความเอาใจใส่ เช่น สนใจในปัญหาที่ต้องเผชิญ สนใจในความคิดและความรู้สึก 2. แสดงความไว้ใจ เช่น การตรงต่อเวลา การรักษาสัญญา 3. แสดงการยอมรับนับถือ เช่น แสดงความชื่นชมยินดีเมื่อเพื่อนประสบความสำเร็จ 4. แสดงความมีส่วนร่วมและการแบ่งปัน เช่น แบ่งปันประสบการณ์ แบ่งปันความคิดความรู้สึก 5. แสดงความยืดหยุ่น เช่น สามารถยอมรับและปรับตัวเข้ากับเพื่อนได้ 6. แสดงความเห็นอกเห็นใจ ต้องอาศัยความใกล้ชิดและสังเกต จึงจะสามารถเข้าใจผู้อื่นได้ ฯลฯ"},{"n":91,"q":"ข้อใดคือความหมายของคำว่า \"ทักษะทางสังคม\"","o":["ความสามารถของบุคคลในการใช้ปฏิสัมพันธ์ทางสังคม","ทัศนคติที่มีต่อการมีปฏิสัมพันธ์ทางสังคมกับผู้อื่น","ทักษะการสื่อสารกับผู้อื่นเพื่อให้เกิดสัมพันธภาพที่ดี","ความสามารถในการควบคุมอารมณ์ให้เหมาะสม"],"a":1,"e":"ทักษะทางสังคม หมายถึง ความสามารถของบุคคลในการใช้ปฏิสัมพันธ์ทางสังคม ซึ่งบุคคลมีความรู้ ความเข้าใจ และเป็นทักษะเชิงพฤติกรรมที่ช่วยให้บุคคลมีการปฏิสัมพันธ์กันและมีการสื่อสารกับผู้อื่นหรือกับสังคม ดังนั้นทักษะ ทางสังคมจึงถือเป็นพฤติกรรมทางสังคมที่มีความสำคัญอย่างมาก"},{"n":92,"q":"ข้อใดคือองค์ประกอบของทักษะทางสังคม","o":["ทักษะการสังเกตพฤติกรรม","ทักษะการแก้ปัญหาทางสังคม","ทักษะการเข้าใจความรู้สึกตนเอง","ทักษะการป้องกันตัว"],"a":2,"e":"องค์ประกอบของทักษะทางสังคมมี 4 ประการ ได้แก่ 1. ทักษะการสื่อสาร (Communication Skills 2. ทักษะการควบคุมอารมณ์ (Emotion Regulation) 3. ทักษะทางปัญญา (Cognitive Skills) 4. ทักษะการแก้ปัญหาสังคม (Social Problem - Solving Skills)"},{"n":93,"q":"ข้อใดกล่าวถึงทักษะทางปัญญาได้ถูกต้องที่สุด","o":["การใช้ภาษาท่าทาง เพื่อสื่อความคิดความต้องการที่มีอยู่ของตนเอง","การใช้เหตุและผลในการควบคุมอารมณ์ และการแสดงออกเมื่อเข้าสังคม","ความคิดและการใช้เหตุผลในการเข้าใจปฏิสัมพันธ์และบทบาทของแต่ละคน","การเรียนรู้วิธีการแก้ปัญหาที่หลากหลาย และเลือกใช้ให้สอดคล้องต่อสถานการณ์"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 92. ประกอบ ทักษะทางปัญญา (Cognitive Skills) คือ ความรู้ความคิด และการใช้เหตุผลที่เกี่ยวข้องกับปฏิสัมพันธ์ทางสังคม เช่น ความรอบรู้ทางด้านข้อมูลจะช่วยให้แต่ละคนเข้าใจและคาดการณ์เกี่ยวกับบทบาทของแต่ละคน โดยดำเนินการที่ จำเป็นในบริบททางสังคมที่เฉพาะเจาะจง"},{"n":94,"q":"วัยใดที่ทักษะทางสังคมขยายกว้างขึ้นจากคนในครอบครัวกลายเป็นกลุ่มเพื่อนหรือครู","o":["วัยเด็กก่อนเข้าโรงเรียน","เด็กวัยเรียน","วัยรุ่น","วัยผู้ใหญ่"],"a":2,"e":"เด็กวัยเรียน เป็นช่วงวัยที่ได้รู้จักบุคคลอื่น ๆ นอกจากครอบครัว จึงมีทักษะทางสังคมขยายกว้างขึ้นจากคนในครอบ ครัวกลายเป็นกลุ่มเพื่อนหรือครู โดยลักษณะทาง สังคมของเด็กวัยนี้จะขึ้นอยู่กับการอบรมที่ได้รับจากทางครอบครัว ลักษณะสังคมจึงเริ่มอยู่กันเป็นกลุ่ม ซึ่งแต่ละกลุ่มมีการเปลี่ยนหน้ากันอยู่บ่อย ๆ ในลักษณะมารวมกัน ดังนั้นเด็กวัยเรียน จึงต้องฝึกการปรับตัวให้เข้ากับบุคคลอื่น เพื่อให้เป็นที่ยอมรับทางสังคม"},{"n":95,"q":"วัยใดที่มักต้องการการยอมรับจากกลุ่มเพื่อน เพื่อให้รู้ว่าตนเองมีความสำคัญ","o":["วัยเด็กก่อนเข้าโรงเรียน","เด็กวัยเรียน","วัยรุ่น","วัยผู้ใหญ่"],"a":3,"e":"วัยรุ่น เป็นช่วงวัยที่มักต้องการการยอมรับจากกลุ่มเพื่อน เพื่อให้รู้ว่าตนเอ:มีความสำคัญ สังคมของวัยรุ่นเริ่มขยาย ทางสังคมมากขึ้นกว่าช่วงวัยเด็ก เด็กผู้ชายจะมีขนาดสังคมใหญ่กว่าเด็กผู้หญิง โดยวัยรุ่นมักจะทำทุกสิ่งทุกอย่างตามที่ กลุ่มต้องการเพื่อให้เป็น ที่ยอมรับของกลุ่ม และกลุ่มจะมีอิทธิพลต่อวัยรุ่นทั้งในด้านความประพฤติ การแต่งกาย กิริยา ท่าทาง เจตคติ ความสนใจ และค่านิยม ทั้งนี้วัยรุ่นชอบเลียนแบบพฤติกรรมต่าง ๆ จากผู้ใหญ่จึงต้องเน้นฝึกทักษะทาง สังคม คือ ฝึกการปฏิบัติตัวให้เป็นที่ยอมรับทางสังคม"},{"n":96,"q":"วัยใดที่ต้องได้รับการพัฒนาทักษะทางสังคมผ่านกิจกรรม คือ การเล่น","o":["วัยเด็กก่อนเข้าโรงเรียน","เด็กวัยเรียน","วัยรุ่น","วัยผู้ใหญ่"],"a":1,"e":"วัยเด็กก่อนเข้าโรงเรียน เป็นช่วงวัยที่ต้องได้รับการพัฒนาทักษะทางสังคมผ่าน กิจกราม คือ การเล่น ซึ่งถือเป็น กิจกรรมที่สำคัญในชีวิตของเด็กทุกคน เนื่องจากเด็กจะรู้สึกสนุกสนานเพลิดเพลิน ได้สังเกต มีโอกาสทำการทดลอง สร้างสรรค์ คิดแก้ปัญหาและค้นพบด้วยตนเอง และจากการเล่นนั้นทำให้เด็กมีโอกาสเคลื่อนไหวส่วนต่าง ๆ ของร่างกาย ได้ใช้ประสาทสัมผัสและการรับรู้ ได้ผ่อนคลายอารมณ์ แสดงออกถึงตนเอง และเรียนรู้ความรู้สึกของผู้อื่น ดังนั้นการเล่น จึงเป็นทางที่ดีที่เด็กจะสร้างประสบการณ์เรียนรู้สิ่งแวดล้อม เรียนรู้ความเป็นอยู่ของผู้อื่น และสร้างความสัมพันธ์อยู่ ร่วมกับผู้อื่น"},{"n":97,"q":"วัยใดที่จะให้ความสำคัญกับกลุ่มเพื่อนลดลง แต่มุ่งความสนใจไปที่คู่ครองหรือครอบครัว","o":["วัยเด็กก่อนเข้าโรงเรียน","เด็กวัยเรียน","วัยรุ่น","วัยผู้ใหญ่"],"a":4,"e":"วัยผู้ใหญ่ เป็นช่วงวัยที่มีการเจริญเติบโตเต็มที่และมีวุฒิภาวะทุกด้านแล้ว สามารถ รับผิดชอบชีวิตของตนเองและ ครอบครัวได้ และเป็นที่ยอมรับของสังคม ดังนั้นวัยผู้ใหญ่จึงให้ความสำคัญกับกลุ่มเพื่อนลดลง แต่จะมีความผูกพันกับ เพื่อนรักคู่ครอง จึงเป็นวัยที่จะเริ่มใช้ชีวิตครอบครัวกับคู่ของตนเองและปรับตัวกับบทบาทใหม่ จากบทบาทความเป็น สามี ภรรยาจนเริ่ม เข้าสู่วัยสูงอายุ"},{"n":98,"q":"ข้อใดเป็นผลที่เกิดขึ้นจะบุคคลมีความยืดหยุ่น","o":["บุคคลรู้จักให้อภัยและยกโทษให้กับคนที่ทำผิดได้","บุคคลสามารถยอมรับแนวทางหรือการตัดสินใจที่ตนเองเลือกได้","บุคคลมีการดำเนินชีวิตตามแบบแผน กฎเกณฑ์ หรือข้อบังคับของสังคมได้","บุคคลสามารถรับมือกับปัญหาและความพ่ายแพ้ที่เกิดขึ้นได้ดี"],"a":4,"e":"ความยืดหยุ่น คือ บุคคลที่มีความสามารถในการยืดหยุ่นจะเป็นบุคคลที่รับมือกับปัญหาและความพ่ายแพ้ต่าง ๆ ที่ เกิดขึ้นได้ดี โดยผู้ที่มีความยืดหยุ่นจะสามารถใช้ทักษะและ จุดแข็งของตัวเอง เพื่อรับมือและฟื้นตัวต่อปัญหาต่าง ๆ ได้ดี"},{"n":99,"q":"ข้อใดเป็นผลที่เกิดขึ้นจากบุคคลมีระเบียบวินัย","o":["บุคคลรู้จักให้อภัยและยกโทษให้กับคนที่ทำผิดได้","บุคคลสามารถยอมรับแนวทางหรือการตัดสินใจที่ตนเองเลือกได้","บุคคลมีการดำเนินชีวิตตามแบบแผน กฎเกณฑ์ หรือข้อบังคับของสังคมได้","บุคคลสามารถรับมือกับปัญหาและความพ่ายแพ้ที่เกิดขึ้นได้ดี"],"a":3,"e":"ระเบียบวินัย คือ บุคคลที่มีระเบียบวินัยจะต้องเป็นบุคคลที่มีแบบแผน กฎเกณฑ์ที่กำหนดไว้เป็นแนวปฏิบัติ ดังนั้น คนที่มีระเบียบวินัยจึงเป็นบุคคลที่สามารถควบคุมตนเองให้ประพฤติปฏิบัติตนได้ตามแบบแผน กฎเกณฑ์ และข้อบังคับ ของสังคมนั้นได้"},{"n":100,"q":"ข้อใดเป็นผลที่เกิดขึ้นจากบุคคลมีความรับผิดชอบ","o":["บุคคลรู้จักให้อภัยและยกโทษให้กับคนที่ทำผิดได้","บุคคลสามารถยอมรับแนวทางหรือการตัดสินใจที่ตนเองเลือกได้","บุคคลมีการดำเนินชีวิตตามแบบแผน กฎเกณฑ์ หรือข้อบังคับของสังคมได้","บุคคลสามารถรับมือกับปัญหาและความพ่ายแพ้ที่เกิดขึ้นได้ดี"],"a":2,"e":"ความรับผิดชอบ คือ บุคคลที่มีความรับผิดชอบในการปฏิบัติหน้าที่การเรียนและการทำงานให้ประสบความสำเร็จ ตามสิ่งที่มุ่งหวัง โดยพัฒนาตนเองและปรับปรุงหน้าที่ให้ดีขึ้นสำหรับการฝึกทักษะความรับผิดชอบนั้น เราจะมุ่งเน้นให้ บุคคลมีความรับผิดชอบในการปฏิบัติหน้าที่การงานของตนเองเป็นสำคัญ สามารถยอมรับแนวทางหรือการตัดสินใจที่ ตนเองเลือกได้"},{"n":101,"q":"ข้อใดไม่ถูกต้องเกี่ยวกับความหมายของ \"มารยาท\"","o":["หมายรวมถึง การกระทำและคำพูด","หลักปฏิบัติเพื่ออยู่ร่วมกับคนอื่นในสังคม","หลักปฏิบัติเพื่อตอบสนองความต้องการส่วนบุคคล","เหมาะสมกับกาลเทศะ"],"a":3,"e":"นักวิชาการหลายท่าน อธิบายว่า มารยาทหมายรวมถึงการกระทำและคำพูด เป็นกิริยาวาจาที่ถือว่าเรียบร้อย เหมาะสมกับกาลเทศะ ดังนั้นมารยาทจึงเป็นสิ่งที่ทุกคนต้องยึดถือเป็นหลักปฏิบัติ เป็นแบบแผนแห่งความประพฤติ เพื่อ อยู่ร่วมกับคนอื่น ๆ ใน สังคมได้โดยมารยาทเป็นส่วนหนึ่งของวิถีชีวิต"},{"n":102,"q":"มารยาทมีบทบาทต่อสังคม ยกเว้นส่วนใด","o":["องค์กร","ชุมชน","ครอบครัว","กฎหมาย"],"a":4,"e":"มารยาทมีบทบาทและความสำคัญที่ทำให้ครอบครัว ชุมชน หน่วยงานหรือองค์กร สังคมและประเทศ มีความ เรียบร้อยและบรรยากาศน่าอยู่ ซึ่งการมีมารยาททางสังคมและการทำงาน ถือเป็นบุคลิกภาพหรือพฤติกรรมที่แสดง ออกมาในบริบททางสังคมและการทำงาน"},{"n":103,"q":"ข้อใดถือเป็นมารยาทแบบไทยตามธรรมเนียมปฏิบัติ","o":["การยิ้ม","การไหว้","การพยักหน้า","การโค้งคำนับ"],"a":2,"e":"เอกลักษณ์การไหว้ของไทย เป็นธรรมเนียมปฏิบัติที่แสดงออกถึงการมีมารยาทในการทักทายและแสดงความเคารพ ต่อกันของวัฒนธรรมไทย แบ่งออกเป็น 3 ลักษณะ ดังนี้ 1. การไหว้พระ คือ ค้อมตัวลงให้ต ่า พร้อมกับประนมมือขึ้นให้หัวแม่มือจรดระหว่างคิ้วปลายนิ้วแนบหน้าผาก 2. การไหว้ผู้มีพระคุณและผู้อาวุโส คือ ค้อมตัวลงให้ต ่า พร้อมกับประนมมือขึ้นให้หัวแม่มือจรกปลายจมูก ปลายนิ้ว แนบระหว่างคิ้ว 3. การไหว้บุคคลทั่วไป ผู้มีอาวุโสกว่าเล็กน้อย หรือผู้เสมอกัน คือ ประนมมือแล้วยกขึ้นพร้อมกับค้อมศีรษะลงให้หัว แม่มือจรดปลายค่าง ปลายนิ้วแนบปลายจมูก"},{"n":104,"q":"ข้อใดถือเป็นมารยาทในการรับประทานอาหารแบบสากลที่ไม่เหมาะสม","o":["ไม่หยิบอาหารมาแบ่งปันให้คนข้าง ๆ ขณะนั่งรับประทานอาหาร","เมื่อนั่ง วางศอกไว้บนโต๊ะอาหาร","เมื่อนั่ง ควรขยับเก้าอี้ให้ชิดกับโต๊ะอาหารเสมอ","รอเจ้าภาพเชิญนั่งจึงนั่งได้"],"a":2,"e":"มารยาทในการรับประทานอาหารแบบสากลประการหนึ่ง คือ เวลานั่งให้พยายามนั่งตัวตรง โดยวางมือไว้บนตัก หรือวางเบา ๆ บนโต๊ะ แต่อย่าไปวางข้อศอกบนโต๊ะเพราะอาจเผลอกดโต๊ะพลิกได้ และยังทำให้ผู้ที่อยู่ซ้ายและขวาพูดคุย กันไม่สะดวก"},{"n":105,"q":"ข้อใดควรปฏิบัติเมื่อเข้าสู่การประชุม","o":["เคารพมติที่ประชุม","พูดคุยถกเถียงนอกประเด็นประชุม","คุยโทรศัพท์ระหว่างการประชุม","เดินเข้าเดินออกทันที โดยไม่แสดงความเคารพประธาน"],"a":1,"e":"มารยาทในการเข้าประชุม มีดังนี้ 1. ต้องตรงต่อเวลา 2. ให้ความเคารพประธาน ข้อคิดเห็นของผู้เข้าร่วมประชุม และมติที่ประชุม 3. ให้ความสนใจกับการประชุม ไม่แสดงกิริยาเบื่อหน่าย นั่งหลับ หรือนั่งเล่นโทรศัพท์มือถือ 4. ไม่ถกเถียงนอกประเด็นการประชุม 5. ในระหว่างการประชุม เมื่อต้องเข้าหรือออกจากห้องประชุม ควรแสดงคว่ามเคารพประธานก่อน ฯลฯ"},{"n":106,"q":"ข้อใดไม่ใช่มารยากที่ควรปฏิบัติในที่สาธารณะ","o":["แสดงท่าทีที่สุภาพต่อผู้ที่พบเจอ","ระมัดระวังท่าทางที่แสดงออกถึงการคุกคามผู้อื่น","ไอ จาม ในที่สาธารณะโดยไม่ปิดปาก","เคารพกฎเกณฑ์ของสถานที่"],"a":3,"e":"มารยาทในที่สาธารณะ มีดังนี้ 1. ไม่ควรหวีผม แต่งหน้า ตัดเล็บ 2. ไม่ควรขบเคี้ยวหมากฝรั่งหรือสิ่งอื่นใดในขณะสนทนากับผู้อื่น 3. ไม่หาว เรอ ไอ จาม ด้วยเสียงอันดังและไม่มีการป้องกัน 4. ไม่แสดงกิริยาล่วงละเมิดทางเพศหรืออนาจารทั้งทางร่างกายและคำพูด 5. ไม่เรียกขานผู้อื่นด้วยถ้อยคำไม่สุภาพ ล้อเลียน 6. ควรสำรวมกิริยามารยาท ท่าทาง คำพูด ไม่พูดคำหยาบคาย ตลกคะนอง หรือส่งเสียงดัง 7. เคารพเกณฑ์ระเบียบของแต่ละสถานที่ ฯลฯ"},{"n":107,"q":"ข้อใดไม่ใช่มารยากในการใช้อินเทอร์เน็ต","o":["เคารพผู้อื่นเรืองเวลาและการใช้สัญญาณอินเทอร์เน็ต","ให้อภัยผู้อื่นได้","ใช้ตัวตนอวตารในการติดต่อสัมพันธ์","ให้เกียรติผู้อื่นในฐานะมนุษย์"],"a":3,"e":"มารยาทในการใช้อินเทอร์เน็ต มีดังนี้ 1. ให้เกียรติผู้อื่นในฐานะมนุษย์ 2. ยืดบรรทัดฐานเดียวกับสังคมในชีวิตจริง 3. ระลึกอยู่เสมอว่า คุณอยู่ที่ใดในสังคมออนไลน์ 4. เคารพผู้อื่นด้วยการตระหนักในเรื่องของเวลาและช่วงสัญญาณ 5. ทำตัวเองให้ดูดีในสังคมออนไลน์ 6. แบ่งปันความรู้ซึ่งกันและกัน 7. ยับยั้งการโต้ตอบกันด้วยถ้อยคำที่รุนแรง 8. เคารพความเป็นส่วนตัวของผู้อื่น 9. อย่าใช้อำนาจไปในทางที่ผิด 10. รู้จักให้อภัยผู้อื่น"},{"n":108,"q":"ข้อใดแสดงออกถึงมารยาทในการแต่งกายที่เหมาะสม","o":["แต่งกายไปงานแต่งงานด้วยชุดสีชมพู","เข้าร่วมงานเลี้ยงโดยไม่มีบัตรเชิญ","สวมชุดลำลองขาสั้นอยู่บ้านไปเล่นกีฬา","สวมเสื้อเกาะอก ชุดกระโปรงสั้น เข้าร่วมศาสนพิธี"],"a":1,"e":"มารยาทในการแต่งกาย หมายถึง การแต่งกายให้เหมาะสมกับกาละและเทศะ ซึ่งการใช้เสื้อผ้า รวมถึงเครื่องแต่ง กายตั้งแต่ศีรษะจรดเท้าควรสะอาด สุภาพ และเรียบร้อยเหมาะกับรูปร่างลักษณะผิวพรรณของตนเอง เช่น แต่งกายไป งานแต่งงานด้วยชุดสีชมพู"},{"n":109,"q":"ข้อใดไม่เกี่ยวข้องกับการเรียนรู้โดยการเลียนแบบตามแนวคิดการเรียนรู้ทางสังคมเชิงพุทธิปัญญา","o":["การทำตาม","การคงไว้","ความตั้งใจ","ความชอบ"],"a":4,"e":"Albert Bandura นักจิตวิทยาชาวอเมริกัน เป็นผู้ริเริ่มพัฒนาทฤษฎีการเรียนรู้ทางสังคมเชิงพุทธิปัญญา (Social Cognitive Leaming Theory) ซึ่งเน้นหลักการเรียนรู้โดยการสังเกตหรือการเลียนแบบ คือ การที่บุคคลสังเกตการกระทำ ผู้อื่นแล้วพยายามเลียนแบบพฤติกรรมนั้น ประกอบด้วย 4 องค์ประกอบ ดังนี้ 1. ความใส่ใจ (Attention Processes) หรือความตั้งใจ 2. การเก็บจำ (Retention Processes) หรือการคงไว้ 3. การปฏิบัติ (Production Processes) หรือการทำตาม 4. การจูงใจ (Motivation Process) หรือการเสริมแรง"},{"n":110,"q":"ท่านคิดว่าข้อใดถือเป็นการแสดงมารยาทที่เหมาะสมมากที่สุด","o":["นักศึกษาโทรหาอาจารย์หลังเวลาหกโมงเย็น อ้างว่ามีงานด่วน","ลูกค้าด่าทอพนักงานเสิร์ฟอย่างรุนแรงด้วยคำหยาบคาย เนื่องจากส่งอาหารที่สั่งผิด","ภรรยาอ่านข้อความ LINE ของสามี แต่ยังไม่ตอบกลับ เนื่องจากยังทำงานสำคัญไม่เสร็จ","พนักงานเข้าห้องประชุมสาย อ้างว่ารถติด"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 101. ประกอบ"},{"n":111,"q":"ข้อใดกล่าวไม่ถูกต้อง","o":["วัฒนธรรมเป็นสิ่งแวดล้อมทางสังคมที่บุคคลเรียนรู้โดยไม่รู้ตัว","วัฒนธรรมมีผลต่อวิถีชีวิตของปัจเจกบุคคล","การเข้าใจวัฒนธรรมทำให้เข้าใจวิถีชีวิตคนในสังคมได้","เวลาไม่ใช่ปัจจัยที่ทำให้เกิดความผันแปรทางวัฒนธรรม"],"a":4,"e":"ข้อสังเกตเกี่ยวกับวัฒนธรรม มีดังนี้ 1. การเข้าใจวัฒนธรรมทำให้เข้าใจวิถีชีวิตคนในสังคมได้ 2. วัฒนธรรมมีผลต่อวิถีชีวิตของปัจเจกบุคคล 3. วัฒนธรรมเป็นสิ่งแวดล้อมทางสังคมที่บุคคลเรียนรู้ทั้งที่รู้ตัวและไม่รู้ตัว 4. เวลา ถือเป็นหนึ่งในปัจจัยที่ทำให้เกิดการผันแปรทางวัฒนธรรม ซึ่งนำไปสู่ความแตกต่างระหว่างรุ่น 5. วัฒนธรรมเรียนรู้ได้จากสมาชิกของสังคม ดังนั้นการเข้าใจวัฒนธรรมของสังคมนั้น จึงเท่ากับเข้าใจบุคลิกภาพของ คนในสังคมนั้นด้วย ฯลฯ"},{"n":112,"q":"ข้อใดกล่าวถูกต้องเกี่ยวกับคำว่า \"วัฒนธรรม\"","o":["วัฒนธรรมเปลี่ยนแปลงได้ง่าย หากปัจเจกบุคคลต้องการ","วัฒนธรรมเป็นสิ่งที่ไม่สามารถเปลี่ยนแปลงได้","วัฒนธรรมเรียนรู้ได้จากสมาชิกของสังคม","วัฒนธรรมเป็นความเชื่อร่วมกันของคนในสังคม ซึ่งมีการบันทึกเป็นลายลักษณ์อักษร"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 111. ประกอบ"},{"n":113,"q":"ข้อใดกล่าวไม่ถูกต้อง","o":["ผลิตผลทางวัฒนธรรมไม่สามารถสะท้อนความแตกต่างทางวัฒนธรรมได้","การสร้างตัวตนอยู่ภายใต้เจตจำนงเสรีและวัฒนธรรม","บุคลิกภาพส่งผลต่อวัฒนธรรม","วัฒนธรรมส่งผลต่อบุคลิกภาพ"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 73. ประกอบ"},{"n":114,"q":"ให้ความสำคัญกับการเสียสละเพื่อส่วนรวม","o":["หากข้อความนี้ตรงกับปัจเจกนิยม (Individualism)","หากข้อความนี้ตรงกับกลุ่มนิยม (Collectivism)"],"a":2,"e":"ข้อสังเกตเกี่ยวกับวัฒนธรรมกลุ่มนิยม (Collectivism) มีดังนี้ 1. ให้ความสำคัญกับผู้อื่นและสังคมเป็นอันดับแรก 2. อัตลักษณ์ส่วนบุคคลได้รับอิทธิพลจากค่านิยมของกลุ่มที่สังกัด 3. กลุ่ม ครอบครัว และการเสียสละเพื่อประโยชน์ของส่วนรวมนั้น มีความสำคัญมากกว่าประโยชน์ส่วนบุคคล 4. มีความเป็น \"พวกเขา\" และ \"พวกเรา\" อย่างชัดเจน 5. กฎมีขึ้นเพื่อส่งเสริมความมั่นคงและความสงบเรียบร้อยของกลุ่ม 6. การทำงานกับผู้อื่นและให้ความร่วมมือ คือ บรรทัดฐานของวัฒนธรรม 7. มักมีการอนุมานสาเหตุภายนอก (External Attribution) คือ วิธีการคิดที่กำหนดสาเหตุของพฤติกรรมว่าเกิดจาก ปัจจัย หรือสถานการณ์ภายนอก หรือบริบทรอบข้าง ฯลฯ"},{"n":115,"q":"อัตลักษณ์ส่วนบุคคลได้รับอิทธิพลจากค่านิยมของกลุ่มที่สังกัด","o":["หากข้อความนี้ตรงกับปัจเจกนิยม (Individualism)","หากข้อความนี้ตรงกับกลุ่มนิยม (Collectivism)"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 114. ประกอบ"},{"n":116,"q":"ชื่นชมการพึ่งพาตนเอง (Self - reliance) และความเป็นอิสระ","o":["หากข้อความนี้ตรงกับปัจเจกนิยม (Individualism)","หากข้อความนี้ตรงกับกลุ่มนิยม (Collectivism)"],"a":1,"e":"ข้อสังเกตเกี่ยวกับวัฒนธรรมปัจเจกนิยม (Individualism) มีดังนี้ 1. ให้ความสำคัญกับความต้องการของตนเองมากกว่าความต้องการของผู้อื่นและสังคม 2. ให้ความสำคัญกันเป้าหมายส่วนบุคคลเป็นอันดับแรก 3. ยึดถือระบบความคิดส่วนบุคคลและความสำเร็จส่วนบุคคลเป็นที่ตั้ง 4. ชื่นชมการพึ่งพาตนเอง (Self - reliance) และความเป็นอิสระ 5. แนวคิดเกี่ยวกับ \"พวกเขา\" และ \"พวกเรา\" มีอิทธิพลน้อยกว่ากลุ่มนิยม 6. มีแนวโน้มที่จะตักสินผู้อื่นตามระบบความคิดส่วนบุคคลของตน 7. มักมีการอนุมานสาเหตุภายใน (Internal Attribution) คือ วิธีการคิดที่กำหนดสาเหตุของพฤติกรรมว่าเกิด จาก คุณลักษณะภายในของบุคคล เช่น บุคลิกภาพ นิสัย อารมณ์ ฯลฯ"},{"n":117,"q":"แนวคิดเกี่ยวกับ \"พวกเขา\" และ \"พวกเรา\" มีอิทธิพลน้อย","o":["หากข้อความนี้ตรงกับปัจเจกนิยม (Individualism)","หากข้อความนี้ตรงกับกลุ่มนิยม (Collectivism)"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 116. ประกอบ"},{"n":118,"q":"สาเหตุของพฤติกรรมว่าเกิดจากปัจจัย หรือสถานการณ์ภายนอก","o":["หากข้อความนี้ตรงกับปัจเจกนิยม (Individualism)","หากข้อความนี้ตรงกับกลุ่มนิยม (Collectivism)"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 114. ประกอบ"},{"n":119,"q":"ความตื่นตระหนกทางวัฒนธรรมจะไม่เกิดขึ้นในสถานการณ์ใด","o":["การแต่งงานกับคู่สมรสต่างเชื้อชาติ","การเป็นผู้หนีภัยสู้รบในประเทศที่สาม","การศึกษาต่อต่างประเทศ","การท่องเที่ยวในพื้นที่ที่มีประชากรร่วมวัฒนธรรม"],"a":4,"e":"ความตื่นตระหนกทางวัฒนธรรม (Cultural Shock) เป็นประสบการณ์ส่วนบุคคลในการเผชิญกับแรงกดดันที่เกิด จากการสัมผัสกับวัฒนธรรมที่แตกต่างหรือไม่มีความ คุ้นเคย และรู้สึกสับสนหรือสูญเสียอัตลักษณ์จากวัฒนธรรมเดิม ซึ่งความตื่นตระหนกทางวัฒนธรรมมักเกิดขึ้นกับบุคคลที่เคลื่อนย้ายไปในพื้นที่แตกต่างทางวัฒนธรรม เช่น ผู้ลี้ภัย นักศึกษาต่างชาติ การมีคู่สมรสต่างชาติ องค์กรทางธุรกิจที่มีการปรับเปลี่ยนโครงสร้าง หรือแม้แต่การเผชิญกับความ เปลี่ยนแปลงทางสังคมและเทคโนโลยี ซึ่งในสังคมพหุวัฒนธรรมที่มีความหลากหลายชาติพันธุ์มักแฝงด้วยความขัดแย้ง และการซึมซับวัฒนธรรมในชีวิตประจำวัน อันเป็นที่มาของความตื่นตระหนกทางวัฒนธรรม นำไปสู่วิกฤติทางจิตใจ หรือความสัมพันธ์ทาง สังคม บกพร่องลง"},{"n":120,"q":"ข้อใดไม่ใช่การปรับตัวทางวัฒนธรรม","o":["การอาศัยในขุมชนของบุคคลชาติพันธุ์เดียวกัน","การขัดเกลาทางสังคมซ ้า","การพัฒนาอัตลักษณ์สองวัฒนธรรม","การเปลี่ยนแปลงตัวตนจากภายใน"],"a":1,"e":"การปรับตัวทางวัฒนธรรม (Cultural Adaptation) มีความหมายสรุปได้ดังนี้ 1. การจัดการความตื่นตระหนกทางวัฒนธรรมและการจุ่มตัวลงสู่สังคมที่แตกต่าง ซึ่งเป็น รูปแบบเฉพาะในการ ปรับตัวของมนุษย์ที่ถูกกล่าวถึงในบริบทของการขัดเกลาทางสังคม (Socialization), การขัดเกลาซ ้าทางสังคม (Resocialization) และความสัมพันธ์ของกลุ่มบุคคล 2. การปรับแต่งคุณลักษณะส่วนบุคคล หรือการเปลี่ยนแปลงตัวตนจากภายใน เพื่อทำเข้าใจ วัฒนธรรมที่แตกต่าง และ ปรับตัวได้อย่างมีประสิทธิภาพ โดยการฝึกให้เกิดความคุ้นชินกับ วัฒนธรรมใหม่ และพัฒนาไปสู่การเป็นบุคคลที่มีอัต ลักษณ์แบบสองวัฒนธรรม"}]},{"title":"ภาค S ปีการศึกษา 2565","items":[{"n":1,"q":"ข้อใดไม่ใช่ความสำคัญในการวิเคราะห์ประเมินบุคลิกภาพ","o":["เพื่อทำความเข้าใจพฤติกรรมและลักษณะเฉพาะตัวของบุคคล","เพื่ออธิบายพฤติกรรมของบุคคลอย่างถูกต้องตามหลักวิชาการ","เพื่อตีตราแบ่งแยกบุคคลตามกฎเกณฑ์ของสังคม","เพื่อการพัฒนาบุคลิกภาพให้เหมาะสมต่อการปรับตัวมากขึ้น"],"a":3,"e":"ความสำคัญของการวิเคราะห์และการประเมินบุคลิกภาพ มีดังนี้ 1. เป็นแนวทางในการทำความเข้าใจรูปแบบพฤติกรรมและลักษณะเฉพาะตัวของบุคคล ทั้งภายนอกและภายในที่ เกี่ยวข้องกับการปรับตัวต่อสิ่งแวดล้อม รวมถึงยังมีประโยชน์ทำให้บุคคลสาม\" รถเข้าใจตนเอง จนนำไปสู่การพัฒนา บุคลิกภาพตนเองให้เหมาะสม กับการบรับตัว 2. สามารถนำมาประยุกต์ใช้ประโยชน์ในบริบทที่หลากหลาย เช่น การคัดเลือกบุคคลในองค์กรและการศึกษา, ใช้ ประกอบการวินิจฉัยหรือบำบัดรักษาทางคลินิก, เป็นข้อมูลประกอบการพิจารณาคดีตามกฎหมาย และใช้ทำความเข้าใจ ตนเอง รวมถึงผู้อื่นเพื่อปรับตัวในการดำเนินชีวิต"},{"n":2,"q":"ข้อใดถูกต้องน้อยที่สุดเกี่ยวกับหลักการประเมินบุคลิกภาพ","o":["กำหนดเป้าหมายของพฤติกรรมที่จะประเมินให้ชัดเจน","ต้องมีความรู้ความเข้าใจเกี่ยวกับแนวคิดทฤษฎีที่เกี่ยวข้องกับการประเมิน","ควรเลือกวิธีการที่ดีที่สุดในการประเมินเพียงวิธีเดียว","ควรประเมินความพร้อมของผู้ประเมินและผู้รับการประเมินด้วย"],"a":3,"e":"หลักการพื้นฐานในการวิเคราะห์และประเมินบุคลิกภาพประการหนึ่ง คือเลือกใช้วิธีการหรือเครื่องมือในการ ประเมินที่มีความเหมาะสม ได้แก่ วิธีการประเมินทาง บุคลิกภาพที่เหมาะสมกับตัวบุคคล และบริบทที่เกี่ยวข้องกับการ ประเมิน รวมทั้งตระหนักด้วยว่า ไม่มีวิธีการใดที่ดีที่สุด แต่ควรใช้วิธีการหลากหลายอย่างเหมาะสม รวมถึงคุณภาพของ เครื่องมือหรือวิธีการด้วย เพื่อช่วยยืนยันถึงผลการประเมินที่ถูกต้องเชื่อถือได้"},{"n":3,"q":"ตามทฤษฎีจิตสังคมของอีริคสัน วัยรุ่นที่แต่งตัวตามบุคคลที่ชื่นชอบ อยู่ในพัฒนาการขั้นใด","o":["ความเป็นอัตลักษณ์กับความสับสนในบทบาท","ความมั่นคงสมบูรณ์ในชีวิตกับความสิ้นหวัง","การสืบทอดกับการคำนึงถึงแต่ตนเอง","ความใกล้ชิดสนิทสนมกับความรู้สึกโดดเดี่ยวอ้างว้าง"],"a":1,"e":"ทฤษฎีจิตสังคม (Psychosocial Theory) โดยอีริคสัน (Erik H. Erikson) แบ่งพัฒนาการของบุคคลเป็น 8 ชั้น ซึ่งใน ขั้นที่ 5 ความเป็นอัตลักษณ์กับความสับสนในบทบาที่ (อายุ 13 - 19 ปี) คือ วัยรุ่นจะเรียนรู้ว่าแต่ละคนมีบทบาทในสังคม แตกต่างกัน เขาจะเรียนรู้ว่าเขาเป็นทั้งเพื่อน นักเรียน เป็นเด็ก และพลเมือง วัยรุ่นหลายคนจะพบวิกฤติในการค้นหาตัวตน ของตัวเอง ในขั้นนี้หากพ่อแม่อนุญาตให้เขาออกไปค้นหาตัวเอง เขาก็จะค้นพบตัวเองได้ แต่ถ้า พ่อแม่เรียกร้องให้ลูกอยู่ ในกรอบของตัวเองอย่างเดียว วัยรุ่นอาจรู้สึกสับสนในบทบาทและรู้สึกหลงทาง ซึ่งบุคคลสำคัญในการพัฒนาช่วงนี้ คือ เพื่อน ๆ และบุคคลต้นแบบ เช่น วัยรุ่นมักจะแต่งตัวตามบุคคลที่ชื่นชอบ เป็นต้น"},{"n":4,"q":"ข้อใดกล่าวถูกต้องตามทฤษฎีการเรียนรู้เชิงปัญญาสังคมของแบนดูรา (Albert Bandura)","o":["มนุษย์ทุกคนมีความสามารถ มีศักยภาพที่จะพัฒนาตนเองไปในทิศทางที่ดีงาม","การหยุดชะงักของพัฒนาการแต่ละขั้นจะมีผลทำให้เกิดความผิดปกติทางบุคลิกภาพ","การให้รางวัลสามารถจูงใจเสริมสร้างบุคลิกลักษณะที่พึงประสงค์ได้","บุคลิกภาพเกิดจากการที่บุคคลมีปฏิสัมพันธ์กับคนอื่น ๆ"],"a":4,"e":"ทฤษฎีการเรียนรู้เชิงปัญญาสังคมของแบนดูรา (Albert Bandura) เชื่อว่า พฤติกรรมของมนุษย์ส่วนใหญ่เกิดจาก การสังเกตพฤติกรรมของผู้อื่น หรือการเรียนรู้จากตัวแบบ ซึ่งเกิดจากการที่บุคคลสังเกตการกระทำของผู้อื่นแล้วพยายาม เลียนแบบพฤติกรรมนั้น อีกส่วนหนึ่ง คือ บุคคลเรียนรู้จากประสบการณ์ของตนเอง ทฤษฎีนี้จึงให้ความสำคัญว่า บุคลิกภาพเกิดจากการที่บุคคลมีปฏิสัมพันธ์กับคนอื่น ๆ เรียนรู้บทบาทและมีพฤติกรรมตามตัวแบบในสังคม"},{"n":5,"q":"พฤติกรรมแบบใดที่อาจบ่งบอกถึง ความรู้สึกตื่นเต้นได้ชัดเจนที่สุด","o":["การนั่งยืดคอตั้งหลังตรง","การถูมือ","การนั่งกอดอก","การคว ่ามือขณะสนทนา"],"a":2,"e":"พฤติกรรมของคนที่มีความรู้สึกตื่นเต้น มักจะแสดงกิริยาอาการผ่านท่าทาง คือหายใจเร็วและแรงมาก เสียงสัน ตาโต การถูมือดูแขนไป ๆ มา ๆ เป็นต้น"},{"n":6,"q":"ข้อใดไม่ใช่หลักการพื้นฐานในการประเมินหรือวิเคราะห์บุคลิกภาพ","o":["คำนึงถึงจริยธรรมในการประเมิน","ต้องมีความรู้เกี่ยวกับทฤษฎีทางบุคลิกภาพ","กำหนดพฤติกรรมเป้าหมายให้ชัดเจนก่อนการประเมิน","การประเมินบุคลิกภาพเลือกวิธีการที่เหมาะสมที่สุดเพียงวิธีการเดียว"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 2. ประกอบ"},{"n":7,"q":"ข้อใดกล่าวถูกต้องเกี่ยวกับแนวทางการพัฒนาบุคลิกภาพภายใน","o":["ฝึกเป็นคนรักความสะอาด รักษาสุขอนามัย","ฝึกให้เป็นคนแต่งกายสวยงามเสริมบุคลิกภาพ","ฝึกให้เป็นคนอารมณ์ดี มีใบหน้ายิ้มแย้มแจ่มใส","ฝึกให้เป็นคนเข้าใจและยอมรับตนเองตามความเป็นจริง"],"a":4,"e":"แนวทางการพัฒนาบุคลิกภาพภายใน มีดังนี้ 1. จิตใจ คือ ฝึกให้มีความเชื่อมั่นในตนเอง เข้าใจและยอมรับจุดเด่นจุดด้อยของตนเองตามความเป็นจริง แก้ไขจุดด้อย พัฒนาจุดเด่น เป็นผู้มีเมตตา รู้จักให้อภัย ฯลฯ 2. สติปัญญา คือ ฝึกฝนตนให้มีความรอบรู้ เป็นผู้เรียนรู้ตลอดชีวิต เรียนรู้สิ่งใหม่ ค้นหาความสามารถด้านอื่น ๆ หมั่น แสวงหาประสบการณ์ใหม่ ฯลฯ 3. อารมณ์ คือ รู้จักมารยาทและกาลเทศะ ปฏิบัติต่อผู้อื่นด้วยความสุภาพ ควบคุมอารมณ์ไม่ให้หงุดหงิดหรือโกรธง่าย ฝึกให้เป็นคนยิ้มแย้มแจ่มใส มีอารมณ์ขัน ฯลฯ 4. สังคม คือ เมตตากรุณา มีน ้าใจต่อเพื่อนมนุษย์ มีจิตสาธารณะ เคารพความคิดเห็นของ ผู้อื่น มีทัศนคติและมุมมองที่ กว้าง สามารถเข้ากับผู้อื่นได้ ฯลฯ"},{"n":8,"q":"ข้อใดถือเป็นวิธีการสังเกตทางอ้อม","o":["ขณะที่ครูกำลังสอนหนังสือก็สังเกตพฤติกรรมของเด็กในห้องเรียนควบคู่ไปด้วย","นักจิตวิทยาสังเกตพฤติกรรมของเด็กผ่านกล้องบันทึกวิดีโอ","ตำรวจสังเกตพฤติกรรมของผู้ต้องหาขณะสืบสวนคดี","แม่สังเกตพฤติกรรมของลูกระหว่างที่ทำกิจกรรมร่วมกันในครอบครัว"],"a":2,"e":"การสังเกต แบ่งออกได้ 2 ลักษณะ ดังนี้ 1. การสังเกตทางตรง หมายถึง การที่ผู้สังเกตเฝ้าดูหรือศึกษาพฤติกรรมด้วยตนเอง 2. การสังเกตทางอ้อม หมายถึง การสังเกตที่ผู้สังเกตไม่ได้เฝ้าดูพฤติกรรมโดยตรง แต่อาศัย ถ่ายทอดข้อมูลอีกทาง หนึ่งจากผู้อื่น หรืออุปกรณ์ต่าง ๆ เช่น ภาพถ่าย บันทึกเสียงหรือกล้องบันทึกวิดีโอ เป็นต้น"},{"n":9,"q":"การยิ้มที่ \"ดูไม่สอดคล้องเป็นธรรมชาติ รูปปากดูโค้งงอ ปากด้านบนดูเหมือนยิ้ม ในขณะที่ด้านล่าง เหมือนขมวดเข้าหากัน\" เป็นลักษณะการยิ้มแบบใด","o":["ยิ้มแบบหม่นหมอง","ยิ้มแบบจริงใจ","ยิ้มแบบเสแสร้ง","ยิ้มแบบขบขัน"],"a":1,"e":"ยิ้มแบบหม่นหมอง (Gloomy Smile) เป็นรอยยิ้มของคนที่กำลังมีความทุกข์ผิดหวัง, ล้มเหลว หรือว่าเสียใจ โดย ลักษณะที่พอสังเกตได้ คือ ยิ้มมุมปากไปด้านใดด้านหนึ่งหรือทั้งสองข้าง ครึ่งปากอาจจะแสดงว่ากำลังยิ้มอยู่ ในขณะที่ อีกครึ่งปากดูหมองเศร้า ดังนั้น จึงเป็นการยิ้มที่ดูไม่สอดคล้องเป็นธรรมชาติ รูปปากดูโค้งงอ ปากด้านบนดูเหมือนยิ้ม ในขณะ ที่ด้านล่างเหมือนขมวดเข้าหากัน"},{"n":10,"q":"ข้อใดกล่าวถูกต้องเกี่ยวกับแนวทางการพัฒนาบุคลิกภาพภายนอก","o":["ฝึกฝนให้ตนรักการเรียนรู้ตลอดชีวิต เรียนรู้สิ่งใหม่ ๆ","ฝึกให้เป็นคนอารมณ์ดี มีใบหน้ายิ้มแย้มแจ่มใส","มีน ้าใจต่อเพื่อนมนุษย์ มีจิตสาธารณะ เมตตากรุณา","ฝึกให้มีความเชื่อมั่นในตนเอง ยอมรับจุดเด่นจุดด้อยของตนเอง"],"a":2,"e":"แนวทางการพัฒนาบุคลิกภาพภายนอก มีดังนี้ 1. รูปร่างหน้าตา คือ ฝึกให้เป็นคนอารมณ์ดี มีใบหน้ายิ้มแย้มแจ่มใส ฯลฯ 2. การแต่งกาย คือ เลือกสวมใส่เสื้อผ้าเหมาะสมกับอายุหรือวัย กาลเทศะ เลือกเสื้อผ้า ที่พรางจุดด้อยและเสริมจุดเด่น ใช้เครื่องประดับ กระเป๋า รองเท้าที่เหมาะสม ฯลฯ 3. กิริยาท่าทาง คือ ฝึกฝนให้เป็นผู้มีกิริยาท่าทางที่สุภาพ ถูกต้องตามกาลเทศะ การพูดหรือใช้ภาษาให้ถูกต้อง มี น ้าเสียงนุ่มนวลจริงใจ การยืน/การเดินอย่างงามสง่า ฯลฯ 4. สุขภาพอนามัย คือ รักษาสุขภาพร่างกายให้แข็งแรง รับประทานอาหาร ดื่มน ้า และ พักผ่อนให้เพียงพอกับวัย ออก กำลังกายเป็นประจำ ฯลฯ"},{"n":11,"q":"การอนุมานสาเหตุภายในที่เน้นอธิบายความคิดเบื้องหลังการกระทำ พบได้ในบุคคลข้อใด","o":["บุคคลในวัฒนธรรมแบบกลุ่มนิยม","บุคคลที่มีอัตลักษณ์ทางวัฒนธรรมมากกว่า 1 รูปแบบ","บุคคลที่ขาดความตระหนักทางวัฒนธรรม","บุคคลในวัฒนธรรมแบบปัจเจกนิยม"],"a":4,"e":"ความแตกต่างทางวัฒนธรรมกับการอนุมานสาเหตุภายใน (Internal Attribution) คือ การอธิบายความคิด เบื้องหลังการกระทำโดยอนุมานจากความคิด/ความรู้สึก ที่เกิดขึ้นภายในตัวๆคคล จึงมักพบได้กับบุคคลในวัฒนธรรม แบบปัจเจกนิยม เช่น ฉันสอบได้เกรด A เพราะฉันเป็นคนเก่ง สมองดี เป็นต้น"},{"n":12,"q":"มุมมองทางบวกต่อตนเองแบบไม่อิงความเป็นจริง มักพบได้ในบุคคลข้อใด","o":["บุคคลที่มีอัตลักษณ์ทางวัฒนธรรมมากกว่า 1 รูปแบบ","บุคคลในวัฒนธรรมแบบปัจเจกนิยม","บุคคลที่ขาดความตระหนักทางวัฒนธรรม","บุคคลในวัฒนธรรมแบบกลุ่มนิยม"],"a":2,"e":"ความแตกต่างทางวัฒนธรรมกับมุมมองที่มีต่อตนเอง (Self View/Self Esteem) หมายถึง วัฒนธรรมปัจเจกนิยม และกลุ่มนิยมจะมีอิทธิพลต่อมุมมองที่มีต่อตนเองของบุคคลที่อยู่ภายใต้วัฒนธรรมนั้น กล่าวคือ บุคคลในวัฒนธรรมแบบ ปัจเจกนิยมจะมีมุมมองทางบวกหรือทางลบต่อตนเองแบบไม่อิงความเป็นจริงจากกลุ่มสังคม ในขณะที่บุคคลใน วัฒนธรรมแบบกลุ่มนิยมจะมีมุมมองต่อตนเอง โดยยึดโยงกับกลุ่มในสังคมเป็นหลัก"},{"n":13,"q":"การเผชิญกับแรงกดดันที่เกิดจากการสัมผัสกับวัฒนธรรมที่ไม่คุ้นเคย ก่อให้เกิดสิ่งใด","o":["ความหวาดกลัวทางวัฒนธรรม","ความเปิดรับทางวัฒนธรรม","ความเริงร่าทางวัฒนธรรม","ความตื่นตระหนกทางวัฒนธรรม"],"a":4,"e":"ความตื่นตระหนกทางวัฒนธรรม (Cultural Shock) เป็นประสบการณ์ส่วนบุคคลในการเผชิญกับแรงกดดันที่เกิด จากการสัมผัสกับวัฒนธรรมที่แตกต่างหรือไม่มีความคุ้นเคย และรู้สึกสับสนหรือสูญเสียอัตลักษณ์จากวัฒนธรรมเดิม ซึ่ง ความตื่นตระหนกทางวัฒนธรรมมักเกิดขึ้นกับบุคคลที่เคลื่อนย้ายไปในพื้นที่แตกต่างทางวัฒนธรรม"},{"n":14,"q":"เป้าหมายของการปรับตัวทางวัฒนธรรม คือข้อใด","o":["การเลี่ยงการเผชิญปัญหา","การพัฒนาอัตลักษณ์แบบสองวัฒนธรรม","การซึมซับวัฒนธรรมใหม่","การละทิ้งวัฒนธรรมเดิม"],"a":2,"e":"การปรับตัวทางวัฒนธรรม (Cultural Adaptation) คือ การปรับแต่ง คุณลักษณะส่วนบุคคล เพื่อทำความเข้าใจ วัฒนธรรมที่แตกต่างและการปรับตัวได้อย่าง มีประสิทธิภาพ โดยการฝึกให้เกิดคุ้นชิ่นกับวัฒนธรรมใหม่ และพัฒนา ไปสู่การเป็นบุคคล ที่มีอัตลักษณ์แบบสองวัฒนธรรม"},{"n":15,"q":"ช่วงที่ความตื่นตระหนกทางวัฒนธรรมทวีความรุนแรงขึ้น คือช่วงใด","o":["ช่วงฮันนี้มูน","ช่วงวิกฤต","ช่วงปรับเปลี่ยน","ช่วงตระหนักถึงปัญหา"],"a":2,"e":"วงจรของความตื่นตระหนกทางวัฒนธรรมมีลักษณะต่อเนื่องแบ่งออกเป็น 4 ช่วง ได้แก่ 1. ช่วงฮันนีมูน หรือท่องเที่ยว เป็นระยะที่บุคคลมีความตื่นเต้น และเกิดความรื่นรมย์กับความแปลกใหม่ของ วัฒนธรรมใหม่ 2. ช่วงวิกฤต หรือเกิดความตื่นตระหนกทางวัฒนธรรมทวีความรุนแรงขึ้น เป็นระยะที่เริ่มประสบกับความไม่พึง พอใจ ต้องพบเจอประสบการณ์ทางลบ ส่งผลให้เกิดความรู้สึก ผิดหวัง นำไปสู่ความรู้สึกต่อต้านวัฒนธรรมใหม่ 3. ช่วงปรับเปลี่ยน หรือกำหนดทิศทางใหม่ หรือฟื้นกลับ เป็นระยะที่บุคคลเริ่มยอมรับความแตกต่างทางวัฒนธรรม ได้ หากเป็นคนที่ทำงานในต่างประเทศก็จะกลับบ้านเกิดเป็นบางเวลา 4. ช่วงปรับตัว หรือช่วงหาทางออก หรือช่วงปรับตัวทางวัฒนธรรม เป็นระยะที่สามารถยอมรับวัฒนธรรมใหม่ มี ความคิดว่าตนเองไม่สามารถเปลี่ยนแปลงวัฒนธรรมใหม่ได้จึงสามารถปรับตัว เปลี่ยนแปลงบุคลิกภาพ และอยู่อาศัยใน สิ่งแวดล้อมใหม่ และไม่มีความแตกตื่นทางวัฒนธรรม"},{"n":16,"q":"ข้อใดถูกต้องเกี่ยวกับการหยุดชะงักในขั้นอวัยวะขับถ่ายทวารหนัก (Anal Stage) ตามทฤษฎีจิต วิเคราะห์","o":["บุคลิกภาพชอบนินทา","บุคลิกภาพเลียนแบบเพศตรงข้าม","บุคลิกภาพจู้จี้ขี้บ่น","บุคลิกภาพตระหนี่ถี่เหนี่ยว"],"a":3,"e":"ฟรอยด์ (Sigmund Freud) ได้แบ่งพัฒนาการทางบุคลิกภาพของบุคคลออกเป็น 5 ระยะ ซึ่งระยะที่ 2 ได้แก่ ขั้น อวัยวะขับถ่ายทวารหนัก (Anal Stage) อายุ 18 เดือน - 3 ปี เป็นชั้นที่ความสุขและความพึงพอใจของเด็กอยู่ที่การขับถ่าย ซึ่งหากเกิดการหยุดชะงักในขั้นนี้ เมื่อโตขึ้นจะมีปัญหาทางบุคลิกภาพ 2 แบบ ได้แก่ 1. บุคลิกภาพแบบสมบูรณ์ จะเกิดกับเด็กที่มีบุคลิกภาพอ่อนแอ คือ เป็นคนเจ้าระเบียบ จู้จี้ขี้บ่น ย ้าคิดย ้าทำ กังวลมาก เกินไปโดยเฉพาะในเรื่องความสะอาด 2. บุคลิกภาพแบบอันธพาล จะเกิดกับเด็กที่มีบุคลิกภาพเข้มแข็ง คือ เป็นคนไม่ยอมคน คัดค้านระเบียบแบบแผนที่วาง ไว้ ไม่มีระเบียบ"},{"n":17,"q":"ผู้ที่มีความสนใจเรียนรู้สิ่งใหม่ แสวงหาความรู้ที่หลากหลาย ตรงกับการพัฒนาบุคลิกภาพด้านใด","o":["อารมณ์","จิตใจ","สติปัญญา","สังคม"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 7. ประกอบ"},{"n":18,"q":"วิธีการ \"สนทนาพูดคุย\" เป็นหลักสำคัญในการประเมินบุคลิกภาพแบบใด","o":["สังเกต","สัมภาษณ์","แบบสอบถาม","แบบทดสอบทางจิตวิทยา"],"a":2,"e":"การสัมภาษณ์ หมายถึง การสนทนาพูดคุยอย่างมีเป้าหมาย เพื่อให้เกิดความกระจ่างให้ข้อมูลหรือลักษณะสำคัญ เฉพาะตัว จำแนกได้ 3 ลักษณะ ได้แก่ 1. การสัมภาษณ์แบบมีโครงสร้าง (มีรูปแบบ ขั้นตอน วิธีการ หรือข้อคำถามที่ชัดเจนตายตัว) 2. การสัมภาษณ์แบบไม่มีโครงสร้าง (มีรูปแบบ ขั้นตอน วิธีการ หรือข้อคำถามที่ไม่ตายตัว) 3. การสัมภาษณ์แบบกึ่งโครงสร้าง (อยู่ระหว่างแบบที่ 1 และแบบที่ 2)"},{"n":19,"q":"การนั่งไขว่ห้าง สามารถสะท้อนถึงพฤติกรรมทางจิตวิทยาแบบใดได้ชัดเจนที่สุด","o":["ไม่มั่นใจในตนเอง","ผ่อนคลาย","อึดอัดในสถานการณ์","เขินอาย"],"a":2,"e":"การนั่งเอาขาไขว่ห้างกันสามารถแสดงออกได้ 2 ความรู้สึก คือ รู้สึกผ่อนคลาย กับรู้สึกปกป้องตัวเองหรือปิดบัง อะไรบางอย่างอยู่ โดยสามารถสังเกตจากความแน่นเกริงของ ลักษณะขา ซึ่งหากกำลังรู้สึกผ่อนคลายอยู่จะมีลักษณะเป็น การนั่งไขว่ห้างที่ดูหลวม ๆ แต่ถ้า รู้สึกต้องการปกป้องตัวเอง กังวล หรือรู้สึกถูกบีบคั้น ลักษณะการนั่งก็จะดูรัดกุม และ หนีบขาแน่นมากขึ้น"},{"n":20,"q":"ข้อใดถูกต้องเกี่ยวกับการมีสุขภาพจิตที่ดี","o":["มีอารมณ์มั่นคง","ใช้ศักยภาพที่มีจัดการปัญหาได้ดี","รับรู้อารมณ์ตนเองได้เมื่อโกรธ","ถูกทุกข้อ"],"a":4,"e":"สุขภาพจิตที่ดีเป็นพื้นฐานสำคัญของกระบวนการคิด การเรียนรู้การสื่อสาร และความเข้มแข็งทางจิตใจ โดย ผู้เชี่ยวชาญด้านจิตวิทยาชี้ว่า ผู้ที่มีสุขภาพจิต ที่ดี มักจะมีลักษณะดังนี้ 1. เป็นคนที่เข้าใจชีวิต และมีจุดมุ่งหมายในชีวิต 2. ไม่มีความรู้สึกสิ้นหวัง คิดบวก มองโลกในแง่ดี 3. มีอารมณ์มั่นคง สามารถรับรู้อารมณ์ตนเองได้เมื่อโกรธ 4. ใช้ศักยภาพที่มีจัดการปัญหาได้ดี 5. มีความรู้สึกที่ดีต่อตนเองและผู้อื่น ฯลฯ"},{"n":21,"q":"ข้อใดไม่เป็นลักษณะที่บ่งชี้ถึงความแตกต่างระหว่างบุคคลที่ได้รับอิทธิพลจากสังคม","o":["เจตคติเกี่ยวกับความเชื่อในสิ่งศักดิ์สิทธิ์","รสนิยมและความสนใจทางเพศ","ฝาแฝดที่เกิดจากไข่ใบเดียวกัน","เอกลักษณ์ของนักศึกษาแต่ละมหาวิทยาลัย"],"a":3,"e":"ลักษณะที่บ่งชี้ถึงความแตกต่างระหว่างบุคคลที่ได้รับอิทธิพลจากสังคม ได้แก่รสนิยมและความสนใจทางเพศ ประสบการณ์ การปรับตัว ทัศนคติ เจตคติ เอกลักษณ์ ฯลฯ (ส่วนตัวเลือกข้อ 3 บ่งชี้ถึงความแตกต่างระหว่างบุคคลที่ ได้รับอิทธิพลจากพันธุกรรม)"},{"n":22,"q":"กล้ามีพฤติกรรมก้าวร้าวหลังได้รับบาดเจ็บทางสมอง ตรงกับสาเหตุใด","o":["สาเหตุทางร่างกาย","สาเหตุทางจิตใจ","สาเหตุทางสังคมเศรษฐกิจ","สาเหตุทางสิ่งแวดล้อม"],"a":1,"e":"สาเหตุของการเกิดปัญหาสุขภาพจิต มีดังนี้ 1. สาเหตุทางร่างกาย ได้แก่ พันธุกรรม หรือโรคทางกาย ความพิการ อุบัติเหตุทางสมอง ฯลฯจะทำให้บุคคลนั้นมี อารมณ์แปรปรวน เกิดความวิตกกังวล ท้อแท้ คิดมาก จนมีผลกระทบต่อ สุขภาพจิตได้ 2. สาเหตุทางจิตใจ ได้แก่ การถูกทารุณกรรม การสูญเสียบุคคลที่รัก ความผิดหวังรุนแรงจากเหตุการณ์เลวร้ายที่ เกิดขึ้นในอดีต ฯลฯ ทำให้เกิดความทุกข์ความไม่สบายใจเป็นเวลานานจนอาจทำให้เกิดความเจ็บป่วยทางจิต หรือเกิด ปัญหาสุขภาพจิตได้ 3. สาเหตุทางสถานะเศรษฐกิจสังคม ได้แก่ การถูกไล่ออกจากงาน ปัญหาหนี้สิน ฯลฯ 4. สาเหตุทางสิ่งแวดล้อม ได้แก่ การเกิดโรคระบาด และการประสบภัยธรรมชาติ เช่น น ้าท่วมไฟไหม้ แผ่นดินไหว ฯลฯ ซึ่งสถานการณ์เหล่านี้จะมีผลกระทบต่อจิตใจอย่างรุนแรง จนทำให้เกิดปัญหาสุขภาพจิตได้"},{"n":23,"q":"ติ๊กเกิดความวิตกกังวลอย่างมากหลังจากถูกไล่ออกจากงาน ตรงกับสาเหตุใด","o":["สาเหตุทางร่างกาย","สาเหตุทางจิตใจ","สาเหตุทางสังคมเศรษฐกิจ","สาเหตุทางสิ่งแวดล้อม"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 22. ประกอบ"},{"n":24,"q":"ชิชาไม่อยากไปโรงเรียนเพราะแม่ป่วยหนัก จึงอยากอยู่กับแม่หลอดเวลา ตรงกับสาเหตุใด","o":["สาเหตุทางร่างกาย","สาเหตุทางจิตใจ","สาเหตุทางสังคมเศรษฐกิจ","สาเหตุทางสิ่งแวดล้อม"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 22. ประกอบ"},{"n":25,"q":"แจ็คมีอาการปวดมวนในท้อง มือชา และเหงื่อออกมากกว่าปกติ ตรงกับข้อใด","o":["ด้านจิตใจ","ด้านอารมณ์","ด้านร่างกาย","ด้านพฤติกรรม"],"a":3,"e":"สัญญาณเตือนของปัญหาสุขภาพจิต มีดังนี้ 1. ด้านร่างกาย ได้แก่ ปวดศีรษะ ปวดตึงกล้ามเนื้อบริเวณคอ บ่า ไหล่ เหนื่อยง่าย อ่อนเพลียไม่มีเรี่ยวแรง ปวดมวนใน ท้อง มือชา เหงื่อออกมากกว่าปกติ มีปัญหาด้านการกินหรือนอน 2. ด้านอารมณ์และจิตใจ ได้แก่ เครียด วิตกกังวล หงุดหงิดง่าย เบื่อหน่าย ท้อแท้ สิ้นหวัง เช็ง ซึมเศร้า สับสน หวาดกลัว ระแวง อารมณ์เปลี่ยนแปลงง่าย และมีความคิดอยากตาย 3. ด้านพฤติกรรม ได้แก่ ไม่มีสมาธิในการเรียนหรือการทำงาน แยกตัวออกจากสังคม ก้าวร้าวใช้ยาหรือสารเสพติด ฯลฯ"},{"n":26,"q":"แมคใช้ยานอนหลับเพิ่มมากขึ้นจากเดิมจึงจะนอนหลับได้ ตรงกับข้อใด","o":["ด้านจิตใจ","ด้านอารมณ์","ด้านร่างกาย","ด้านพฤติกรรม"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 25. ประกอบ"},{"n":27,"q":"เป็นคนที่มีทัศนคติทางลบ อิจฉาและารู้สึกไม่ไว้วางใจเพื่อนร่วมงาน ตรงกับข้อใด","o":["โรคซึมเศร้า","โรควิตกกังวล","บุคลิกภาพแบบุหวาดระแวง","บุคลิกภาพแบบต่อต้านสังคม"],"a":3,"e":"บุคลิกภาพแบบหวาดระแวง คือ บุคคลที่มีลักษณะหวาดระแวงสงสัยในการกระทำของบุคคลอื่น รู้สึกไม่ไว้วางใจ ระแวงสงสัยคนรอบข้าง ผู้ใกล้ชิด และมักมองว่าการกระทำของคนรอบข้างเป็นภัยคุกคาม เป็นอันตราย หรือเป็นการ ทรยศหักหลัง โดยที่ผู้อื่นไม่ได้เป็นเช่นนั้น คนเหล่านี้มักมีทัศนคติด้านลบ อิจฉาริษยาผู้อื่น หรือรู้สึกว่าตนมีความสำคัญ มากเกินไป และมีแนวโน้มจะเข้าใจการกระทำที่เป็นธรรมดาหรือการกระทำที่หวังดีของคนอื่นเป็นการก้าวร้าวหรือ ดูถูก ดูหมิ่นตน"},{"n":28,"q":"เป็นคนที่ฝันร้ายบ่อย ๆ มีประสบการณ์ถูกทารุณกรรมในอดีต ไม่สามารถควบคุมความคิดเกี่ยวกับ ประสบการณ์ในอดีตได้ ตรงกับข้อใด","o":["โรคซึมเศร้า","โรควิตกกังวล","บุคลิกภาพแบบุหวาดระแวง","บุคลิกภาพแบบต่อต้านสังคม"],"a":2,"e":"ประเภทของโรควิตกกังวลชนิดหนึ่ง คือ โรคเครียดหลังผ่านเหตุการณ์ร้ายแรง (Post - Traumatic Stress Disorder : PTSD) เป็นภาวะทางจิตที่เกิดจากการเผชิญ กับเหตุการณ์ตึงเครียด น่ากลัว หรือกระทบกระเทือนจิตใจอย่างรุนแรง ซึ่ง อาจเป็นประสบการณ์โดยตรง หรือการพบเห็นเหตุการณ์นั้น ๆ จนทำให้ผู้ป่วยอาจเห็นภาพในอดีต ฝันร้ายเกี่ยวกับ เหตุการณ์ที่เกิดขึ้น รู้สึกวิตกกังวล ไม่สามารถควบคุมความคิดเกี่ยวกับประสบการณ์ในอดีตได้จนอาจส่งผลให้นอนไม่ หลับและไม่มีสมาธิด้วย โดยอาการเหล่านี้จะค่อนข้างรุนแรงและเกิดขึ้นอย่างสม ่าเสมอจนอาจกระทบต่อการใช้ ชีวิตประจำวันได้"},{"n":29,"q":"เป็นคนที่ไม่สนใจความรู้สึกของคนอื่น ไม่ชอบทำตามกฎเกณฑ์ของสังคม ไม่รู้สึกต่อการกระทำที่ ไม่เหมาะสมุซองตนเอง ตรงกับข้อใด","o":["โรคซึมเศร้า","โรควิตกกังวล","บุคลิกภาพแบบุหวาดระแวง","บุคลิกภาพแบบต่อต้านสังคม"],"a":4,"e":"บุคลิกภาพแบบต่อต้านสังคม คือ บุคคลที่มีนิสัยแข็งกระด้าง ก้าวร้าวไม่รู้สึกผิด ไม่มีความรับผิดชอบ ไม่สนใจ ความรู้สึกของคนอื่น โดยมักยึดถือความพึงพอใจของ ตัวเองเป็นหลัก และไม่ชอบทำตามกฎเกณฑ์ของสังคมที่ขัดแย้ง กับความต้องการของตน จึงมีพฤติกรรมแหกกฎอยู่บ่อยครั้ง และอาจนำไปสู่พฤติกรรมติดสุราหรือใช้สารเสพติด ทำให้ผู้ ที่มีบุคลิกภาพต่อต้านสังคมมีแนวโน้มที่จะใช้ความรุนแรง และไม่สามารถรับผิดชอบหน้าที่การงานหรือชีวิตครอบครัว ได้ ซึ่งบุคลิกภาพต่อต้านสังคมมักพบในวัยเด็กหรือวัยรุ่น และส่งผลต่อการใช้ชีวิตของผู้ป่วยในระยะยาว"},{"n":30,"q":"เป็นคนที่หมดความสนใจต่อสิ่งรอบตัว อยากร้องไห้ตลอดทั้งวัน รู้สึกสิ้นหวัง ท้อแท้ ตรงกับข้อใด","o":["โรคซึมเศร้า","โรควิตกกังวล","บุคลิกภาพแบบุหวาดระแวง","บุคลิกภาพแบบต่อต้านสังคม"],"a":1,"e":"โรคซึมเศร้า คือ โรคทางอารมณ์ชนิดหนึ่ง ซึ่งผู้ป่วยจะมีอารมณ์ซึมเศร้านานต่อเนื่องติดต่อกันอย่างน้อย 2 สัปดาห์ โดยจะมีอาการเศร้าอย่างมาก อยากร้องไห้อยู่ตลอดเวลา ไม่มีความสนใจในสิ่งรอบตัวหรือในกิจกรรมต่าง ๆ ที่จะช่วยให้ กลับมามีความสุขสดชื่นเหมือนเดิม เรือหน่ายไปกับทุกสิ่ง รู้สึกท้อแท้ หดหู่ สิ้นหวังอย่างรุนแรง มองตัวเองไม่ดีและอาจ มีความคิดอยากฆ่าตัวตาย เป็นต้น"},{"n":31,"q":"ข้อใดกล่าวถูกต้องน้อยที่สุดเกี่ยวกับการใช้แบบทดสอบทางจิตวิทยา","o":["การประเมินโดยใช้แบบทดสอบถือเป็นวิธีที่น่าเชื่อถือที่สุดในการประเมินบุคลิกภาพ","นักจิตวิทยาต้องมีจรรยาบรรณในการวิเคราะห์และแปลผลแบบทดสอบ","ผู้ใช้ต้องมีความรู้และทักษะการวิเคราะห์ประเมินผลแบบทดสอบนั้น ๆ","เป็นแบบทดสอบที่มีการศึกษาวิจัยถึงคุณภาพและความน่าเชื่อถือ"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 2. ประกอบ แนวทางการประเมินบุคลิกภาพประการหนึ่ง คือ การใช้แบบทดสอบทาง จิตวิทยา ถือเป็นวิธีการที่ได้รับความนิยม โดยเฉพาะบทบาทวิชาชีพที่เกี่ยวข้องกับการประเมินทางจิตวิทยา เช่น นักจิตวิทยา หรือนักจิตวิทยาคลินิก ฯลฯ เนื่องจาก คุณสมบัติและลักษณะของแบบทดสอบที่มีความเป็นมาตรฐาน กระบวนการทดสอบและแปลผลที่ชัดเจน และมีการ ศึกษาถึงคุณภาพของเครื่องมือที่น่าเชื่อถือ จึงได้รับการยอมรับเป็นวงกว้าง แต่สิ่งสำคัญก็คือไม่ควรตีตราและยึดถือผล ของการทดสอบที่มากเกินไป"},{"n":32,"q":"ข้อใดไม่ใช่อิทธิพลของสิ่งแวดล้อมก่อนคลอด","o":["การเจ็บป่วยและการติดเชื้อขณะตั้งครรภ์","การรับประทานอาหารและยาของมารดา","สุขภาพจิตของมารดาขณะตั้งครรภ์","การลดน ้าหนักหลังคลอดของมารดา"],"a":4,"e":"สิ่งแวดล้อมก่อนคลอด คือ ตั้งแต่การปฏิสนธิของตัวอ่อนในครรภ์มารดา เมื่อมารดา รับรู้ว่าตนเองได้ตั้งครรภ์แล้ว การดูแลบำรุงครรภ์ของมารดาถือว่าเป็นสิ่งสำคัญ โดยสิ่งแวดล้อม ก่อนคลอดที่สำคัญ ได้แก่ 1. สุขภาพร่างกายของมารดา 2. สุขภาพจิตของมารดา 3. การบริโภคข่องมารดา 4. การได้รับสารพิษและการได้รับรังสี 5. อายุของมารดา 6. จำนวนทารกในครรภ์"},{"n":33,"q":"ข้อใดไม่ใช่ความผิดปกติที่มีสาเหตุหลักมาจากพันธุกรรม","o":["ตาบอดสี","ความบกพร่องทางสติปัญญา","ดาวน์ซินโดรม","ความฉลาดทางอารมณ์"],"a":4,"e":"สาเหตุหลักสำคัญที่ทำให้เกิดความแตกต่างระหว่างบุคคลมี 2 ประการ คือ 1. พันธุกรรม (Genetic) เป็นการถ่ายทอดคุณลักษณะทางด้านชีวภาพทั้งหมดจากพ่อและแม่ไปสู่ลูก โดยมียืน (Gene) เป็นหน่วยของพันธุกรรมที่กำหนดคุณลักษณะทางชีวภาพ ซึ่งการ ถ่ายทอดทางพันธุกรรมจะทำให้เกิดความแตกต่างทาง สายพันธุ์และเชื้อชาติ รวมถึงโรค หรือความผิดปกติทางร่างกายบางด้านที่ถูกถ่ายทอดทางพันธุกรรม เช่น ตาบอดสี ความ บกพร่อง ทางสติปัญญา ด'วน์ซินโดรม ฯลฯ 2. สิ่งแวดล้อม (Environment) มีส่วนสำคัญกับคนเราตั้งแต่เริ่มมีการปฏิสนธิในครรภ์มารดาจนกระทั่งคลอด และ เติบโตกลายมาเป็นส่วนหนึ่งของสังคม โดยสิ่งแวดล้อมที่มีผลทำให้เกิดความแตกต่างระหว่างบุคคลสามารถจำแนก ออกเป็น 3 ช่วง ได้แก่ สิ่งแวดล้อมก่อนคลอด สิ่งแวดล้อมขณะคลอด และสิ่งแวดล้อมหลังคลอด"},{"n":34,"q":"พฤติกรรมของบุคคลในข้อใดที่สะท้อนถึงการนำหลักความแตกต่างระหว่างบุคคลไปปรับใช้ในชีวิต ได้ดี","o":["ส้มใช้ความพยายามตั้งใจทำงาน เพื่อแก้ไขความผิดพลาดในงานของตนเอง","เงาะสอบถามความถนัดของสมาชิกกลุ่ม เพื่อมอบหมายงานตามความถนัดของแต่ละคน","แตงกวาสมัครเรียนต่อมหาวิทยาลัยในสาขาที่เพื่อนสนิทของตนเองได้เลือกเรียนให้","กล้วยพยายามโน้มน้าวเพื่อนนักเรียนคนอื่น ๆ ให้สมัครเข้าชมรมดนตรีไทยของตนเอง"],"a":2,"e":"การศึกษาและทำความเข้าใจเกี่ยวกับความแตกต่างระหว่างบุคคล จะช่วยให้บุคคล มีความรู้ความเข้าใจเกี่ยวกับ บุคลิกภาพของแต่ละคนเป็นพื้นฐาน ซึ่งถือได้ว่าเป็นปรากฏการณ์ธรรมชาติของมนุษย์แต่ละคนที่จะมีความคิด ความรู้สึก และมีบุคลิกภาพที่แตกต่างกันไปตามประสบการณ์ ดังนั้นในฐานะที่มนุษย์ต้องพึ่งพาอาศัยและมีปฏิสัมพันธ์ร่วมกับ บุคคลอื่น ๆ ใน สังคม การเรียนรู้ที่จะยอมรับถึงความแตกต่างระหว่างบุคคลจึงถือเป็นสิ่งสำคัญที่ช่วยให้บุคคลสามารถ ขจัดอคติส่วนตนออกไปได้และนำไปสู่บรรยากาศที่ดี จนเกิดความร่วมมือกันมากกว่า ที่จะเกิดความขัดแย้งระหว่างกัน"},{"n":35,"q":"บุคคลที่มีความสนใจในตนเองมากกว่าสังคม เป็นคนที่ไม่กล้าแสดงออก ตรงกับบุคลิกภาพข้อใด ตามแนวคิดของคาร์ล จุง","o":["บุคลิกภาพแบบเปิดเผยตัว","บุคลิกภาพแบบเก็บตัว","บุคลิกภาพแบบเข้าสังคม","บุคลิกภาพแบบกลาง ๆ"],"a":2,"e":"คาร์ล จุง (Carl Jung) ซึ่งเป็นนักจิตวิทยาชาวสวิตเซอร์แลนด์ ได้ศึกษาและจำแนกบุคลิกภาพบุคคลออกเป็น ลักษณะใหญ่ 2 กลุ่ม ได้แก่ 1. ลักษณะของบุคลิกภาพแบบเก็บตัว (Introvert) คือ บุคคลที่ไม่กล้าแสดงออก ขี้อายให้ความสนใจกับตนเอง มากกว่าสังคม 2. ลักษณะของบุคลิกภาพแบบเปิดเผยตัวตน (Extrovert) คือ บุคคลที่ชอบแสดงตนชอบพูดคุย สนุกสนาน กล้า แสดงออก ชอบการเข้าสังคมนอกจากนี้คาร์ล จุง ได้กล่าวถึงบุคคลที่อาจมีลักษณะไม่เด่นชัดว่า บุคลิกภาพแบบกลาง ๆ (Ambivert) คือ ไม่ชอบเก็บตัวมากไป และไม่ชอบแสดงออกมากไป"},{"n":36,"q":"การปลูกฝังค่านิยมทางสังคมของโรงเรียน จัดว่าเป็นอิทธิพลสิ่งแวดล้อมแบบใด","o":["สิ่งแวดล้อมก่อนคลอด","สิ่งแวดล้อมหลังคลอด","สิ่งแวดล้อมขณะคลอด","สิ่งแวดล้อมและพันธุกรรม"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 33. ประกอบ สิ่งแวดล้อมหลังคลอดที่สำคัญประการหนึ่ง ได้แก้สิ่งแวดล้อมในสถานศึกษา คือ สถานศึกษาประกอบด้วย สิ่งแวดล้อมทางกายภาพ และบุคคล ที่อยู่รอบตัวนักเรียน เพื่อนนักเรียน ครูอาจารย์ ล้วนมีผลต่อการเติบโตของนักเรียน ได้ทั้งสิ้น"},{"n":37,"q":"ความแตกต่างระหว่างบุคคลมีสาเหตุหลัก คือข้อใด","o":["สิ่งแวดล้อมก่อนคลอด","สิ่งแวดล้อมหลังคลอด","สิ่งแวดล้อมขณะคลอด","สิ่งแวดล้อมและพันธุกรรม"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 33. ประกอบ"},{"n":38,"q":"ความยากลำบากในการทำคลอด ส่งผลให้เด็กทารกขาดออกซิเจนชั่วขณะ ตรงกับข้อใด","o":["สิ่งแวดล้อมก่อนคลอด","สิ่งแวดล้อมหลังคลอด","สิ่งแวดล้อมขณะคลอด","สิ่งแวดล้อมและพันธุกรรม"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 33. ประกอบ สิ่งแวดล้อมขณะคลอด คือ หลังจากที่ทารกมีการเจริญเติบโตอยู่ในครรภ์มารดาจนครบ 9 เดือนแล้ว มารตาก็เริ่มมี อาการปวดท้องจะคลอดบุตร ซึ่งในช่วงระหว่างการคลอดนี้ ถ้าหากทารกได้รับการกระทบกระเทือน หรือมีความ ยากลำบากในการคลอด อาจจะส่งผลต่อพัฒนาการของทารกต่อไปได้ ดังนั้นสภาพแวดล้อมในขณะคลอด จึงมี ความสำคัญ ถ้าหากมีสภาวะการขาดออกซิเจน การได้รับบาดเจ็บทางระบบประสาทก็จะเป็นอันตรายและส่งผลกระทบ กับทารก"},{"n":39,"q":"บุคคลในข้อใดมีลักษณะลีลาการเรียนรู้ที่สื่อด้วยสัมผัสและการกระทำ K (Kinesthetic)","o":["แดงเรียนรู้ด้วยการดูภาพและสัญลักษณ์จะช่วยจดจำได้ดี","เขียวชื่นชอบการฟังบรรยาย การพูดคุยระหว่างการเรียน","ฟ้าชื่นชอบการลงมือปฏิบัติจริง เพื่อให้เกิดประสบการณ์","ส้มต้องใช้การอ่านและการเขียน เพื่อช่วยให้จำดีขึ้น"],"a":3,"e":"Fleming and Mill (1992) ได้แบ่งลีลาการเรียนรู้ตามความชอบหรือความถนัดในการรับข้อมูลของบุคคล ออกเป็น 4 กลุ่ม เรียกว่า \"VARK Learning Styles\" ดังนี้ 1. ลีลาการเรียนรู้ที่สื่อด้วยภาพและสัญลักษณ์ V (Visual) เมื่อมองเห็นข้อมูลต่าง ๆ ในรูปแบบแผนภาพ กราฟ แผนภูมิ และสัญลักษณ์ต่าง ๆ 2. ลีลาการเรียนรู้ที่สื่อด้วยเสียง A (AuraV/Auditory) ผ่านการได้ยินได้ฟัง การพูดคุย 3. ลีลาการเรียนรู้ที่สื่อด้วยอักษร R (Read/Write) ผ่านการอ่านและการเขียน 4. ลีลาการเรียนรู้ที่สื่อด้วยสัมผัสและการกระทำ K (Kinesthetic) เมื่อใช้ประสบการณ์และการลงมือปฏิบัติ"},{"n":40,"q":"ข้อใดไม่ใช่ตัวตนตามทฤษฎี \"ตัวตน\" (Self Theory) ของโรเจอร์ส (Carl Rogers)","o":["Self Concept","Self – Esteem","Ideal Self","Real Self"],"a":2,"e":"ทฤษฎี \"ตัวตน\" (Self Theory) ของคาร์ล โรเจอร์ส (Cart Rogers) เชื่อว่ามนุษย์ทุกคนมีตัวตน 3 แบบ ได้แก่ 1. ตัวตนที่ตนมองเห็น (Self Concept) คือ ภาพที่ตนเห็นเองว่า ตนเป็นอย่างไร มีความรู้ความสามารถ ลักษณะเฉพาะ ตนอย่างไร เช่น สวย รวย เก่ง ขี้อาย ช่างพูด เก็บตัว เงียบ ต ่าต้อย เป็นต้น ซึ่งการมองเห็นอาจจะไม่ตรงกับข้อเท็จจริงหรือ ภาพที่คนอื่นเห็น 2. ตัวตนตามที่เป็นจริง (Real Self) คือ ตัวตนตามข้อเท็จจริง แต่บ่อยครั้งที่ตนมองไม่เห็น ข้อเท็จจริง เพราะอาจเป็น สิ่งที่ทำให้รู้สึกเสียใจ ไม่เท่าเทียมกับบุคคลอื่น 3. ตัวตนตามอุดมคติ (Ideal Self) คือ ตัวตนที่อยากมีอยากเป็น แต่ยังไม่มีไม่เป็นในสภาวะ ปัจจุบัน เช่น ชองเก็บตัว แต่อยากเข้าสังคมเก่ง เป็นต้น"},{"n":41,"q":"ข้อใดกล่าวถึงเจตคติต่อตนเองไม่ถูกต้อง","o":["เป็นผลมาจากการตรวจสอบและการรับรู้ในด้านค่านิยม","ได้รับอิทธิพลมาจากพันธุกรรมมากกว่าสิ่งแวดล้อม","เป็นสิ่งสำคัญที่ทำให้บุคคลแสดงพฤติกรรมออกมา","เป็นแบบแผนที่บุคคลได้พิจารณาจัดระบบความรู้สึก"],"a":2,"e":"แนวคิดเกี่ยวกับเจตคติต่อตนเอง มีดังนี้ 1. เป็นแบบแผนที่บุคคลได้พิจารณาจัดระบบความรู้สึกนึกคิด 2. เป็นผลมาจากการตรวจสอบและการรับรู้ในด้านค่านิยม และความเชื่อที่มีต่อสิ่งใดสิ่งหนึ่ง ทั้งทางบวกและขางลบ 3. เป็นสิ่งสำคัญที่ทำให้บุคคลแสดงพฤติกรรมต่าง ๆ ออกมา 4. เจตคติไม่ใช่สิ่งที่มีมาแต่กำเนิด แต่เกิดจากการเรียนรู้ ประสบการณ์ การอบรมเลี้ยงดูดังนั้นเจตคติจึงมีอิทธิพลมา จากสิ่งแวดล้อมมากกว่าพันธุกรรม ฯลฯ"},{"n":42,"q":"พฤติกรรมในข้อใดสะท้อนถึงบุคลิกภาพภายในของบุคคลได้อย่างชัดเจน","o":["การหมั่นออกกำลังกายเพื่อให้รูปร่างสวยงาม","การเอาชนะการแข่งขันกีฬาเพื่อให้ได้รับเงินรางวัล","การมีอคติของตนต่อบุคคลที่ไม่ชื่นชอบ","การพูดและนำเสนอที่ดีของคนขายสินค้า"],"a":3,"e":"ประเภทของบุคลิกภาพ แบ่งออกเป็น 1. บุคลิกภาพภายนอก คือ ลักษณะภายนอกที่ปรากฏให้เห็นเด่นชัดแตกต่างกันในแต่ละคนเป็นส่วนที่สร้างความ ประทับใจให้กับผู้อื่นตั้งแต่แรกเห็น เช่น การแต่งกาย รูปร่างหน้าตา กิริยามารยาท เป็นต้น 2. บุคลิกภาพภายใน คือ ลักษณะภายในของบุคคลไม่ปรากฏอย่างชัดเจน อยู่ภายในมองไม่เห็นแต่อาจทราบได้จาก การคาดเดา เช่น นิสัย สติปัญญา ความถนัด ค่านิยม อารมณ์ ความรู้สึกการมีอคติ ความเป็นตัวของตัวเอง เป็นต้น"},{"n":43,"q":"ข้อใดไม่ใช่เทคนิคการฝึกทักษะความกรุณาต่อตนเอง","o":["การเข้าใจความเป็นมนุษย์","ฝึกการปล่อยวาง","วิพากษ์วิจารณ์ตนเอง","การฝึกสติ"],"a":3,"e":"เทคนิคการฝึกเพิ่มทักษะความกรุณาต่อตนเอง ได้แก่ 1. การฝึกเมตตาตนเอง ได้แก่ รู้จักให้อภัยตนเอง ให้การช่วยเหลือ และเห็นอกเห็นใจ 2. ฝึกการยอมรับและเข้าใจการเป็นมนุษย์อย่างธรรมดาสามัญ 3. การฝึกสติและฝึกการปล่อยวาง"},{"n":44,"q":"ข้อใดกล่าวได้ถูกต้องที่สุดเกี่ยวกับกระบวนการเปลี่ยนแปลงเจตคติตามทฤษฎีของเคลแมน","o":["ความคาดหวังการยอมรับจากบุคคลอื่น เป็นอุปสรรคในการเปลี่ยนแปลงเจตคติ","เจตคติของบุคคลจะเปลี่ยนไปมากหรือน้อยขึ้นอยู่กับสิ่งเร้าให้เกิดการเลียนแบบ","รางวัลเป็นสิ่งสำคัญในการจูงใจให้เกิดการเปลี่ยนแปลง","ต้องการที่จะเปลี่ยนเป็นสิ่งสำคัญที่สุด"],"a":2,"e":"ทฤษฎีการเปลี่ยนแปลงเจตคติของเคลแมน เชื่อว่า เจตคติบางอย่างเปลี่ยนแปลงได้ถ้าอยู่ในสภาพแวดล้อมที่ เหมาะสม นอกจากนี้เจตคติอย่างเดียวกันอาจเกิดในตัวบุคคลด้วยวิธีที่ต่างกัน ซึ่งจากความคิดนี้ เคลแมนแบ่ง กระบวนการเปลี่ยนแปลงเจตคติออกเป็น 3 ประการ ที่มีอิทธิพลต่อการเปลี่ยนแปลงเจตคติ คือ 1. การยินยอม (Compliance) จะเกิดได้เมื่อการยอมกระทำตามนี้เป็นกระบวนการเปลี่ยนแปลง ทัศนคติ ซึ่งจะมีพลัง ผลักดันให้บุคคลยอมกระทำตามมากหรือน้อยนั้นขึ้นอยู่กับจำนวนหรือความรุนแรงของรางวัลและการลงโทษ 2. การเลียนแบบ (Identification) เป็นกระบ่วนการเปลี่ยนแปลงทัศนคติ โดยเจตคติของ บุคคลจะเปลี่ยนไปมากหรือ น้อยขึ้นอยู่กับสิ่งเร้าให้เกิดการเลียนแบบ 3. ความต้องการที่อยากจะเปลี่ยน (Internalization) เป็นกระบวนการที่เกิดขึ้นเมื่อบุคคลยอมรับสิ่งที่มีอิทธิพล เหนือกว่า ซึ่งตรงกับความต้องการภายในค่านิยมของเขา"},{"n":45,"q":"ข้อใดไม่ใช่หน้าที่ของเจตคติตามทฤษฎีเครื่องล่อใจ","o":["เป็นเครื่องมือในการปรับตัว","ช่วยป้องกันตนเองได้","ช่วยให้สุขภาพจิตดี","เป็นตัวกำหนดพฤติกรรม"],"a":3,"e":"หน้าที่ของเจตคติตามทฤษฎีเครื่องล่อใจ (Incentive Theories) 1. เจตคติเป็นเครื่องมือทำให้บุคคลไปถึงจุดมุ่งหมาย และช่วยในการปรับตัว 2. เจตคติช่วยป้องกันตนเองได้ 3. เจตคติช่วยให้แสดงออกทางด้านพฤติกรรมต่า
