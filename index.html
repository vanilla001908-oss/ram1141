่งสิ่ง สำคัญก็คือ ไม่ควรตีตราและยึดถือผลของการทดสอบที่มากเกินไป"},{"n":12,"q":"วิธีการใดจัดเป็นวิธีการพื้นฐานชีมักใช้ควบคู่กับวิธีการอื่น ๆ เสมอ","o":["การสังเกต","การสัมภาษณ์","การใช้แบบสอบถาม","การใช้แบบทดสอบ"],"a":1,"e":"การสังเกต ถือเป็นวิธีการพื้นฐานทางจิตวิทยาที่มักใช้ควบคู่กับวิธีการอื่น ๆ เสมอเพราะเป็นการเฝ้าดูปรากฏการณ์ ที่เกิดขึ้นอย่างมีเป้าหมาย โดยอาศัยรูปแบบและวิธีการสังเกต ที่มีระบบระเบียบ ซึ่งการศึกษาบุคลิกภาพจะให้ความสำคัญ กับการสังเกตพฤติกรรมของบุคคลและนำข้อมูลมาวิเคราะห์เชื่อมโยงกับแนวคิดทฤษฎีที่เกี่ยวข้อง เพื่อนำมาใช้อธิบาย ลักษณะของ บุคลิกภาพ ทั้งนี้การสังเกตจะแบ่งออกเป็น การสังเกตทางตรง และการสังเกตทางอ้อม"},{"n":13,"q":"วิธีการใดที่สามารถทำการรวบรวมข้อมูลได้ แม้ในกรณีที่ผู้ตอบอยู่ในสถานที่ต่างกัน","o":["การสังเกต","การสัมภาษณ์","การใช้แบบสอบถาม","การใช้แบบทดสอบ"],"a":3,"e":"การใช้แบบสอบถาม มักนำมาใช้ในการศึกษาพฤติกรรมเพื่อประเมิน บุคลิกภาพอย่างแพร่หลายวิธีหนึ่ง เพราะเป็น วิธีการ์ที่สามารถรวบรวมข้อมูลจากคนจำนวนมากได้ในคราวเดียวกัน แม้ในกรณีที่ผู้ตอบอยู่ในสถานที่ต่างกัน ซึ่ง ลักษณะเด่นของแบบสอบถาม คือจะให้ผู้รับการประเมินตอบแบบคำถามในลักษณะของการรายงานตัวเองที่เกี่ยวข้องกับ ความคิด ทัศนคติ หรือความรู้สึกต่าง ๆ ที่อาจสะท้อนถึงลักษณะทางบุคลิกภาพบางประการได้ แต่ควรเลือกใช้ แบบสอบถามที่มีความน่าเชื่อถือ มีความเป็นมาตรฐาน และสามารถวิเคราะห์ผลทางสถิติได้อย่างมีประสิทธิภาพ"},{"n":14,"q":"วิธีการใดที่มีความยืดหยุ่น สามารถปรับเปลี่ยนคำถามได้ตามความเหมาะสมในระหว่างการประเมิน","o":["การสังเกต","การสัมภาษณ์","การใช้แบบสอบถาม","การใช้แบบทดสอบ"],"a":2,"e":"การสัมภาษณ์ หมายถึง การสนทนาพูดคุยอย่างมีเป้าหมาย เพื่อให้เกิดความกระจ่างในข้อมูลหรือลักษณะสำคัญ เฉพาะตัว จำแนกได้ 3 ลักษณะ ได้แก่ 1. การสัมภาษณ์แบบมีโครงสร้าง คือ มีรูปแบบ ขั้นตอน วิธีการ หรือข้อคำถามที่ชัดเจนตายตัว 2. การสัมภาษณ์แบบไม่มีโครงสร้าง คือ มีรูปแบบ ขั้นตอน วิธีการ หรือข้อคำถามที่ไม่ตายตัว 3. การสัมภาษณ์แบบกึ่งโครงสร้าง เป็นการสัมภาษณ์อยู่ระหว่างแบบที่ 1 และแบบที่ 2 คือ มีรูปแบบและแนวทางการ สัมภาษณ์ที่ชัดเจนแต่มีความยืดหยุ่นและสามารถปรับเปลี่ยนให้มีความเหมาะสมกับผู้รับการสัมภาษณ์หรือบริบทต่าง ๆ"},{"n":15,"q":"กรณีศึกษา หากคุณกำลังพิจารณาวิธีการประเมินบุคลิกภาพของพนักงานในองค์กรของคุณ คุณจะ เลือก วิธีการใดที่เหมาะสมที่สุดในการรวบรวมข้อมูลจากพนักงานจำนวนมากในคราวเดียวกัน โดยใช้ เครื่องมือ ที่มีความเป็นมาตรฐาน และสามารถวิเคราะห์ผลทางสถิติได้อย่างมีประสิทธิภาพ","o":["สังเกตพฤติกรรมในสถานการณ์การทำงาน","การใช้แบบทดสอบทางจิตวิทยา","การใช้แบบสอบถาม","การสัมภาษณ์แบบกึ่งโครงสร้าง"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 13. ประกอบ"},{"n":16,"q":"ข้อใดคือเหตุผลที่สำคัญที่สุดสำหรับการวิเคราะห์และประเมินบุคลิกภาพ","o":["เพื่อให้ได้มาซึ่งอำนาจในองค์กร","เพื่อเข้าใจรูปแบบการปรับตัวของบุคคลที่เปลี่ยนแปลงไปตามสถานการณ์ต่าง ๆ","เพื่อควบคุมพฤติกรรมของบุคคลอื่น","เพื่อสร้างความมั่นใจในตนเอง"],"a":2,"e":"ความสำคัญของการวิเคราะห์และประเมินบุคลิกภาพ มีดังนี้ 1. เป็นแนวทางในการทำความเข้าใจรูปแบบพฤติกรรมและลักษณะเฉพาะตัวของบุคคลทั้งภายนอกและภายในที่ เกี่ยวข้องกับการปรับตัวต่อสิ่งแวดล้อม รวมถึงยังมีประโยชน์ทำให้บุคคลสามารถเข้าใจตนเอง จนนำไปสู่การพัฒนา บุคลิกภาพตนเองให้เหมาะสม กับการปรับตัวของบุคคลที่เปลี่ยนแปลงไปตามสถานการณ์ต่าง ๆ 2. สามารถนำมาประยุกต์ใช้ประโยชน์ในบริบทที่หลากหลาย เช่น การคัดเลือกบุคคลในองค์กรและการศึกษา, ใช้ ประกอบการวินิจฉัยหรือบำบัดรักษาทางคลินิก, เป็นข้อมูลประกอบการพิจารณาคดีตามกฎหมาย และใช้ทำความเข้าใจ ตนเอง รวมถึงผู้อื่นเพื่อปรับตัวในการดำเนินชีวิต"},{"n":17,"q":"หลักการพื้นฐานในการวิเคราะห์และประเมินบุคลิกภาพที่ถูกต้อง คือข้อใด","o":["ใช้ข้อมูลที่ได้จากเพื่อนสนิทในการวิเคราะห์","ใช้เพียงแบบทดสอบทางจิตวิทยาอย่างเดียว","กำหนดเป้าหมายของพฤติกรรมที่ต้องการวัดหรือประเมินให้ชัดเจน","วิเคราะห์บุคลิกภาพโดยไม่ต้องคำนึงถึงแนวคิดทฤษฎีทางจิตวิทยา"],"a":3,"e":"หลักการพื้นฐานในการวิเคราะห์และประเมินบุคลิกภาพ มีดังนี้ 1. มีความรู้ความเข้าใจเกี่ยวกับแนวคิดทฤษฎีทางบุคลิกภาพ เนื่องจากการประเมินบุคลิกภาพอาศัยแนวคิดทาง จิตวิทยาเป็นพื้นฐาน 2. กำหนดเป้าหมายของพฤติกรรมที่ต้องการวัดหรือประเมินให้ชัดเจน 3. เลือกใช้วิธีการหรือเครื่องมือในการประเมินที่มีความเหมาะสม รวมทั้งตระหนักว่าไม่มีวิธีการใดที่ดีที่สุด แต่ควร ใช้วิธีการหลากหลายอย่างเหมาะสม 4. คำนึงถึงปัจจัยที่เกี่ยวข้องกับการวิเคราะห์และประเมินบุคลิกภาพ ทั้งปัจจัยส่วนบุคคล ปัจจัยทางสังคม รวมถึง ปัจจัยที่เกี่ยวข้องกับบริบทของการประเมินผล 5. คำนึ่งถึงจริยธรรมในการประเมิน"},{"n":18,"q":"ข้อใดไม่ใช่การแสดงออกทางภาษากายที่ควรนำมาประเมินบุคลิกภาพของบุคคล","o":["การสบตากับคู่สนทนา","การยิ้มแบบแกล้งทำ","การแสดงออกด้วยท่าทางการเดิน","การเลือกเสื้อผ้าที่จะสวมใส่ในวันนั้น"],"a":4,"e":"การวิเคราะห์ประเมินการแสดงออกของบุคคลทางภาษากาย ประกอบด้วย 1. การแสดงออกทางสีหน้า ซึ่งที่สำคัญ คือ การยิ้ม เช่น ยิ้มแบบจริงใจ ยิ้มแบบหม่นหมองและยิ้มแบบเสแสร้งหรือ แกล้งทำ 2. คำพูด และการสื่อสารที่แสดงออกต่อผู้อื่น 3. ภาษาท่าทาง เช่น การสบตากับคู่สนทนา, การแสดงออกด้วยท่าทางการเดิน เป็นต้น"},{"n":19,"q":"นักจิตวิทยาคลินิกมักใช้แบบทดสอบทางจิตวิทยาเพื่ออะไร","o":["เพื่อรักษาผู้ป่วยที่มีความผิดปกติทางจิตใจ","เพื่อกำหนดสถานะทางเศรษฐกิจของผู้ป่วย","เพื่อทำนายพฤติกรรมของผู้ป่วยในอนาคต","เพื่อสร้างความบันเทิงให้กับผู้ป่วย"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 11. ประกอบ วัตถุประสงค์หลักของการประเมินบุคลิกภาพด้วยแบบทดสอบทางจิตวิทยา คือ เพื่อประกอบการตรวจวินิจฉัยทาง คลินิกที่เกี่ยวกับการบำบัด รักษาผู้ที่มีความผิด1กติต่าง ๆ โดยเฉพาะทางด้านจิตใจ ดังนั้นการบริการตรวจประเมินทาง บุคลิกภาพโดยส่วนใหญ่จึงทำได้ในสถานพยาบาล หรือคลินิกทางจิตวิทยาที่ได้รับอนุญาต"},{"n":20,"q":"การวิเคราะห์และประเมินภาษากายมักใช้ในกระบวนการใด","o":["การตัดสินใจในการซื้อสินค้า","กระบวนการคัดเลือกบุคคลในองค์กร","การเรียนการสอนในโรงเรียน","การสร้างภาพลักษณ์ในสื่อสังคมออนไลน์"],"a":2,"e":"การวิเคราะห์และประเมินภาษากายจะสอดแทรกอยู่ในกระบวนการทางจิตวิทยาหลายส่วนด้วยกัน ได้แก่ 1. กระบวนการคัดเลือกบุคคลในองค์กร 2. การตรวจสภาพจิตทางคลินิก (MSE) โดยเฉพาะ \"General Appearance\" 3. การทัดสอบทางจิตวิทยา คือ พฤติกรรมขณะทดสอบ (Test Behavior)"},{"n":21,"q":"องค์การอนามัยโลก (WHO) ได้ให้นิยามของ \"สุขภาพจิต\" ว่าอย่างไร","o":["การปรับตัวให้เข้ากับสภาพแวดล้อมที่เปลี่ยนแปลง","ความสามารถในการจัดการจับความเครียดในชีวิตประจำวันได้อย่างมีประสิทธิภาพ","การหลีกเลี่ยงปัญหาทางจิตใจและร่างกาย","ความสำเร็จในการทำงานและชีวิตส่วนตัว"],"a":2,"e":"องค์การอนามัยโลก (WHO) ได้ให้นิยามของคำว่า \"สุขภาพจิต\" คือสภาวะของความอยู่ดี มีสุข ซึ่งบุคคลตระหนัก ถึงความสามารถของตนเอง สามารถรับมือและ จัดการกับความเครียดที่เกิดขึ้นตามปกติในชีวิตประจำวันได้อย่างมี ประสิทธิภาพ ใช้ศักยภาพ ที่มีในการทำงาน และช่วยเหลือชุมขนของตนเองได้อย่างเต็มความสามารถ"},{"n":22,"q":"ปัจจัยใดที่ไม่ได้เป็นสาเหตุของการเกิดปัญหาสุขภาพจิต","o":["การอยู่ในสิ่งแวดล้อมที่ไม่เหมาะสม","การถูกทารุณกรรมหรือสูญเสียบุคคลที่รัก","พันธุกรรมและสารสื่อประสาทในสมอง","ได้รับการสนับสนุนจากครอบครัวและสังคม"],"a":4,"e":"ปัจจัยที่ทำให้เกิดปัญหาสุขภาพจิต มีดังนี้ 1. Biological ได้แก่ พันธุกรรม ความผิดปกติของสารสื่อประสาทในสมอง การบาดเจ็บทางสมอง และโรคทางกาย 2. Psychological ได้แก่ ประสบการณ์ในชีวิต เช่น การถูกทารุณกรรม การสูญเสีย การถูกทอดทิ้ง การถูกกลั่นแกล้ง การขาดความภาคภูมิใจในตนเอง และความกลัววิตกกังวล 3. Social ได้แก่ การเลี้ยงดูที่ไม่เหมาะสม การถูกคาดหวังจากสังคมรอบข้าง การถูกตีตราจากสังคม ความยากจน ภาระหนี้สิน การหย่าร้าง การว่างงาน และการอยู่ในสิ่งแวดล้อม ที่ไม่เหมาะสม"},{"n":23,"q":"สัญญาณใดที่ไม่ได้บ่งบอกถึงปัญหาสุขภาพจิต","o":["ปวดศีรษะและมีปัญหาการนอนหลับ","การออกกำลังกายเป็นประจำ","รู้สึกเบื่อหน่าย ท้อแท้ และสิ้นหวัง","การแยกตัวจากสังคมและมีอารมณ์แปรปรวน"],"a":2,"e":"สัญญาณเตือนของปัญหาสุขภาพจิต มีดังนี้ 1. ด้านร่างกาย ได้แก่ ปวดศีรษะ ปวดตึงกล้ามเนื้อบริเวณคอ บ่า ไหล่ เหนื่อยง่าย อ่อนเพลียไม่มีเรี่ยวแรง ปวดมวนใน ท้อง มือชา เหงื่อออกมากกว่าปกติ มีปัญหาด้านการกินหรือนอน 2. ด้านอารมณ์และจิตใจ ได้แก่ เครียด วิตกกังวล หงุดหงิดง่าย เบื่อหน่าย ท้อแท้ สิ้นหวัง เซ็ง ซึมเศร้า สับสน หวาดกลัว ระแวง อารมณ์เปลี่ยนแปลงง่าย และมีความคิดอยากตาย 3. ด้านพฤติกรรม ได้แก่ ไม่มีสมาธิในการเรียนหรือทำงาน แยกตัวออกจากสังคม ก้าวร้าว ฯลฯ"},{"n":24,"q":"อาการใดที่ไม่ใช่สัญญาณของภาวะซึมเศร้า","o":["ความคิดถึงเรื่องความตายอยู่บ่อยครั้ง","น ้าหนักตัวเพิ่มขึ้นอย่างรวดเร็ว","การตื่นตัวและพลังงานสูงเกินปกติ","หมดความสนใจในกิจกรรมที่เคยชอบทำ"],"a":3,"e":"โรคซึมเศร้า คือ โรคทางอารมณ์ชนิดหนึ่ง ซึ่งผู้ป่วยจะมีอารมณ์ซึมเศร้านานต่อเนื่องติดต่อกันอย่างน้อย 2 สัปดาห์ โดยจะมีอาการเศร้าอย่างมาก อยากร้องไห้อยู่ตลอดเวลา หมดความสนใจในสิ่งรอบตัวหรือในกิจกรรมต่าง ๆ ที่จะช่วย ให้กลับมามีความสุขสดชื่นเหมือนเดิม เบื่อหน่ายไปกับทุกสิ่ง รู้สึกท้อแท้ หดหู่ สิ้นหวังอย่างรุนแรง มองตัวเองไม่ดี น ้าหนักลดหรือเพิ่มมากเกินไป และอาจมีความคิดอยากฆ่าตัวตายอยู่ซ ้า ๆ เป็นต้น"},{"n":25,"q":"ภาวะใดที่จัดอยู่ในกลุ่มโรควิตกกังวล (Anxiety Disorder)","o":["โรคซึมเศร้า (Depression)","โรคย ้าคิดย ้าทำ (Obsessive - compulsive Disorder)","โรคสมาธิสั้น (ADHD)","โรคจิตเภท (Schizophrenia)"],"a":2,"e":"ภาวะวิตกกังวล (Anxiety Disorder) เป็นอารมณ์หนึ่งที่เกิดได้กับ บุคคลทั่วไปเมื่อต้องเผชิญกับสถานการณ์ที่ไม่ คุ้นเคย หรืออยู่ในภาวะกดดัน รวมทั้งการมีความคิดหมกมุ่นกับเหตุการณ์ในอดีต แบ่งออกเป็น 1. โรควิตกกังวลทั่วไป 2. โรคย ้าคิดย ้าทำ 3. โรคตื่นตระหนก 4. โรคกลัวแบบเฉพาะเจาะจง 5. โรคเครียดหลังเผชิญเหตุการณ์ร้ายแรง"},{"n":26,"q":"บุคลิกภาพแบบใดมักแสดงพฤติกรรมที่ไม่มั่นคง หุนหันพลันแล่น แสดงอารมณ์โกรธอย่างรุนแรง","o":["บุคลิกภาพแบบเก็บตัว (Schizoid Personality)","บุคลิกภาพแบบกำกึ่ง (Borderline Personality)","บุคลิกภาพแบบหวาดระแวง (Paranoid Personality)","บุคลิกภาพแบบพึ่งพิง (Dependent Personality)"],"a":2,"e":"บุคลิกภาพที่ผิดปกติแบ่งออกเป็น 5 ชนิด ได้แก่ 1. เก็บตัว คือ ไม่ชอบเข้าสังคม มักหลีกเลี่ยงการเข้าสังคม 2. หวาดระแวง คือ สงสัยในการกระทำของบุคคลอื่น 3. ต่อต้านสังคม คือ ไม่รู้สึกผิด ไม่มีความรับผิดชอบ ไม่ทำตามกฎเกณฑ์สังคม 4. แบบก ้ากึ่ง คือ อารมณ์ไม่มั่นคง เปลี่ยนแปลงง่าย หุนหันพลันแล่น มีอารมณ์โกรธที่รุนแรง 5. แบบพึ่งพิง คือ ขาดความมั่นใจในตนเอง ไม่กล้าตัดสินใจ กลัวการอยู่คนเดียว ไม่กล้าปฏิเสธ"},{"n":27,"q":"ปัญหาสุขภาพจิตใดที่เกี่ยวข้องกับความกลัวและความกังวลในสถานการณ์ทางสังคม","o":["โรคตื่นตระหนก (Panic Attack)","โรควิตกกังวลทางสังคม (Social Anxiety Disorder)","โรคย ้าคิดย ้าทำ (Obsessive - compulsive Disorder)","โรคเครียดกับเหตุการณ์ร้ายแรง (Post - Traumatic Stress Disorder)"],"a":2,"e":"โรควิตกกังวลทางสังคม (Social Anxiety Disorder : SAD) หรือเรียกกันว่า \"โรคกลัวสังคม\" เป็นโรควิตกกังวลที่ มีลักษณะเฉพาะ คือ ความรู้สึกกลัวและวิตกกังวลในสถานการณ์ทางสังคม ทำให้เกิดความทุกข์อย่างมาก และความ สามารถในการทำสิ่งต่าง ๆในชีวิตประจำวันลดลง ซึ่งความกลัวเหล่านี้อาจเกิดขึ้นได้จากการรับรู้หรือการจับจ้องจาก ผู้อื่น เพราะบุคคลที่เป็นโรควิตกกังวลทางสังคมจะกลัวการประเมินเชิงลบจากผู้อื่น"},{"n":28,"q":"สาเหตุใดที่ไม่ได้ส่งผลให้เกิดภาวะวิตกกังวล","o":["การมีความคิดหมกมุ่นกับเหตุการณ์ในอดีต","การทำงานภายใต้ความกดดัน","การมีกิจกรรมที่ชื่นชอบ","การเผชิญหน้ากับสถานการณ์ที่ไม่คุ้นเคย"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 25. ประกอบ"},{"n":29,"q":"ข้อใดต่อไปนี้เป็นวิธีที่มีประสิทธิภาพในการดูแลสุขภาพจิตของตนเอง","o":["การตำหนิตนเองเมื่อทำผิดพลาด","การออกกำลังกายเป็นประจำ และการพักผ่อนเพียงพอ","หลีกเลี่ยงการขอความช่วยเหลือจากผู้อื่น","การปล่อยให้ตนเองจมอยู่กับปัญหา"],"a":2,"e":"บุคคลสามารถดูแลสุขภาพจิตของตนเองได้ ดังนี้ 1. การให้คุณค่าตนเอง ไม่ตำหนิตนเอง 2. ดูแลสุขภาพร่างกาย และนอนหลับพักผ่อนให้เพียงพอ 3. การเป็นจิตอาสา 4. การเรียนรู้วิธีจัดการกับความเครียดอย่างถูกวิธี 5. การผ่อนคลายจิตใจด้วยการออกกำลังกายเป็นประจำ 6. ปรับเปลี่ยนรูปแบบการดำเนินชีวิตประจำวันเพื่อลดความน่าเบื่อหน่าย 7. หาตัวช่วย เช่น ขอความช่วยเหลือจากเพื่อน ครอบครัว จิตแพทย์ ฯลฯ"},{"n":30,"q":"ข้อใดไม่ใช่วิธีในการประเมินสุขภาพจิตด้วยตนเอง","o":["การทำแบบประเมินการฆ่าตัวตาย 8 คำถาม (8Q)","การทำแบบประเมินความเครียดด้วยตนเอง ST-5","การละเว้นจากการประเมินตนเอง เพราะกลัวความจริง","การทำแบบคัดกรองโรคซึมเศร้า 9 คำถาม"],"a":3,"e":"วิธีในการประเมินสุขภาพจิตด้วยตนเอง มีดังนี้ 1. การทำแบบประเมินความเครียดด้วยตนเอง ST-5 2. การทำแบบประเมินการฆ่าตัวตาย 8 คำถาม (80) 3. การทำแบบคัดกรองโรคซึมเศร้า 9 คำถาม (90) ฯลฯ"},{"n":31,"q":"ข้อใดกล่าวถึงความหมายของเจตคติได้อย่างถูกต้องมากที่สุด","o":["เจตคติ หมายถึง ท่าที่ ความรู้สึกที่บุคคลมีต่อสิ่งใดสิ่งหนึ่ง","เจตคติ หมายถึง ความคิดที่.รามีต่อตนเองเท่านั้น","เจตคติ หมายถึง แบบแผนทางความคิดทางด้านบวกของมนุษย์","เจตคติเป็นเพียงความคิด ซึ่งแยกออกจากอารมณ์และพฤติกรรม"],"a":1,"e":"คำว่า \"เจตคติ\" ในพจนานุกรมฉบับราชบัณฑิตยสถาน พ.ศ. 2554 อ่านว่า \"เจตะคติ\" หมายถึง ท่าที่ หรือ ความรู้สึกของบุคคลต่อสิ่งหนึ่งสิ่งใด"},{"n":32,"q":"ข้อใดไม่ใช่ตัวตนตามทฤษฎี \"ตัวตน\" (Self Theory) ของโรเจอร์ส (Carl Rogers)","o":["Self Concept","Self – Esteem","Real Self","Ideal Self"],"a":2,"e":"ทฤษฎี \"ตัวตน\" (Self Theory) ของคาร์ล โรเจอร์ส (Carl Rogers) เชื่อว่ามนุษย์ทุกคนมีตัวตน 3 แบบ ได้แก่ 1. ตัวตนที่ตนมองเห็น (Self Concept) คือ ภาพในใจที่ตนเห็นเองว่า ตนเป็นอย่างไร มีความรู้ความสามารถ ลักษณะ เฉพจะตนอย่างไร ซึ่งอาจไม่ตรงกับข้อเท็จจริงหรือภาพที่คนอื่นเห็น 2. ตัวตนตามที่เป็นจริง (Real Self) คือ ตัวตนตามข้อเท็จจริง แต่บ่อยครั้งที่ตนมองไม่เห็น ข้อเท็จจริง เพราะอาจเป็น สิ่งที่ทำให้รู้สึกเสียใจ ไม่เท่าเทียมกับบุคคลอื่น 3. ตัวตนตามอุดมคติ (Ideal Self) คือ ตัวตนที่อยากมีอยากเป็น แต่ยังไม่มีไม่เป็นในสภาวะ ปัจจุบัน เช่น ชองเก็บตัว แต่อยากเข้าสังคมเก่ง เป็นต้น"},{"n":33,"q":"\"การที่บุคคลมีความรู้ ความเชื่อ และข้อมูล จนนำมาซึ่งข้อสรุปที่บุคคลมีต่อตนเองและผู้อื่น\" จัดเป็น องค์ประกอบของเจตคติในด้านใด","o":["ด้านความเข้าใจ","ด้านสมรรถนะ","ด้านความรู้สึก","ด้านพฤติกรรม"],"a":1,"e":"องค์ประกอบที่สำคัญของเจตคติมีอยู่ 3 ประการ ดังนี้ 1. ด้านความรู้ ความเข้าใจ (Cognitive Component) คือ การที่บุคคลมีความรู้ ความเชื่อและข้อมูล จนนำมาซึ่งข้อสรุป ที่บุคคลมีต่อตนเองและผู้อื่น 2. ด้านอารมณ์ ความรู้สึก (Affective Component) คือ อารมณ์ดีใจ พอใจ เศร้าใจเสียใจไม่ว่าจะเป็นทั้งทางบวกหรือ ทางลบ 3. ด้านพฤติกรรม (Behavioral Component) คือ แนวโน้มของการกระทำในทิศทางใด ทิศทางหนึ่ง"},{"n":34,"q":"เจตคติมีกี่ประเภท อะไรบ้าง","o":["2 ประเภท คือ เจตคติทางตรง และเจตคติทางอ้อม","2 ประเภท คือ เจตคติทางบวก และเจตคติท่างลบ","3 ประเภท คือ เจตคติทางบวก เจตคติทางลบ และการไม่แสดงออกทางเจตคติ","4 ประเภท คือ เจตคติทางบวก เจตคติทางลบ เจตคติเฉยเมย และการไม่แสดงออกทางเจตคติ"],"a":3,"e":"ประเภทของเจตคติแบ่งออกเป็น 3 ประเภท ได้แก่ 1. เจตคติในทางบวก (Positive Attitude) คือ ความรู้สึกต่อตนเอง ผู้อื่น หรือสิ่งแวดล้อมในทางที่ดีหรือยอมรับ พึงพอใจ หรือชอบ เห็นด้วยและชื่นชม ซึ่งจะเป็นเครื่องนำทางไปสู่พฤติกรรมที่พึงประสงค์และเป็นพฤติกรรมที่ดีตามมาด้วย 2. เจตคติในทางลบ (Negative Attitude) คือ ความรู้สึกหรือการแสดงออกต่อตนเอง ผู้อื่นหรือสิ่งแวดล้อมที่ไม่พึงพอใจ ไม่ชอบ ไม่ยอมรับ ไม่เห็นด้วย 3. การไม่แสดงออกทางเจตคติ (Passive Attitude) คือ การไม่มีความรู้สึกใด ๆ ต่อตนเอง บุคคล หรือสิ่งต่าง ๆ"},{"n":35,"q":"ข้อใดไม่ใช่หน้าที่สำคัญของเจตคติ","o":["ช่วยให้เกิดการปรับตัว","ช่วยให้ตัดสินและประเมินผู้อื่นได้","เป็นการแสดงความหมายของค่านิยม","เป็นกลไกสำคัญในการป้องกันตนเอง"],"a":2,"e":"หน้าที่และความสำคัญของเจตคติ ได้แก่ 1. ทำให้เกิดการปรับตัว (Adjustment) 2. เป็นกลไกสำคัญในการป้องกันตัว (Ego Defense) 3. เป็นการแสดงความหมายของค่านิยม (Value Expression) 4. เป็นตัวจัดระเบียบความรู้ (Knowledge)"},{"n":36,"q":"ข้อใดเป็นปัจจัยภายในที่ส่งผลต่อการเกิดเจตคติ","o":["ประสบการณ์","การเลี้ยงดู","สิ่งแวดล้อม","ครอบครัว"],"a":1,"e":"ปัจจัยภายในที่ส่งผลต่อการเกิดเจตคติ คือ ประสบการณ์ทางตรงที่สอดคล้องกับเจตคติเดิม โดยเจตคติและพฤติกรรม เป็นสาเหตุซึ่งกันและกัน ดังนั้นบุคคลมักแสดงพฤติกรรมตามเจตคติของตนเอง ซึ่งประสบการณ์ทางตรงที่สอดคล้องกับ เจตคติเดิมจะ ช่วยส่งเสริมให้บุคคลเกิดความมั่นใจในการปฏิบัติต่อบุคคลอื่นมากขึ้น"},{"n":37,"q":"\"นางสาวรักดีมีประสบการณ์ไม่ดีเกี่ยวกับเพื่อนบ้าน เป็นผู้ชายวัยรุ่นและชอบสูบบุหรี่ จึงรู้สึกไม่ พอใจเมื่อทราบว่า เพื่อนบ้านที่ย้ายมาใหม่เป็นวัยรุ่นชาย\" สามารถอธิบายการเกิดเจตคติได้ด้วยแนวคิดใด","o":["ทฤษฎีการเลียนแบบทางสังจม","การเรียนรู้โดยการวางเงื่อนไขจากการกระทำ","การเรียนรู้โดยการวางเงื่อนไขแบบคลาสสิก","ทฤษฎีการวิเคราะห์สัมพันธภาพระหว่างบุคคล"],"a":3,"e":"เจตคติที่เกิดจากการเรียนรู้โดยการวางเงื่อนไขคลาสสิก (Classical Conditioning) หรือการตอบสนองที่ถูกกระตุ้น โดยสิ่งเร้าที่ปรากฏชัดเจนในสถานการณ์การเรียนรู้ ซึ่งนักจิตวิทยาที่สำคัญในทฤษฎีนี้ คือ พาฟลอฟ (PavloV) เชื่อว่า การเรียนรู้ของสิ่งที่มีชีวิตเกิดจากการวางเงื่อนไข (Conditioning) กล่าวคือ การตอบสนองหรือการเรียนรู้ที่เกิดขึ้น ต่อสิ่ง เร้านั้น ๆ ต้องมีเงื่อนไขหรือมีการสร้างสถานการณ์ให้เกิดขึ้นที่เป็นผลของการเรียนรู้ เช่นนางสาวรักดีมีประสบการณ์ไม่ ดีเกี่ยวกับเพื่อนบ้าน ซึ่งเป็นผู้ชายวัยรุ่นและชอบสูบบุหรี่ จึงรู้สึกไม่พอใจเมื่อทราบว่า เพื่อนบ้านที่ย้ายมาใหม่เป็นวัยรุ่น ชาย เป็นต้น"},{"n":38,"q":"\"นางสาวสุดสวยมักได้รับคำชมทุกครั้งที่แต่งหน้าไปเรียน จึงสนใจอยากเรียนวิชาเสริมความงาม\" จากเหตุการณ์ข้างต้นสามารถอธิบายการเกิดเจตคติได้ด้วยแนวคิดใด","o":["ทฤษฎีการวิเคราะห์สัมพันธภาพระหว่างบุคคล","การเรียนรู้โดยการวางเงื่อนไขจากการกระทำ","การเรียนรู้การวางเงื่อนไขแบบคลาสสิก","ทฤษฎีตัวแบบ"],"a":2,"e":"เจตคติที่เกิดจากการเรียนรู้โดยการวางเงื่อนไขจากการกระทำ (Operant Conditioning) พัฒนาขึ้นโดยสกินเนอร์ (Skinner) เชื่อว่า การเรียนรู้เกิดจากการที่บุคคลเรียนรู้ความสัมพันธ์ระหว่างสิ่งเร้า และการตอบสนองแบบจงใจกระทำ/ ตั้งใจกระทำ เพราะบุคคลคาดหวังผลลัพธ์ที่จะเกิดขึ้นตามมาไม่ว่าจะเป็นผลทางบวกหรือทางลบแต่หากเป็นผลทางบวก ก็จะทำให้บุคคลมีแนวโน้มที่จะแสดงพฤติกรรมนั้นอีก ในทางกลับกัน ถ้าเป็นทางลบก็จะทำให้บุคคลนั้นมีแนวโน้มจะ ไม่แสดงพฤติกรรมนั้นอีก เรียกว่า \"หลักการของการเสริมแรง\" เช่น นางสาวสุดสวยมักจะได้รับคำชมทุกครั้งที่แต่งหน้า ไปเรียน จึงสนใจอยากเรียนวิชาเสริมความงาม เป็นต้น"},{"n":39,"q":"ข้อใดกล่าวไม่ถูกต้องเกี่ยวกับการเปลี่ยนแปลงเจตคติ","o":["เจตคติในทิศทางเดียวกันมีความคงทนคงที่มากกว่าการเปลี่ยนแปลงไปคนละทาง","เจตคติไม่สามารถเปลี่ยนแปลงได้ เพราะเป็นสิ่งที่ติดตัวมาแต่กำเนิด","เจตคติสามารถเปลี่ยนแปลงได้ไม่คงที่","การเปลี่ยนแปลงเจตคติขึ้นอยู่กับความรู้"],"a":2,"e":"เจตคติเป็นความรู้สึกนึกคิดของบุคคลที่มีต่อสิ่งใดในขณะหนึ่ง ซึ่งจะไม่คงที่ ย่อมเปลี่ยนแปลงตามประสบการณ์ ใหม่ อันเกิดจากความรู้ใหม่ในเวลาต่อมา โดยการเปลี่ยนแปลงเจตคติมีอยู่ 2 ทาง ดังนี้ 1. การเปลี่ยนแปลงเจตคติในทางเดียวกัน หมายถึง เจตคติเดิมของบุคคลที่เป็นไปในทางบวกจะเพิ่มมากขึ้นในทางบวก แต่ถ้าเจตคติเป็นไปทางลบก็เพิ่มมากขึ้นในทางลบด้วย 2. การเปลี่ยนแปลงเจตคติไปคนละทาง หมายถึง การเปลี่ยนแปลงเจตคติเดิมของบุคคลที่จะเป็นไปในทิศทางตรงกันข้าม"},{"n":40,"q":"ข้อใดแสดงกระบวนการในการเปลี่ยนแปลงเจตคติได้อย่างถูกต้อง","o":["การยอมรับ > ใส่ใจ > เข้าใจ > ความคงอยู่","การยอมรับ > การตระหนักรู้ > ใส่ใจ > เข้าใจ","การตระหนักรู้ > ความใส่ใจ > ความเข้าใจ >. ความคงทน","ใส่ใจ > การเข้าใจ > การยอมรับ >. ความคงอยู่"],"a":4,"e":"กระบวนการในการเปลี่ยนแปลงเจตคติมีอยู่ 4 ขั้นตอน คือ 1. การใส่ใจ (Attention) 2. ความเข้าใจ (Comprehension) 3. การยอมรับ (Acceptance) 4. ความคงอยู่ (Retention)"},{"n":41,"q":"ข้อใดกล่าวถึงเจตคติได้ถูกต้องน้อยที่สุด","o":["เจตคติเชิงบวกเป็นเครื่องนำทางพฤติกรรมที่พึงประสงค์","เจตคติเชิงบวกมีความหมายไม่แตกต่างไปจากการหลงตนเอง (Narcissism)","เจตคติเชิงบวก คือ ความคิดความรู้สึกต่อตนเอง ผู้อื่น หรือสิ่งแวดล้อมในทางที่ดี","เจตคติเชิงบวกทำให้เกิดการยอมรับ พึงพอใจ หรือเห็นด้วย"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 34. ประกอบ"},{"n":42,"q":"ข้อใดไม่ใช่ประโยชน์ของการมีเจตคติเชิงบวก","o":["มีพลังอำนาจแห่งตน","ได้รับการยอมรับ","สร้างแรงบันดาลใจให้ผู้อื่น","ยืดติดในความคิดมากขึ้น"],"a":4,"e":"เจตคติไม่ไช่สิ่งที่มีมาแต่กำเนิด แต่เกิดจากการเรียนรู้ ประสบการณ์การอบรมเลี้ยงดู ซึ่งบุคคลจะมีเจตคติที่ดีต่อสิ่งใด ต้องเชื่อแล้วว่า สิ่งนั้นจะช่วยสร้างประโยชน์หรือสร้างความพอใจแก่ตนเอง โดยประโยชน์ของการมีเจตคติเชิงบวก ได้แก่ 1. ช่วยเสริมสร้างพลังอำนาจแห่งตน 2. ทำให้มีความกรุณาต่อตนเอง 3. เป็นเครื่องมือทำให้บุคคลไปถึงจุดมุ่งหมาย 4. ได้รับการยอมรับจากผู้อื่น 5. ช่วยสร้างแรงบันดาลใจให้กับผู้อื่น ฯลฯ"},{"n":43,"q":"ข้อใดกล่าวถึงการพัฒนาเจตคติเชิงบวกต่อตนเองได้อย่างถูกต้อง","o":["เจตคติเกิดจากการเรียนรู้และประสบการณ์","การพัฒนาตนเองที่มีประสิทธิภาพเริ่มจากการปรับพฤติกรรม","การพัฒนาตนเองไม่จำเป็นต้องเกิดความคิด ความรู้สึกที่ดีต่อตนเอง","การพัฒนาเจตคติเชิงบวกต่อตนเอง ทำให้เรามีความเชื่อมั่นในตนเองต ่า"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 42. ประกอบ"},{"n":44,"q":"การที่บุคคลรับรู้ถึงความสามารถของตนเอง พร้อมต่อการเผชิญสถานการณ์ปัญหา เป็นคุณลักษณะ ขององค์ประกอบใด","o":["ความสามารถควบคุมหรือจัดการสถานการณ์ได้","การพัฒนาตนเอง","ความพึงพอใจในความสามารถของตนเอง","การเพิ่มเป้าหมายในชีวิตของตนเอง"],"a":1,"e":"องค์ประกอบของการเสริมสร้างพลังอำนาจแห่งตนประการแรก คือ ความสามารถควบคุมหรือจัดการกับสถานการณ์ ได้ (Sense of Mastery) หมายถึง การที่บุคคลรับรู้ถึงความสามารถของตนเองตรงตามความเป็นจริง และพร้อมต่อการ เผชิญสถานการณ์ปัญหาต่าง ๆ ที่เข้ามาได้"},{"n":45,"q":"ข้อใดกล่าวถึงความกรุณาต่อตนเองได้ถูกต้องมากที่สุด","o":["การกรุณาต่อตนเองเกิดขึ้นได้ยากกว่าความกรุณาต่อผู้อื่น","การมีความกรุณาต่อตนเอง ทำให้เราหลีกหนีละเลยความทุกข์ในใจ","การกรุณาต่อตนเอง คือ การใส่ใจและเปิดใจต่อการรับรู้ความทุกข์ของตนเอง","การมีความกรุณาต่อตนเองมากเกินไป ทำให้เกิดการจัดเก็บอารมณ์ทางลบและอาจขาดสติ"],"a":3,"e":"ความกรุณาต่อตนเอง (Self - compassion) หมายถึง การใส่ใจและเปิดใจต่อการรับรู้ความทุกข์ของตนเอง หรือ ความสามารถของบุคคลในการให้ความรักและ มีความเห็นใจต่อตนเองเมื่อมีความทุกข์ ซึ่งเทคนิคการฝึกเพิ่มทักษะ ความกรุณาต่อตนเอง ได้แก่ 1. การฝึกเมตตาตนเอง คือ รู้จักให้อภัยตนเอง ให้การช่วยเหลือ และเห็นอกเห็นใจ 2. ฝึกการยอมรับและเข้าใจการเป็นมนุษย์อย่างธรรมดาสามัญ 3. การฝึกสติและฝึกการปล่อยวาง"},{"n":46,"q":"ข้อใดไม่ใช่ประโยชน์สำคัญของทักษะการคิดเชิงบวก","o":["เป็นวิธีการนำพาผู้คนออกจากอคติที่มีต่อบุคคลอื่นได้","ช่วยลดความเครียดที่เกิดขึ้นกับตนเองได้","ช่วยให้หลีกหนีจากสถานการณ์ที่เป็นทุกข์ได้","ช่วยให้สามารถมองโลกในแง่ดีได้อีกทางหนึ่ง"],"a":3,"e":"การคิดเชิงบวกเป็นทักษะที่ต้องใช้การฝึกฝน ดังนั้นจึงควรฝึกทักษะการคิดเชิงบวกอยู่เสมอ โดยเริ่มจากการทำความ เข้าใจสถานการณ์ ตีความ และหาหนทางในการแก้ไขปัญหาใหม่ ๆ ในทิศทางที่สร้างสรรค์ ซึ่งประโยชน์ของทักษะการ คิดเชิงบวก คือ 1. ช่วยให้สามารถมองโลกในแง่ดีได้อีกทางหนึ่ง 2. ช่วยลดความเครียดที่เกิดขึ้นกับตนเองได้ 3. เป็นวิธีการที่นำพาผู้คนออกจากอคติที่มีต่อบุคคลอื่นได้ 4. ทำให้สามารถใช้ชีวิตในสังคมได้อย่างมีความสุข ฯลฯ"},{"n":47,"q":"บุคคลในข้อใดที่แสดงออกถึงการมองโลกในแง่ดี","o":["วิภพเชื่อว่าสิ่งดี ๆ จะเกิดขึ้นกับคนที่มองโลกในแง่ดีเท่านั้น","ภูผาไม่ได้รับรางวัลในการประกวดดนตรี แต่รู้สึกดีใจที่ได้มาเจอผู้คนใหม่ ๆ","สายน ้าขอถอนตัวจากการแข่งขันวิ่งกรีฑา เพราะทราบว่ามีแชมป์ในการเข้าร่วม","วารีเชื่อว่าทุกสิ่งที่เกิดขึ้นมีความคงทนถาวร"],"a":2,"e":"การมองโลกในแง่ดี (Optimism) คือ การที่บุคคลสามารถมองเห็นถึงสาเหตุหรือคุณลักษณะของเหตุการณ์ต่าง ๆ ในทางบวก และเชื่อมันว่าสิ่งนั้นไม่มีความคงทนถาวรโดยสามารถแปลความหมายของเหตุการณ์เชิงลบว่า เป็นเรื่องที่ เกิดจากปัจจัยภายนอกและจะเกิดขึ้นเพียงชั่วคราวตามแต่สถานการณ์เท่านั้น เช่น ภูผาไม่ได้รับรางวัลในการประกวด ดนตรี แต่รู้สึกดีใจชิได้มาเจอผู้คนใหม่ ๆ เป็นต้น"},{"n":48,"q":"ข้อใดกล่าวถึง \"ความคงทนถาวร (Permanence)\" ของการมองโลกในแง่ดีได้ถูกต้อง","o":["บุคคลที่มองโลกในแง่ดี เชื่อว่า สาเหตุของเหตุการณ์เลวร้ายนั้นเกิดขึ้นชั่วคราว","บุคคลที่มองโลกในแง่ร้าย เชื่อว่า สาเหตุของเหตุการณ์ที่ดีที่เกิดขึ้นกับตนนั้นถาวร","บุคคลที่มองโลกในแง่ร้าย เชื่อว่า สาเหตุของเหตุการณ์เลวร้ายนั้นเกิดขึ้นชั่วคราว","บุคคลที่มองโลกในแง่ดี เชื่อว่า สาเหตุของเหตุการณ์ที่ดีในชีวิตนั้นเกิดขึ้นชั่วคราว"],"a":1,"e":"ความคงทนถาวร (Permanence) เป็นองค์ประกอบของการมองโลกในแง่ดีประการแรก หมายถึง สาเหตุที่ทำให้ เกิดสถานการณ์ที่เกิดขึ้นในชีวิตนั้นมีความคงทนถาวรมากน้อยเพียงใด โดยบุคคลที่มองโลกในแง่ดี เชื่อว่า สาเหตุของ เหตุการณ์เลวร้ายนั้นเกิดขึ้นเพียงชั่วคราวแล้วก็จะผ่านไป ส่วนบุคคลที่มองโลกในแง่ร้ายมักเชื่อว่า สาเหตุของเหตุการณ์ เลวร้ายนั้นจะเกิดขึ้นอย่างคงทนถาวรตลอดไป"},{"n":49,"q":"ข้อใดกล่าวได้ถูกต้องเกี่ยวกับหลักการฝึกทำความเข้าใจความคิดของตนเอง","o":["เจตคติไม่สามารถควบคุมได้","ความคิดไม่สามารถเปลี่ยนแปลงได้","หากบุคคลตีความสถานการณ์ทางลบ บุคคลจะรู้สึกหดหู่ ท้อแท้ สิ้นหวัง","หากบุคคลตีความทางบวก ไม่สามารถช่วยนำพาความรู้สึกทางบวกให้เกิดขึ้นได้"],"a":3,"e":"การพัฒนาเจตคติเชิงบวกในการอยู่ร่วมกับผู้อื่นประการแรก คือ การทำความเข้าใจความคิดของตนเอง หมายถึง เจตคติเป็นสิ่งที่เกิดจากความคิดของตนเอง สามารถควบคุมและเปลี่ยนแปลงได้ เพราะเจตคติเป็นสิ่งที่เกิดขึ้นจากการ ตีความต่อบุคคล สถานการณ์หรือสิ่งของ ซึ่งหากบุคคลตีความทางบวกจะรู้สึกทางบวกตามไปด้วย แต่ถ้าหากบุคคล ตีความสถานการณ์ทางลบ บุคคลจะรู้สึกหดหู่ ท้อแท้ สิ้นหวัง"},{"n":50,"q":"ข้อใดไม่ใช่ปัจจัยที่ส่งเสริมเกื้อหนุนในการพัฒนาเจตคติในการทำงานเป็นทีมร่วมกันได้อย่างมี ประสิทธิภาพ","o":["การสร้างความเป็นหนึ่งเดียวกัน","การสร้างแรงจูงใจในการทำงานร่วมกัน","การสื่อสารทางบวกระหว่างกัน","การพัฒนาตน"],"a":4,"e":"ปัจจัยที่ส่งเสริเกื้อหนุนในการพัฒนาเจตคติในการทำงานร่วมกับผู้อื่นได้อย่างมีประสิทธิภาพ มีดังนี้ 1. การสร้างแรงจูงใจในการทำงานร่วมกัน จะเป็นพลังให้ทีมในการทำงานผ่านพันอุปสรรค ต่าง ๆ ไปได้ ซึ่งต้อง อาศัยสัมพันธภาพที่ดี และความรู้สึกเป็นหนึ่งเดียวระหว่างกัน 2. การสื่อสารทางบวกระหว่างกัน เพื่อแสดงถึงความจริงใจต่อกัน เพราะการสื่อสารที่มีความคลุมเครือ ไม่ชัดเจน ไม่ จริงใจ จะก่อให้เกิดความขัดแย้งในการทำงาน"},{"n":51,"q":"ข้อใดไม่ใช่ลักษณะที่สะท้อนถึงความแตกต่างระหว่างบุคคล","o":["ความโดดเด่นส่วนบุคคล","ลักษณะเฉพาะตัวที่ไม่เหมือนใคร","แนวโน้มที่ติดตัวบุคคลมายาวนาน","ความคล้ายคลึงของสมาชิกในครอบครัว"],"a":4,"e":"คาร์เวอร์และไชเออร์ (Carver, Scheier, 2000) ได้ให้คำจำกัดความของคำว่า \"ความแตกต่างระหว่างบุคคล\" (Individual Differences) หมายถึง คุณลักษณะทางจิตวิทยาหรือแนวโน้มที่ติดตัวบุคคลมายาวนานที่สะท้อนให้เห็นถึง ความสม ่าเสมอ ความเป็นเหตุเป็นผลภายใน และความโดดเด่นส่วนบุคคล ส่วนจำเนียร ช่วงโชติ (2536) ได้กล่าวถึง เอกลักษณ์ของแต่ละบุคคล หมายถึง แบบลักษณะที่เฉพาะของตัวเอง ไม่ซ ้าแบบใคร และไม่มีใครเหมือน ดังนั้น \"เอกลักษณ์ของแต่ละบุคคลจึงเป็นลักษณะเฉพาะตัวที่ไม่เหมือนใคร"},{"n":52,"q":"ลักษณะความแตกต่างภายในของบุคคลที่สามารถสังเกตเห็นได้ชัดเจนที่สุด ตรงกับข้อใด","o":["การเปลี่ยนแปลงทางเพศของวัยรุ่น","ความแปรปรวนของอารมณ์","การหลับและการตื่น","ความถดถอยของความจำ"],"a":1,"e":"ลักษณะของความแตกต่างระหว่างบุคคล อาจแบ่งออกได้ 2 ลักษณะสำคัญ ดังนี้ 1. ความแตกต่างภายในของบุคคล (Intra - Individual Differences) คือ ความแตกต่างของตนเองที่มีอยู่ภายในตน เป็น ความผันแปรภายในของบุคคลเดียวกันในเวลาที่ต่างกัน ตั้งแต่ที่บุคคลเกิด และเจริญเติบโตเข้าสู่ในแต่ละช่วงวัย เช่น การ เปลี่ยนแปลงทางเพศของวัยรุ่น (เป็นลักษณะความแตกต่างภายในของบุคคลที่สามารถสังเกตเห็นได้ชัดเจนที่สุด) 2. ความแตกต่างระหว่างของบุคคล (Inter - Individual Differences) คือ ความแตกต่างของบุคคลในด้านร่างกาย อารมณ์ สังคม สติปัญญา แม้แต่พี่น้องที่อยู่ในครอบครัวเดียวกัน มีสภาพแวดล้อมที่คล้ายคลึงกัน ก็ยังพบว่ามีพฤติกรรมที่ แตกต่างกัน"},{"n":53,"q":"หน่วยพื้นฐานทางสังคมที่เล็กที่สุดและส่งผลต่อบุคลิกภาพของบุคคล คือข้อใด","o":["ชุมชน","โรงเรียน","ครอบครัว","สื่อโซเชียล"],"a":3,"e":"หลังจากการคลอดทารกที่เกิดมาแล้ว ควรได้รับการอบรมเลี้ยงดูด้วยความรักและเอาใจใส่ เพื่อส่งเสริมให้ทารกมี พัฒนาการทั้งทางด้านร่างกาย อารมณ์ สังคม และสติปัญญาที่เหมาะสม โดยสิ่งแวดล้อมหลังคลอดของเด็กเริ่มต้นจาก หน่วยพื้นฐานทางสังคมขนาดเล็กที่สุด คือ ครอบครัว ซึ่งในช่วงวัยแรกเกิดจนถึง 5 ปีแรก ในทางจิตวิทยาถือว่า เป็นช่วง วัยที่สำคัญต่อการเสริมสร้างบุคลิกภาพของแต่ละบุคคลด้วย และเมื่อเด็กโตขึ้นก็เข้ารับการศึกษาในสถาบัน-การศึกษา จนสามารถดำเนินชีวิตในสังคมได้"},{"n":54,"q":"ข้อใดบ่งชี้ถึงความแตกต่างระหว่างบุคคลที่ได้รับอิทธิพลจากพันธุกรรมได้ชัดเจนที่สุด","o":["ความเข้มแข็งทวงจิตใจ","ความสนใจส่วนบุคคล","ความพยายามในการเรียนรู้","ความผิดปกติทางร่างกาย"],"a":4,"e":"ในทางจิตวิทยาส่วนใหญ่ เมื่อมีการอธิบายถึงความแตกต่างระหว่างบุคคลพบว่า มีสาเหตุหลักสำคัญที่ส่งผลให้เกิด ความแตกต่างระหว่างบุคคล 2 ประการ คือ 1. พันธุกรรม (Genetic) เป็นการถ่ายทอดคุณลักษณะทางด้านชีวภาพทั้งหมดจากพ่อและแม่ไปสู่ลูก โดยมียื่น (Gene) เป็นหน่วยของพันธุกรรมที่กำหนดคุณลักษณะทางชีวภาพ ซึ่งการ ถ่ายทอดทางพันรุกรรมจะทำให้เกิดความแตกต่างทาง สายพันธุ์และเชื้อชาติ รวมถึงโรค หรือความผิดปกติทางร่างกายบางด้านที่ถูกถ่ายทอดทางพันธุกรรม เช่น ตาบอดสี ความ บกพร่องทางสติปัญญา ดาวน์ซินโดรม ฯลฯ 2. สิ่งแวดล้อม (Environment) มีส่วนสำคัญกับคนเราตั้งแต่เริ่มมีการปฏิสนธิในครรภ์มารดาจนกระทั่งคลอด และ เติบโตกลายมาเป็นส่วนหนึ่งของสังคม โดยสิ่งแวดล้อมที่มีผลทำให้เกิดความแตกต่างระหว่างบุคคลสามารถจำแนก ออกเป็น 3 ระยะ ได้แก่ สิ่งแวดล้อมก่อนคลอด สิ่งแวดล้อมขณะคลอด และสิ่งแวดล้อมหลังคลอด"},{"n":55,"q":"สาเหตุสำคัญที่ส่งผลให้เกิดคว่ามแตกต่างระหว่างบุคคล คือข้อใด","o":["พันธุกรรมและสิ่งแวดล้อม","อิทธิพลทางสังคมและครอบครัว","สภาพแวดล้อมและการอบรมเลี้ยงดู","ความบกพร่องทางร่างกายและสติปัญญา"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 54. ประกอบ"},{"n":56,"q":"สิ่งแวดล้อมที่มีผลทำให้มนุษย์มีความแตกต่างกันแบ่งออกเป็นกี่ระยะ ได้แก่อะไรบ้าง","o":["มี 2 ระยะ คือ ก่อนเกิดกับหลังเกิด","มี 3 ระยะ คือ ก่อนคลอด ขณะคลอด และหลังคลอด","มี 4 ระยะ คือ อนุบาล ประถมศึกษา มัธยมศึกษา และอุดมศึกษา","มี 5 ระยะ คือ วัยเด็ก วัยรุ่น วัยหนุ่มสาว วัยกลางคน และวัยชรา"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 54. ประกอบ"},{"n":57,"q":"ความแตกต่างที่สังเกตได้โดยตรง ได้แก่ข้อใด","o":["ร่างกาย","ระดับสติปัญญา","อารมณ์","บุคลิกภาพ"],"a":1,"e":"ประเภทของความแตกต่างระหว่างบุคคล มีดังนี้ 1. ความแตกต่างทางด้านร่างกาย (เป็นความแตกต่างที่สังเกตได้โดยตรง) 2. ความแตกต่างทางด้านเพศ 3. ความแตกต่างทางด้านอารมณ์ 4. ความแตกต่างทางด้านสติปัญญา 5. ความแตกต่างทางด้านบุคลิกภาพ 6. ความแตกต่างด้านเชื้อชาติ 7. ความแตกต่างด้านสังคมและเศรษฐกิจ"},{"n":58,"q":"การศึกษาความแตกต่างของมนุษย์ในช่วงแรกเป็นการศึกษาในด้านใด","o":["ด้านสติปัญญา","ด้านร่างกาย","ด้านเชื้อชาติ","ด้านสิ่งแวดล้อม"],"a":1,"e":"การศึกษาความแตกต่างระหว่างบุคคลในอดีตนั้นจะพบว่า ส่วนใหญ่มีการศึกษาที่เด่นชัดเกี่ยวข้องกับทางด้าน สติปัญญาและบุคลิกภาพบุคคล เช่น สมัยกรีกโบราณหนังสือ \"The Republic\" ของเพลโต เขียนไว้ว่า ไม่มีบุคคลใดที่เกิด มาเหมือนกันทุกประการ"},{"n":59,"q":"เราสามารถวัดความแตกต่างระหว่างบุคคลได้กี่ด้าน อะไรบ้าง","o":["2 ด้าน คือ สติปัญญา และรางกาย","2 ด้าน คือ คุณลักษณะทางร่างกาย และคุณลักษณะทางจิตวิทยา","3 ด้าน คือ สติปัญญา ร่างกาย และจิตใจ","3 ด้าน คือ คุณลักษณะทางร่างกาย คุณลักษณะทางจิตวิทยา และคุณลักษณะพิเศษ"],"a":2,"e":"จำเนียร ช่วงโชติ (2532) กล่าวไว้ในเรื่องการวัดความแตกต่างระหว่างบุคคลว่า บุคคลมีคุณลักษณะที่แตกต่างกัน ซึ่งวัดได้ 2 ด้าน ดังนี้ 1. คุณลักษณะทางร่างกายและทางสรีระวิทยาของบุคคล เช่น ส่วนสูง น ้าหนัก สัดส่วน ฯลฯ 2. คุณลักษณะทางจิตวิทยาของบุคคล เช่น ความแตกต่างในเรื่องสติปัญญา ความสนใจ เจตคติค่านิยม ความสามารถ พิเศษ บุคลิกภาพ ฯลฯ"},{"n":60,"q":"ผู้ที่ชอบจดจำเป็นภาพ เป็นผู้ที่มีการรับรู้เพื่อการเรียนรู้แบบใด","o":["การได้เห็น","การได้ยิน","การได้สัมผัส","การได้กลิ่น"],"a":1,"e":"Fleming and Mill (1992) ได้แบ่งลีลาการเรียนรู้ตามความชอบหรือความถนัดในการรับข้อมูลของบุคคลออกเป็น 4 กลุ่ม เรียกว่า \"VARK Learning Styles\" ดังนี้ 1. ลีลาการเรียนรู้ที่สื่อด้วยภาพและสัญลักษณ์ V (Visual)) ผ่านทางการได้เห็นข้อมูลต่าง ๆ - ในรูปแบบแผนภาพ กราฟ แผนภูมิ และสัญลักษณ์ต่าง ๆ 2. ลีลาการเรียนรู้ที่สื่อด้วยเสียง A (AuraV/Auditory) ผ่านทางการได้ยินได้ฟัง ชื่นชอบการฟังบรรยาย การพูดคุย หรือ คิดออกมาดัง ๆ เป็นการใช้ความคิดผ่านการพูด 3. ลีลาการเรียนรู้ที่สื่อด้วยอักษร R (Read/Write) เน้นการรับและส่งข้อมูลผ่านการอ่านและการเขียน บุคคลกลุ่มนี้มัก มีสมุดบันทึกติดตัวเพื่อจดบันทึก. 4. ลีลาการเรียนรู้ที่สื่อด้วยสัมผัสและการกระทำ K (Kinesthetic) เมื่อใช้ประสบการณ์และการลงมือปฏิบัติ"},{"n":61,"q":"ข้อใดกล่าวได้ถูกต้องเกี่ยวกับความหมายของการสื่อสาร","o":["มนุษย์มีความสามารถในการสื่อสารตั้งแต่เกิด","การสื่อสารไม่ใช่ส่วนสำคัญของบุคลิกภาพ","คนบุคลิกภาพแบบเก็บตัว (Introvert) ไม่มีความสามารถในการสื่อสาร","การสื่อสารมีความสำคัญต่อการอยู่ร่วมกันในสังคม"],"a":4,"e":"ความหมายของการสื่อสาร (Communication) มีดังนี้ 1. การสื่อสาร (Communication) มาจากภาษาลาติน คือ \"Communis\" หมายถึงความเหมือนกันหรือร่วมกัน 2. การสื่อสารเป็นกระบวนการถ่ายทอดข่าวสาร ข้อมูล ความรู้ ประสบการณ์ ความรู้สึกความคิดเห็น ความต้องการ จากผู้ส่งสาร - ผู้รับสาร 3. การสื่อสารมีความสำคัญต่อการอยู่ร่วมกันในสังคม เพราะเป็นช่องทางในการบอกเล่าความคิด ความรู้สึก รวมถึง สามารถใช้การสื่อสารในการระบายอารมณ์ 4. มนุษย์ไม่มีความสามารถในการสื่อสารตั้งแต่เกิด แต่สามารถเรียนรู้การสื่อสารได้จาก สิ่งแวดล้อม และสามารถ พัฒนาได้ในทุกช่วงวัย หรือตลอดชีวิต 5. คุณลักษณะด้านการสื่อสารจะบ่งบอกถึงบุคลิกภาพของบุคคลแต่สะคน ฯลฯ"},{"n":62,"q":"ข้อใดไม่ใช่องค์ประกอบสำคัญของการสื่อสาร","o":["ผู้ส่งสาร","สาร","เวลา","ช่องทางในการสื่อสาร"],"a":3,"e":"องค์ประกอบของการสื่อสารมีอยู่ 4 ประการ ดังนี้ 1. ผู้ส่งสาร (Sender) 2. สาร (Message) 3. ช่องทางการสื่อสาร (Channel) 4. ผู้รับสาร (Receiver)"},{"n":63,"q":"ข้อใดคือสิ่งสำคัญในการสื่อสารได้อย่างมีประสิทธิภาพ","o":["อารมณ์","ทักษะในการสื่อสาร","บุคลิกภาพ หน้าตา","ฐานะครอบครัว"],"a":2,"e":"บุคคลที่สื่อสารได้อย่างมีประสิทธิภาพจะมีความสามารถและทักษะการสื่อสารที่ดีอันจะทำให้กระบวนการสื่อสาร มีความสมบูรณ์ ซึ่งทักษะการสื่อสารที่สำคัญ มีดังนี้ 1. ทักษะการฟัง 2. ทักษะการพูด 3. ทักษะการอ่าน 4. ทักษะการเขียน"},{"n":64,"q":"ข้อใดไม่ใช่รูปแบบของการสื่อสาร","o":["การสื่อสารแบบกึ่งกลาง","การสื่อสารแบบเผชิญหน้า","การสื่อสารแบบกึ่งเผชิญหน้า","การสื่อสารมวลชน"],"a":3,"e":"การสื่อสารมีหลายรูปแบบตามโอกาสและความเจริญก้าวหน้าทางเทคโนโลยีการสื่อสาร ซึ่งสามารถจำแนกออกได้ เป็น 3 รูปแบบ ดังนี้ 1. การสื่อสารแบบเผชิญหน้า (Face to Face Communication) 2. การสื่อสารแบบกึ่งกลาง (Machine - assisted Interpersonal Communication) 3. การสื่อสารมวลชน (Mass Communication)"},{"n":65,"q":"นาย ก : วิชา RAM 1141 เรียนยากไหม เมื่อวานเราไม่ได้เข้าเรียน นาย ข : เป็นอะไรหรือป่าว ถึงไม่ได้เข้าเรียน มา ๆ เดี๋ยวอธิบายให้ฟัง จากบทสนทนาข้างตัน นาย ข มีบุคลิกภาพในการสื่อสารแบบใดตามแนวคิดอีริค เบิร์น (Eric Berne)","o":["การสื่อสารแบบพ่อแม่","การสื่อสารแบบมิตรภาพ","การสื่อสารแบบผู้ใหญ่","การสื่อสารแบบเด็ก"],"a":1,"e":"ตามแนวคิดการวิเคราะห์การสื่อสารของอีริค เบิร์น (Eric Berne) การสื่อสารแบบพ่อแม่ (Parent Ego State) จะ แสดงออกในลักษณะการควบคุม ออกคำสั่งหรือการปกป้องเหมือนผู้ปกครอง แบ่งออกเป็น 2 ลักษณะ ได้แก่ 1. การสื่อสารแบบพ่อแม่ที่ดุดัน เป็นการสื่อสารที่แสดงออกถึงการบังคับ ควบคุม หรืออบรม สั่งสอนอย่างเข้มงวด 2. การสื่อสารแบบพ่อแม่ที่ดูแลปกป้อง เป็นการสื่อสารที่แสดงออกในลักษณะที่ปุกป้อง ห่วงใย คุ้มครอง หรือการชื่น ชมให้กำลังใจ"},{"n":66,"q":"\"การที่นักศึกษาฟังบรรยายในชั้นเรียน และสามารถจับประเด็นในการพูดของอาจารย์ได้\" เป็นการใช้ ทักษะในการสื่อสารด้านใด","o":["ทักษะการพูด","ทักษะการฟัง","ทักษะการอ่าน","ทักษะการตีความ"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 63. ประกอบ ทักษะการฟัง เป็นความสามารถในการรับสารจากประสาทสัมผัสทางหู ทั้งการถอดรหัสข้อมูล สรุป และทำความ เข้าใจความหมายของสารเช่น นักศึกษาฟังบรรยายในชั้นเรียน และสามารถจับประเด็นในการพูดของอาจารย์ได้ เป็นต้น"},{"n":67,"q":"ข้อใดกล่าวถูกต้องมากที่สุด","o":["ผู้หญิงมีการสื่อสารที่นุ่มนวลกว่าผู้ชาย","เพศที่แตกต่างกันมีบุคลิกภาพในการสื่อสารไม่ต่างกัน","ผู้หญิงเปิดเผยความรู้สึกน้อยกว่าเพศชาย","ผู้ชายทุกคนมักมีการสื่อสารแบบแข็งกร้าว ดุดัน"],"a":1,"e":"การสื่อสารของเพศหญิง จะมีลักษณะการพูดหรือการแสดงออกที่นุ่มนวลกว่าผู้ชายการพูดจะมีโทนเสียงที่กว้าง น ้าเสียงแหลมเล็ก และการแสดงท่าทางมีความระมัดระวังในการเคลื่อนไหว นอกจากนี้การสื่อสารของผู้หญิงจะเปิดเผย ความรู้สึกผ่านการยิ้มแย้มได้ง่าย อีกทั้ง ผู้หญิงส่วนใหญ่มีความต้องการที่จะสื่อสารพูดคุยกับผู้คนรอบข้างมากกว่าผู้ชาย"},{"n":68,"q":"ข้อใดคือสิ่งสำคัญที่สุดในการสื่อสาร","o":["บุคลิกภาพ","น ้าเสียง","จริยธรรม","ตำแหน่งหน้าที่"],"a":3,"e":"จากการเปลี่ยนแปลงและเกิดความแตกต่างในบริบททางสังคมทั้งกลุ่มคน ช่วงวัยและบทบาทหน้าที่ ทำให้การ กำหนดจริยธรรมการสื่อสารภายในสังคมถือเป็นสิ่งสำคัญที่สุดในการสื่อสาร ซึ่งจะช่วยให้การปฏิสัมพันธ์ของบุคคลมี ประสิทธิภาพ โดย Louis Day ได้กล่าวถึงจริยธรรมการสื่อสาร 4 ประการ ได้แก่ 1. การสร้างสังคมแห่งเหตุผล 2. การมีศรัทธาต่อเสรีภาพและความรับผิดชอบต่อสังคม 3. การเคารพต่อศักดิ์ศรีความเป็นเพื่อนมนุษย์ 4. การอดทนและยึดมั่นต่อความยุติธรรมตามบรรทัดฐานทางสังคมบนหลักของความจริง"},{"n":69,"q":"ข้อใดต่อไปนี้ไม่ใช่การคำนึงถึงความปลอดภัยและการใช้สื่อออนไลน์ที่เหมาะสม","o":["ปฏิบัติตามกฎหมายเกี่ยวกับคอมพิวเตอร์","เปิดเผยข้อมูลส่วนตน","เรียนรู้วิธีการใช้สื่ออิเล็กทรอนิกส์ที่ถูกต้อง","ใช้ถ้อยคำที่เหมาะสม"],"a":2,"e":"การสื่อสารผ่านอุปกรณ์อิเล็กทรอนิกส์ เป็นการสื่อสารที่ทันสมัยและมีประสิทธิภาพ ช่วยให้การดำเนินชีวิตมีความ สะดวกสบายจากการส่งและรับข้อมูลที่เชื่อมโยงสังคมเข้าด้วยกันและควรคำนึงถึงความปลอดภัยในการใช้สื่อออนไลน์ ที่เหมาะสม ดังนี้ 1. ควรเรียนรู้วิธีการใช้สื่ออิเล็กทรอนิกส์ที่ถูกต้อง 2. รักษาข้อมูลสำคัญให้เป็นความลับ 3. การใช้ถ้อยคำที่เหมาะสม 4. ปฏิบัติตามกฎหมายเกี่ยวกับคอมพิวเตอร์"},{"n":70,"q":"ในการสื่อสารเพื่อพัฒนาบุคคลด้านการปรึกษา ขั้นตอนใดสำคัญที่สุด","o":["การสร้างสัมพันธภาพ","การทำความเข้าใจ","การวางแผนแก้ไข","การยุติ"],"a":1,"e":"การสื่อสารเพื่อพัฒนาบุคคลด้วยการให้การปรึกษา เป็นการช่วยเหลือให้บุคคลสามารถรับรู้ เข้าใจ ยอมรับ และ ปรับตัวต่อสถานการณ์ที่เกิดขึ้นผ่านการสื่อสารระหว่าง ผู้ให้การปรึกษากับผู้รับการปรึกษา โดยจะมีกระบวนการ ดังนี้ 1. สร้างสัมพันธภาพ ถือเป็นขั้นตอนที่สำคัญที่สุด โดยเริ่มต้นด้วยการสื่อสารกล่าวทักทายเพื่อสร้างความคุ้นเคย 2. สำรวจปัญหา 3. ทำความเข้าใจปัญหา 4. วางแผนคลี่คลายปัญหา 5. ยุติการปรึกษา"},{"n":71,"q":"ข้อใดคือวัตถุประสงค์ของการศึกษา \"ศิลปะการสร้างมนุษยสัมพันธ์\"","o":["เพื่อวิเคราะห์","เพื่อควบคุม","เพื่ออธิบาย","เพื่อทำนาย"],"a":3,"e":"วัตถุประสงค์ของการศึกษา \"ศิลปะการสร้างมนุษยสัมพันธ์\" คือ เพื่ออธิบายว่ามนุษย์เป็นสัตว์สังคม ใช้ชีวิตอยู่ ร่วมกันเป็นหมู่เป็นเหล่า จึงต้องมีความสัมพันธ์ต่อกัน"},{"n":72,"q":"มนุษยสัมพันธ์แตกต่างกับการปฏิสัมพันธ์อย่างไร","o":["มนุษยสัมพันธ์เป็นการทำงานร่วมกัน ปฏิสัมพันธ์เป็นเรื่องของการติดต่อสื่อสารในการทำงาน","มนุษยสัมพันธ์เป็นเรื่องการครองใจคน ปฏิสัมพันธ์เป็นเรื่องของการติดต่อสื่อสาร","มนุษยสัมพันธ์เป็นเรื่องส่วนตัว ปฏิสัมพันธ์เป็นเรื่องของการทำงาน","มนุษยสัมพันธ์เป็นเรื่องนามธรรม ปฏิสัมพันธ์เป็นเรื่องของรูปธรรม"],"a":2,"e":"มนุษยสัมพันธ์แตกต่างกับการปฏิสัมพันธ์ ดังนี้ 1. มนุษยสัมพันธ์เป็นเรื่องการครองใจคน เนื่องจากเป็นวิชาที่ว่าด้วยศาสตร์และศิลป์ในการเสริมสร้างความสัมพันธ์ อันดีกับบุคคล เพื่อให้ได้มาซึ่งความรักใคร่นับถือ ความจงรักภักดีและความร่วมมือต่อกัน 2. การปฏิสัมพันธ์เป็นเรื่องของการติดต่อสื่อสารระหว่างบุคคลเพื่อให้ได้มาซึ่งผลลัพธ์ ไม่ว่าผลลัพธ์นั้นจะออกมา ในทางที่ดีหรือไม่ดีก็ตาม"},{"n":73,"q":"ข้อใดไม่ถูกต้องเกี่ยวกับความสัมพันธ์ของมนุษยสัมพันธ์ที่มีต่อการดำเนินชีวิตในสังคม","o":["ช่วยให้มนุษย์มีโลกส่วนตัว","ช่วยให้ได้รับความช่วยเหลือ","ช่วยให้มั่นคงปลอดภัย","ช่วยให้ประสบความสำเร็จในงาน"],"a":1,"e":"ความสำคัญของมนุษยสัมพันธ์ที่มีต่อการดำเนินชีวิตในสังคม ได้แก่ 1. มนุษยสัมพันธ์จะช่วยให้มนุษย์ไม่ว้าเหว่ หรือไม่รู้สึกโดดเดี่ยว 2. มนุษยสัมพันธ์ทำให้มนุษย์ได้รับความช่วยเหลือและได้รับคว่ามสำเร็จ เช่น ทำให้ได้รับคำแนะนำดี ๆ ในการเรียน จากอาจารย์ รุ่นพี่ เพื่อนร่วมขั้น ฯลฯ 3. มนุษยสัมพันธ์ช่วยให้มนุษย์มีความมั่นคงปลอดภัย 4. มนุษยสัมพันธ์ช่วยให้มนุษย์ได้รับความรักและการยอมรับ"},{"n":74,"q":"ข้อใดไม่ใช่เทคนิคการสร้างมนุษยสัมพันธ์เพื่อเอาชนะใจผู้อื่นของ เดล คาร์เนกี้","o":["จงทำให้ผู้อื่นมองว่าเราเป็นคนสำคัญ","จงยกย่องผู้อื่นด้วยความสุจริตใจ","อย่าตำหนิ ประณาม หรือนินทาผู้อื่น","ควรเป็นนักฟังที่ดีในการสนทนาเสมอ"],"a":1,"e":"เทคนิคารสร้างมนุษยสัมพันธ์เพื่อเอาชนะใจผู้อื่นของ เดล คาร์เนกี้ มีดังนี้ 1. อย่าตำหนิ ประณาม พร ่าบ่น หรือนินทา 2. จงยกย่องสรรเสริญผู้อื่นด้วยความสุจริตใจ 3. จงเอาใจใส่ผู้อื่นอย่างแท้จริง 4. การยิ้ม 5. จดจำชื่อบุคคล 6. จงเป็นนักฟังที่ดี 7. จงทำให้ผู้อื่นเกิดความรู้สึกว่าเป็นคนสำคัญ"},{"n":75,"q":"ข้อใดไม่ใช่ความสำคัญของมนุษยสัมพันธ์ในการดำเนินชีวิตในสังคม","o":["ช่วยให้ไม่ว้าเหว่","ได้รับความรักใคร่","ได้รับคำแนะนำดี ๆ","การครองใจคน"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 73. ประกอบ (ส่วนตัวเลือกข้อ 4 เป็นความสำคัญของมนุษยสัมพันธ์ที่มีต่อการบริหารงาน)"},{"n":76,"q":"ข้อใดไม่ใช่ขั้นตอนของการสร้างมนุษยสัมพันธ์","o":["เข้าใจและยอมรับผู้อื่น","ศึกษาและปรับปรุงตนเอง","เป็นแบบอย่างที่ดีให้กับผู้อื่น","ปรับเปลี่ยนตนเองให้เข้ากับผู้อื่นและสิ่งแวดล้อม"],"a":3,"e":"ขั้นตอนของการสร้างมนุษยสัมพันธ์ให้เกิดขึ้นในกลุ่มคนไม่ว่าจะเป็นกลุ่มใด จะต้องคำนึงถึงองค์ประกอบของ มนุษยสัมพันธ์ ซึ่งพรรณทิพย์ ศิริวรรณบุศย์ ได้กล่าวเอาไว้ 3 ประการ ได้แก่ 1. การเข้าใจตนเอง 2. การเข้าใจผู้อื่น 3. การเข้าใจสิ่งแวดล้อม โดยได้เสนอเป็นแผนภูมิแสดงองค์ประกอบของมนุษยสัมพันธ์ไว้ ดังนี้"},{"n":77,"q":"ข้อใดไม่ใช่เทคนิคการสร้างมนุษยสัมพันธ์ในที่ทำงานตามหลัก R-E-L-A-T-I-O-N-S","o":["R – Reality","N- Networking","A – Adaptability","I - Introvert"],"a":4,"e":"เทคนิคการสร้างมนุษยสัมพันธ์ในที่ทำงานตามหลักของ \"การสร้างความสัมพันธ์\" ซึ่งตรงกับภาษาอังกฤษว่า \"RELATIONS\" มีดังนี้ 1. R = Reality คือ เข้าใจและยอมรับสภาพที่เป็นจริง มีความจริงใจ 2. E = Energy คือ มีความกระตือรือร้นทำสิ่งต่าง ๆ และมีชีวิตชีวา 3. L = Listening คือ เป็นผู้ฟังที่ดี รับฟังผู้อื่นอย่างตั้งใจและเต็มใจ 4. A = Adaptability คือ มีความสามารถในการปรับตัวเข้ากับผู้อื่นและสังคมได้ดี 5. T = Tolerance คือ มีความอดทนและพยายามที่จะสร้างหรือรักษาความสัมพันธ์นั้นโดยการอดทนต่อคำพูดและการ กระทำต่าง ๆ ที่อาจบั่นทอนจิตใจเรา 6. I = Integrity คือ มีความชื่อสัตย์ทั้งต่อตนเองและผู้อื่น 7. 0 = Oral Communication Skills คือ มีทักษะการพูดเพื่อการสื่อสาร 8. N = Networking คือ แสวงหาเครือข่าย หมั่นสร้างมิตรภาพ 9. S = Smile คือ ยิ้มแย้มแจ่มใส แสดงออกถึงมิตรภาพ"},{"n":78,"q":"ข้อใดไม่ถูกต้องในหลักการฝึกพัฒนาบุคลิกภาพภายในเพื่อสร้างมนุษยสัมพันธ์","o":["ปรับทัศนคติของตนเองให้มองทุกสิ่งทั้งด้านดีและไม่ดี","พยายามวิเคราะห์และประเมินตนเองอย่างแท้จริง","ฝึกตนเองให้มีความอดทนและอดกลั้นในปัญหาต่าง ๆ","สร้างความเชื่อมั่นและศรัทธาในตนเอง"],"a":1,"e":"หลักการฝึกพัฒนาบุคลิกภาพภายในเพื่อสร้างมนุษยสัมพันธ์ มีดังนี้ 1. ปรับทัศนคติของคนเองให้มองทุกสิ่งในด้านที่ดี หรือการมองทุกคนในแง่ดี 2. สร้างความเชื่อมั่นและศรัทธาในตนเอง 3. พยายามวิเคราะห์ประเมินตนเองอย่างแท้จริง 4. ทำใจให้พร้อมในการเผชิญความจริง 5. ฝึกให้มีความสามารถในการควบคุมอารมณ์ของตนเองไม่ว่าจะอยู่ในสถานการณ์ใด 6. ฝึกตนเองให้มีความอดทนและอดกลั้นในปัญหาต่าง ๆ ฯลฯ"},{"n":79,"q":"ข้อใดกล่าวถูกต้องเกี่ยวกับ \"ความขัดแย้ง\" ตามแนวคิดด้านมนุษยสัมพันธ์","o":["สนับสนุนความขัดแย้งบนรากฐานความสามัคคีและความสงบสุข","ควรสนับสนุนและยอมรับความขัดแย้ง เพราะบางครั้งอาจมีประโยชน์","ความขัดแย้งเป็นสิ่งที่ไม่ดี หากหลีกเลี่ยงได้ควรเลี่ยงไม่ให้เกิดขึ้น","ถูกทุกข้อ"],"a":2,"e":"แนวความคิดเกี่ยวกับความขัดแย้งแบ่งออกเป็น 3 กลุ่ม ดังนี้ 1. แนวคิดสมัยดั้งเดิม (Traditional View) เป็นมุมมองสมัยดั้งเดิม สันนิษฐานว่า ความชัดแย้งเป็นสิ่งไม่ดี และมี ผลกระทบด้านลบต่อองค์กรอยู่เสมอ ดังนั้นความขัดแย้งจึงกลายเป็นคำ ที่มีความหมายเหมือนกับความรุนแรง การ ทำลาย และการไร้เหตุผล เพราะความขัดแย้งจะทำให้เสียหาย หากหลีกเลี่ยงได้ควรเลี่ยงไม่ให้เกิดขึ้น 2. แนวคิดด้านมนุษยสัมพันธ์ (Human Relation View) เป็นมุมมองในยุค ค.ศ. 1940 - 1970 คือ ความขัดแย้งอาจจะ เกิดขึ้นตามธรรมชาติ และหลีกเลี่ยงไม่ได้ภายในทุกองค์กร ถ้าหากไม่สามารถหลีกเลียงความขัดแย้งได้ มุมมองทางด้าน มนุษยสัมพันธ์จะสนับสนุ่นการยอมรับความขัดแย้ง เพราะบางครั้งอาจมีประโยชน์ 3. แนวคิดสมัยใหม่ (Contemporary View) เป็นมุมมองที่สนับสนุนความขัดแย้งบนรากฐานความสามัคคี ความสงบ สุข ความเงียบสงบ และมีความร่วมมือ"},{"n":80,"q":"แนวคิดด้านมนุษยสัมพันธ์มองความขัดแย้งอย่างไร","o":["สนับสนุนการยอมรับความขัดแย้ง","ต้องรักษาระดับความขัดแย้งให้พอดี","ไม่สนับสนุนให้เกิดความขัดแย้ง","ต้องขจัดความขัดแย้งให้หมดไป"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 79. ประกอบ"},{"n":81,"q":"ความสำคัญของการสร้างสัมพันธภาพระหว่างบุคคล มีผลกระทบต่อบุคคลอย่างไร","o":["เพิ่มความสามารถในการทำงานร่วมกัน","ทำให้เกิดความเครียดในที่ทำงาน","เพิ่มระยะห่างระหว่างบุคคล","ลดความสัมพันธ์กับบุคคลอื่น"],"a":1,"e":"ความสำคัญของการสร้างสัมพันธภาพ ได้แก่ 1. ช่วยกระตุ้นให้บุคคลทำงานร่วมกัน เกิดแรงจูงใจในการทำงาน 2. ช่วยให้การทำงานสามารถขับเคลื่อนไปในทิศทางที่ดี บรรลุตามเป้าหมายได้โดยง่าย"},{"n":82,"q":"ระยะห่างระหว่างบุคคลในระดับใดที่เหมาะสมสำหรับการสนทนาในสภาพแวดล้อมทางสังคม","o":["ระยะสาธารณะ","ระยะส่วนตัว","ระยะสังคม","ระยะใกล้ชิด"],"a":3,"e":"ระยะสังคม (Social Distance) มีระยะห่างระหว่างบุคคลประมาณ 2 - 3.5 เมตร โดยมีลักษณะ ดังนี้ 1. ติดต่อสื่อสารภายใต้มารยาททางสังคม 2. ไม่ใกล้ชิด สัมผัสกันไม่ได้ 3. ภาษาที่ใช้เป็นทางการมากขึ้น 4. ระยะสังคม เช่น คนที่อยู่ในโรงเรียนเดียวกัน"},{"n":83,"q":"บุคคลที่อยู่ในระยะส่วนตัวมักมีระยะห่างเท่าใด","o":["0 - 15 เซนติเมตร","45 - 60 เซนติเมตร","2 - 3.5 เมตร","3.5 เมตรขึ้นไป"],"a":2,"e":"ระยะส่วนตัว (Personal Distance) มีระยะห่างระหว่างบุคคลประมาณ 45 - 60 เซนติเมตร โดยมีลักษณะ ดังนี้ 1. มีอาณาเขตส่วนตัว แม้จะใกล้ชิดกันแค่ไหน 2. เอื้อมมือถึงกัน สัมผัสกันได้ 3. พูดคุยด้วยน ้าเสียงปกติ 4. ตัวอย่างของระยะส่วนตัว เช่น ระยะของเพื่อน เพื่อนร่วมงาน เพื่อนร่วมชั้นเรียน"},{"n":84,"q":"การเห็นคุณค่าในตนเองมีผลอย่างไรต่อการสร้างสัมพันธภาพกับผู้อื่น","o":["ไม่ช่วยให้เกิดความช่วยเหลือ","ช่วยให้การตัดสินใจทางสังคมดีขึ้น","ลดความสามารถในการควบคุมอารมณ์","ทำให้เกิดความกังวลมากขึ้น"],"a":2,"e":"การเห็นคุณค่าในตัวเอง (Self Esteem) หมายถึง ทัศนคติที่บุคคลมีต่อตัวเอง ทั้งในแง่บวกและลบ รวมทั้งการประเมิน ความคิดและความรู้สึกของตนเองต่อการมีสัมพันธภาพ กับผู้อื่น ดังนั้นการเห็นคุณค่าในตัวเองจึงเป็นลักษณะส่วนบุคคล ที่เกี่ยวข้องกับการตัดสินใจตาม ค่านิยมที่มีต่อผู้อื่น และช่วยให้การตัดสินใจทางสังคมดีขึ้น"},{"n":85,"q":"ผลลัพธ์ด้านลบของการเห็นคุณค่าในตนเองต ่า คือข้อใด","o":["ความมั่นใจสูง","การตัดสินใจที่ผิดพลาด","ความสามารถในการปรับตัวสูง","ความอดทนต่อความกดดันเพิ่มขึ้น"],"a":2,"e":"หากบุคคลมีการมองเห็นคุณค่าในตัวเองระดับตำจะส่งผล ดังนี้ 1. มีความทุกข์ทรมานจากความรู้สึกไร้ค่า ความไม่มันใจ และความไม่มันคงทางอารมณ์ 2. มีทัศนคติเชิงลบต่อทุกสิ่งทุกอย่าง 3. ไม่พึงพอใจในชีวิตตนเอง 4. มีการตัดสินใจที่ผิดพลาด ไม่สามารถจัดการความยุ่งยากในชีวิต 5. กระตุ้นให้เกิดพฤติกรรมเชิงลบ เช่น ซึมเศร้า ก้าวร้าว วิตกกังวล 6. เป็นสาเหตุของภาวะทางจิตเวช เช่น โรคซึมเศร้า โรคการกินผิดปกติ การเสพติด ฯลฯ"},{"n":86,"q":"บุคคลที่มีความฉลาดทางอารมณ์สูงจะมีลักษณะใด","o":["ควบคุมอารมณ์ได้ดีและมีสัมพันธภาพที่ดี","มีแนวโน้มที่จะโกรธง่าย","ไม่สนใจความรู้สึกของผู้อื่น","มุ่งเน้นการใช้อารมณ์ในการตัดสินใจ"],"a":1,"e":"ความฉลาดทางอารมณ์ (Emotional Quotient : E.Q. หรือ Emotional Intelligence) หมายถึง ความสามารถในการ รับรู้และควบคุมอารมณ์ของตนเองให้เหมาะสมกับสถานการณ์ต่าง ๆ ที่เกี่ยวข้อง ตลอดจนสามารถจัดการความเครียดได้ อย่างมีประสิทธิภาพ ซึ่งการพัฒนาความฉลาดทางอารมณ์ (E.Q.) เพื่อสร้างสัมพันธภาพที่ดีกับ ผู้อื่น ประกอบด้วย 3 ปัจจัยสำคัญ ได้แก่ ดี เก่ง สุข"},{"n":87,"q":"ปัจจัยใดไม่เกี่ยวข้องกับความฉลาดทางอารมณ์","o":["การจัดการความเครียดอย่างมีประสิทธิภาพ","การสร้างความสัมพันธ์ที่ดีกับผู้อื่น","ความสามารถแก้ไขปัญหาทางคณิตศาสตร์","การรับรู้และควบคุมอารมณ์ตนเอง"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 86. ประกอบ"},{"n":88,"q":"การสร้างสัมพันธภาพที่ดีกับคนรัก ควรใช้วิธีใดเพื่อสื่อสารอย่างมีประสิทธิภาพ","o":["การหลีกเลี่ยงการสนทนาที่จริงใจ","การสื่อสารผ่านภาษารักที่เข้าใจกัน","การหลีกเลี่ยงการสัมผัสทางกาย","การใช้เวลาอยู่ด้วยกันให้น้อยที่สุด"],"a":2,"e":"หลักการสร้างสัมพันธภาพที่ดีกับคนรัก ต้องอาศัยการสื่อสารที่เหมาะสมหรือภาษารักทั้ง 5 รูปแบบ ได้แก่ 1. บอกรักด้วยคำพูด 2. บอกรักด้วยการใช้เวลาร่วมกัน 3. การบอกรักด้วยการให้ของขวัญ 4. การบอกรักด้วยการทำให้ 5. การบอกรักด้วยการสัมผัส"},{"n":89,"q":"ในการสร้างสัมพันธภาพที่ดีกับเพื่อน ควรให้ความสำคัญกับสิ่งใดเป็นอันดับแรก","o":["การแสดงความเป็นเจ้าของเหนือเพื่อน","การสร้างความคุ้นเคยและประสบการณ์ร่วมกัน","การหลีกเลี่ยงการสื่อสารทุกประเภท","การทำให้เพื่อนรู้สึกกังวลและไม่สบายใจ"],"a":2,"e":"หลักการสร้างสัมพันธภาพที่ดีกับเพื่อน สามารถทำได้ดังนี้ 1. แสดงความเอาใจใส่ เช่น สนใจในปัญหาที่ต้องเผชิญ สนใจในความคิดและความรู้สึก 2. แสดงความไว้ใจ เช่น การตรงต่อเวลา การรักษาสัญญา 3. แสดงการยอมรับนับถือ เช่น แสดงความชื่นชมยินดีเมื่อเพื่อนประสบความสำเร็จ 4. แสดงความมีส่วนร่วมและการแบ่งปัน เช่น แบ่งปันประสบการณ์ แบ่งปันความคิดความรู้สึก 5. แสดงความยืดหยุ่น เช่น สามารถยอมรับและปรับตัวเข้ากับเพื่อนได้ 6. แสดงความเห็นอกเห็นใจ ต้องอาศัยความใกล้ชิดและสังเกต จึงจะสามารถเข้าใจผู้อื่นได้"},{"n":90,"q":"การสร้างสัมพันธภาพในครอบครัวที่แข็งแรง สามารถทำได้โดยวิธีใด","o":["เคารพความแตกต่างระหว่างบุคคล","หลีกเลี่ยงการมีส่วนร่วมในกิจกรรมครอบครัว","การใช้ความรุนแรงในการแก้ไขปัญหา","เพิ่มความห่างเหินระหว่างสมาชิกในครอบครัว"],"a":1,"e":"หลักการสร้างสัมพันธภาพที่ดีกับบุคคลในครอบครัว สามารถทำได้ดังนี้ 1. เคารพความแตกต่างระหว่างบุคคล รับฟังและเคารพความคิดเห็นอย่างมีเหตุผล จริงใจต่อกัน 2. มีการพัฒนาความสัมพันธ์อยู่ตลอดเวลา 3. ร่วมมือร่วมใจ เพื่อเตรียมพร้อมต่อการเผชิญอุปสรรคหรือภาวะวิกฤติต่าง ๆ 4. รู้จักรักษาสัมพันธภาพที่ดีต่อกันไว้ สามารถตอบสนองความต้องการของครอบครัวได้"},{"n":91,"q":"ทักษะทางสังคม หมายถึงอะไร","o":["ความสามารถในการวางแผนการเรียน","ความสามารถในการสร้างความสัมพันธ์ทางสังคมและการปฏิสัมพันธ์กับผู้อื่น","ความสามารถในการทำงานก้านวิทยาศาสตร์","ความสามารถในการทำงานที่ใช้กำลัง"],"a":2,"e":"ทักษะทางสังคม หมายถึง ความสามารถของบุคคลในการใช้ปฏิสัมพันธ์ทางสังคม ซึ่งบุคคลมีความรู้ ความเข้าใจ และเป็นทักษะเชิงพฤติกรรมที่ช่วยให้บุคคลมีการปฏิสัมพันธ์กันและมีการสื่อสารกับผู้อื่นหรือกับสังคม ดังนั้นทักษะ ทางสังคมจึงถือเป็นพฤติกรรมทางสังคมที่มีความสำคัญอย่างมาก"},{"n":92,"q":"ข้อใดอธิบายถึงความสำคัญของทักษะทางสังคมได้ถูกต้องที่สุด","o":["การพัฒนาทักษะทางสังคมช่วยให้บุคคลมีความสามารถในการแข่งขันสูงในที่ทำงาน","การพัฒนาทักษะทางสังคมช่วยให้บุคคลมีปฏิสัมพันธ์ที่ดีในครอบครัว เพื่อน และครู","การมีทักษะทางสังคมช่วยให้บุคคลได้รับเงินเดือนสูงขึ้น","ทักษะทางสังคมสำคัญสำหรับการเรียนวิชาคณิตศาสตร์"],"a":2,"e":"ความสำคัญของทักษะทางสังคม เป็นความสามารถทางพฤติกรรมทางสังคมที่ช่วยให้บุคคลมีปฏิสัมพันธ์ทาง สังคมเชิงบวกกับบุคคลอื่น โดยช่วยให้บุคคลมีปฏิสัมพันธ์ที่ดีในครอบครัว ญาติพี่น้อง เพื่อน ครู เป็นต้น ซึ่งผู้ที่มีทักษะ ทางสังคมในระดับสูงจะได้รับการยอมรับจากบุคคลรอบข้าง และมีอารมณ์เชิงบวก"},{"n":93,"q":"ทักษะทางสังคมใดเกี่ยวข้องกับการใช้คำพูด การเขียน การแสดงออกทางท่าทาง สายตา และน ้าเสียง","o":["ทักษะการควบคุมอารมณ์","ทักษะการแก้ปัญหาสังคม","ทักษะการสื่อสาร","ทักษะทางการรู้คิด"],"a":3,"e":"องค์ประกอบของทักษะทางสังคมประการแรก ได้แก่ ทักษะการสื่อสาร คือการสื่อสารประกอบด้วยส่วนประกอบ ทั้งทางวาจาและอวัจนภาษาที่โต้ตอบเพื่ออำนวยความสะดวกในการทำความเข้าใจร่วมกันระหว่างผู้ส่งและผู้รับ โดยการ สื่อสารด้วยวาจาจะรวมถึงการใช้ภาษาพูด ภาษาเขียนเป็นหลัก ในขณะที่การสื่อสารแบบอวัจนภาษาจะรวมถึงคุณสมบัติ ทางเสียง เช่น โทนเสียง/รูปแบบเสียงสูง-ต ่า การสบสายตา ภาษากายหรือท่าทาง และการแสดงออกทางใบหน้า"},{"n":94,"q":"เด็กอายุกี่ปีที่เริ่มมีการพัฒนาทักษะทางสังคม การสื่อสาร และการเรียนรู้ผ่านการเล่นกับเด็กคนอื่น ๆ","o":["อายุ 0 - 1 ปี","อายุ 1- 2 ปี","อายุ 2 - 5 ปี","อายุ 3 - 7 ปี"],"a":3,"e":"วัยเด็กก่อนเข้าโรงเรียน หรืออายุ 2 - 5 ปี จะพัฒนาทักษะทาง สังคม การสื่อสาร และการเรียนรู้ผ่านการเล่นกับเด็ก คนอื่น ๆ โดยเริ่มเข้าใจและตอบสนอง ต่อความแตกต่างระหว่างตนเองและผู้อื่น ทั้งนี้การพัฒนาทักษะทางสังคมต้อง เริ่มต้นตั้งแต่วัยเด็ก เพื่อให้สามารถเข้าใจและอยู่ร่วมกับผู้อื่นในสังคมอย่างดี และยังเป็นประสบการณ์ที่เกี่ยวข้องกับ เพื่อนในวัยเดียวกัน"},{"n":95,"q":"ช่วงวัยเรียน เด็กอายุเท่าใดที่เริ่มเข้าใจความต้องการของผู้อื่น และมีมิตรภาพที่ดี","o":["อายุ 3- 4 ปี","อายุ 5 - 7 ปี","อายุ 6 - 11 ปี","อายุ 12 ปีขึ้นไป"],"a":2,"e":"เด็กวัยเรียนในช่วงอายุต่าง ๆ จะมีพัฒนาการทางสังคมต่างกัน ดังนี้ 1. อายุ 5 - 7 ปี จะเข้าใจความต้องการของผู้อื่น และมีมิตรภาพที่ดี เข้าร่วมสังคมได้ดี 2. อายุ 8 - 9 ปี เข้ากับคนอื่น และเป็นที่ยอมรับของสังคมได้ 3. อายุ 10-11 ปี ปฏิบัติตนได้อย่างเหมาะสม จัดการกับอารมณ์ได้ดีขึ้น 4. อายุ 12 ปีขึ้นไป มีทักษะทางสังคมออนไลน์ มั่นใจในการจัดการกับความคิดและอารมณ์"},{"n":96,"q":"ทักษะทางสังคมของวัยรุ่นเปลี่ยนแปลงอย่างไรเมื่อเทียบกับช่วงวัยเด็ก","o":["วัยรุ่นไม่สนใจการเข้าร่วมกลุ่มสังคม","วัยรุ่นมักอยู่กับครอบครัว และหลีกเลี่ยงการเข้าสังคม","วัยรุ่นเริ่มพัฒนาการสื่อสารกับผู้ใหญ่อย่างเดียว","วัยรุ่นเริ่มขยายบทบาททางสังคมมากขึ้น และเลียนแบบพฤติกรรมจากกลุ่มเพื่อน"],"a":4,"e":"การพัฒนาทักษะทางสังคมของวัยรุ่นระหว่างอายุ 13 - 19 ปี จะเน้นการเรียนรู้และเลียนแบบพฤติกรรมทางสังคม จากกลุ่มเพื่อนและผู้ใหญ่ เพื่อสร้างความสัมพันธ์ทางสังคม โดยวัยรุ่นเริ่มขยายบทบาททางสังคมมากขึ้น เรียนรู้เกี่ยวกับ ความแตกต่างของเพศและการสร้างมิตรภาพ เพื่อเป็นพื้นฐานสำคัญในการปฏิสัมพันธ์อย่างดีในช่วงวัยรุ่น"},{"n":97,"q":"วัยผู้ใหญ่สามารถแบ่งออกเป็นช่วงใดบ้าง","o":["วัยผู้ใหญ่ตอนต้น, วัยรุ่น, วัยสูงอายุ","วัยผู้ใหญ่ตอนต้น, วัยสูงอายุ, วัยเด็ก","วัยผู้ใหญ่ตอนกลางวัยผู้ใหญ่ตอนปลาย, วัยชรา","วัยผู้ใหญ่ตอนต้น, วัยผู้ใหญ่ตอนกลาง, วัยผู้ใหญ่ตอนปลาย"],"a":4,"e":"ช่วงวัยผู้ใหญ่โดยทั่วไปจะเริ่มตั้งแต่อายุ 20 ปีขึ้นไป ซึ่งสามารถแบ่งออกเป็นช่วงต่าง ๆ ได้ดังนี้ 1. วัยผู้ใหญ่ตอนต้น อายุประมาณ 20 - 40 ปี 2. วัยผู้ใหญ่ตอนกลาง อายุประมาณ 40 - 65 ปี 3. วัยผู้ใหญ่ตอนปลาย อายุ 65 ปีขึ้นไป"},{"n":98,"q":"วัยสูงอายุเริ่มต้นที่อายุเท่าใด","o":["55 ปีขึ้นไป","60 ปีขึ้นไป","65 ปีขึ้นไป","70 ปีขึ้นไป"],"a":2,"e":"วัยสูงอายุจะเริ่มตั้งแต่ช่วงอายุ 60 ปีขึ้นไป มีการเปลี่ยนแปลงทางร่างกายและ จิตใจ เช่น ความสามารถทางสมอง ลดลง ทักษะทางสังคมลดลง รวมถึงปัญหาในการประเมินสถานการณ์ทางสังคม และการสร้างความสัมพันธ์ใหม่ ๆ ซึ่ง สิ่งเหล่านี้มีผลต่อการดำเนินชีวิตประจำวันและคุณภาพชีวิตของผู้สูงอายุ"},{"n":99,"q":"ความรับผิดชอบ หมายถึงอะไร","o":["การทำให้คนอื่นพอใจในทุกสถานการณ์","การทำตามความคาดหวังข่องคนรอบข้าง","การมีจิตสำนึกและปฏิบัติหน้าที่ตามความคาดหวังของสังคม","การทำงานให้เสร็จตามเวลาเท่านั้น"],"a":3,"e":"ความรับผิดชอบ หมายถึง การรับผิดชอบในการปฏิบัติหน้าที่ในทุก ๆ ด้านของชีวิต โดยมีความตั้งใจและความ คาดหวังต่อตนเองและสังคมอย่างเต็มที่ ซึ่งบุคคลที่มีความรับผิดชอบจะสามารถจัดการกับภาระงานที่กำหนดไว้อย่างมี ประสิทธิภาพในการเรียนการทำงาน และการดำเนินชีวิตประจำวัน นอกจากนี้ยังรวมถึงการรับผิดชอบต่อการกระทำของ ตนเองทั้งด้านบวกและด้านลบ โดยไม่หลีกเลี่ยงหรือโยนความผิดให้ผู้อื่น"},{"n":100,"q":"ระเบียบวินัย หมายถึงอะไร","o":["การทำงานอย่างมีประสิทธิภาพ","การสั่งสอนให้ผู้อื่นปฏิบัติตามกฎเกณฑ์","การเชื่อฟังคำสั่งของผู้อื่นเสมอ","การควบคุมพฤติกรรมของตนเองในทุกด้าน"],"a":4,"e":"การมีระเบียบวินัย หมายถึง ความสามารถในการควบคุมพฤติกรรมของตัวเองทั้งในด้านความคิด อารมณ์ และการ กระทำให้อยู่ในกรอบของกฎเกณฑ์หรือมาตรฐาน ที่กำหนดไว้ ไม่ว่าจะเป็นกฎเกณฑ์ที่ตนเองสร้างขึ้น หรือที่สังคม กำหนดไว้ เพื่อให้บรรลุเป้าหมายหรือผลลัพธ์ที่ต้องการ"},{"n":101,"q":"มารยาททางจิตวิทยา คืออะไร","o":["การจัดระเบียบพฤติกรรมของสมาชิกในสังคมให้มีระเบียบเรียบร้อย","การแสดงออกทางกายและวาจาที่สุภาพเรียบร้อยตามกาลเทศะ","การแสดงความเคารพและการให้เกียรติแก่บุคคลอื่น","การปฏิบัติตามร้อบธรรมองท้องถิ่นที่แตกต่างกัน"],"a":2,"e":"ความหมายของมารยาททางจิตวิทยา คือ มารยาทเป็นการแสดงออกทางพฤติกรรม ได้แก่ การแสดงออกทางกาย (กิริยา) และวาจาที่สุภาพเรียบร้อยตามกาลเทศะเหมาะสมตามโอกาสและสถานที่ ให้สอดคล้องตามระบบระเบียบแบบ แผนอันดีงามของสังคม"},{"n":102,"q":"ข้อใดต่อไปนี้ไม่ใช่ความสำคัญของมารยาทในสังคม","o":["ช่วยให้ครอบครัวและชุมชนมีความเรียบร้อย","ทำให้การทำงานร่วมกันในองค์กรมีประสิทธิภาพ","ทำให้บุคคลมีโอกาสได้รับความนิยมและชื่นชมจากผู้อื่น","ส่งเสริมความรู้และทักษะการทำงานของบุคคล"],"a":4,"e":"มารยาทมีบทบาทและความสำคัญ ดังนี้ 1. ทำให้ครอบครัว ชุมชน หน่วยงานหรือองค์กร สังคมและประเทศ มีความเรียบร้อยและมีบรรยากาศที่น่าอยู่ 2. ทำให้การทำงานร่วมกันในองค์กรมีประสิทธิภาพ 3. ทำให้บุคคลมีโอกาสได้รับความนิยมและชื่นชมจากผู้อื่น 4. ช่วยให้เอื้อต่อความสามารถในการเข้าสังคม ฯลฯ"},{"n":103,"q":"อิทธิพลใดที่มีความสำคัญมากกว่าในการกำหนดบุคลิกภาพของบุคคลตามทฤษฎีทางจิตวิทยา","o":["พันธุกรรม","สิ่งแวดล้อมทางสังคม","การศึกษา","การอบรมจากครอบครัว"],"a":2,"e":"บุคลิกภาพของบุคคลได้รับอิทธิพลจากพันธุกรรมและสิ่งแวดล้อม ซึ่งอิทธิพลของสิ่งแวดล้อมนั้น นักจิตวิทยาถือ กันว่าเป็นปัจจัยสำคัญในการกำหนดบุคลิกภาพของบุคคลมากกว่าพันธุกรรม โดยเฉพาะสิ่งแวดล้อมทางสังคม อัน ประกอบด้วย ครอบครัว สถานศึกษาศาสนา สื่อมวลชน รวมไปถึงสังคมทุกระดับที่บุคคลได้มีโอกาสปฏิสัมพันธ์หรือ เกี่ยวข้องด้วย"},{"n":104,"q":"การทักทายแบบใดที่สะท้อนถึงความเคารพในวัฒนธรรมญี่ปุ่น","o":["การจับมือ","การโค้งคำนับ","การแตะไหล่","การหอมแก้ม"],"a":2,"e":"มารยาทในการการทักทายและแสดงความเคารพของชาวญี่ปุ่นจะใช้การโค้งคำนับ ซึ่งก็มีหลายระดับคล้าย ๆ กับ การไหว้ของไทย โดยมักกล่าวคำทักทายก่อนแล้วตามด้วยการโค้ง"},{"n":105,"q":"ในการทักทายแบบไทย การไหว้จะมีระดับต่าง ๆ ขึ้นอยู่กับอะไร","o":["อายุ","สถานะทางสังคม","สถานที่","ความสัมพันธ์และระดับความเคารพ"],"a":4,"e":"มารยาทในการทักทายของไทย ได้แก่ การไหว้ ซึ่งถือเป็นธรรมเนียมปฏิบัติของวัฒนธรรมไทยที่แสดงออกถึงการมี มารยาทในการทักทาย ความสุภาพอ่อนน้อม และ มีกาลเทศะ รวมทั้งยังเป็นการแสดงออกถึงการให้ความเคารพและ สะท้อนถึงระดับความสัมพันธ์ของบุคคลอีกด้วย"},{"n":106,"q":"อะไรคือข้อปฏิบัติที่สำคัญในการเข้าประชุม","o":["ส่งเสียงดังและแสดงความคิดเห็นเสรี","เล่นโทรศัพท์มือถือเพื่อฆ่าเวลา","เข้าประชุมสายได้หากไม่สะดวก","ให้ความเคารพประธานและข้อคิดเห็นของผู้เข้าร่วมประชุม"],"a":4,"e":"มารยาทในการเข้าประชุม มีดังนี้ 1. ต้องตรงต่อเวลา 2. ไม่ส่งเสียงดังรบกวนผู้เข้าประชุม 3. ให้ความเคารพประธาน ข้อคิดเห็นของผู้เข้าร่วมประชุม และมติที่ประชุม 4. ให้ความสนใจกับการประชุม ไม่แสดงกิริยาเบื่อหน่าย นั่งหลับ หรือนั่งเล่นโทรศัพท์มือถือ 5. ในกรณีที่ต้องการแสดงความคิดเห็น ควรยกมือเพื่อขออนุญาต และแสดงความคิดเห็นอย่างสุภาพ 6. ไม่ถกเถียงนอกประเด็นการประชุม 7. เมื่อต้องเข้าหรือออกจากห้องประชุม ควรแสดงความเคารพประธานก่อน ฯลฯ"},{"n":107,"q":"การแต่งกายที่เหมาะสมสำหรับการประชุม ควรเป็นอย่างไร","o":["ใส่เสื้อผ้าที่ทันสมัยและเน้นความสบาย","ใช้โทนสีที่สุภาพและไม่ฉูดฉาด","ใช้เครื่องประดับขนาดใหญ่และสีสันสดใส","สวมเสื้อผ้ารัดรูปและมีลวดลายที่เด่นชัด"],"a":2,"e":"มารยาทการแต่งกายเข้าประชุม หมายถึง การแต่งกายให้เหมาะสม กับกาลเทศะ และบทบาทหน้าที่ของตนเองในที่ ประชุม ซึ่งสไตล์หรือวิธีการแต่งตัวของแต่ละ บุคคล การใช้เสื้อผ้า รวมถึงเครื่องแต่งกายตั้งแต่ศีรษะจรดเท้าที่สะอาด สุภาพ และเรียบร้อยเหมาะสมกับรูปร่างและผิวพรรณของตน โดยควรใช้โทนสีที่สุภาพและไม่ฉูดฉาด จะเป็นการ ช่วย เสริมสร้างบุคลำภาพที่ดีให้แก่ตนเองในที่ประชุม นอกจากนี้ต้องคำนึงถึงการแต่งกายให้ถูกต้องตามประเพณีและ วัฒนธรรมอีกด้วย"},{"n":108,"q":"อะไรคือข้อปฏิบัติที่สำคัญในการเขียนจดหมายอิเล็กทรอนิกส์","o":["ใช้คำทักทายที่ไม่เป็นทางการเสมอ","ตรวจสอบความถูกต้องของการสะกดคำ ไวยากรณ์ และโครงสร้างประโยค","ส่งอีเมลทันทีโดยไม่ต้องตรวจสอบข้อความ","ใช้ภาษาไม่เป็นทางการเพื่อความสะดวก"],"a":2,"e":"มารยาทการเขียนจดหมายอิเล็กทรอนิกส์ คือ วิธีการเขียนและตอบกลับจดหมายอิเล็กทรอนิกส์ หรืออีเมลอย่าง สุภาพและมืออาชีพ ประกอบด้วย องค์ประกอบต่าง ๆ ของการ สื่อสารทางอีเมล เช่น ภาษา น ้าเสียง การจัดรูปแบบ และ พฤติกรรมทั่วไป โดยต้องตระหนักถึงความสัมพันธ์ของตนกับผู้รับในบริบทตามวัฒนธรรม และหน่วยงานหรือองค์กร ของผู้รับ รวมทั้งควรตรวจสอบความถูกต้องของการสะกดคำ ไวยากรณ์ และโครงสร้างประโยคก่อนส่งอีเมล"},{"n":109,"q":"หลักพื้นฐานของมารยาททางอินเทอร์เน็ตข้อใดที่เน้นการเคารพความเป็นส่วนตัวของผู้อื่น","o":["คิดก่อนคลิก","ทำตัวเองให้ดูดีในสังคมออนไลน์","รักษาข้อมูลส่วนตัวของเพื่อนและผู้ใช้งานอื่น","โพสต์แต่ข้อความที่ดีและเป็นจริง"],"a":3,"e":"มารยาททางอินเทอร์เน็ต (Netiquette) : กฎข้อที่ 8 เคารพความเป็นส่วนตัวของผู้อื่น (Respect Other People's privacy) คือ เคารพความเป็นส่วนตัวของผู้อื่นที่อยู่ร่วมกันบนอินเทอร์เน็ต รักษาข้อมูลส่วนตัวของเพื่อนและผู้ใช้งานอื่น โดยไม่บุกรุกหรือเข้าถึงข้อมูลส่วนบุคคลโดยไม่ได้รับอนุญาต เช่น ไม่อ่านอีเมลของผู้อื่น เป็นต้น"},{"n":110,"q":"ข้อใดเป็นกฎกติกามารยาทในการใช้อินเทอร์เน็ตที่กล่าวถึงการให้อภัยผู้อื่น","o":["รู้จักให้อภัยผู้อื่น","ระลึกอยู่เสมอว่า คุณอยู่ที่ใดในสังคมออนไลน์","เคารพผู้อื่นด้วยการตระหนักในเรื่องของเวลาและช่วงสัญญาณ","ทำตัวเองให้ดูดีในสังคมออนไลน์"],"a":1,"e":"มารยาททางอินเทอร์เน็ต (Netiquette) : กฎข้อที่ 10 รู้จักให้อภัยผู้อื่น (Be Forgiving of Other People's mistakes) คือ ให้อภัยผู้อื่นในการกระทำที่ผิดพลาด เพื่อให้สังคมอินเทอร์เน็ตเป็นสังคมที่น่าอยู่และถ้อยทีด้อยอาศัยซึ่งกันและกัน ถ้าหาก ต้องการติหรือเตือนในสิ่งที่ผิดพลาดให้กระทำอย่างหวังดี เหมาะสม และสุภาพ"},{"n":111,"q":"ข้อใดไม่ใช่ความหมายของวัฒนธรรมตามที่กล่าวถึงในเนื้อหาวิชานี้","o":["รูปแบบของความรู้ ความเชื่อ ทัศนคติ","พฤติกรรมและการปฏิบัติทางสังคมที่ได้รับการยอมรับและยึดถือ","จุดร่วมของประวัติศาสตร์ ค่านิยมที่เป็นลักษณะเฉพาะของกลุ่ม","การแสดงออกของศิลปะ ขนบธรรมเนียม"],"a":4,"e":"วัฒนธรรม คือ รูปแบบของความรู้ ความเชื่อ ทัศนคติ พฤติกรรมและการปฏิบัติทางสังคม อันเป็นสิ่งที่กลุ่มบุคคล ยอมรับและยึดถือ ประกอบกับการมีจุดร่วมทางประวัติศาสตร์ ประเพณี ค่านิยม ทัศนคติ เป้าหมาย และการปฏิบัติที่เป็น ลักษณะเฉพาะของกลุ่ม ดังนั้นวัฒนธรรมจึงถือว่าเป็นส่วนหนึ่งของมุมมองที่ผู้คนใช้เพื่อทำความเข้าใจโลก ทำให้ภูมิ หลังทางวัฒนธรรมเป็นสิ่งที่กำหนดรูปแบบและมีอิทธิพลต่อการชี้นำวิถีชีวิตของแต่ละบุคคล"},{"n":112,"q":"วัฒนธรรมกับบุคลิกภาพของบุคคล มีความสัมพันธ์กันอย่างไร","o":["วัฒนธรรมจัดเป็นสิ่งแวดล้อมทางสังคมที่หล่อหลอมบุคลิกภาพของแต่ละบุคคล","วัฒนธรรมส่งผสต่อบุคลิกภาพผ่านการสืบทอดทางพันธุกรรม","วัฒนธรรมเป็นสิ่งที่เปลี่ยนแปลงไม่ได้","วัฒนธรรมเป็นสิ่งที่คนทำตามกันจากรุ่นสู่รุ่น"],"a":1,"e":"วัฒนธรรมกับบุคลิกภาพของบุคคล มีความสัมพันธ์กันดังนี้ 1. วัฒนธรรมมีอิทธิพลต่อชีวิตของมนุษย์ในทุกแง่มุม ไม่ว่าจะเป็นวิธีการใช้ชีวิตของผู้คนการปฏิสัมพันธ์กับผู้อื่น การ ดูแลสุขภาพ และการทำความเข้าใจตนเอง 2. การศึกษาทำความเข้าใจวัฒนธรรมเป็นส่วนสำคัญของการทำความเข้าใจบุคลิกภาพของมนุษย์ ดังนั้นวัฒนธรรม และบุคลิกภาพของบุคคลจึงส่งผลกระทบซึ่งกันและกัน 3. วัฒนธรรมจัดเป็นสิ่งแวดล้อมทางสังคม และส่งผลทำให้บุคลิกภาพของแต่ละบุคคล มีความแตกต่างกัน"},{"n":113,"q":"บุคคลใดต่อไปนี้มีบทบาทในกระบวนการหล่อหลอมทางสังคม (Socialization) ในช่วงวัยเด็ก","o":["นายจ้าง","ครู","เพื่อน","ผู้ปกครอง"],"a":4,"e":"ทฤษฎีกระบวนการหล่อหลอมทางสังคม (Socialization) เชื่อว่า วัฒนธรรม มีผลต่อบุคลิกภาพของบุคคลผ่านการ หล่อหลอมทางสังคม โดยการเรียนรู้บรรทัดฐานทาง วัฒนธรรมของเด็กจะเริ่มต้นจากการเรียนรู้แบบแผนพฤติกรรมของ สมาชิกที่เป็นผู้ใหญ่ใน สังคมนั้น ๆ ซึ่งบุคคลที่ถือได้ว่ามีบทบาทสำคัญในกระบวนการหล่อหลอมทางสังคมในช่วง วัย เด็ก คือ พ่อแม่/ผู้ปกครอง"},{"n":114,"q":"ทฤษฎีแบบจำลองการประกอบสร้างระหว่างกัน (Mutual Constitution Model) อธิบาย ความสัมพันธ์ระหว่างวัฒนธรรมและบุคลิกภาพในข้อใดถูกต้องที่สุด","o":["วัฒนธรรมและบุคลิกภาพไม่สัมพันธ์กัน","บุคลิกภาพกำหนดวัฒนธรรมโดยสมบูรณ์","วัฒนธรรมกำหนดบุคลิกภาพโดยสมบูรณ์","วัฒนธรรมและบุคลิกภาพส่งผลซึ่งกันและกัน"],"a":4,"e":"ทฤษฎีแบบจำลองการประกอบสร้างระหว่างกัน (Mutual Constitution Model) อธิบายความสัมพันธ์ระหว่าง วัฒนธรรมและบุคลิกภาพว่า บุคคลและวัฒนธรรมมีการประกอบสร้างซึ่งกันและกันในลักษณะที่ส่งผลกระทบทั้งสอง ฝ่าย กล่าวคือ วัฒนธรรมสร้างบุคคล และ บุคคลก็สร้างวัฒนธรรม"},{"n":115,"q":"วัฒนธรรมแบบกลุ่มนิยม (Collectivism) มุ่งเน้นที่สิ่งใดเป็นสำคัญ","o":["การแข่งขันและการแสดงออก","การพึ่งพาอาศัยกันและความสามัคคีในกลุ่ม","ความสำเร็จและอิสระส่วนบุคคล","การพัฒนาตนเอง"],"a":2,"e":"ค่านิยมตามวัฒนธรรมแบบกลุ่มนิยม (Collectivism) ได้แก่ 1. มีข้อจำกัดมีให้ปันเจกบุคคลแสดงความคิดเห็นหรือความเชื่อ ซึ่งอาจขัดต่อความเชื่อของกลุ่ม 2. กลุ่ม ครอบครัว หรือส่วนรวม มีความสำคัญมากกว่าประโยชน์ส่วนบุคคล 3. ให้ความสำคัญกับการปฏิบัติตามกฎ การให้ความร่วมมือกับกลุ่ม 4. บรรทัดฐานของวัฒนธรรม คือ สมาชิกทั้งหมดต้องพึ่งพาอาศัยและสนับสนุนกัน รวมทั้ง มีความสามัคคีในกลุ่ม 5. มีความเป็น \"พวกเขา\" และ \"พวกเรา\" 6. มีแนวโน้มที่จะตัดสินผู้อื่นตามอัตลักษณ์ของกลุ่ม ฯลฯ"},{"n":116,"q":"การอนุมานสาเหตุ (Attribution) ในวัฒนธรรมแบบปัจเจกนิยม มักมีลักษณะอย่างไร","o":["มุ่งเน้นที่ปัจจัยภายในและบุคลิกภาพ","มุ่งเน้นที่ปัจจัยภายนอก","มุ่งเน้นที่การพึ่งพาอาศัยกัน","มุ่งเน้นที่การทำงานเป็นทีม"],"a":1,"e":"การอนุมานสาเหตุ (Attribution) ในวัฒนธรรมแบบปัจเจกนิยม (Individualism) ได้แก่ 1. ใช้การอนุมานสาเหตุภายใน (Internal Attribution) คือ วิธีการคิดที่กำหนดสาเหตุของพฤติกรรมว่าเกิดจาก คุณลักษณะภายในของบุคคล เช่น บุคลิกภาพ นิสัย อารมณ์ ฯลฯ 2. เชื่อว่าเบื้องหลังการกระทำหรือที่มาของสิ่งที่เกิดขึ้นเป็นผลจากการกระทำของตน เพราะเป็นวัฒนธรรมที่ให้ ความสำคัญกับตัวตนของตนเองมาก"},{"n":117,"q":"ข้อใดถูกต้องเกี่ยวกับมุมมองที่มีต่อตนเอง (Self - views) ในวัฒนธรรมแบบปัจเจกนิยม","o":["มีแนวโน้มที่จะอธิบายตนเองเชิงบวก มากกว่าเมื่อให้เพื่อนอธิบายถึงตน","มีแนวโน้มที่เพื่อนอธิบายถึงตัวตนเชิงบวก มากกว่าเมื่ออธิบายตนเอง","ความรู้สึกเห็นคุณค่าในตนเองเกิดจากกลุ่มอ้างอิงมากกว่าจากตนเอง","มีความเห็นอกเห็นใจผู้อื่นสูง"],"a":1,"e":"มุมมองที่มีต่อตนเอง (Self - views) ในวัฒนธรรมแบบปัจเจกนิยม (Individualism) มีดังนี้ 1. มีแนวโน้มที่จะอธิบายตนเองเชิงบวก มากกว่าเมื่อให้เพื่อนอธิบายถึงตน 2. มีมุมมองทางบวกต่อตนเอง จนบางครั้งไม่อึงความเป็นจริง 3. ทำให้มีความพยายามในการพัฒนาตนเองสูง และมีแนวโน้มการเห็นคุณค่าในตนเอง"},{"n":118,"q":"ในขั้นตอนใดของวงจรการตื่นตระหนกทางวัฒนธรรม (Culture Shock ที่บุคคลเริ่มเรียนรู้และ ปรับเปลี่ยนตนเองให้เข้ากับสภาพแวดล้อมขางวัฒนธรรมใหม่","o":["ช่วงฮันนีมูน (Honeymoon Phase)","ช่วงวิกฤต (Crises Phase)","ช่วงปรับตัว (Adaptation Phase)","ช่วงฟื้นกลับ (Recovery Phase)"],"a":4,"e":"วงจรของความตื่นตระหนกทางวัฒนธรรม (Culture Shock) ช่วงฟื้นกลับ (Recovery Phase) คือ ระยะที่บุคคลเริ่ม เรียนรู้และปรับเปลี่ยนตนเองให้เข้ากับสภาพแวดล้อมทางวัฒนธรรมใหม่ โดยจะอาศัยทั้งการปรับเปลี่ยนและการปรับตัว การยอมรับ วัฒนธรรมใหม่ และกำหนดทิศทางใหม่ (บางช่วงอาจหลีกหนี้หรือแยกตัวไปรวมกับกลุ่มบุคคลจาก วัฒนธรรมเดิม)"},{"n":119,"q":"เหตุการณ์ใดต่อไปนี้ที่ทำให้บุคคลรู้สึกตื่นตระหนกทางวัฒนธรรมมากที่สุด","o":["การมีปัญหาในการสื่อสาร เนื่องจากความแตกต่างทางภาษา","การได้รับการต้อนรับอย่างอบอุ่นจากคนท้องถิ่น","การรับประทานอาหารท้องถิ่นคุ้นเคยมาก่อน","การเข้าร่วมกิจกรรมทางวัฒนธรรมที่คล้ายคลึงกับบ้านเกิด"],"a":1,"e":"ความตื่นตระหนกทางวัฒนธรรม (Cultural Shock) เป็นประสบการณ์ส่วนบุคคลในการเผชิญกับแรงกดดันที่เกิด จากการสัมผัสกับวัฒนธรรมที่แตกต่างหรือไม่มีความคุ้นเคย และรู้สึกสับสนหรือสูญเสียอัตลักษณ์จากวัฒนธรรมเดิม ซึ่ง ความตื่นตระหนกทางวัฒนธรรมมักเกิดขึ้นกับบุคคลที่เคลื่อนย้ายไปในพื้นที่แตกต่างทางวัฒนธรรม เช่น ผู้สี้ภัย คู่สมรส ต่างชาติ นักศึกษาต่างชาติที่มีปัญหาในการสื่อสาร เนื่องจากความแตกต่างทางภาษา,องค์กรทางธุรกิจที่มีการปรับเปลี่ยน โครงสร้าง หรือแม้แต่การเผชิญกับความเปลี่ยนแปลงทาง สังคมและเทคโนโลยี"},{"n":120,"q":"ข้อใดไม่ใช่วิธีการปรับตัวที่เหมาะสมเมื่อเผชิญกับวัฒนธรรมใหม่","o":["เตรียมตัวก่อนออกเดินทาง","ปล่อยใจให้ว่าง ทุกอย่างจะดีขึ้นได้เอง","ยอมรับความจริงมากกว่าปฏิเสธปัญหา","เปิดใจเรียนรู้ประสบการณ์และวัฒนธรรมใหม่"],"a":2,"e":"ยุทธศาสตร์ในการปรับตัวทางวัฒนธรรม มีดังนี้ 1. การเตรียมตัวก่อนออกเดินทาง 2. ช่วงเปลี่ยนผ่าน คือ เปิดใจเรียนรู้และยอมรับประสบการณ์และวัฒนธรรมใหม่ การรับรู้ถึงความสามารถของตนเอง และมีความพร้อมของทรัพยากรที่ใช้ในช่วงเปลี่ยนผ่าน 3. ความสัมพันธ์ส่วนบุคคลและสังคม คือ การมีเครือข่ายทางสังคม 4. กฎแห่งการปฏิสัมพันธ์ทางสังคมและวัฒนธรรม คือ ภาษา กาลเทศะและมารยาท รวมทั้งกฎเกณฑ์ทางสังคม 5. ทักษะการจัดการกับภาวะวิกฤต คือ การยอมรับความจริงเกี่ยวกับปัญหาที่เผชิญมากกว่าการปฏิเสธปัญหา"}]},{"title":"ภาค 1 ปีการศึกษา 2566","items":[{"n":1,"q":"ข้อใดต่อไปนี้ตรงกับความหมายของบุคลิกภาพมากที่สุด","o":["ลักษณะโดยรวมของบุคคลแต่ละคน ซึ่งมีความเป็นเอกลักษณ์","ลักษณะบางประการของบุคคลที่คล้ายกันกับคนอื่น","พฤติกรรมที่เป็นนิสัยของบุคคลเปลี่ยนแปลงได้ง่าย","ลักษณะนิสัยที่ผู้อื่นคาดเดาได้ยาก"],"a":1,"e":"บุคลิกภาพ หมายถึง ลักษณะโดยรวมของบุคคลแต่ละคน ซึ่งมีความเป็นเอกลักษณ์ทำให้บุคคลมีความแตกต่างกัน โดยประเภทของบุคลิกภาพ แบ่งออกเป็น 1. บุคลิกภาพภายนอก คือ ลักษณะภายนอกที่ปรากฏให้เห็นเด่นชัดแตกต่างกันในแต่ละคนเป็นส่วนที่สร้างความ ประทับใจให้กับผู้อื่นตั้งแต่แรกเห็น เช่น การแต่งกาย รูปร่างหน้าตา กิริยามารยาท เป็นต้น 2. บุคลิกภาพภายใน คือ ลักษณะภายในของบุคคลไม่ปรากฏอย่างชัดเจน อยู่ภายในมองไม่เห็นแต่อาจทราบได้จาก การคาดเดา เช่น นิสัย สติปัญญา ความถนัด ค่านิยม อารมณ์ ความรู้สึกความเป็นตัวของตัวเอง เป็นต้น"},{"n":2,"q":"ข้อใดต่อไปนี้ตรงกับลักษณะบุคลิกภาพภายนอก","o":["แอน ชิลี เป็นคนที่มีสติปัญญาสูง ฉลาด","แจ็คสัน หวัง รูปร่างผอมสูง หน้าตาดี","ญาญ่า เป็นดาราที่มีความเป็นตัวของตัวเองสูง","หมาก ปริญ ดูเป็นคนอบอุ่น ใจดี"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 1. ประกอบ"},{"n":3,"q":"ข้อใดไม่ใช่ความสำคัญของบุคลิกภาพ","o":["ผู้ที่มีบุคลิกภาพที่ดีจะมองเห็นและยอมรับในความแตกต่างของบุคคล","ผู้ที่มีบุคลิกภาพที่ดีสามารถแสดงออกความสามารถได้อย่างเต็มศักยภาพ","ผู้ที่มีบุคลิกภาพเหมาะสมสอดคล้องกับงานอาชีพจะสามารถทำงานได้ดี","ผู้ที่มีบุคลิกภาพที่ดีย่อมมั่นใจในตนเอง ไม่หวั่นไหวต่ออารมณ์ของผู้อื่น"],"a":4,"e":"ความสำคัญของบุคลิกภาพ มีดังนี้ 1. ผู้ที่มีบุคลิกภาพที่ดีมีอิทธิพลต่อความรู้สึกและอารมณ์ของผู้ที่พบเห็น ทำให้ได้รับการยอมรับ นับถือและประทับใจ ต่อผู้พบเห็น เรียกว่า \"มีเสน่ห์น่าคบหา\" 2. ผู้ที่มีบุคลิกภาพที่ดีจะรู้สึกมั่นใจในตนเอง มีความเป็นตัวของตัวเอง และสามารถแสดงออก ถึงความสามารถได้ อย่างเต็มศักยภาพ ได้รับความร่วมมือในการทำงาน 3. ผู้ที่มีบุคลิกภาพเหมาะสมสอดคล้องกับงานอาชีพจะสามารถทำงานได้ดี 4. ผู้ที่มีบุคลิกภาพที่ดีจะมองเห็นและยอมรับในความแตกต่างของบุคคล รู้จักและเข้าใจผู้อื่นสามารถสร้าง สัมพันธภาพกับผู้อื่นได้ดี"},{"n":4,"q":"โครงสร้างของจิตตามทฤษฎีจิตวิเคราะห์ (Psychoanalytic Theory) ประกอบด้วย 3 ส่วน คือ","o":["จิตสำนึก (Conscious) - จิตใต้สำนึก (Preconscious) - จิตไร้สำนึก (Unconscious)","ตัวตน (Self) - หน้ากาก (Persona) - สัญชาตญาณ (Instinct)","อิด (Id) - อีโก้ (Ego) - ซุปเปอร์อีโก้ (Superego)","สัญชาตญาณชีวิต (Life Instinct) - พลังชีวิต (Libido) - สัญชาตญาณความตาย (Death Instinct)"],"a":3,"e":"ทฤษฎีจิตวิเคราะห์ (Psychoanalytic Theory) ของซิกมันด์ ฟรอยด์ (Sigmund Freud) ได้กล่าวถึง โครงสร้างของ จิต ประกอบด้วย 3 ส่วน คือ 1. อิด (Id) ความต้องการพื้นฐานทำงานตามความพึงพอใจ 2. อีโก้ (Ego) กฎเกณฑ์ทางสังคมควบคุมความต้องการ 3. ซุปเปอร์อีโก้ (Superego) มโนธรรม ศีลธรรม ขนบธรรมเนียม ทั้งนี้องค์ประกอบของจิตทั้ง 3 ส่วนข้างต้น ถ้า ทำงานสัมพันธ์กันดี บุคลิกภาพก็เหมาะสมกับตนแต่ถ้าโครงสร้างทั้ง 3 ระบบทำหน้าที่ขัดแย้งกัน บุคคลก็จะมีบุคลิกภาพ ที่ไม่เหมาะสม"},{"n":5,"q":"สมศรีเข้าใจและยอมรับจุดเด่นจุดด้อยของตนเอง สมศรีกำลังพัฒนาบุคลิกภาพด้านใด","o":["สติปัญญา","จิตใจ","อารมณ์","สังคม"],"a":2,"e":"แนวทางการพัฒนาบุคลิกภาพภายใน มีดังนี้ 1. จิตใจ คือ ฝึกให้มีความเชื่อมั่นในตนเอง เข้าใจและยอมรับจุดเด่นจุดด้อยของตนเองแก้ไขจุดด้อย พัฒนาจุดเด่น เป็นผู้มีเมตตา รู้จักให้อภัย ฯลฯ 2. สติปัญญา คือ ฝึกฝนตนให้มีความรอบรู้ เป็นผู้เรียนรู้ตลอดชีวิต เรียนรู้สิงใหม่ ค้นหาความสามารถด้านอื่น ๆ หมั่น แสวงหาประสบการณ์ใหม่ ฯลฯ 3. อารมณ์ คือ รู้จักมารยาทและกาลเทศะ ปฏิบัติต่อผู้อื่นด้วยความสุภาพ ควบคุมอารมณ์ไม่ให้หงุดหงิดหรือโกรธง่าย ฝึกให้เป็นคนยิมแย้มแจ่มใส่ มีอารมณ์ขัน ฯลฯ 4. สังคม คือ เมตตากรุณา มีน ้าใจต่อเพื่อนมนุษย์ มีจิตสาธารณะ เคารพความคิดเห็นของผู้อื่น มีทัศนคติและมุมมองที่ กว้าง สามารถเข้ากับผู้อื่นได้ ฯลฯ"},{"n":6,"q":"ข้อใดกล่าวถูกต้องเกี่ยวกับการติดขัดในขั้นปาก (Oral Stage) ตามทฤษฎีจิตวิเคราะห์ของฟรอยด์","o":["บุคลิกภาพชอบนินทา","บุคลิกภาพตระหนีถี่เหนี่ยว","บุคลิกภาพจู้จี้ขี้บ่น","บุคลิกภาพเลียนแบบเพศตรงข้าม"],"a":1,"e":"ฟรอยด์ (Sigmund Freud) ได้แบ่งพัฒนาการทางบุคลิกภาพของบุคคลออกเป็น 5 ระยะ ซึ่งระยะแรก ได้แก่ ระยะปาก (Oral Stage) เริ่มตั้งแต่แรกเกิด - 18 เดือนเป็นขั้นที่ความสุขและความพึงพอใจของเด็กจะอยู่ที่ปาก เช่น การดูดนม การ สัมผัสด้วยปากฯลฯ ซึ่งถ้าหากเด็กได้รับการตอบสนองเต็มที่ เด็กก็จะเจริญเติบโตเป็นผู้ใหญ่ที่มีบุคลิกภาพที่เหมาะสม แต่หากตรงกันข้ามเด็กจะเกิดการติดขัดหรือชะงักถดถอย (Fixation) และมาแสดงพฤติกรรมในช่วงนี้อีกในวัยผู้ใหญ่ เช่น พูดมาก ชอบนินทา ก้าวร้าว กินจุบจิบ สูบบุหรี่ กัดเล็บเป็นต้น ซึ่งบุคลิกภาพเหล่านี้เรียกว่า \"Oral Personality\""},{"n":7,"q":"แอนนา เสืองามเอี่ยม เป็นนางงามที่เปิดโอกาสให้ตนเองเรียนรู้สิ่งใหม่ หาความรู้จากหลายช่อง ทางตรงกับการพัฒนาบุคลิกภาพด้านใด","o":["อารมณ์","จิตใจ สังคม","สติปัญญา","จิตใจ"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 5. ประกอบ"},{"n":8,"q":"ตามทฤษฎีจิตสังคม (Psychosocial Theory) ของอีริคสัน ผู้สูงอายุอยู่ในพัฒนาการบุคลิกภาพขั้นใด","o":["ความใกล้ชิดสนิทสนมกับความรู้สึกโดดเดี่ยวอ้างว้าง","ความเป็นอัตลักษณ์กับความสับสนในบทบาท","การสืบทอดกับการคำนึ่งถึงเต่ตนเอง","ความมั่นคงสมบูรณ์ในชีวิตกับความสิ้นหวัง"],"a":4,"e":"ทฤษฎีจิตสังคม (Psychosocial Theory) โดยอีริคสัน (Erik H. Erikson) เชื่อว่า การเจริญเติบโตทางร่างกายและ สิ่งแวดล้อมจะมีความสัมพันธ์กับพัฒนาการทางจิตใจและบุคลิกภาพ จึงทำให้บุคคลสามารถปรับตัวอยู่ร่วมกับผู้อื่นใน สังคมได้ ทั้งนี้อีริคสันได้แบ่ง พัฒนาการของบุคคลเป็น 8 ขั้น ซึ่งในขั้นที่ 8 ความมั่นคงสมบูรณ์ในชีวิตกับความสิ้นหวัง คือ 1. เป็นช่วงอายุ 65 ปี ถึงบั้นปลายชีวิต เป็นระยะที่ผู้สูงอายุคิดถึงความสำเร็จในชีวิต และเกิดความภูมิใจหากรู้สึก ประสบความสำเร็จในชีวิต ดังนั้นจึงเป็นช่วงที่ทำงานลดลง เพื่อค้นหา ชีวิตวัยเกษียณ ถ้ามองว่าชีวิตที่ผ่านมาไม่ประสบ ความสำเร็จก็จะรู้สึกผิดเกี่ยวกับอดีตและไม่ขอใจกับชีวิต ซึ่งอาจส่งผลต่อการเกิดโรคซึมเศร้า หรือความสิ้นหวัง 2. หวาสำเร็จจะนำไปสู่ปัญญา เพื่อให้มองย้อนหลังถึงชีวิตด้วยความรู้สึกสมบูรณ์ และยอมรับความตายโดย ปราศจากความกลัว 3. ผู้ที่ฉลาดจะมีทั้งความมั่นคงและความสิ้นหวังอย่างสมดุลกัน"},{"n":9,"q":"ข้อใดกล่าวถูกต้องเกี่ยวกับบุคลิกภาพตามทฤษฎีมนุษยนิยม","o":["การติดขัดของพัฒนาการแต่ละขั้น จะมีผลทำให้เกิดความผิดปกติทางบุคลิกภาพ","มนุษย์ทุกคนมีความสามารถ มีศักยภาพที่จะพัฒนาตนเองไปในทางที่ดีงาม","การให้รางวัลสามารถจูงใจเสริมสร้างบุคลิกลักษณะที่พึงประสงค์ได้","บุคลิกภาพเกิดจากการที่บุคคลมีปฏิสัมพันธ์ในสังคม"],"a":2,"e":"ทฤษฎีมนุษยนิยม (The Humanistic Model) กล่าวว่า มนุษย์ทุกคนมีความสามารถ มีศักยภาพที่จะพัฒนาตนเอง ไปในทางที่ดีงาม มีความรับผิดชอบและเข้าใจตนเองอย่างแท้จริงโดยมนุษย์จะควบคุมตนเองและตัดสินใจด้วยตนเอง ซึ่ง มาสโลว์ (Abraham Maslow) อธิบายเอาไว้ว่า พฤติกรรมเป็นผลมาจากแรงจูงใจของบุคคลที่ต้องการตอบสนองความ ต้องการพื้นฐานตามลำดับขั้น เมื่อบุคคลไม่ได้รับการสนองตอบตามความต้องการพื้นฐานที่เหมาะสม ก็ย่อมจะ ก่อให้เกิดการเสียสมดุลของจิตใจขึ้น แต่ถ้าปรับตัวไม่ได้จะทำให้เกิดปัญหาบุคลิกภาพตามมา"},{"n":10,"q":"ข้อใดกล่าวถูกต้องเกี่ยวกับแนวทางการพัฒนาบุคลิกภาพภายนอก","o":["มีน ้าใจต่อเพื่อนมนุษย์ มีจิตสาธารณะ","ฝึกให้เป็นคนอารมณ์ดี มีใบหน้ายิ้มแย้มแจ่มใส","ฝึกให้มีความเชื่อมั่นในตนเอง","ฝึกฝนตนให้มีความรอบรู้ เป็นผู้เรียนรู้ตลอดชีวิต"],"a":2,"e":"แนวทางการพัฒนาบุคลิกภาพภายนอก มีดังนี้ 1. รูปร่างหน้าตา คือ ฝึกให้เป็นคนอารมณ์ดี มีใบหน้ายิ้มแย้มแจ่มใส ฯลฯ 2. การแต่งกาย คือ ลือกสวมใส่เสื้อผ้าเหมาะสมกับอายุหรือวัย กาลเทศะ เลือกเสื้อผ้าที่พรางจุดด้อยและเสริมจุดเด่น ใช้เครื่องประดับ กระเป๋า รองเท้าที่เหมาะสม ฯลฯ 3. กิริยาท่าทาง คือ ฝึกฝนให้เป็นผู้มีกิริยาท่าทางที่สุภาพ ถูกต้องตามกาลเทศะ การพูดหรือใช้ภาษาให้ถูกต้อง มี น ้าเสียงนุ่มนวลจริงใจ การยืน/การเดินอย่างงามสง่า ฯลฯ 4. สุขภาพอนามัย คือ รักษาสุขภาพร่างกายให้แข็งแรง รับประทานอาหาร ดื่มน ้า และ พักผ่อนให้เพียงพอกับวัย ออก กำลังกายเป็นประจำ ฯลฯ"},{"n":11,"q":"ข้อใดไม่ใช่ประโยชน์ของการประเมินบุคลิกภาพ","o":["ช่วยในการปรับตัว","เข้าใจตนเอง","ใช้คัดเลือกบุคคล","ใช้เพื่อให้คุณค่าบุคคล"],"a":4,"e":"ความสำคัญของการวิเคราะห์และการประเมินบุคลิกภาพ มีดังนี้ 1. เป็นแนวทางในการทำความเข้าใจรูปแบบพฤติกรรมและลักษณะเฉพาะตัวของบุคคล ทั้งภายนอกและภายในที่ เกี่ยวข้องกับการปรับตัวต่อสิ่งแวดล้อม รวมถึงยังมีประโยชน์ทำให้บุคคลสามารถเข้าใจตนเอง จนนำไปสู่การพัฒนา บุคลิกภาพตนเองให้เหมาะสม กับการปรับตัว 2. สามารถนำมาประยุกต์ใช้ประโยชน์ในบริบทที่หลากหลาย เช่น การคัดเลือกบุคคลในองค์กรและการศึกษา ใช้ ประกอบการวินิจฉัยหรือบำบัดรักษาทางคลินิก, เป็นข้อมูลประกอบการพิจารณาคดีตามกฎหมาย และใช้ทำความเข้าใจ ตนเอง รวมถึงผู้อื่นเพื่อปรับตัวในการดำเนินชีวิต"},{"n":12,"q":"ข้อใดกล่าวถูกต้องเกี่ยวกับหลักการประเมินวิเคราะห์บุคลิกภาพ","o":["การประเมินบุคลิกภาพใช้ทฤษฎีทางโหราศาสตร์","ปัจจัยทางสังคมไม่ใช่สิ่งที่ต้องคำนึงในการประเมิน","การประเมินต้องกำหนดเป้าหมายพฤติกรรมให้ชัดเจนเสมอ","ความเหนื่อยล ้า เช่น จากการเรียนหรือทำงาน ไม่มีผลต่อการประเมินบุคลิกภาพ"],"a":3,"e":"หลักการพื้นฐานในการวิเคราะห์และประเมินบุคลิกภาพ มีดังนี้ 1. มีความรู้ความเข้าใจเกี่ยวกับแนวคิดทฤษฎีทางบุคลิกภาพ เนื่องจากการประเมินบุคลิกภาพอาศัยแนวคิดทางจิตวิทยา เป็นพื้นฐาน 2. กำหนดเป้าหมายของพฤติกรรมที่จะประเมินให้ชัดเจน 3. เลือกใช้วิธีการหรือเครื่องมือในการประเมินที่มีความเหมาะสม รวมทั้งตระหนักว่าไม่มีวิธีการใดที่ดีที่สุด แต่ควร ใช้วิธีการหลากหลายอย่างเหมาะสม 4. คำนึงถึงปัจจัยที่เกี่ยวข้องกับการวิเคราะห์และประเมินบุคลิกภาพ ทั้งปัจจัยส่วนบุคคล ปัจจัยทางสังคม รวมถึง ปัจจัยที่เกี่ยวข้องกับบริบทของการประเมินผล 5. คำนึงถึงจริยธรรมในการประเมิน"},{"n":13,"q":"ข้อใดถือเป็นการสังเกตทางอ้อม (Indirect Observation)","o":["ครูสังเกตพฤติกรรมของนักเรียนขณะสอน","ตำรวจสังเกตพฤติกรรมคนร้ายผ่านกล้องวงจรปิด","หมอสังเกตพฤติกรรมคนไข้ระหว่างชักประวัติ","นักจิตวิทยาสังเกตพฤติกรรมคนขณะสัมภาษณ์"],"a":2,"e":"การสังเกต แบ่งออกได้ 2 ลักษณะ ดังนี้ 1. การสังเกตทางตรง (Direct Observation) หมายถึง การที่ผู้สังเกตเฝ้าดูหรือศึกษาพฤติกรรมด้วยตนเอง 2. การสังเกตทางอ้อม (Indirect Observation) หมายถึง การสังเกตที่ผู้สังเกตไม่ได้เฝ้าดูพฤติกรรมโดยตรง แต่อาศัย ถ่ายทอดข้อมูลอีกทางหนึ่งจากผู้อื่น หรืออุปกรณ์ต่าง ๆ เช่นภาพถ่าย บันทึกเสียงหรือกล้องบันทึกวิดีโอ เป็นต้น"},{"n":14,"q":"ข้อใดถูกต้องเกี่ยวกับการสัมภาษณ์","o":["การสนทนาเพื่อสร้างความบันเทิง","การสนทนาเพื่อให้เกิดความกระจ่างในข้อมูล","การสัมภาษณ์ที่ดีต้องเก็บบันทึกข้อมูลอย่างเป็นระบบได้","การสนทนา แบ่งเป็นการสนทนาอย่างมีเป้าหมาย และไม่มีเป้าหมาย"],"a":2,"e":"การสัมภาษณ์ หมายถึง การสนทนาพูดคุยอย่างมีเป้าหมาย เพื่อให้เกิดความกระจ่างในข้อมูลหรือลักษณะสำคัญ เฉพาะตัว จำแนกได้ 3 ลักษณะ ได้แก่ 1. การสัมภาษณ์แบบมีโครงสร้าง (มีรูปแบบ ขั้นตอน วิธีการ หรือข้อคำถามที่ชัดเจนตายตัว) 2. การสัมภาษณ์แบบไม่มีโครงสร้าง (มีรูปแบบ ขั้นตอน วิธีการ หรือข้อคำถามที่ไม่ตายตัว) 3. การสัมภาษณ์แบบกึ่งโครงสร้าง (อยู่ระหว่างแบบที่ 1 และแบบที่ 2)"},{"n":15,"q":"ข้อใดไม่ใช่ลักษณะสำคัญของการประเมินด้วยแบบทดสอบทางจิตวิทยา","o":["ใช้โดยผู้ประกอบวิชาชีพ","ใช้ประเมินเพื่อประโยชน์ในการบำบัดรักษา","ต้องมีคุณสมาติหรือคุณภาพของเครื่องมือที่ดีสำหรับใช้","วิธีการแปลผลที่หลากหลายวิธีในแบบทดสอบ"],"a":4,"e":"ลักษณะสำคัญของการประเมินด้วยแบบทดสอบทางจิตวิทยา มีดังนี้ 1. เป็นวิธีการที่ได้รับความนิยมโดยเฉพาะบทบาทวิชาชีพที่เกี่ยวข้องกับการประเมินทาง จิตวิทยา เช่น นักจิตวิทยา หรือนักจิตวิทยาคลินิก ฯลฯ 2. มีคุณสมบัติและลักษณะของแบบทดสอบที่มีความเป็นมาตรฐาน กระบวนการทดสอบและ วิธีการแปลผลที่ ชัดเจน และมีการศึกษาถึงคุณภาพของเครื่องมือที่น่าเชื่อถือ จึงได้รับการยอมรับเป็นวงกว้าง 3. วัตถุประสงค์หลักของการประเมินบุคลิกภาพ คือ เพื่อประกอบการตรวจวินิจฉัยทางคลินิกที่เที่ยวข้องกับการ บำบัดรักษาผู้ที่มีความผิดปกติต่าง ๆ โดยเฉพาะทางด้านจิตใจ 4. การประเมินโดยใช้แบบทดสอบทางจิตวิทยา จึงไม่ใช่เครื่องมือสำหรับบุคคลทั่วไป แต่เป็นเครื่องมือสำหรับ วิชาชีพที่มีความรู้ที่เกี่ยวข้องกับการใช้และแปลผลแบบทดสอบ เพื่อนำไปใช้ประโยชน์ในบริบทที่กล่าวไว้ ฯลฯ"},{"n":16,"q":"ข้อใดถูกต้องเกี่ยวกับการวิเคราะห์และประเมินตนเอง","o":["การวิเคราะห์เนเองช่วยให้ตระหนักรู้ในอารมณ์ของผู้อื่นได้ดีขึ้น","การวิเคราะหานเอง คือ การมองเห็นถึงผลกระทบของผู้อื่นที่ทำต่อตัวเรา","การเปิดโอกาสให้ตนเองมองเห็นผลกระทบที่มีต่อคนรอบข้างได้ และช่วยลดการปิดกั้นตัวเอง","วิเคราะห์ตนเวงได้ต้องรู้จักวิเคราะห์ผู้อื่นก่อน"],"a":3,"e":"การประยุกต์ใช้องค์ความรู้ทางจิตวิทยาได้อย่างมีประสิทธิภาพนั้น บุคคลควรทำความเข้าใจตนเองอย่างดีก่อน ซึ่ง การวิเคราะห์และประเมินตนเองโดยทั่วไปสามารถดำเนินการได้ ดังนี้ 1. เปิดให้ตนเองมองเห็นถึงผลกระทบต่าง ๆ ที่มีต่อคนรอบข้าง ช่วยให้เรียนรู้ข้อบกพร่องของตนเองอย่าง ตรงไปตรงมา ลดการปิดกั้น และเปิดโอกาสพัฒนาตนเอง 2. รู้จัก วิเคราะห์ตนเอง เพื่อสร้างการตระหนักรู้และลดความสับสนทางด้านอารมณ์ที่เกิดขึ้น กับตนเอง ช่วยให้ สามารถอธิบายการกระทำต่าง ๆ ของตัวเองได้ชัดเจน"},{"n":17,"q":"ข้อใดกล่าวไม่ถูกต้องเกี่ยวกับการวิเคราะห์และประเมินตนเองผ่านไดอารี่","o":["ก่อนนอนให้เพ่งความสนใจไปที่อารมณ์ที่เกิดขึ้นต่อเหตุการณ์ที่ไม่พึงพอใจ","พิจารณาการเปลี่ยนแปลงทางสรีรวิทยา เพื่อยอมรับและทำความเข้าใจตัวกระตุ้น","ค้นหาต้นต่อของอารมณ์ที่เกิดขึ้นภายในของตนเอง","ให้พิจารณารับรู้บุคคลอื่น และการตอบสนองต่อบุคคลอื่นและสถานการณ์รอบตัว"],"a":1,"e":"การวิเคราะห์และประเมินตนเองโดยการเขียนเรื่องราวลงในสมุดบันทึกหรือไดอารี่ มีข้อปฏิบัติประการหนึ่ง คือ ก่อนเข้านอนหาโอกาสคิดทบทวนถึงเหตุการณ์ในช่วงวันให้เพ่งความสนใจไปที่ความคิด นำมาพิจารณาว่ามีเหตุการณ์ ทำให้เกิดความรู้สึกบวกและลบโดยหลีกเลี่ยงการคล้อยตามอารมณ์ความรู้สึก (ส่วนตัวเลือกข้ออื่นกล่าวถูกต้อง)"},{"n":18,"q":"ข้อใดถูกต้องเกี่ยวกับหลักสำคัญสำหรับการเขียนเรื่องราวในการวิเคราะห์และประเมินตนเอง","o":["เขียนเรื่องราวเกี่ยวกับคนรอบข้างที่มีความเห็นต่อตัวเรา","เขียนเกี่ยวกับนเอง โดยมีเรื่องราวเกี่ยวกับประสบการณ์ส่วนบุคคล","เขียนเกี่ยวกับตัวเองโดยเน้นประสบการณ์ในวัยเด็กและความคาดหวังในอนาคต","เขียนเรื่องราวของคนรอบข้าง โดยเน้นประสบการณ์ส่วนบุคคลของเขา"],"a":2,"e":"การวิเคราะห์และประเมินตนเองโดยการเขียนเล่าเรื่องราว คือ การเขียนเกี่ยวกับ ตัวเอง ส่วนใหญ่เป็นการทำความ เข้าใจตัวบุคคลมากขึ้นว่าคือใคร โดยเรื่องราวประกอบด้วยประสบการณ์ส่วนบุคคลต่าง ๆ ที่สามารถเขียนได้อย่างอิสระ ตามความต้องการ"},{"n":19,"q":"ข้อใดถูกต้องเกี่ยวกับวิธีการใช้คำเพื่ออธิบายตัวเอง","o":["ค้นหาคำด้านลบต่อตนเอง 5 คำ ที่คิดว่าตนเองไม่อยากเป็น","ค้นหาคำด้านบวกต่อตนเอง 5 คำ ที่คิดว่าเหมาะสมกับตนเอง","ค้นหาคำด้านสบต่อตนเอง 5 คำ ที่คิดว่าอยากแก้ไข","ค้นหาคำด้านบวกต่อตนเองที่คิดว่าตนเองต้องการเป็น"],"a":2,"e":"การวิเคราะห์และประเมินตนเองโดยการใช้คำ 5 คำเพื่ออธิบายตัวเอง คือ ค้นหาคำ ด้านบวก 5 คำ ที่คิดว่าเหมาะสม กับตัวเอง ซึ่งช่วยให้บุคคลเข้าใจตัวเองได้ดีขึ้นผ่านคำดังกล่าว"},{"n":20,"q":"ข้อใดถือเป็นการประเมินบุคลิกภาพที่ถูกต้อง","o":["ดูลายมือเพื่อรีเคราะห์บุคลิกภาพ","ดูโหงวเย้งโดยซินแส","การประเมินด้วยแบบทดสอบบุคลิกภาพโดยบุคลากรวิชาชีพ","ใช้คำถามในหนังสืออ่านเล่นเพื่อประเมินบุคลิกภาพ"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 15. ประกอบ"},{"n":21,"q":"ข้อใดไม่ใช่คุณลักษณะของบุคคลที่มีสุขภาพจิตดี","o":["ตระหนักถึงความสามารถของตนเอง","มีความสุข","ดูแลตนเองและชุมชนได้","ป้องกันเหตุร้ายได้"],"a":4,"e":"สุขภาพจิต คือ สภาวะของความอยู่ดี มีสุข ซึ่งบุคคลตระหนักถึงความสามารถของตะเอง สามารถรับมือและจัดการ กับความเครียดที่เกิดขึ้นตามปกติในชีวิตประจำวันได้อย่างมีประสิทธิภาพ ใช้ศักยภาพที่มีในการทำงาน และช่วยเหลือ ขุมชนของตนเองได้อย่างเต็มความสามารถ"},{"n":22,"q":"ข้อใดกล่าวถูกต้องเกี่ยวกับปัญหาสุขภาพจิต","o":["สาเหตุจากสมองและสารสื่อประสาทเท่านั้น","ปัญหาหลัก ๆ เกิดจากการอบรมเลี้ยงดู","ปัญหาเกิดจากหลายปัจจัยเหตุควบรวมกัน","ปัจจัยสาเหตุมักเหมือนกันในบุคคลวัยเดียวกัน"],"a":3,"e":"สาเหตุของการเกิดปัญหาสุขภาพจิตนั้น มักเกิดจากหลายปัจจัยที่ต้อง พิจารณาร่วมกันทั้งปัจจัยด้านร่างกาย จิตใจ และ สังคม (Bio - Psycho - Social Framework) ซึ่งไม่ลามารถพิจารณาแยกออกจากกันได้"},{"n":23,"q":"ปัจจัยสาเหตุของปัญหาสุขภาพจิต พิจารณาจากสิ่งใด","o":["ปัจจัยทางกาย จิต สังคม","ปัจจัยสิ่งแวดล่อม","ปัจจัยทางโรค","ปัจจัยการเลี้ยงดู"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 22. ประกอบ"},{"n":24,"q":"การประสบเหตุการณ์เลวร้าย จัดเป็นปัจจัยเสี่ยงด้านสุขภาพจิตประเภทใด","o":["ปัจจัยด้านกาย","ปัจจัยด้านจิต","ปัจจัยด้านสังคม","ปัจจัยด้านสรีรวิทยา"],"a":2,"e":"ปัจจัยเสี่ยงด้านสุขภาพจิตประการหนึ่ง คือ ปัจจัยด้านจิตใจ ได้แก่การถูกทารุณกรรม การสูญเสียบุคคลที่รัก ความ ผิดหวังรุนแรงจากเหตุการณ์เลวร้ายที่เกิดขึ้นในอดีต ฯลฯ ทำให้เกิดความทุกข์ ความไม่สบายใจเป็นเวลานาน จนอาจทำ ให้เกิดความเจ็บป่วยทางจิตหรือเกิดปัญหาสุขภาพจิตได้"},{"n":25,"q":"มีความตื่นตระหนกอย่างทันที่ทันใด","o":["โรคกลัว","โรควิตกกังวลทั่วไป","โรคตื่นตระหนก","โรคย ้าคิดย ้าทำ"],"a":3,"e":"ประเภทของโรควิตกกังวล ได้แก่ 1. โรควิตกกังวลทั่วไป คือ บุคคลจะมีลักษณะของความวิตกกังวลที่เกินความจริง และแสดงความวิตกกังวลกับ เหตุการณ์ต่าง ๆ ในชีวิตประจำวันโดยไม่มีเหตุผลที่ชัดเจน ซึ่งความวิตก กังวลที่เกิดขึ้นจะรบกวนการทำหน้าที่ใน ชีวิตประจำวันของบุคคล 2. โรคตื่นตระหนก คือ บุคคลจะรู้สึกตื่นกลัวอย่างทันทีทันใดร่วมกับอาการอื่น เช่น เหงื่อออกเจ็บหน้าอก การเห้นข องหัวใจผิดปกติ และอาจช็อก บุคคลอาจรู้สึกเสมือนหัวใจวาย หรือ รู้สึกว่ากำลังเป็นบ้า 3. โรคย ้าคิดย ้าทำ คือ โรควิตกกังวลที่เกี่ยวข้องกับความกลัวที่ไม่สมเหตุสมผลและความกลัว อันไม่เป็นที่ต้องการ ซึ่ง เป็นสาเหตุของการย ้าคิดและพฤติกรรมย ้าทำซ ้าไปซ ้ามา 4. โรคกลัว คือ ความผิดปกติที่แสดงถึงความกลัวอันเข้มข้นต่อวัตถุหรือสถานการณ์เฉพาะบางอย่าง เช่น งู แมลงวัน ฯลฯ ซึ่งระดับของความกลัวไม่เหมาะสมกับสถานการณ์ และเป็นสาเหตุให้บุคคลนั้นหลีกเลี่ยงสถานการณ์ทางสังคม"},{"n":26,"q":"ความผิดปกติที่แลดงความกลัวอันเข้มข้นต่อวัตถุหรือสถานการณ์บางอย่างที่ไม่สมเหตุสมผล","o":["โรคกลัว","โรควิตกกังวลทั่วไป","โรคตื่นตระหนก","โรคย ้าคิดย ้าทำ"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 25. ประกอบ"},{"n":27,"q":"วิตกกังวลกับเหตุการณ์ต่าง ๆ ในชีวิตประจำวันโดยไม่มีเหตุผลที่ชัดเจนและควบคุมไม่ได้","o":["โรคกลัว","โรควิตกกังวลทั่วไป","โรคตื่นตระหนก","โรคย ้าคิดย ้าทำ"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 25. ประกอบ"},{"n":28,"q":"ความวิตกกังวลที่ส่งผลให้เกิดการกระทำบางอย่างซ ้าไปซ ้ามา เพื่อลดความทุกข์ทางใจ","o":["โรคกลัว","โรควิตกกังวลทั่วไป","โรคตื่นตระหนก","โรคย ้าคิดย ้าทำ"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 25. ประกอบ"},{"n":29,"q":"ข้อใดไม่ใช่ชนิดของบุคลิกภาพที่ผิดปกติ","o":["ต่อต้านสังคม","พึ่งพิง","เห็นภาพหลอน","หวาดระแวง"],"a":3,"e":"บุคลิกภาพที่ผิดปกติแบ่งออกเป็น 5 ชนิด ได้แก่ 1. เก็บตัว คือ ไม
